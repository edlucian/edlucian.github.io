<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>计算机类·单招刷题</title>

<style>

:root{

  /* 层次暖灰阶梯 */

  --bg:#1C1B19; --panel:#22211F; --card:#292725; --hover:#32302D;

  --line:#3D3935;

  /* 文字 */

  --ink:#F0ECE5; --sub:#A7A097; --dim:#77716A;

  /* 强调与反馈 */

  --acc:#D58B68; --acc-soft:rgba(213,139,104,.12); --acc-line:rgba(213,139,104,.45);

  --ok:#8FB49A; --ok-deep:#5E7F69; --ok-soft:rgba(94,127,105,.14);

  --bad:#C98577; --bad-deep:#96574C; --bad-soft:rgba(150,87,76,.14);

  /* 圆角体系 */

  --r-lg:14px; --r-md:10px; --r-sm:6px;

  /* 动效 */

  --ease:cubic-bezier(.3,.7,.3,1);

}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{margin:0;padding:0}

body{

  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;

  background:var(--bg);color:var(--ink);

  min-height:100vh;

  padding-bottom:calc(88px + env(safe-area-inset-bottom));

  -webkit-font-smoothing:antialiased;

  font-size:15px;line-height:1.6;

}

button{font-family:inherit}

svg{display:block}



/* ================= 顶部 ================= */

.top{

  border-bottom:1px solid var(--line);

  background:var(--panel);

}

.top-in{

  max-width:960px;margin:0 auto;padding:18px 24px 0;

}

.brand{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}

.brand h1{margin:0;font-size:16.5px;font-weight:600;letter-spacing:.01em}

.brand .mark{color:var(--acc);margin-right:8px;font-weight:700}

.brand .sub{margin:0;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}

.prog{height:2px;background:var(--line);border-radius:1px;margin:14px 0 16px;overflow:hidden}

.prog i{display:block;height:100%;width:0;background:var(--acc);border-radius:1px;transition:width .45s var(--ease)}



/* ================= 模块导航 ================= */

.tabs{

  border-bottom:1px solid var(--line);

  background:var(--panel);

}

.tabs-in{

  max-width:960px;margin:0 auto;padding:0 16px 12px;

  display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;

}

.tabs-in::-webkit-scrollbar{display:none}

.tab{

  flex:0 0 auto;cursor:pointer;border:none;border-radius:var(--r-sm);

  padding:7px 12px;font-size:13.5px;font-weight:450;color:var(--sub);

  background:transparent;transition:background .15s ease,color .15s ease;

  position:relative;white-space:nowrap;

}

.tab:hover{background:var(--hover);color:var(--ink)}

.tab.on{background:var(--card);color:var(--ink);font-weight:550;box-shadow:inset 0 -2px 0 var(--acc)}

.tab .n{font-size:11px;color:var(--dim);margin-left:5px;font-variant-numeric:tabular-nums}

.tab.on .n{color:var(--acc)}



/* ================= 主布局：桌面双栏 ================= */

.layout{

  max-width:960px;margin:0 auto;padding:22px 24px 0;

  display:grid;grid-template-columns:minmax(0,1fr) 264px;gap:20px;

  align-items:start;

}

.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:14px}

@media (max-width:900px){

  .layout{grid-template-columns:1fr;padding:16px 16px 0}

  .side{display:none}

}



/* ================= 学习面板（侧栏） ================= */

.panel{

  background:var(--card);border:1px solid var(--line);

  border-radius:var(--r-lg);padding:18px;

}

.panel .pt{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--dim);margin:0 0 14px}

.ring-row{display:flex;align-items:center;gap:16px;margin-bottom:6px}

.ring{position:relative;width:74px;height:74px;flex:0 0 74px}

.ring svg{width:74px;height:74px;transform:rotate(-90deg)}

.ring .track{stroke:var(--line)}

.ring .fill{stroke:var(--acc);transition:stroke-dashoffset .5s var(--ease)}

.ring .cv{

  position:absolute;inset:0;display:flex;flex-direction:column;

  align-items:center;justify-content:center;line-height:1.15;

}

.ring .cv b{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}

.ring .cv span{font-size:10px;color:var(--dim)}

.stat-rows{flex:1;min-width:0}

.srow{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;font-size:12.5px}

.srow .k{color:var(--sub)}

.srow .v{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.srow .v small{color:var(--dim);font-weight:450}

.mrow{display:flex;align-items:center;gap:10px;padding:5px 0}

.mrow .mn{flex:0 0 58px;font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mrow .mbar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}

.mrow .mbar i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .4s var(--ease)}

.mrow .mc{flex:0 0 52px;text-align:right;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}



/* ================= 题目卡 ================= */

.qcard{

  background:var(--card);border:1px solid var(--line);

  border-radius:var(--r-lg);

  padding:24px 26px 8px;

  animation:rise .24s var(--ease);

}

@keyframes rise{from{transform:translateY(6px)}to{transform:none}}

@media (prefers-reduced-motion:reduce){.qcard{animation:none}}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}

.qno{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.02em}

.qtag{

  font-size:11.5px;font-weight:550;letter-spacing:.05em;

  color:var(--acc);background:var(--acc-soft);

  padding:4px 10px;border-radius:var(--r-sm);

}

.stem{font-size:17.5px;line-height:1.7;font-weight:550;margin:0 0 20px;letter-spacing:.005em;word-break:break-word;text-wrap:pretty}

.opts{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}

.opt{

  display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;cursor:pointer;

  border:1px solid transparent;border-radius:var(--r-md);

  background:transparent;color:var(--ink);

  padding:14px 15px;font-size:15px;line-height:1.55;

  transition:background .15s ease,border-color .15s ease;

}

.opt:hover{background:var(--hover);border-color:var(--line)}

.opt:focus-visible{outline:2px solid var(--acc-line);outline-offset:2px}

.opt:active{background:#383531}

.opt .k{

  flex:0 0 27px;height:27px;border-radius:var(--r-sm);margin-top:1px;

  background:var(--hover);color:var(--sub);border:1px solid transparent;

  font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;

  transition:background .15s,color .15s,border-color .15s;

}

.opt:hover .k{border-color:var(--line)}

.opt .t{min-width:0;word-break:break-word;padding-top:2px}

.opt.sel{background:var(--acc-soft);border-color:var(--acc-line)}

.opt.sel .k{background:var(--acc);color:#1C1B19;border-color:transparent}

.opt.ok{background:var(--ok-soft);border-color:var(--ok-deep)}

.opt.ok .k{background:var(--ok-deep);color:#F0ECE5;border-color:transparent}

.opt.bad{background:var(--bad-soft);border-color:var(--bad-deep)}

.opt.bad .k{background:var(--bad-deep);color:#F0ECE5;border-color:transparent}

.opt.dim{opacity:.4}



/* ================= 反馈与解析 ================= */

.after{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .26s var(--ease),opacity .2s ease .06s}

.after.show{grid-template-rows:1fr;opacity:1}

.after>div{overflow:hidden}

.feedwrap{padding:2px 0 20px}

.feed{

  display:flex;align-items:center;gap:9px;

  font-size:14px;font-weight:550;margin-bottom:14px;

}

.feed .ic{flex:0 0 18px;width:18px;height:18px}

.feed.ok{color:var(--ok)}

.feed.bad{color:var(--bad)}

.feed .ans{font-weight:700;font-size:15px}

.fb-panel{

  background:var(--panel);border:1px solid var(--line);

  border-radius:var(--r-md);padding:16px 18px;

}

.roast{padding:0 0 0 14px;border-left:2px solid var(--acc);margin-bottom:14px}

.roast .rk{display:block;font-size:11px;font-weight:650;letter-spacing:.1em;color:var(--acc);margin-bottom:5px}

.roast .rt{font-size:14.5px;line-height:1.65;color:var(--ink);font-weight:450;word-break:break-word;text-wrap:pretty}

.explain{border-top:1px solid var(--line);padding-top:13px}

.explain .et{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--dim);margin-bottom:7px}

.explain .ex{font-size:14.5px;line-height:1.72;color:var(--sub);word-break:break-word;text-wrap:pretty}



/* ================= 底部操作栏 ================= */

.bar{

  position:fixed;left:0;right:0;bottom:0;z-index:30;

  background:var(--panel);border-top:1px solid var(--line);

  padding:10px max(24px,calc((100vw - 960px)/2 + 24px)) calc(10px + env(safe-area-inset-bottom));

  display:flex;align-items:center;gap:8px;

}

.bbtn{

  display:flex;align-items:center;justify-content:center;gap:7px;

  cursor:pointer;font-weight:500;font-size:14px;

  border:1px solid var(--line);border-radius:var(--r-md);

  padding:10px 18px;color:var(--ink);background:var(--card);

  transition:background .15s ease,border-color .15s ease;

}

.bbtn svg{width:15px;height:15px}

.bbtn:hover{background:var(--hover);border-color:#4A453F}

.bbtn:active{background:#383531}

.bbtn:focus-visible{outline:2px solid var(--acc-line);outline-offset:2px}

.bbtn:disabled{opacity:.35;pointer-events:none}

.bbtn.primary{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc)}

.bbtn.primary:hover{background:rgba(213,139,104,.2)}

.bbtn.primary:active{background:rgba(213,139,104,.28)}

.bar .pos{

  flex:1;text-align:center;font-size:12.5px;font-weight:500;color:var(--sub);

  font-variant-numeric:tabular-nums;letter-spacing:.03em;

}

.bar .pos b{color:var(--ink);font-weight:650}



/* ================= 错题本抽屉 ================= */

.sheet{

  position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;

  background:rgba(28,27,25,.62);

  opacity:0;pointer-events:none;transition:opacity .25s ease;

}

.sheet.show{opacity:1;pointer-events:auto}

.sheet .spanel{

  width:100%;max-width:680px;max-height:76vh;display:flex;flex-direction:column;

  background:var(--panel);border:1px solid var(--line);border-bottom:none;

  border-radius:var(--r-lg) var(--r-lg) 0 0;

  box-shadow:0 -12px 40px rgba(0,0,0,.35);

  transform:translateY(46px);transition:transform .32s var(--ease);

  padding:0 0 env(safe-area-inset-bottom);

}

.sheet.show .spanel{transform:translateY(0)}

.sgrab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 2px}

.shead{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 12px;border-bottom:1px solid var(--line)}

.shead h2{margin:0;font-size:15px;font-weight:600}

.shead .st{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

.shead button{border:none;background:transparent;border-radius:var(--r-sm);width:30px;height:30px;font-size:14px;cursor:pointer;color:var(--sub);display:flex;align-items:center;justify-content:center}

.shead button:hover{background:var(--hover);color:var(--ink)}

.slist{overflow-y:auto;padding:2px 14px 20px}

.wrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13.5px}

.wrow:last-child{border-bottom:none}

.wrow .wl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}

.wrow .wl b{color:var(--ink);font-weight:550}

.wrow .redo{

  flex:0 0 auto;cursor:pointer;font-size:12.5px;font-weight:550;

  border:1px solid var(--acc-line);color:var(--acc);

  background:transparent;border-radius:var(--r-sm);padding:5px 13px;

  transition:background .15s;

}

.wrow .redo:hover{background:var(--acc-soft)}

.wrow .redo:active{background:rgba(213,139,104,.22)}



.empty{text-align:center;padding:72px 20px;color:var(--dim)}

.empty svg{width:36px;height:36px;margin:0 auto 12px;opacity:.5}

.empty p{margin:0;font-size:13.5px}



/* ---- 考纲覆盖抽屉 ---- */

.synote{

  font-size:12.5px;line-height:1.7;color:var(--sub);

  background:var(--card);border:1px solid var(--line);

  border-radius:var(--r-md);padding:12px 14px;margin:10px 6px 14px;

  text-wrap:pretty;

}

.synote b{color:var(--acc);font-weight:600}

.synote.warn{border-color:var(--acc-line)}

.smod{padding:2px 6px}

.smhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:2px}

.smname{font-size:13.5px;font-weight:600;color:var(--ink)}

.smmeta{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}

.strow{

  display:flex;align-items:center;gap:9px;

  padding:10px 4px;border-bottom:1px solid var(--line);

  cursor:pointer;border-radius:var(--r-sm);

  transition:background .15s ease;

}

.strow:last-child{border-bottom:none}

.strow:hover{background:var(--hover)}

.strow:active{background:#383531}

.sdot{flex:0 0 7px;width:7px;height:7px;border-radius:50%}

.sdot.ok{background:var(--ok-deep)}

.sdot.thin{background:var(--acc)}

.sdot.none{background:var(--bad-deep)}

.sname{flex:1;min-width:0;font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scnt{flex:0 0 auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}

.sgo{flex:0 0 auto;font-size:11.5px;font-weight:550;color:var(--acc);opacity:.75}

.strow:hover .sgo{opacity:1}



/* ================= 科目切换条 ================= */
.subj{background:var(--panel)}
.subj-in{max-width:960px;margin:0 auto;padding:0 16px 10px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.subj-in::-webkit-scrollbar{display:none}
.sbtn{
  flex:0 0 auto;cursor:pointer;border:none;border-radius:var(--r-sm);
  padding:7px 16px;font-size:13.5px;font-weight:450;color:var(--sub);
  background:transparent;transition:background .15s ease,color .15s ease;
  position:relative;white-space:nowrap;
}
.sbtn:hover{background:var(--hover);color:var(--ink)}
.sbtn.on{background:var(--card);color:var(--acc);font-weight:600;box-shadow:inset 0 -2px 0 var(--acc)}

@media (max-width:560px){
  .qcard{padding:18px 16px 4px}
  .subj-in{padding:0 10px 8px}
  .sbtn{padding:8px 14px;font-size:13px}

  .stem{font-size:16.5px}

  .opt{padding:12px 12px;gap:11px}

  .top-in{padding:14px 16px 0}

  .bar{padding-left:10px;padding-right:10px;gap:6px;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}

  .bbtn{padding:12px 14px}

  .bbtn .bt{display:none}

  .bbtn.primary .bt{display:inline}

}

</style>

</head>

<body>



<header class="top">

  <div class="top-in">

    <div class="brand">

      <h1><span class="mark">◢</span>计算机类 · 单招刷题</h1>

      <p class="sub" id="sub">—</p>

    </div>

    <nav class="subj"><div class="subj-in" id="subjbar"></div></nav>
    <div class="prog"><i id="progbar"></i></div>

  </div>

</header>



<nav class="tabs">

  <div class="tabs-in" id="chips"></div>

</nav>



<div class="layout">

  <main id="app" style="min-width:0"></main>

  <aside class="side" id="side"></aside>

</div>



<footer class="bar">

  <button class="bbtn" id="btnprev">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

    <span class="bt">上一题</span>

  </button>

  <span class="pos" id="pos">—</span>

  <button class="bbtn primary" id="btnnext">

    <span class="bt">下一题</span>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>

  </button>

  <button class="bbtn" id="btnsyl">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>

    <span class="bt">考纲</span>

  </button>

  <button class="bbtn" id="btnsheet">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>

    <span class="bt">错题本</span>

  </button>

</footer>



<div class="sheet" id="sylsheet">

  <div class="spanel">

    <div class="sgrab"></div>

    <div class="shead">

      <h2>考纲覆盖</h2>

      <span class="st">2023 版大纲 · 2027 沿用</span>

      <button id="sylclose" aria-label="关闭">

        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>

      </button>

    </div>

    <div class="slist" id="syllist"></div>

  </div>

</div>



<div class="sheet" id="sheet">

  <div class="spanel">

    <div class="sgrab"></div>

    <div class="shead">

      <h2 id="sheettitle">错题本</h2>

      <span class="st" id="sheetstat"></span>

      <button id="sheetclose" aria-label="关闭">

        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>

      </button>

    </div>

    <div class="slist" id="sheetlist"></div>

  </div>

</div>



<script>

var BANKS={computer:[{"c":10,"n":1,"m":"M2","mn":"数据库基础","s":"数据库（DB）是指（　）","o":["存储在硬盘上的所有文件","数据库管理系统的简称","一张二维表","长期存储在计算机内、有组织、可共享的数据集合"],"a":"D","status":"OK","ex":"答案D。数据库的定义就是\"长期存储在计算机内、有组织、可共享的数据集合\"；A只是文件的堆砌，没有组织和共享特征，B把DBMS当成了DB，C二维表只是关系模型中数据的表现形式。","roast":"数据库的定义都答错，我建议你把第一章吃了。"},{"c":10,"n":2,"m":"M2","mn":"数据库基础","s":"DBMS 的中文全称是（　）","o":["数据库管理员","数据库系统","数据库","数据库管理系统"],"a":"D","status":"OK","ex":"答案D。DBMS即Database Management System，中文为\"数据库管理系统\"；A的\"数据库管理员\"是DBA，B数据库系统和C数据库分别对应DBS和DB，三个缩写别搅在一起。","roast":"全称送分题，接不住就别怪我没提醒你背缩写。"},{"c":10,"n":3,"m":"M2","mn":"数据库基础","s":"数据库系统的核心是（　）","o":["数据库管理员","数据库管理系统","应用程序","数据库"],"a":"B","status":"OK","ex":"答案B。数据库系统由数据库、DBMS、应用程序和人员等组成，其中DBMS负责数据的建立、使用和维护，是整个系统的核心；A的DBA只是管理人员，D的数据库是被管理的对象本身。"},{"c":10,"n":4,"m":"M2","mn":"数据库基础","s":"下列软件中，不属于数据库管理系统的是（　）","o":["SQL Server","MySQL","Word","Access"],"a":"C","status":"OK","ex":"答案C。SQL Server、MySQL、Access都是常见的数据库管理系统，Word是文字处理软件，跟数据库管理不沾边。"},{"c":10,"n":5,"m":"M2","mn":"数据库基础","s":"DBS 是指（　）","o":["数据库系统","数据库","数据仓库","数据库管理系统"],"a":"A","status":"OK","ex":"答案A。DBS即Database System，中文\"数据库系统\"；B的数据库是DB，C的数据仓库是DW，D的数据库管理系统是DBMS，各自是不同的东西。","roast":"缩写题白给分，DBS能选成数据仓库的怕是没背过单词。"},{"c":10,"n":6,"m":"M2","mn":"数据库基础","s":"数据库系统中，负责数据库的建立、使用和维护的工作人员称为（　）","o":["程序员","系统分析师","DBA","操作员"],"a":"C","status":"OK","ex":"答案C。负责数据库的建立、使用和维护的专职人员就是数据库管理员DBA；程序员负责写应用程序，系统分析师做需求分析，操作员只是使用系统。"},{"c":10,"n":7,"m":"M2","mn":"数据库基础","s":"与文件系统相比，数据库系统最主要的优点是（　）","o":["存储容量大","数据冗余度高","数据共享性好、冗余度低","不需要程序"],"a":"C","status":"OK","ex":"答案C。数据库系统相对文件系统最主要的优势是数据共享性好、冗余度低，从而保证数据一致性；B\"冗余度高\"恰恰是文件系统的毛病，A存储容量大不是数据库独有，D\"不需要程序\"纯属胡说。"},{"c":10,"n":8,"m":"M2","mn":"数据库基础","s":"数据管理技术的发展经历了三个阶段，依次是（　）","o":["人工管理、数据库系统、文件系统","人工管理、文件系统、数据库系统","数据库系统、文件系统、人工管理","文件系统、人工管理、数据库系统"],"a":"B","status":"OK","ex":"答案B。数据管理技术的发展顺序是人工管理阶段、文件系统阶段、数据库系统阶段，从最原始到最先进；其余选项把顺序打乱，按时间先后即可排除。"},{"c":10,"n":9,"m":"M2","mn":"数据库基础","s":"数据库系统的组成不包括（　）","o":["应用程序","数据库管理系统","操作系统内核","数据库"],"a":"C","status":"OK","ex":"答案C。数据库系统的组成一般指数据库、DBMS、应用程序、数据库管理员和用户等；\"操作系统内核\"属于底层系统软件，不算数据库系统本身的组成成分。"},{"c":10,"n":10,"m":"M2","mn":"数据库基础","s":"下列关于数据库特点的描述，错误的是（　）","o":["数据结构化","数据独立性高","数据冗余度高","数据共享性好"],"a":"C","status":"OK","ex":"答案C。数据库的特点是数据结构化、共享性高、冗余度低、独立性高；C说\"冗余度高\"正好说反了，数据库追求的恰恰是低冗余。"},{"c":10,"n":11,"m":"M2","mn":"数据库基础","s":"数据的独立性是指（　）","o":["数据库与操作系统相互独立","表与表之间相互独立","数据与数据之间相互独立","应用程序与数据的结构和存储相互独立"],"a":"D","status":"OK","ex":"答案D。数据独立性指应用程序不依赖于数据的结构和存储方式，数据变了程序不用跟着改；A、B、C都把\"独立\"理解成了别的对象之间的关系。"},{"c":10,"n":12,"m":"M2","mn":"数据库基础","s":"数据的物理独立性是指（　）","o":["数据的物理存储方式改变时应用程序不变","数据可存于不同介质","数据的逻辑结构改变时应用程序不变","数据与程序完全分离"],"a":"A","status":"OK","ex":"答案A。物理独立性指数据的物理存储方式改变时应用程序不必改变；C描述的是逻辑独立性，两种独立性不要混为一谈。"},{"c":10,"n":13,"m":"M2","mn":"数据库基础","s":"下列属于关系型数据库管理系统的是（　）","o":["MySQL","Flash","Photoshop","Excel"],"a":"A","status":"OK","ex":"答案A。MySQL是典型的关系型数据库管理系统；Flash做动画、Photoshop处理图像、Excel是电子表格软件，都不属于DBMS。"},{"c":10,"n":14,"m":"M2","mn":"数据库基础","s":"数据库技术主要解决的问题是（　）","o":["程序的编写效率","数据的大量存储","数据的共享与统一管理","数据的快速打印"],"a":"C","status":"OK","ex":"答案C。数据库技术要解决的核心问题是数据的共享与统一管理，在此前提下减少冗余、保证一致性；A编程效率、B单纯的大量存储、D打印都不是它的根本目标。"},{"c":10,"n":15,"m":"M2","mn":"数据库基础","s":"数据库（DB）、数据库管理系统（DBMS）、数据库系统（DBS）三者关系是（　）","o":["DBMS 包括 DB 和 DBS","三者互相独立","DBS 包括 DB 和 DBMS","DB 包括 DBMS 和 DBS"],"a":"C","status":"OK","ex":"答案C。DBS是最大的概念，由数据库DB和数据库管理系统DBMS（加上应用程序、人员等）组成；A、D把包含关系说反了，B\"互相独立\"更不对。"},{"c":10,"n":16,"m":"M2","mn":"数据库基础","s":"常见的数据模型有三种，即层次模型、网状模型和（　）","o":["链表模型","关系模型","树状模型","面向对象模型"],"a":"B","status":"OK","ex":"答案B。经典三大数据模型是层次模型、网状模型和关系模型；链表、树是数据结构不是数据模型，面向对象模型虽存在但不属于本题所指的三种传统模型。"},{"c":10,"n":17,"m":"M2","mn":"数据库基础","s":"在关系模型中，一个关系对应一张（　）","o":["树形图","二维表","三维表","一维表"],"a":"B","status":"OK","ex":"答案B。关系模型中一个关系就是一张二维表；树形图是层次模型的形态，三维表、一维表都不是关系的形态。","roast":"一个关系一张二维表，背了就白给，答错等于白学。"},{"c":10,"n":18,"m":"M2","mn":"数据库基础","s":"在关系模型中，表中的一行称为（　）","o":["关键字","属性","域","元组"],"a":"D","status":"OK","ex":"答案D。二维表中的一行叫元组（也叫记录）；一列是属性，属性的取值范围叫域，关键字是能唯一标识元组的属性，概念别串行。","roast":"行是元组列是属性，这都记不住我都替你脸红。"},{"c":10,"n":19,"m":"M2","mn":"数据库基础","s":"在关系模型中，表中的一列称为（　）","o":["联系","元组","属性","记录"],"a":"C","status":"OK","ex":"答案C。二维表中的一列叫属性（字段）；一行才叫元组或记录，\"联系\"是E-R模型中的概念，位置别放错。"},{"c":10,"n":20,"m":"M2","mn":"数据库基础","s":"在关系模型中，属性的取值范围称为（　）","o":["域","关系","元组","键"],"a":"A","status":"OK","ex":"答案A。属性的取值范围称为域，例如性别的域是\"男、女\"；关系指整张表，元组指行，键指起标识作用的属性，各是各的概念。"},{"c":10,"n":21,"m":"M2","mn":"数据库基础","s":"在 E-R 图中，用矩形表示（　）","o":["属性","实体","字段","联系"],"a":"B","status":"OK","ex":"答案B。E-R图中矩形表示实体；椭圆表示属性、菱形表示联系，三个图形各管一摊，记牢就不会错。","roast":"矩形实体椭圆属性菱形联系，画三遍就该刻进脑子，送分不接我收回。"},{"c":10,"n":22,"m":"M2","mn":"数据库基础","s":"在 E-R 图中，用椭圆（椭圆形）表示（　）","o":["实体","主键","联系","属性"],"a":"D","status":"OK","ex":"答案D。E-R图中椭圆表示属性；矩形是实体、菱形是联系，别把三件套的位置记混。","roast":"椭圆=属性，E-R三件套的送分题，错了回去抄图。"},{"c":10,"n":23,"m":"M2","mn":"数据库基础","s":"在 E-R 图中，用菱形表示（　）","o":["属性","联系","类型","实体"],"a":"B","status":"OK","ex":"答案B。E-R图中菱形表示实体之间的联系；矩形是实体，椭圆是属性，照图记就行。","roast":"菱形联系，跟矩形椭圆一伙的送分题，这都能错？"},{"c":10,"n":24,"m":"M2","mn":"数据库基础","s":"若一个班级有多个学生，一个学生只属于一个班级，则班级与学生的联系属于（　）","o":["一对一","无联系","多对多","一对多"],"a":"D","status":"OK","ex":"答案D。一个班级有多个学生，一个学生只属于一个班级，一方为一方为多，属于一对多联系。"},{"c":10,"n":25,"m":"M2","mn":"数据库基础","s":"图书与读者之间的借阅关系属于（　）","o":["无联系","多对多","一对多","一对一"],"a":"B","status":"OK","ex":"答案B。一本图书可被多个读者借阅，一个读者也可借多本图书，两边都是\"多\"，属于多对多联系。"},{"c":10,"n":26,"m":"M2","mn":"数据库基础","s":"目前应用最广泛的数据模型是（　）","o":["层次模型","面向对象模型","关系模型","网状模型"],"a":"C","status":"OK","ex":"答案C。目前应用最广泛的数据模型是关系模型，MySQL、SQL Server等主流数据库都是关系型的；层次、网状模型早已退出主流。"},{"c":10,"n":27,"m":"M2","mn":"数据库基础","s":"实体是指（　）","o":["客观存在并可相互区别的事物","表中的一列","数据之间的关系","属性的取值"],"a":"A","status":"OK","ex":"答案A。实体的定义是\"客观存在并可相互区别的事物\"，如一个学生、一本书；B说的是属性，C说的是联系，D是域的取值。"},{"c":10,"n":28,"m":"M2","mn":"数据库基础","s":"在关系表中，能唯一标识一条记录的字段或字段组合称为（　）","o":["视图","外键","主键","索引"],"a":"C","status":"OK","ex":"答案C。能唯一标识一条记录的字段或字段组合就是主键；外键用于建立表间联系，索引用于加快查询，视图是虚拟表，都不能承担唯一标识记录的职责。"},{"c":10,"n":29,"m":"M2","mn":"数据库基础","s":"关于主键的说法，正确的是（　）","o":["主键的值不能为空且不能重复","一个表可以有多个主键","主键的值可以为空","主键必须是数值型"],"a":"A","status":"OK","ex":"答案A。主键的约束是\"非空且唯一\"；一个表只能有一个主键，主键值可以为空的说法错误，主键也不要求必须是数值型。"},{"c":10,"n":30,"m":"M2","mn":"数据库基础","s":"一个数据表最多可以有（　）个主键","o":["任意多","2","3","1"],"a":"D","status":"OK","ex":"答案D。一个数据表只能有一个主键——即使由多个字段组成组合主键，主键本身也只有一个；这是主键定义决定的。"},{"c":10,"n":31,"m":"M2","mn":"数据库基础","s":"外键的主要作用是（　）","o":["实现表与表之间的联系并保证数据一致性","加快查询速度","节省存储空间","防止数据被删除"],"a":"A","status":"OK","ex":"答案A。外键用于实现表与表之间的联系，并通过参照约束保证数据一致性；加快查询靠索引，节省存储空间、防止数据被删除都不是外键的职责。"},{"c":10,"n":32,"m":"M2","mn":"数据库基础","s":"外键的值必须是（　）","o":["任意值","数值型","另一个表中某个主键的值，或为空","唯一的"],"a":"C","status":"OK","ex":"答案C。外键的取值要么为空，要么必须等于参照表中某个主键的值，否则破坏参照完整性；\"任意值\"和\"必须唯一\"都不是对外键的要求，外键也不限于数值型。"},{"c":10,"n":33,"m":"M2","mn":"数据库基础","s":"实体完整性要求（　）","o":["主键不能为空且不能重复","外键不能为空","字段值必须在规定范围内","所有字段都不能为空"],"a":"A","status":"OK","ex":"答案A。实体完整性针对主键：主键值不能为空且不能重复；C\"字段值在规定范围内\"属于用户定义完整性，B\"外键不能为空\"的说法本身就不对，外键允许为空。"},{"c":10,"n":34,"m":"M2","mn":"数据库基础","s":"参照完整性要求（　）","o":["字段值不能重复","外键的取值必须参照另一表的主键值","主键不能为空","表中不能有重复行"],"a":"B","status":"OK","ex":"答案B。参照完整性管的是外键：外键的取值必须参照被参照表中主键的已有值（或为空）；C\"主键不能为空\"是实体完整性，A、D与这三类完整性规则都对不上。"},{"c":10,"n":35,"m":"M2","mn":"数据库基础","s":"一个数据表可以有（　）个外键","o":["只能1个","最多2个","0个或1个","多个"],"a":"D","status":"OK","ex":"答案D。一个表可以定义多个外键，引用一张别的表就可以设一个；外键不像主键那样限制只有一个。"},{"c":10,"n":36,"m":"M2","mn":"数据库基础","s":"组合主键是指（　）","o":["由两个或多个字段共同组成的主键","两个表的主键","主键和索引的组合","主键和外键的组合"],"a":"A","status":"OK","ex":"答案A。组合主键是由两个或多个字段共同组成的主键，只要组合起来能唯一标识记录即可；与\"两个表的主键\"\"主键和外键的组合\"之类说法无关。"},{"c":10,"n":37,"m":"M2","mn":"数据库基础","s":"下列关于主键的说法，错误的是（　）","o":["主键可以由多个字段组成","主键的值不能重复","主键可以唯一标识表中的一条记录","主键的值可以为空"],"a":"D","status":"OK","ex":"答案D。主键必须非空且唯一，\"主键的值可以为空\"是错误说法；A、B、C都是主键的正确性质，注意本题选的是错误项。"},{"c":10,"n":38,"m":"M2","mn":"数据库基础","s":"在 student 表中，学号能唯一确定一个学生，则学号可以作为（　）","o":["主键","外键","视图名","索引名"],"a":"A","status":"OK","ex":"答案A。学号能唯一确定一个学生，满足主键\"唯一标识记录\"的要求，因此可作主键；外键是引用他表主键的字段，视图和索引是另外的对象。"},{"c":10,"n":39,"m":"M2","mn":"数据库基础","s":"设立外键的目的是（　）","o":["提高查询速度","方便排序","保证数据的一致性与完整性","减少数据冗余"],"a":"C","status":"OK","ex":"答案C。设置外键的根本目的是保证数据的一致性与完整性，即参照完整性约束；提高查询速度靠索引，方便排序、减少冗余都不是外键的功能。"},{"c":10,"n":40,"m":"M2","mn":"数据库基础","s":"关系数据库中，表与表之间的联系是通过（　）实现的","o":["外键","视图","索引","相同的字段名"],"a":"A","status":"OK","ex":"答案A。关系数据库中表与表之间的联系通过外键实现，从表的外键引用主表的主键；视图是虚拟表，索引管查询速度，仅字段名相同并不能建立表间联系。"},{"c":10,"n":41,"m":"M2","mn":"数据库基础","s":"如果删除主表中某条记录，从表中与之对应的记录（　）","o":["必须全部删除","自动变成空值","可能被级联删除或受限制，取决于约束设置","一定不受影响"],"a":"C","status":"OK","ex":"答案C。删除主表记录时从表怎么办取决于外键约束的设置：可能级联删除、限制删除或置空等，不能一概而论；A、B、D都把结果说死了。"},{"c":10,"n":42,"m":"M2","mn":"数据库基础","s":"用户定义完整性是指（　）","o":["针对具体应用定义的字段取值范围等约束","外键必须参照主键","主键不能为空","用户自己编写程序"],"a":"A","status":"OK","ex":"答案A。用户定义完整性是针对具体应用环境定义的约束，如字段取值范围、非空、默认值等；B是参照完整性，C是实体完整性，D\"用户自己编写程序\"根本不是完整性。"},{"c":10,"n":43,"m":"M2","mn":"数据库基础","s":"SQL 的中文含义是（　）","o":["系统查询语言","顺序查询语言","标准查询语言","结构化查询语言"],"a":"D","status":"OK","ex":"答案D。SQL是Structured Query Language的缩写，中文为\"结构化查询语言\"；A、B、C都是望文生义的干扰翻译。","roast":"SQL的中文名都写不对，回去把缩写表抄十遍。"},{"c":10,"n":44,"m":"M2","mn":"数据库基础","s":"SQL 中用于查询数据的关键字是（　）","o":["FIND","QUERY","SELECT","GET"],"a":"C","status":"OK","ex":"答案C。SQL中查询数据的关键字是SELECT；FIND、QUERY、GET都不是SQL的查询关键字，属于生造的干扰项。","roast":"SELECT查询都选不出，我瓜子都替你臊得慌。"},{"c":10,"n":45,"m":"M2","mn":"数据库基础","s":"在 SQL 中，查询表中所有列的符号是（　）","o":["#","?","@","*"],"a":"D","status":"OK","ex":"答案D。SELECT后的星号*表示查询表中所有列；#、?、@在SQL中没有这种用途。","roast":"SELECT *的星号，数据库第一节课的内容，白给。"},{"c":10,"n":46,"m":"M2","mn":"数据库基础","s":"语句 SELECT * FROM student 的作用是（　）","o":["修改 student 表结构","查询 student 表的第一条记录","删除 student 表的所有记录","查询 student 表的所有记录的所有字段"],"a":"D","status":"OK","ex":"答案D。SELECT * FROM student是查询student表中所有记录的所有字段；修改表结构要用ALTER，删除记录要用DELETE，查询本身不改变数据。"},{"c":10,"n":47,"m":"M2","mn":"数据库基础","s":"若要查询 student 表中所有学生的姓名和年龄，正确的语句是（　）","o":["SELECT * FROM student 姓名,年龄","QUERY 姓名,年龄 FROM student","SELECT 姓名,年龄 FROM student","SELECT FROM student (姓名,年龄)"],"a":"C","status":"OK","ex":"答案C。查询指定列的标准写法是SELECT 列名 FROM 表名，即SELECT 姓名,年龄 FROM student；A把*与列名混写，B用了不存在的QUERY关键字，D语法错乱，都不是合法SQL。"},{"c":10,"n":48,"m":"M2","mn":"数据库基础","s":"在查询中去掉重复记录，应使用关键字（　）","o":["ONLY","DISTINCT","DIFFERENT","UNIQUE"],"a":"B","status":"OK","ex":"答案B。去掉查询结果中的重复记录用DISTINCT，写在SELECT之后；ONLY、DIFFERENT、UNIQUE都不是完成该功能的关键字。"},{"c":10,"n":49,"m":"M2","mn":"数据库基础","s":"SQL 中用于指定查询条件的是（　）子句","o":["GROUP BY","FROM","ORDER BY","WHERE"],"a":"D","status":"OK","ex":"答案D。WHERE子句用于指定查询的筛选条件；GROUP BY负责分组，ORDER BY负责排序，FROM指明数据来源，各司其职。"},{"c":10,"n":50,"m":"M2","mn":"数据库基础","s":"SQL 中对查询结果进行排序使用（　）","o":["SORT BY","GROUP BY","ORDER BY","ARRANGE BY"],"a":"C","status":"OK","ex":"答案C。对查询结果排序用ORDER BY；SORT BY、ARRANGE BY不是SQL关键字，GROUP BY是分组不是排序。"},{"c":10,"n":51,"m":"M2","mn":"数据库基础","s":"在 ORDER BY 中，实现降序排列的关键字是（　）","o":["DOWN","REVERSE","DESC","ASC"],"a":"C","status":"OK","ex":"答案C。ORDER BY中DESC表示降序，ASC表示升序；DOWN、REVERSE不是SQL的排序关键字。"},{"c":10,"n":52,"m":"M2","mn":"数据库基础","s":"ORDER BY 中默认的排序方式是（　）","o":["升序","随机","按插入顺序","降序"],"a":"A","status":"OK","ex":"答案A。ORDER BY省略ASC/DESC时默认按升序（ASC）排列；随机、按插入顺序、降序都不是默认行为。"},{"c":10,"n":53,"m":"M2","mn":"数据库基础","s":"SQL 中进行模糊查询使用的关键字是（　）","o":["IS","LIKE","AS","IN"],"a":"B","status":"OK","ex":"答案B。模糊查询用LIKE配合通配符实现；IS用于判断空值，IN用于集合匹配，AS用于起别名，功能各不相同。"},{"c":10,"n":54,"m":"M2","mn":"数据库基础","s":"在 LIKE 语句中，通配符 % 表示（　）","o":["任意多个（含零个）字符","数字","空格","任意单个字符"],"a":"A","status":"OK","ex":"答案A。LIKE中的%匹配任意多个字符（含零个）；匹配任意单个字符是下划线_的职责，两个通配符不要记反。"},{"c":10,"n":55,"m":"M2","mn":"数据库基础","s":"在 LIKE 语句中，通配符 _ 表示（　）","o":["任意单个字符","任意多个字符","一个数字","一个汉字"],"a":"A","status":"OK","ex":"答案A。LIKE中的下划线_恰好匹配任意单个字符；%才是\"任意多个字符\"，限定成\"一个数字\"或\"一个汉字\"都把范围说窄了。"},{"c":10,"n":56,"m":"M2","mn":"数据库基础","s":"要查询姓“张”的所有学生，正确的条件是（　）","o":["WHERE 姓名 IN '张'","WHERE 姓名 = '张'","WHERE 姓名 LIKE '%张'","WHERE 姓名 LIKE '张%'"],"a":"D","status":"OK","ex":"答案D。姓\"张\"即以\"张\"开头，应写LIKE '张%'；C的'%张'匹配的是以\"张\"结尾的，='张'只匹配恰好叫\"张\"的，IN的用法也不成立。"},{"c":10,"n":57,"m":"M2","mn":"数据库基础","s":"要查询年龄在 20 到 25 岁之间的学生，正确的写法是（　）","o":["WHERE 年龄 BETWEEN 20 AND 25","WHERE 年龄 LIKE 20-25","WHERE 年龄 = 20 AND 25","WHERE 年龄 IN 20 TO 25"],"a":"A","status":"OK","ex":"答案A。BETWEEN 20 AND 25表示20到25的闭区间；LIKE用于字符串模糊匹配不能表达数值范围，=只能和一个值比较，IN 20 TO 25的写法不存在。"},{"c":10,"n":58,"m":"M2","mn":"数据库基础","s":"判断某字段是否为空值，应使用（　）","o":["IS NULL","== NULL","= NULL","LIKE NULL"],"a":"A","status":"OK","ex":"答案A。判断空值必须用IS NULL；NULL与任何值用=比较的结果都是未知，所以\"= NULL\"判断不出空值，==和LIKE也不行。"},{"c":10,"n":59,"m":"M2","mn":"数据库基础","s":"关键字 IN 的作用是（　）","o":["进行模糊匹配","判断字段是否为空","对结果排序","判断字段值是否在指定集合中"],"a":"D","status":"OK","ex":"答案D。IN用于判断字段值是否在指定集合中，如年龄 IN (20,21,22)；模糊匹配是LIKE的活，判断空值用IS NULL，排序用ORDER BY。"},{"c":10,"n":60,"m":"M2","mn":"数据库基础","s":"字符串常量在 SQL 语句中应使用的定界符是（　）","o":["单引号","方括号","双引号","圆括号"],"a":"A","status":"OK","ex":"答案A。SQL中字符串常量用单引号定界，如'张三'；双引号在标准SQL中一般用于标识符，方括号、圆括号都不是字符串定界符。"},{"c":10,"n":61,"m":"M2","mn":"数据库基础","s":"下列不属于 SQL 聚合函数的是（　）","o":["SUM","AVG","COUNT","LIKE"],"a":"D","status":"OK","ex":"答案D。SUM、AVG、COUNT都是聚合函数（同类的还有MAX、MIN），LIKE是模糊匹配谓词，不属于聚合函数。"},{"c":10,"n":62,"m":"M2","mn":"数据库基础","s":"用于统计记录条数的函数是（　）","o":["TOTAL","COUNT","SUM","NUM"],"a":"B","status":"OK","ex":"答案B。COUNT 是统计记录条数的聚合函数；SUM 求和，TOTAL 和 NUM 都不是 SQL 标准聚合函数。","roast":"背个函数名就白给分，这都能丢，我替你脸红。"},{"c":10,"n":63,"m":"M2","mn":"数据库基础","s":"用于求平均值的函数是（　）","o":["AVG","MID","AVE","MEAN"],"a":"A","status":"OK","ex":"答案A。AVG 是求平均值的聚合函数；MID 是字符串截取函数，AVE、MEAN 不是 SQL 的写法，AVG 就是 average 的缩写。","roast":"AVG=average 砍个尾巴，这都记不住？"},{"c":10,"n":64,"m":"M2","mn":"数据库基础","s":"用于求和的函数是（　）","o":["PLUS","TOTAL","SUM","ADD"],"a":"C","status":"OK","ex":"答案C。SUM 是标准的求和聚合函数；PLUS、ADD、TOTAL 都不是 SQL 关键字，别按英语直译选 ADD。","roast":"SUM、AVG、MAX、MIN 一套背完，这题属于闭眼送分。"},{"c":10,"n":65,"m":"M2","mn":"数据库基础","s":"用于求最大值的函数是（　）","o":["TOP","BIG","LARGE","MAX"],"a":"D","status":"OK","ex":"答案D。MAX 求最大值；TOP 是 SQL Server 里取前 N 条的关键字，BIG、LARGE 只是英语单词，SQL 里不认。","roast":"MAX/MIN 一对儿，打包背就能拿的分，分开丢冤不冤？"},{"c":10,"n":66,"m":"M2","mn":"数据库基础","s":"用于求最小值的函数是（　）","o":["LOW","MIN","SMALL","LEAST"],"a":"B","status":"OK","ex":"答案B。MIN 求最小值，与 MAX 相对；LOW、SMALL、LEAST 是日常英语不是函数。聚合函数就五个：COUNT、SUM、AVG、MAX、MIN。","roast":"五个聚合函数编个顺口溜就完事，还错？"},{"c":10,"n":67,"m":"M2","mn":"数据库基础","s":"对查询结果进行分组统计，应使用（　）子句","o":["WHERE","GROUP BY","ORDER BY","DISTINCT"],"a":"B","status":"OK","ex":"答案B。GROUP BY 把字段值相同的记录归为一组，配合聚合函数做分组统计；WHERE 是行筛选，ORDER BY 是排序，DISTINCT 是去重。"},{"c":10,"n":68,"m":"M2","mn":"数据库基础","s":"对分组后的结果再进行筛选，应使用（　）子句","o":["WHERE","ORDER BY","HAVING","GROUP BY"],"a":"C","status":"OK","ex":"答案C。HAVING 专门在分组之后筛选，条件里常带聚合函数；WHERE 作用于分组前的原始行，GROUP BY 只负责分组不筛选。"},{"c":10,"n":69,"m":"M2","mn":"数据库基础","s":"WHERE 与 HAVING 的主要区别是（　）","o":["HAVING 只能用于字符串","WHERE 在分组前筛选，HAVING 在分组后筛选","WHERE 只能用于数值","两者完全相同"],"a":"B","status":"OK","ex":"答案B。两者筛选时机不同：WHERE 在 GROUP BY 之前对原始记录筛选，HAVING 在分组之后对组筛选；它们都不限于数值或字符串，更不是完全相同。"},{"c":10,"n":70,"m":"M2","mn":"数据库基础","s":"查询 student 表中性别为“男”的记录，正确的语句是（　）","o":["SELECT * FROM student WHERE 性别=男","SELECT * FROM student 性别='男'","SELECT * FROM student LIKE 性别='男'","SELECT * FROM student WHERE 性别='男'"],"a":"D","status":"OK","ex":"答案D。字符串值必须用单引号括起来，条件要用 WHERE 引导，即 WHERE 性别='男'。A 缺引号，B 漏了 WHERE，C 把 LIKE 用在了错误的位置。"},{"c":10,"n":71,"m":"M2","mn":"数据库基础","s":"查询结果按年龄从小到大排列，正确的子句是（　）","o":["ORDER BY 年龄 DESC","GROUP BY 年龄","ORDER BY 年龄 ASC","SORT BY 年龄"],"a":"C","status":"OK","ex":"答案C。从小到大是升序，用 ASC（也是默认排序）；DESC 是降序，GROUP BY 是分组，SORT 不是 SQL 关键字。"},{"c":10,"n":72,"m":"M2","mn":"数据库基础","s":"多个条件必须同时满足时使用（　）","o":["OR","AND","NOT","IN"],"a":"B","status":"OK","ex":"答案B。AND 要求多个条件同时成立；OR 是满足其一即可，NOT 是取反，IN 用于判断值是否在某个列表中。"},{"c":10,"n":73,"m":"M2","mn":"数据库基础","s":"多个条件满足其中一个即可时使用（　）","o":["OR","AND","LIKE","NOT"],"a":"A","status":"OK","ex":"答案A。OR 连接的条件只要有一个满足整体就成立；AND 要求全部满足，LIKE 是模糊匹配，NOT 是取反。"},{"c":10,"n":74,"m":"M2","mn":"数据库基础","s":"查询所有不是“男”生的记录，可以使用（　）","o":["WHERE 性别 LIKE 男","WHERE 性别 <> '男'","WHERE 性别 != 男","WHERE 性别 NOT '男'"],"a":"B","status":"OK","ex":"答案B。不等于写作 <>（或 !=），字符串要加单引号，即 WHERE 性别<>'男'；A 用错 LIKE，C 缺少引号，D 的 NOT 后直接跟值不是合法语法。"},{"c":10,"n":75,"m":"M2","mn":"数据库基础","s":"在 SQL 中，<> 表示（　）","o":["不等于","大于","等于","小于"],"a":"A","status":"OK","ex":"答案A。<> 是比较运算符里的不等于，等价于 !=；= 是等于，> 和 < 分别是大于、小于。","roast":"符号题也丢分？<> 长得就是个俩都不等的样，我没话说了。"},{"c":10,"n":76,"m":"M2","mn":"数据库基础","s":"多重排序，即先按字段1排序、字段1相同时再按字段2排序，写法是（　）","o":["ORDER BY 字段1, 字段2","ORDER BY 字段1 + 字段2","ORDER BY 字段1 AND 字段2","ORDER BY 字段1 OR 字段2"],"a":"A","status":"OK","ex":"答案A。多重排序在 ORDER BY 后用逗号依次列出字段，写在前面的优先；+、AND、OR 都不是连接排序字段的写法。"},{"c":10,"n":77,"m":"M2","mn":"数据库基础","s":"连接查询中用于指定连接条件的关键字是（　）","o":["AT","ON","FOR","WITH"],"a":"B","status":"OK","ex":"答案B。连接条件跟在 JOIN 后面的 ON 关键字之后，如 ON a.学号=b.学号；AT、FOR、WITH 都不用于指定连接条件。"},{"c":10,"n":78,"m":"M2","mn":"数据库基础","s":"内连接使用的关键字是（　）","o":["INNER JOIN","ALL JOIN","LEFT JOIN","OUTER JOIN"],"a":"A","status":"OK","ex":"答案A。内连接用 INNER JOIN；LEFT JOIN 是左外连接，OUTER 必须搭配 LEFT/RIGHT/FULL 使用，ALL JOIN 根本不存在。"},{"c":10,"n":79,"m":"M2","mn":"数据库基础","s":"统计 student 表中共有多少条记录，正确的语句是（　）","o":["SELECT SUM(*) FROM student","SELECT COUNT(*) FROM student","SELECT COUNT FROM student","SELECT * COUNT FROM student"],"a":"B","status":"OK","ex":"答案B。COUNT(*) 统计记录条数，格式为 SELECT COUNT(*) FROM student；SUM 是求和不能作用在 * 上，C、D 的 COUNT 后面缺括号或参数。"},{"c":10,"n":80,"m":"M2","mn":"数据库基础","s":"查询每个班级的学生人数，正确的语句是（　）","o":["SELECT 班级, COUNT(*) FROM student GROUP BY 班级","SELECT 班级, COUNT(*) FROM student ORDER BY 班级","SELECT 班级 FROM student COUNT(*)","SELECT COUNT(*) FROM student GROUP BY 班级"],"a":"A","status":"OK","ex":"答案A。统计每个班级人数要按班级分组：SELECT 班级, COUNT(*) FROM student GROUP BY 班级；B 只排序不分组，C 语法错误，D 少了班级列。"},{"c":10,"n":81,"m":"M2","mn":"数据库基础","s":"查询 score 表中的最高分，正确的语句是（　）","o":["SELECT HIGH(成绩) FROM score","SELECT 成绩 MAX FROM score","SELECT TOP(成绩) FROM score","SELECT MAX(成绩) FROM score"],"a":"D","status":"OK","ex":"答案D。求最高分用聚合函数：SELECT MAX(成绩) FROM score；HIGH、TOP 不是求最大值的函数，B 把关键字位置写反了。"},{"c":10,"n":82,"m":"M2","mn":"数据库基础","s":"给查询结果中的列起别名，使用的关键字是（　）","o":["ALIAS","WITH","IS","AS"],"a":"D","status":"OK","ex":"答案D。列别名用 AS，如 SELECT 姓名 AS 名字 FROM student；ALIAS、WITH、IS 都不是起别名的关键字。","roast":"AS 起别名，一个词的题还错？把课本吃了它。"},{"c":10,"n":83,"m":"M2","mn":"数据库基础","s":"在 SQL Server 中只查询前 10 条记录，应使用（　）","o":["FIRST 10","TOP 10","HEAD 10","LIMIT 10"],"a":"B","status":"OK","ex":"答案B。SQL Server 取前 N 条用 TOP，即 SELECT TOP 10 ...；LIMIT 是 MySQL 的语法，FIRST、HEAD 不存在。"},{"c":10,"n":84,"m":"M2","mn":"数据库基础","s":"要查询姓名以“李”开头且年龄大于 20 的学生，正确的条件是（　）","o":["WHERE 姓名 LIKE '李%' OR 年龄>20","WHERE 姓名 LIKE '%李' AND 年龄>20","WHERE 姓名='李' AND 年龄>20","WHERE 姓名 LIKE '李%' AND 年龄>20"],"a":"D","status":"OK","ex":"答案D。以李开头写 LIKE '李%'（% 匹配任意多个字符），与年龄条件同时满足要用 AND 连接；A 用 OR 变成了或关系，B 的 '%李' 是以李结尾，C 只匹配姓名恰好等于'李'的人。"},{"c":10,"n":85,"m":"M2","mn":"数据库基础","s":"要查询成绩在 60 到 100 分之间（含端点）的记录，正确的写法是（　）","o":["WHERE 成绩 BETWEEN 60 AND 100","WHERE 成绩 IN 60,100","WHERE 成绩 >60 AND 100","WHERE 成绩 LIKE 60-100"],"a":"A","status":"OK","ex":"答案A。BETWEEN 60 AND 100 表示闭区间，包含 60 和 100 两个端点；IN 用于列举离散值，C 缺少与 100 的比较符，LIKE 是模糊匹配不能表示范围。"},{"c":10,"n":86,"m":"M2","mn":"数据库基础","s":"要查询学号为 1、3、5 的学生，正确的条件是（　）","o":["WHERE 学号 = 1,3,5","WHERE 学号 BETWEEN 1 AND 5","WHERE 学号 IN (1,3,5)","WHERE 学号 LIKE '1,3,5'"],"a":"C","status":"OK","ex":"答案C。离散的几个值用 IN (1,3,5) 列举；= 后面不能接逗号列表，BETWEEN 1 AND 5 会把 2 和 4 也查进来，LIKE 是模糊匹配。"},{"c":10,"n":87,"m":"M2","mn":"数据库基础","s":"要查询电话字段没有填写的学生，正确的条件是（　）","o":["WHERE 电话 = ''","WHERE 电话 IS NULL","WHERE 电话 = NULL","WHERE 电话 IS EMPTY"],"a":"B","status":"OK","ex":"答案B。判断空值必须用 IS NULL；NULL 与任何值用 = 比较结果都是未知，所以 = NULL 查不到结果，'' 是空字符串不等于 NULL，IS EMPTY 不是 SQL 语法。"},{"c":10,"n":88,"m":"M2","mn":"数据库基础","s":"SELECT 语句的基本语法结构中，最先执行的是（　）子句","o":["SELECT","ORDER BY","WHERE","FROM"],"a":"D","status":"OK","ex":"答案D。逻辑执行顺序是 FROM 最先（先确定数据来源），再 WHERE 筛选、GROUP BY 分组、HAVING 筛组，然后才轮到 SELECT 投影和 ORDER BY 排序；SELECT 写在最前只是书写顺序。"},{"c":10,"n":89,"m":"M2","mn":"数据库基础","s":"下列 SQL 运算符中，属于比较运算符的是（　）","o":["NOT","AND",">=","LIKE"],"a":"C","status":"OK","ex":"答案C。>= 是比较运算符；NOT、AND 属于逻辑运算符，LIKE 是模式匹配运算符，都不属于比较运算符。"},{"c":10,"n":90,"m":"M2","mn":"数据库基础","s":"要查询 student 表中年龄最大的学生信息，正确的语句是（　）","o":["SELECT * FROM student ORDER BY 年龄","SELECT MAX(*) FROM student","SELECT * FROM student WHERE 年龄 = (SELECT MAX(年龄) FROM student)","SELECT TOP MAX(年龄) FROM student"],"a":"C","status":"OK","ex":"答案C。先由子查询求出最大年龄，外层再用 WHERE 年龄=(SELECT MAX(年龄) FROM student) 找出对应记录；A 是升序排列且返回全部行，MAX(*) 不是合法写法，D 语法混乱。"},{"c":10,"n":91,"m":"M2","mn":"数据库基础","s":"查询结果中，若某列的值为空，在结果中显示为（　）","o":["空（NULL）","0","错误","空格"],"a":"A","status":"OK","ex":"答案A。空值在结果中显示为 NULL；0 是数值零、空格是字符，NULL 表示没有值，与它们都不是一回事。"},{"c":10,"n":92,"m":"M2","mn":"数据库基础","s":"下列语句中，能查询 student 表所有字段的是（　）","o":["SELECT ALL FROM student","SELECT 1 FROM student","SELECT FIELDS FROM student","SELECT * FROM student"],"a":"D","status":"OK","ex":"答案D。SELECT * 中的星号代表所有字段；ALL 不能单独作字段列表，SELECT 1 只返回常量 1，FIELDS 不是关键字。"},{"c":10,"n":93,"m":"M2","mn":"数据库基础","s":"向表中插入记录使用的关键字是（　）","o":["INSERT INTO","ADD INTO","PUT INTO","APPEND"],"a":"A","status":"OK","ex":"答案A。SQL 插入记录用 INSERT INTO 表名 ...；ADD、PUT 不是 SQL 关键字，APPEND 也不是标准 SQL 的插入语句。","roast":"INSERT INTO 送分送到嘴边，不接是跟分数有仇？"},{"c":10,"n":94,"m":"M2","mn":"数据库基础","s":"插入语句的正确格式是（　）","o":["INSERT 表名 VALUES 值","INSERT INTO 表名(字段列表) VALUES(值列表)","INSERT VALUES INTO 表名","ADD INTO 表名(字段) VALUES(值)"],"a":"B","status":"OK","ex":"答案B。标准格式是 INSERT INTO 表名(字段列表) VALUES(值列表)；A 缺 INTO 和括号，C 把 VALUES 放到了表名前面，D 的 ADD 根本不是插入关键字。"},{"c":10,"n":95,"m":"M2","mn":"数据库基础","s":"修改表中记录使用的关键字是（　）","o":["MODIFY","ALTER","UPDATE","CHANGE"],"a":"C","status":"OK","ex":"答案C。修改记录用 UPDATE 表名 SET ...；ALTER 用来修改表结构，MODIFY、CHANGE 不是标准 SQL 里修改记录的关键字。","roast":"UPDATE 改记录、ALTER 改结构，这组词背一遍受用一辈子，别懒。"},{"c":10,"n":96,"m":"M2","mn":"数据库基础","s":"修改语句中，指定新值的子句是（　）","o":["SET","WITH","TO","VALUES"],"a":"A","status":"OK","ex":"答案A。UPDATE 语句用 SET 子句给字段指定新值，如 UPDATE student SET 年龄=20；VALUES 是 INSERT 用的，TO、WITH 不用于赋值。"},{"c":10,"n":97,"m":"M2","mn":"数据库基础","s":"DELETE 语句中用来指定删除条件的是（　）","o":["HAVING","WHERE","ON","IF"],"a":"B","status":"OK","ex":"答案B。DELETE FROM 表名 WHERE 条件，用 WHERE 指定删除哪些记录；不带 WHERE 会删光全表数据。HAVING 配分组用，ON 配连接用，IF 不是 SQL 的条件子句。"},{"c":10,"n":98,"m":"M2","mn":"数据库基础","s":"执行 DELETE FROM student 后，结果是（　）","o":["只删除第一条记录","没有任何影响","删除 student 表及其中所有记录","删除 student 表中的所有记录，表结构保留"],"a":"D","status":"OK","ex":"答案D。DELETE FROM student 不带 WHERE 时删除表中所有记录，但表结构保留；连表结构一起删的是 DROP TABLE。"},{"c":10,"n":99,"m":"M2","mn":"数据库基础","s":"要删除 student 表的结构，应使用（　）","o":["DELETE TABLE student","REMOVE student","CLEAR TABLE student","DROP TABLE student"],"a":"D","status":"OK","ex":"答案D。删除整张表用 DROP TABLE student；DELETE TABLE 语法不存在，REMOVE、CLEAR 不是 SQL 关键字。"},{"c":10,"n":100,"m":"M2","mn":"数据库基础","s":"DELETE 与 DROP 的区别是（　）","o":["两者完全相同","DROP 只能删除一行","DELETE 删除表，DROP 删除记录","DELETE 删除记录，DROP 删除整个表"],"a":"D","status":"OK","ex":"答案D。DELETE 删除的是记录（可带条件），表结构保留；DROP TABLE 连表带数据一起删。C 正好把两者说反了。"},{"c":10,"n":101,"m":"M2","mn":"数据库基础","s":"同时修改多个字段的值，正确的写法是（　）","o":["SET 字段1, 字段2 = 值1, 值2","SET (字段1,字段2)=(值1,值2)","SET 字段1=值1, 字段2=值2","SET 字段1=值1 AND 字段2=值2"],"a":"C","status":"OK","ex":"答案C。多个字段赋值用逗号分隔：SET 字段1=值1, 字段2=值2；A、B 的写法不合法，AND 用来连接条件而不是赋值项。"},{"c":10,"n":102,"m":"M2","mn":"数据库基础","s":"执行 UPDATE 语句时如果不加 WHERE 条件，结果是（　）","o":["不修改任何记录","修改表中所有记录","只修改第一条记录","报错"],"a":"B","status":"OK","ex":"答案B。UPDATE 不加 WHERE 条件时默认作用于表中所有记录，不会报错也不会只改一条，所以更新前一定要想清楚条件。"},{"c":10,"n":103,"m":"M2","mn":"数据库基础","s":"删除 student 表中年龄大于 30 的记录，正确的语句是（　）","o":["DROP FROM student WHERE 年龄>30","DELETE FROM student WHERE 年龄>30","DELETE student 年龄>30","DELETE FROM student 年龄>30"],"a":"B","status":"OK","ex":"答案B。删除满足条件的记录：DELETE FROM student WHERE 年龄>30；DROP FROM 不是合法语句，C、D 少了 WHERE 关键字。"},{"c":10,"n":104,"m":"M2","mn":"数据库基础","s":"TRUNCATE TABLE 语句的作用是（　）","o":["修改表结构","删除表结构","删除表中所有数据但保留表结构","查询表数据"],"a":"C","status":"OK","ex":"答案C。TRUNCATE TABLE 一次性清空表中全部数据但保留表结构，比逐行 DELETE 快；它既不改表结构也不删表。"},{"c":10,"n":105,"m":"M2","mn":"数据库基础","s":"使用 INSERT 语句插入数据时，字段列表与值列表必须（　）","o":["都为数字","可以随意","数量相同、类型对应","完全相同"],"a":"C","status":"OK","ex":"答案C。字段列表与值列表必须个数相同、类型对应，否则插入失败或数据错乱；D 说'完全相同'没有道理，字段列表本来就可以省略或只写部分字段。"},{"c":10,"n":106,"m":"M2","mn":"数据库基础","s":"下列关于 UPDATE 语句的说法，正确的是（　）","o":["可以不带 WHERE 条件，此时修改全部记录","只能修改一个字段","不能修改数值型字段","必须带 WHERE 条件"],"a":"A","status":"OK","ex":"答案A。UPDATE 语法允许不带 WHERE，此时修改的是全部记录；B 错在 SET 后可用逗号改多个字段，C 错在数值字段照样能改，D 错在不带 WHERE 并不报错。"},{"c":10,"n":107,"m":"M2","mn":"数据库基础","s":"向 student 表添加一条记录，字段顺序与表定义完全一致时可省略（　）","o":["VALUES 关键字","字段列表","表名","INSERT 关键字"],"a":"B","status":"OK","ex":"答案B。当 VALUES 里值的个数、顺序、类型与表定义的全部字段一一对应时，可省略字段列表，写成 INSERT INTO student VALUES(...)；VALUES、表名、INSERT 都不能省。"},{"c":10,"n":108,"m":"M2","mn":"数据库基础","s":"视图是一个（　）","o":["索引","虚拟表","物理表","存储过程"],"a":"B","status":"OK","ex":"答案B。视图是基于查询定义的虚拟表，本身不存放数据；它不是物理表，也不是索引或存储过程。","roast":"虚拟表三个字背到就是分，这题丢分离谱。"},{"c":10,"n":109,"m":"M2","mn":"数据库基础","s":"视图中的数据来源于（　）","o":["内存变量","基本表或其他视图","临时表","独立存储的文件"],"a":"B","status":"OK","ex":"答案B。视图的数据来自基本表（或其他视图），查询视图时实时从基表取数；它不来自内存变量、临时表，更不是独立文件。"},{"c":10,"n":110,"m":"M2","mn":"数据库基础","s":"建立索引的主要作用是（　）","o":["加快查询速度","美化表结构","节省存储空间","保证数据完整性"],"a":"A","status":"OK","ex":"答案A。建立索引的核心目的是加快查询（检索）速度；索引的代价是占存储空间、拖慢插入和修改，所以美化结构、节省空间都说不通。"},{"c":10,"n":111,"m":"M2","mn":"数据库基础","s":"下列关于索引的说法，错误的是（　）","o":["索引会占用一定的存储空间","索引可以加快查询速度","索引越多越好","索引会降低插入、修改的速度"],"a":"C","status":"OK","ex":"答案C。索引并非越多越好：每个索引都占空间，且数据增删改时要同步维护，越多反而越慢；A、B、D 说的都是索引的真实特点。"},{"c":10,"n":112,"m":"M2","mn":"数据库基础","s":"为主键自动创建的索引属于（　）","o":["全文索引","普通索引","唯一索引","聚簇索引"],"a":"C","status":"OK","ex":"答案C。主键要求取值唯一且非空，系统为主键自动创建的是唯一索引；全文索引用于文本检索，普通索引不要求唯一，聚簇索引是按键值物理排序的组织方式。"},{"c":10,"n":113,"m":"M2","mn":"数据库基础","s":"下列数据类型中，用于存储字符（文本）的是（　）","o":["VARCHAR","FLOAT","DATE","INT"],"a":"A","status":"OK","ex":"答案A。VARCHAR 是可变长度字符类型，用来存文本；FLOAT 存浮点数，DATE 存日期，INT 存整数。","roast":"VAR=variable 变长字符，类型题是全卷最白给的一档，背！"},{"c":10,"n":114,"m":"M2","mn":"数据库基础","s":"下列数据类型中，用于存储整数的是（　）","o":["INT","CHAR","DATE","TEXT"],"a":"A","status":"OK","ex":"答案A。INT 是整数类型；CHAR、TEXT 存的是字符文本，DATE 存日期。"},{"c":10,"n":115,"m":"M2","mn":"数据库基础","s":"下列数据类型中，用于存储日期的是（　）","o":["INT","DECIMAL","VARCHAR","DATETIME"],"a":"D","status":"OK","ex":"答案D。DATETIME 用于存储日期和时间；INT、DECIMAL 是数值类型，VARCHAR 是字符类型。"},{"c":10,"n":116,"m":"M2","mn":"数据库基础","s":"VARCHAR 与 CHAR 的主要区别是（　）","o":["CHAR 只能存数字","两者完全相同","VARCHAR 变长，CHAR 定长","VARCHAR 定长，CHAR 变长"],"a":"C","status":"OK","ex":"答案C。VARCHAR 变长，按实际内容占空间；CHAR 定长，不足部分补空格。两者方向别记反，D 恰好说反了。"},{"c":10,"n":117,"m":"M2","mn":"数据库基础","s":"一个数据库中（　）","o":["不能有索引","只能有一个视图","只能有一张表","可以有多张表，表之间可以建立联系"],"a":"D","status":"OK","ex":"答案D。一个数据库可以包含多张表，表与表之间通过公共字段（如外键）建立联系；只能有一张表、一个视图或不能建索引的说法都不成立。"},{"c":10,"n":118,"m":"M2","mn":"数据库基础","s":"下列数据库对象中，不存储实际数据的是（　）","o":["表","视图","记录","字段"],"a":"B","status":"OK","ex":"答案B。视图是虚拟表，只有定义不存数据，数据始终在基本表里；表、记录、字段才是实际承载数据的对象。"},{"c":10,"n":119,"m":"M2","mn":"数据库基础","s":"使用视图的好处不包括（　）","o":["简化查询","提高数据安全性","加快数据写入速度","减少数据冗余"],"a":"C","status":"OK","ex":"答案C。视图能简化查询、提高数据安全性，也不会引入新冗余（它本身不存数据）；但视图对数据写入毫无加速作用，复杂视图反而可能拖慢操作，所以'加快数据写入速度'不属于它的好处。"},{"c":10,"n":120,"m":"M2","mn":"数据库基础","s":"在关系数据库中，数据的基本存储单位是（　）","o":["表","数据库","字段","记录"],"a":"A","status":"OK","ex":"答案A。关系数据库用二维表（关系）来组织和存放数据，表是数据的基本存储单位；记录、字段只是表内部的行列组成，数据库则是存放多张表的容器。"},{"c":10,"n":121,"m":"M2","mn":"数据库基础","s":"删除视图使用的语句是（　）","o":["DELETE VIEW","REMOVE VIEW","CLEAR VIEW","DROP VIEW"],"a":"D","status":"OK","ex":"答案D。删除视图用 DROP VIEW 视图名；DELETE 只用于删记录，REMOVE、CLEAR 不是 SQL 关键字。"},{"c":10,"n":122,"m":"M2","mn":"数据库基础","s":"创建视图使用的关键字是（　）","o":["NEW VIEW","CREATE VIEW","MAKE VIEW","BUILD VIEW"],"a":"B","status":"OK","ex":"答案B。创建视图用 CREATE VIEW 视图名 AS SELECT ...；NEW、MAKE、BUILD 都不是 SQL 关键字。","roast":"对着 NEW/MAKE/BUILD 仨土话选 CREATE，纯送分，别客气。"},{"c":2,"n":1,"m":"M3","mn":"操作系统基础","s":"操作系统是____。","o":["用户与软件的接口","系统软件与应用软件的接口","主机与外设的接口","用户与计算机的接口"],"a":"D","status":"OK","ex":"操作系统直接控制和管理计算机软硬件资源、方便用户使用，向上为用户提供操作界面，所以是用户与计算机的接口；A漏了硬件层面，B把接口对象搞成了软件之间，C说的是主机与外设的连接，都与操作系统的定位不符。","roast":"操作系统第一章第一句话，背了就白给，这都错我真懒得骂。"},{"c":2,"n":2,"m":"M3","mn":"操作系统基础","s":"下列有关快捷方式的叙述，错误的是____。","o":["快捷方式改变了程序或文档在磁盘上的存放位置","快捷方式提供了对常用程序或文档的访问捷径","快捷方式图标的左下角有一个小箭头","删除快捷方式不会对源程序或文档产生影响"],"a":"A","status":"OK","ex":"快捷方式只是一个指向源对象的小链接文件，建立、删除它都不会改变源程序或文档在磁盘上的存放位置；B、C、D说的都是快捷方式的正常特征。"},{"c":2,"n":3,"m":"M3","mn":"操作系统基础","s":"不可能在任务栏上的内容为____。","o":["对话框窗口的图标","正在执行的应用程序窗口图标","已打开文档窗口的图标","语言栏对应图标"],"a":"A","status":"OK","ex":"任务栏程序按钮区放的是正在运行的应用程序（含其打开的文档窗口）的按钮，对话框不是独立程序，不会在任务栏上出现自己的图标；语言栏图标则可以常驻任务栏。"},{"c":2,"n":4,"m":"M3","mn":"操作系统基础","s":"在Windows中，关于文件夹的描述不正确的是____。","o":["文件夹是用来组织和管理文件的","“计算机”是一个系统文件夹","文件夹中可以存放驱动程序文件","同一文件夹中可以存放两个同名文件"],"a":"D","status":"OK","ex":"同一文件夹内文件名必须唯一，不可能存放两个同名文件，D不成立；文件夹本来就是组织管理文件的容器，\"计算机\"是系统文件夹，其中也能存放驱动程序文件，A、B、C都对。"},{"c":2,"n":5,"m":"M3","mn":"操作系统基础","s":"Windows中可以设置、控制计算机硬件配置和修改显示属性的应用程序是____。","o":["Word","Excel","资源管理器","控制面板"],"a":"D","status":"OK","ex":"设置硬件配置、修改显示属性这类系统级设置都集中在控制面板里完成；Word、Excel是办公软件，资源管理器管文件浏览，都干不了这活。"},{"c":2,"n":6,"m":"M3","mn":"操作系统基础","s":"在Windows中，不属于控制面板操作的是____。","o":["更改桌面背景","添加新硬件","造字","调整鼠标的使用设置"],"a":"C","status":"OK","ex":"造字程序是\"附件\"里的独立小工具，不属于控制面板；更改桌面背景、添加新硬件、调整鼠标设置都是控制面板的常规项目。"},{"c":2,"n":7,"m":"M3","mn":"操作系统基础","s":"在Windows资源管理器中选定了文件或文件夹后，若要将它们移动到不同驱动器的文件夹中，操作为____。","o":["按下Ctrl键拖动鼠标","按下Shift键拖动鼠标","直接拖动鼠标","按下Alt键拖动鼠标"],"a":"B","status":"OK","ex":"跨驱动器拖动时Windows默认执行复制，要移动就得按住Shift拖；按Ctrl拖是复制，按Alt拖是创建快捷方式。"},{"c":2,"n":8,"m":"M3","mn":"操作系统基础","s":"要将语言栏显示在桌面上，第一步操作应该是____。","o":["控制面板中选“时钟、语言和区域”下的“更改键盘和其他输入法”选项","控制面板中选“程序”","右击桌面空白处，选择“查看”","右击任务栏空白处，选择“属性”"],"a":"A","status":"OK","ex":"语言栏的显示属于输入法设置，第一步应进控制面板的\"时钟、语言和区域\"→\"更改键盘和其他输入法\"去调；其余三个入口都到不了语言栏设置。"},{"c":2,"n":9,"m":"M3","mn":"操作系统基础","s":"在Windows的中文输入方式下，中英文输入方式之间切换应按的键是____。","o":["Ctrl+Alt","Ctrl+Shift","Shift+Space","Ctrl+Space"],"a":"D","status":"OK","ex":"Ctrl+Space负责中英文输入状态切换；Ctrl+Shift是在多个输入法之间切换，Shift+Space是全半角切换，分工别混。","roast":"Ctrl+Space切中英文，这都记不住，键盘算白买了。"},{"c":2,"n":10,"m":"M3","mn":"操作系统基础","s":"在Windows中下面的叙述正确的是____。","o":["“写字板”是字处理软件，不能进行图文处理","“画图”是绘图工具，不能输入文字","“写字板”和“画图”均可以进行文字和图形处理","“记事本”文件可以插入自选图形"],"a":"C","status":"OK","ex":"写字板虽是字处理软件但支持插图，画图虽是绘图工具但能输入文字，两者都能进行文字和图形处理，C对；A、B把能力说死了，记事本是纯文本编辑器，插不了自选图形，D错。"},{"c":2,"n":11,"m":"M3","mn":"操作系统基础","s":"Windows的任务栏可用于____。","o":["启动应用程序","切换当前应用程序","修改程序项的属性","修改程序组的属性"],"a":"B","status":"OK","ex":"任务栏上排着各运行程序的按钮，单击即可把对应程序切到前台，这是它的主要用途；修改程序项或程序组的属性不是任务栏的职责，启动应用程序也不是它的本职。"},{"c":2,"n":12,"m":"M3","mn":"操作系统基础","s":"操作系统中对文件的确切定义应该是____。","o":["用户手写的程序和数据","打印在纸上的程序和数据","显示在屏幕上的程序和数据的集合","记录在存储介质上的程序和数据的集合"],"a":"D","status":"OK","ex":"文件是记录在存储介质上的相关程序和数据的集合，关键词是\"存储介质\"；写在纸上、只显示在屏幕上或用户手写的内容都不构成文件。"},{"c":2,"n":13,"m":"M3","mn":"操作系统基础","s":"在Windows操作环境下，将整个屏幕画面全部复制到剪贴板中使用的键是____。","o":["Print Screen","Page Up","Alt+F4","Ctrl+Space"],"a":"A","status":"OK","ex":"按PrintScreen键把整个屏幕画面复制到剪贴板，只想复制当前活动窗口则用Alt+PrintScreen；Page Up是翻页，Alt+F4是关闭窗口。","roast":"PrintScreen截全屏，送分题里的送分题，错了我都替你臊得慌。"},{"c":2,"n":14,"m":"M3","mn":"操作系统基础","s":"下列4种说法中正确的是____。","o":["安装了Windows的微型计算机，其内存容量不能超过4MB","Windows中的文件名不能用大写字母","安装了Windows操作系统之后才能安装应用软件","安装了Windows的计算机，硬盘常安装在主机箱内，因此是一种内存储器"],"a":"C","status":"OK","ex":"应用软件必须以操作系统为运行平台，所以先装Windows再装应用软件，C对；A的内存容量限制纯属胡说，B的文件名可以用大写，D把外存储器硬盘说成内存，全错。"},{"c":2,"n":15,"m":"M3","mn":"操作系统基础","s":"关于Windows窗口的概念，以下叙述正确的是____。","o":["屏幕上只能出现一个窗口，这就是活动窗口","屏幕上可以出现多个窗口，但只有一个是活动窗口","屏幕上可以出现多个窗口，但不止一个活动窗口","当屏幕上出现多个窗口时，就没有了活动窗口"],"a":"B","status":"OK","ex":"Windows允许多个窗口同时打开，但同一时刻只有一个活动窗口（标题栏高亮、接收键盘输入）；\"只能一个\"\"不止一个\"\"没有活动窗口\"都与事实不符。"},{"c":2,"n":16,"m":"M3","mn":"操作系统基础","s":"在Windows桌面底部的任务栏中，一般会出现的对象有____。","o":["“开始”按钮、“快速启动区”、“程序按钮区”及“通知区域”","“资源管理器”按钮、“快速启动区”、“程序按钮区”及“显示”桌面按钮","“开始”按钮、“资源管理器”按钮、“程序按钮区”及“通知区域”","“开始”按钮、“快速启动区”、“通知区域”及“屏幕设置”按钮"],"a":"A","status":"OK","ex":"任务栏的固定组成就是\"开始\"按钮、快速启动区、程序按钮区和通知区域；\"资源管理器按钮\"\"屏幕设置按钮\"不是任务栏标配，B、C、D都掺了假货。"},{"c":2,"n":17,"m":"M3","mn":"操作系统基础","s":"在Windows中，“计算机”图标____。","o":["一定出现在桌面上","可以设置到桌面上","可以通过单击将其显示到桌面上","不可能出现在桌面上"],"a":"B","status":"OK","ex":"\"计算机\"图标可以通过桌面图标设置勾选显示到桌面上，默认不一定出现；\"一定出现\"\"不可能出现\"太绝对，\"单击就显示到桌面\"也不存在这种操作。"},{"c":2,"n":18,"m":"M3","mn":"操作系统基础","s":"在Windows中，剪贴板是用来在程序和文件间传递信息的临时存储区，此存储区是____。","o":["回收站的一部分","硬盘的一部分","内存的一部分","软盘的一部分"],"a":"C","status":"OK","ex":"剪贴板是系统在内存中开辟的一块临时存储区，用来在程序和文件间传递信息，重启即清空；跟硬盘、回收站、软盘都沾不上边。","roast":"剪贴板在内存里，断电就没——这常识都错，我建议你把内存条也背一遍。"},{"c":2,"n":19,"m":"M3","mn":"操作系统基础","s":"在Windows中，对桌面上的图标____。","o":["可以用鼠标的拖动或打开一个快捷菜单对它们的位置加以调整","只能用鼠标对它们拖动来调整位置","只能通过快捷菜单来调整位置","只需用鼠标在桌面上从屏幕左上角向右下角拖动一次，它们就会重新排列"],"a":"A","status":"OK","ex":"桌面图标既可以直接用鼠标拖动摆放，也可以通过右键快捷菜单调整排列，两种方式都行；B、C的\"只能\"太片面，D那套拖法纯属想当然。"},{"c":2,"n":20,"m":"M3","mn":"操作系统基础","s":"Windows菜单操作中，如果某个菜单项的颜色暗淡，则表示____。","o":["只要双击，就能选中","必须连续三击，才能选中","单击被选中后，还会显示出一个方框要求操作者进一步输入信息","在当前情况下，这项选择是没有意义的，选中它不会有任何反应"],"a":"D","status":"OK","ex":"菜单项颜色暗淡表示在当前情况下该命令不可用，单击也不会有任何反应；弹出对话框要求进一步输入的是带省略号的菜单项，跟颜色暗淡是两码事。"},{"c":2,"n":21,"m":"M3","mn":"操作系统基础","s":"下列关于Windows的叙述中，错误的是____。","o":["删除应用程序快捷图标时，会连同其所对应的程序文件一同删除","设置文件夹属性时，可以将属性应用于其包含的所有文件和子文件夹","删除目录时，可将此目录下的所有文件及子目录一同删除","双击某类扩展名的文件，操作系统可启动相关的应用程序"],"a":"A","status":"OK","ex":"删除应用程序的快捷方式图标只是删掉那个链接文件，源程序文件安然无恙，A的说法错误；B、C、D的描述都符合Windows的实际行为。"},{"c":2,"n":22,"m":"M3","mn":"操作系统基础","s":"在Windows 的中文输入方式下，在几种中文输入方式之间切换可以按____键。","o":["Ctrl+Alt","Ctrl+Shift","Shift+Space","Ctrl+Space"],"a":"B","status":"OK","ex":"Ctrl+Shift在已安装的几种中文输入法之间轮流切换；Ctrl+Space只管中英文开关，Shift+Space管全半角。","roast":"跟切换键那题是一对双胞胎，背混了等于两题一起白给。"},{"c":2,"n":24,"m":"M3","mn":"操作系统基础","s":"在Windows中，同时显示多个应用程序窗口的正确方法是____。","o":["在任务栏空白区单击鼠标右键，在弹出快捷菜单中选择“并排显示窗口”命令","在任务栏空白区单击鼠标左键，在弹出快捷菜单中选择“排列图标”命令","按Ctrl+Tab键进行排列","在资源管理器中进行排列"],"a":"A","status":"OK","ex":"在任务栏空白处右击，快捷菜单里就有\"层叠窗口\"\"堆叠显示窗口\"\"并排显示窗口\"等排列命令；左键单击不弹菜单，Ctrl+Tab也不是排列窗口的快捷键。"},{"c":2,"n":25,"m":"M3","mn":"操作系统基础","s":"在资源管理器中，选定多个非连续文件的操作为____。","o":["按住Shift键，单击每一个要选定的文件图标","按住Ctrl键，单击每一个要选定的文件图标","先选中第一个文件，按住Shift键，再单击最后一个要选定的文件图标","先选中第一个文件，按住Ctrl键，再单击最后一个要选定的文件图标"],"a":"B","status":"OK","ex":"按住Ctrl逐个单击可加选不连续的多个文件；Shift+单击选的是首尾之间的连续区段，这正是B与A、C的差别。","roast":"Ctrl加选、Shift连选，这口诀都不会，文件白管了。"},{"c":2,"n":26,"m":"M3","mn":"操作系统基础","s":"文件ABC.Bmp存放在F盘的T文件夹中的G子文件夹下，它的完整文件标识符是____。","o":["F:\\T\\G\\ABC","T:\\AB","Bmp","F:\\T:\\AB"],"a":"C","status":"OK","ex":"完整文件标识符由盘符+各级文件夹+主文件名+扩展名拼成，此题应为 F:\\T\\G\\ABC.Bmp；本批选项存在明显错排缺损，按原库答案记为C。"},{"c":2,"n":27,"m":"M3","mn":"操作系统基础","s":"资源管理器中的库是____。","o":["一个特殊的文件夹","一个特殊的文件","硬件的集合","用户快速访问一组文件或文件夹的快捷路径"],"a":"D","status":"OK","ex":"库并不真正存放文件，而是把分散在各处的文件夹聚合起来、提供快速访问入口的\"快捷路径\"集合；把它当成一个特殊文件夹（A）是最常见的误解。"},{"c":2,"n":29,"m":"M3","mn":"操作系统基础","s":"在Windows下，将某应用程序中所选的文本或图形复制到一个文件，先要在“编辑”菜单中选择的命令是__。","o":["剪切","粘贴","复制","选择性粘贴"],"a":"C","status":"OK","ex":"要把选定内容放进剪贴板以便粘贴到文件里，应先在\"编辑\"菜单中选\"复制\"，原内容保留；\"剪切\"会移走原内容，\"粘贴\"是目标端的动作，\"选择性粘贴\"是粘贴时的格式选项。"},{"c":2,"n":30,"m":"M3","mn":"操作系统基础","s":"在Windows资源管理器中，要把文件或文件夹图标设置成“大图标”方式显示，使用的菜单是____。","o":["“文件”菜单","“编辑”菜单","“查看”菜单","“工具”菜单"],"a":"C","status":"OK","ex":"大图标、小图标、列表、详细信息等显示方式都集中在\"查看\"菜单里设置；文件菜单管操作、编辑菜单管复制移动、工具菜单管文件夹选项，都不管显示方式。"},{"c":2,"n":31,"m":"M3","mn":"操作系统基础","s":"在查找文件时，通配符*与？的含义是____。","o":["*表示任意多个字符，？表示任意一个字符","？表示任意多个字符，*表示任意一个字符","*和？表示乘号和问号","查找*.？与？.*的文件是一致的"],"a":"A","status":"OK","ex":"*匹配任意多个字符，?只匹配任意一个字符，这是文件搜索的通配符规则；B正好说反，C、D是凑数的干扰项。","roast":"*和?的分工，DOS时代传下来的老规矩，这都要背错？"},{"c":2,"n":32,"m":"M3","mn":"操作系统基础","s":"在Windows中，打开一个菜单后，其中某菜单项会出现下属级联菜单的标识是____。","o":["菜单项右侧有一组英文提示","菜单项右侧有一个黑色三角形","菜单项左侧有一个黑色圆点","菜单项左侧有一个√符号"],"a":"B","status":"OK","ex":"菜单项右侧带黑色三角形，表示指向或单击它会弹出下一级级联菜单；右侧英文提示是快捷键，左侧圆点是单选标记，√是复选标记。"},{"c":2,"n":33,"m":"M3","mn":"操作系统基础","s":"在控制面板中，使用“程序”的作用是____。","o":["设置字体","设置显示属性","安装未知新设备","安装或卸载程序"],"a":"D","status":"OK","ex":"控制面板的\"程序\"用于安装或卸载程序以及启停Windows功能；设置字体在\"字体\"项，显示属性在\"外观和个性化\"里，安装未知新设备另有专门入口。"},{"c":2,"n":34,"m":"M3","mn":"操作系统基础","s":"在Windows中快速获得处理器型号、内存容量等有关信息，前两步操作是____。","o":["鼠标右击桌面空白区，选择“属性”菜单项","鼠标右击“开始”按钮，选择“属性”菜单项","鼠标右击桌面“计算机”图标，选择“属性”菜单项","鼠标右击任务栏空白区，选择“属性”菜单项"],"a":"C","status":"OK","ex":"右击\"计算机\"图标选\"属性\"，打开的系统窗口里就有处理器型号、内存容量、系统类型这些信息；右击桌面、\"开始\"按钮或任务栏空白处的\"属性\"都到不了这个页面。"},{"c":2,"n":35,"m":"M3","mn":"操作系统基础","s":"在文件系统的树形目录结构中，从根目录到任何数据文件，其通路有____。","o":["二条","唯一的一条","三条","多于三条"],"a":"B","status":"OK","ex":"树形目录结构中每个结点只有一个双亲，从根目录到任何一个数据文件的路径有且只有一条，这正是绝对路径能唯一定位文件的原因。"},{"c":2,"n":36,"m":"M3","mn":"操作系统基础","s":"在Windows启动汉字输入法后，选定一种汉字输入法，屏幕上就会出现一个与该输入法相应的____。","o":["汉字字体列表框","汉字字号列表框","汉字输入编码框","汉字输入法状态框"],"a":"D","status":"OK","ex":"选定一种汉字输入法后，屏幕上会出现与之配套的输入法状态框，上面有中英文切换、全半角、中英文标点和软键盘等按钮；字体、字号列表框是应用软件里的东西。"},{"c":2,"n":37,"m":"M3","mn":"操作系统基础","s":"在资源管理器中，复制文件命令的快捷键是____。","o":["Ctrl+X","Ctrl+S","Ctrl+C","Ctrl+V"],"a":"C","status":"OK","ex":"复制用Ctrl+C、剪切用Ctrl+X、粘贴用Ctrl+V、保存用Ctrl+S，这套组合键在资源管理器和各类软件里通用。","roast":"Ctrl+C复制，摸过电脑就该会，这题错了把键盘吃了。"},{"c":2,"n":38,"m":"M3","mn":"操作系统基础","s":"在Windows中，“写字板”是一种____。","o":["字处理软件","画图工具","网页编辑器","造字程序"],"a":"A","status":"OK","ex":"写字板是Windows自带的小型字处理软件，能录入文字、简单排版、插入图片；画图工具、网页编辑器、造字程序都另有其人。"},{"c":2,"n":39,"m":"M3","mn":"操作系统基础","s":"下面是关于Windows文件名的叙述，错误的是____。","o":["文件名中允许使用汉字","文件名中允许使用多个圆点分隔符","文件名中允许使用空格","文件名中允许使用竖线（|）"],"a":"D","status":"OK","ex":"Windows文件名不允许使用 \\ / : * ? \" < > | 这9个字符，竖线（|）就在禁用之列；汉字、空格和多个圆点分隔符都允许使用。"},{"c":2,"n":40,"m":"M3","mn":"操作系统基础","s":"在Windows中，在“记事本”中保存的文件，系统默认的文件扩展名是____。","o":[".TXT",".DOCX",".BMP",".RTF"],"a":"A","status":"OK","ex":"记事本保存的是纯文本文件，默认扩展名为.TXT；.DOCX是Word文档，.BMP是位图，.RTF是富文本（写字板可选格式）。","roast":"记事本存txt，这要是选DOCX，我都没话讲。"},{"c":2,"n":41,"m":"M3","mn":"操作系统基础","s":"在Windows中，“回收站”是____。","o":["内存中的一块区域","硬盘中的特殊文件夹","软盘上的文件夹","高速缓存中的一块区域"],"a":"B","status":"OK","ex":"回收站是硬盘上的一块特殊区域（本质是每个分区下的特殊文件夹），删除的文件先进这里、可还原，清空后才真正释放空间；它既不在内存也不是缓存。"},{"c":2,"n":42,"m":"M3","mn":"操作系统基础","s":"在Windows中要使用“计算器”进行十六进制数据计算和统计时，应选择____。","o":["“标准型”","“统计型”","“程序员型”","“科学型”"],"a":"C","status":"OK","ex":"计算器的\"程序员\"模式专门提供二、八、十、十六进制运算和位运算；\"标准型\"只有四则运算，\"科学型\"做函数运算，都没有进制换算面板。"},{"c":2,"n":43,"m":"M3","mn":"操作系统基础","s":"在Windows中，不可以对“开始”菜单进行设置的是____。","o":["在控制面板中设置","右击“开始”按钮，选择“属性”，在打开的对话框中设置","右击任务栏空白处，选择“属性”，在打开的对话框中设置","右击桌面空白处，选择“属性”，在打开的对话框中设置"],"a":"D","status":"OK","ex":"开始菜单的设置入口在控制面板的\"任务栏和开始菜单\"、右击\"开始\"按钮选\"属性\"或右击任务栏选\"属性\"；右击桌面空白处的\"属性\"只管桌面外观，碰不到开始菜单。"},{"c":2,"n":44,"m":"M3","mn":"操作系统基础","s":"在Windows中，用户建立的文件默认具有的属性是____。","o":["隐藏","只读","系统","存档"],"a":"D","status":"OK","ex":"用户新建的文件默认带\"存档\"属性，表示该文件自上次备份后有改动；隐藏、只读需手动设置，系统属性一般只属于系统文件。"},{"c":2,"n":45,"m":"M3","mn":"操作系统基础","s":"在Windows中，Alt+Tab键的作用是____。","o":["关闭应用程序","打开应用程序的控制菜单","应用程序之间相互切换","打开“开始”菜单"],"a":"C","status":"OK","ex":"Alt+Tab在已打开的应用程序窗口之间循环切换；关闭程序是Alt+F4，打开\"开始\"菜单是Ctrl+Esc，控制菜单由标题栏图标或Alt+Space调出。","roast":"Alt+Tab切窗口，摸鱼第一键，这都不知道好意思开机吗。"},{"c":2,"n":46,"m":"M3","mn":"操作系统基础","s":"在Windows中，要设置屏幕保护程序，可以使用控制面板的____。","o":["均可通过剪切、复制和粘贴与其他Windows应用程序交换信息","只有写字板可通过剪切、复制和粘贴操作与其他Windows应用程序交换信息","只有记事本可通过剪切、复制和粘贴操作与其他Windows应用程序交换信息","两者均不能与其他Windows应用程序交换信息 答案：ADDAD CABCA"],"a":"D","status":"OK","ex":"此题题面与选项存在错排缺损，按考点看：写字板和记事本都能通过剪切、复制、粘贴与其他Windows应用程序交换信息，\"只有某一方能\"\"均不能\"这类过于绝对的说法都是干扰项；按原库答案记为D。"},{"c":6,"n":1,"m":"M4","mn":"计算机网络基础","s":"计算机网络按使用范围划分为____和____。","o":["广域网  局域网","专用网  公用网","低速网  高速网","部门网  公用网"],"a":"A","status":"OK","ex":"答案A。按使用（覆盖）范围划分，网络分为局域网、城域网、广域网，题中两空即广域网和局域网；B是按服务对象划分的说法，C按速率划分，D搭配混乱，均非按范围划分。"},{"c":6,"n":2,"m":"M4","mn":"计算机网络基础","s":"在下列网络拓扑结构中，中心节点的故障可能造成全网瘫痪的是____。","o":["星形拓扑","总线型拓扑","环型拓扑","树型拓扑"],"a":"A","status":"OK","ex":"答案A。星形拓扑中所有节点都连接到中心节点，中心节点一旦故障全网即瘫痪；总线型、环型、树型都没有这种单点中心节点的全网依赖结构。"},{"c":6,"n":3,"m":"M4","mn":"计算机网络基础","s":"关于网络协议，下列____选项是正确的。","o":["是网民们签订的合同","是计算机之间的相互通信需要共同遵守的规则","TCP/IP协议只能用于Internet，不能用于局域网","拨号网络对应的协议是IPX/SPX"],"a":"B","status":"OK","ex":"答案B。网络协议就是计算机之间通信必须共同遵守的规则和约定；TCP/IP同样可用于局域网，拨号网络使用的是PPP等协议，\"网民签订的合同\"是望文生义。"},{"c":6,"n":4,"m":"M4","mn":"计算机网络基础","s":"两个不同类型的计算机网络能够相互通信是因为____。","o":["它们使用了统一的网络协议","它们使用了交换机互联","它们使用了兼容的硬件设备","它们使用了兼容的软件"],"a":"A","status":"OK","ex":"答案A。异构网络能互通，靠的是遵循统一的通信协议（如TCP/IP）；交换机、兼容硬件只是互联手段，解决不了通信规则不一致的问题。"},{"c":6,"n":5,"m":"M4","mn":"计算机网络基础","s":"SMTP是____邮件的协议，POP3是____邮件的协议。","o":["多媒体 Web数据","文本 Web数据","多媒体 邮件","传输 下载"],"a":"D","status":"OK","ex":"答案D。SMTP（简单邮件传输协议）负责邮件的发送传输，POP3（邮局协议第3版）负责从服务器下载收取邮件；A、B、C把邮件协议与Web、多媒体概念混为一谈。"},{"c":6,"n":6,"m":"M4","mn":"计算机网络基础","s":"计算机网络最突出的优点是____。","o":["运算速度快","联网的计算机能够相互通信共享资源","计算精度高","内存容量大"],"a":"B","status":"OK","ex":"答案B。计算机网络最突出的优点是联网计算机之间能够相互通信、共享资源；运算速度、计算精度、内存容量都是单机自身的性能指标，与联网无关。"},{"c":6,"n":7,"m":"M4","mn":"计算机网络基础","s":"网上共享的资源有____、____和____。","o":["硬件  软件  数据","软件  数据  信道","通信子网  资源子网  信道","硬件  软件  服务"],"a":"A","status":"OK","ex":"答案A。网络共享的资源分为硬件、软件、数据三大类；信道是传输介质本身，不算共享资源，\"服务\"也不是教材所列的资源共享类别。"},{"c":6,"n":8,"m":"M4","mn":"计算机网络基础","s":"LAN通常是指____。","o":["广域网","局域网","资源子网","城域网"],"a":"B","status":"OK","ex":"答案B。LAN是Local Area Network（局域网）的缩写；WAN是广域网，MAN是城域网，资源子网是网络组成概念。","roast":"LAN认成广域网的，怕是课本第一页都没翻开。"},{"c":6,"n":9,"m":"M4","mn":"计算机网络基础","s":"局域网常用的网络设备是____。","o":["路由器","程控交换机","以太网交换机","调制解调器"],"a":"C","status":"OK","ex":"答案C。局域网内连接主机最常用的设备是以太网交换机；路由器主要用于不同网络之间的互联，调制解调器用于拨号接入，程控交换机是电话网的设备。"},{"c":6,"n":10,"m":"M4","mn":"计算机网络基础","s":"支持局域网与广域网互联的设备称为____。","o":["转发器","以太网交换机","路由器","网桥"],"a":"C","status":"OK","ex":"答案C。路由器工作在网络层，负责在不同网络之间转发数据，是局域网与广域网互联的典型设备；交换机、网桥工作在数据链路层，一般用于局域网内部互联，转发器只是信号中继放大设备。"},{"c":6,"n":11,"m":"M4","mn":"计算机网络基础","s":"按照网络信号的传输延迟，从小到大排序正确的是____。","o":["局域网、广域网、城域网","局域网、城域网、广域网","城域网、广域网、局域网","城域网、局域网、广域网"],"a":"B","status":"OK","ex":"答案B。网络覆盖范围越大，信号经过的距离和转发设备越多，传输延迟越大，故从小到大依次为局域网、城域网、广域网。"},{"c":6,"n":12,"m":"M4","mn":"计算机网络基础","s":"Internet是由____发展而来的。","o":["局域网","ARPANET","标准网","WAN"],"a":"B","status":"OK","ex":"答案B。Internet由美国1969年建成的ARPANET（阿帕网）发展而来；局域网、广域网只是网络类型，\"标准网\"不是实际网络名称。","roast":"ARPANET都背不住，还好意思说自己学过网络？"},{"c":6,"n":13,"m":"M4","mn":"计算机网络基础","s":"Internet是全球最具影响力的计算机互联网，也是世界范围的重要____。","o":["信息资源网","多媒体网络","办公网络","销售网络"],"a":"A","status":"OK","ex":"答案A。Internet是全球最大的互联网络，其重要定位是世界范围的信息资源网；多媒体、办公、销售都只是局部应用，概括不了它的整体。"},{"c":6,"n":14,"m":"M4","mn":"计算机网络基础","s":"下列对Internet叙述比较准确的是____。","o":["Internet就是www","Internet就是“信息高速公路”","Internet是采用TCP/IP协议，由许多局域网和广域网互联组成的互联网络","Internet就是局域网互联"],"a":"C","status":"OK","ex":"答案C。Internet是采用TCP/IP协议、由全球众多局域网和广域网互联而成的\"网络的网络\"；WWW只是它提供的一种服务，\"信息高速公路\"是宣传提法，\"就是局域网互联\"表述片面。"},{"c":6,"n":15,"m":"M4","mn":"计算机网络基础","s":"1994年4月20日我国被国际上正式承认为接入Internet的国家，所使用专线的带宽为____。","o":["32Kbps","64Kbps","128Kbps","256Kbps"],"a":"B","status":"OK","ex":"答案B。1994年4月20日，中国通过一条64Kbps的国际专线全功能接入Internet，自此被国际正式承认为接入Internet的国家。"},{"c":6,"n":16,"m":"M4","mn":"计算机网络基础","s":"当前我国的互联网____主要以科研和教育为目的，从事非经营性的活动。","o":["中国移动","中国电信","中国联通","中国教育和科研网"],"a":"D","status":"OK","ex":"答案D。中国教育和科研计算机网（CERNET）主要以科研和教育为目的、从事非经营性活动；移动、电信、联通都是经营性的商业运营商。"},{"c":6,"n":17,"m":"M4","mn":"计算机网络基础","s":"中国教育科研网的缩写为____。","o":["ChinaNet","CERNET","CNNIC","ChinaEDU"],"a":"B","status":"OK","ex":"答案B。CERNET是China Education and Research Network的缩写，即中国教育和科研计算机网；ChinaNet是中国公用计算机互联网，CNNIC是中国互联网络信息中心。","roast":"CERNET这种缩写必考题都丢分，我都替那张卷子心疼。"},{"c":6,"n":18,"m":"M4","mn":"计算机网络基础","s":"某台计算机接入中国教育和科研计算机网CERNET，如下四种说法中正确的是____。","o":["这台计算机不能访问中国联通","这台计算机不能访问中国电信","这台计算机不能访问中国移动","这台计算机可以访问上述任何网络"],"a":"D","status":"OK","ex":"答案D。Internet各网络互联互通，接入CERNET的计算机同样可以访问电信、联通、移动等任何网络，不存在接入一家就被限制访问别家的说法。"},{"c":6,"n":19,"m":"M4","mn":"计算机网络基础","s":"传输控制协议/网际协议即____，属工业标准协议，是Internet采用的主要协议。","o":["Telnet","TCP/IP","HTTP","FTP"],"a":"B","status":"OK","ex":"答案B。传输控制协议/网际协议的英文即TCP/IP，它是Internet采用的主要工业标准协议；Telnet是远程登录、HTTP是超文本传输、FTP是文件传输，都是构建在其上的应用协议。","roast":"TCP/IP的中文名都写不出，这科可以提前交卷了。"},{"c":6,"n":20,"m":"M4","mn":"计算机网络基础","s":"TCP/IP协议是Internet中计算机之间通信所必须共同遵循的一种____。","o":["信息资源","通信规定","软件","硬件"],"a":"B","status":"OK","ex":"答案B。TCP/IP本质是Internet中计算机通信共同遵循的通信规定（约定）；它是规定，不是信息资源，更不是软件或硬件。"},{"c":6,"n":21,"m":"M4","mn":"计算机网络基础","s":"提供不可靠传输的传输层协议是____。","o":["TCP","IP","UDP","PPP"],"a":"C","status":"OK","ex":"答案C。UDP无连接、不保证可靠交付，是传输层提供不可靠传输的协议；TCP提供可靠传输，IP属于网络层而非传输层，PPP是数据链路层协议。"},{"c":6,"n":22,"m":"M4","mn":"计算机网络基础","s":"下列选项中属于Internet专有的特点为____。","o":["采用TCP/IP协议","采用ISO/OSI 7层协议","采用http协议","采用IEEE 802协议"],"a":"A","status":"OK","ex":"答案A。Internet区别于其他网络的标志是统一采用TCP/IP协议；ISO/OSI是理论参考模型，IEEE 802是局域网标准，http只是应用层的一种具体协议。"},{"c":6,"n":23,"m":"M4","mn":"计算机网络基础","s":"IPv4地址有____位二进制数组成。","o":["16","32","64","128"],"a":"B","status":"OK","ex":"答案B。IPv4地址由32位二进制数组成，通常写成4段点分十进制；128位是IPv6的规格，64位、16位均不正确。","roast":"32位都记不住，IPv6的128位你打算靠缘分记？"},{"c":6,"n":24,"m":"M4","mn":"计算机网络基础","s":"理论上，IPv6地址是IPv4地址的____倍。","o":["4","24","96","296"],"a":"D","status":"OK","ex":"答案D。IPv4地址32位、IPv6地址128位，地址总数之比为2^128/2^32=2^96，选项\"296\"即2的96次方倍（题面排版丢了上标）；位数差是4倍，但本题比的是地址数量。"},{"c":6,"n":25,"m":"M4","mn":"计算机网络基础","s":"IP地址能惟一地确定Internet上每台计算机与每个用户的____。","o":["距离","费用","位置","时间"],"a":"C","status":"OK","ex":"答案C。IP地址采用层次化编址，能唯一确定主机在Internet中的网络位置；距离、费用、时间都不是IP地址能表达的内容。"},{"c":6,"n":26,"m":"M4","mn":"计算机网络基础","s":"合法的IP地址书写格式是____。","o":["202：196：112：50","202、196、112、50","202，196，112，50","202.196.112.50"],"a":"D","status":"OK","ex":"答案D。IP地址的标准书写格式是点分十进制：4段0~255的十进制数用英文句点\".\"分隔，只有D符合；用冒号、顿号、逗号分隔的写法全部错误。","roast":"点分十进制这四个字白背了？这题错得毫无借口。"},{"c":6,"n":27,"m":"M4","mn":"计算机网络基础","s":"下列IP地址与子网掩码中，不正确的组是____。","o":["259.197.184.2与255.255.255.0","127.0.0.1与255.255.255.64","202.196.64.5与255.255.255.224","10.10.3.1与255.255.255.192"],"a":"A","status":"OK","ex":"答案A。IP地址每段取值范围是0~255，259已越界，A组必然不正确；B中127.0.0.1是合法的环回地址，C、D各组数值也均未越界。"},{"c":6,"n":28,"m":"M4","mn":"计算机网络基础","s":"配置TCP/IP参数的操作主要包括三个方面：____、指定网关和域名服务器地址。","o":["指定本地机的IP地址及子网掩码","指定本地机的主机名","指定代理服务器","指定服务器的IP地址"],"a":"A","status":"OK","ex":"答案A。配置TCP/IP参数的三个方面是：本机IP地址及子网掩码、默认网关、域名（DNS）服务器地址；主机名、代理服务器、服务器IP都不属于这三项基本参数。"},{"c":6,"n":29,"m":"M4","mn":"计算机网络基础","s":"在许多宾馆中，都有局域网方式上网的信息插座，一般都采用DHCP服务器分配给客人笔记本电脑上\n网参数，这些参数不包括____。","o":["IP地址","子网掩码","MAC地址","默认网关"],"a":"C","status":"OK","ex":"答案C。DHCP自动分配的是IP地址、子网掩码、默认网关（及DNS）等上网参数；MAC地址固化在网卡中，是设备固有标识，不可能由DHCP分配。"},{"c":6,"n":30,"m":"M4","mn":"计算机网络基础","s":"在Internet中，主机的IP地址与域名地址的关系是____。","o":["IP地址是域名中部分信息的表示","域名地址是IP地址中部分信息的表示","IP地址和域名地址是等价的","IP地址和域名地址分别表达不同含义"],"a":"C","status":"OK","ex":"答案C。域名与IP地址通过DNS一一对应，指向同一台主机，二者等价，只是便于记忆的形式不同；既不是谁是谁的一部分，也不是含义不同的两个东西。"},{"c":6,"n":31,"m":"M4","mn":"计算机网络基础","s":"域名服务DNS的主要功能是____。","o":["解析主机的IP地址","查询主机的MAC地址","为主机自动命名","合理分配IP地址"],"a":"A","status":"OK","ex":"答案A。DNS（域名系统）的主要功能是进行域名与IP地址之间的解析，典型过程是把主机域名解析为IP地址；查MAC地址、自动命名、分配IP地址都不是DNS的职责。"},{"c":6,"n":32,"m":"M4","mn":"计算机网络基础","s":"用于解析域名的协议是____。","o":["HTTP","DNS","FTP","SMTP"],"a":"B","status":"OK","ex":"答案B。解析域名的协议就是DNS；HTTP用于传网页、FTP用于传文件、SMTP用于发邮件，都与域名解析无关。"},{"c":6,"n":33,"m":"M4","mn":"计算机网络基础","s":"网址www.zzu.edu.cn中zzu是在Internet中注册的____。","o":["硬件编码","密码","软件编码","域名"],"a":"D","status":"OK","ex":"答案D。网址www.zzu.edu.cn中，zzu是在Internet注册的域名（郑州大学的机构域名）；域名体系中不存在\"硬件编码\"\"软件编码\"，更不是密码。"},{"c":6,"n":34,"m":"M4","mn":"计算机网络基础","s":"中国的顶级域名是____。","o":["cn","ch","chn","china"],"a":"A","status":"OK","ex":"答案A。中国的国家顶级域名是cn；ch是瑞士的国家级域名，chn和china都不是标准顶级域名。","roast":"cn都不认识，你这网是从座机上来的？"},{"c":6,"n":35,"m":"M4","mn":"计算机网络基础","s":"万维网（World Wide Web）一般指____，是Internet中应用最广泛的领域之一。","o":["Internet","WWW网站","城市网","远程网"],"a":"B","status":"OK","ex":"答案B。万维网（WWW）是基于超文本技术的信息浏览服务系统，一般指WWW网站；它是Internet提供的一种服务，不能与Internet本身画等号，城市网、远程网更是不相干。"},{"c":6,"n":36,"m":"M4","mn":"计算机网络基础","s":"WWW的描述语言是____。","o":["FTP","E-Mail","BBS","HTML"],"a":"D","status":"OK","ex":"答案D。WWW网页采用HTML（超文本标记语言）编写描述；FTP是文件传输协议，E-Mail是电子邮件，BBS是电子公告板，都不是描述语言。","roast":"WWW配HTML这种白给组合都能错，我劝你把课本焊手上。"},{"c":6,"n":37,"m":"M4","mn":"计算机网络基础","s":"HTTP协议称为____。","o":["网际协议","超文本传输协议","Network内部协议","中转控制协议"],"a":"B","status":"OK","ex":"答案B。HTTP即HyperText Transfer Protocol，超文本传输协议，是浏览器与Web服务器之间的通信协议；网际协议是IP，其余两项是杜撰说法。","roast":"HTTP全称是超文本传输协议，这都不知道就别说自己是网民。"},{"c":6,"n":38,"m":"M4","mn":"计算机网络基础","s":"HTTP协议的功能是____。","o":["用于标记互联网上的Web资源","用于传送Web数据","用于浏览Web时的路由选择","以上均不正确"],"a":"B","status":"OK","ex":"答案B。HTTP的功能是在浏览器与Web服务器之间传送Web数据；标记Web资源靠URL，路由选择由网络层协议负责，均不是HTTP的职能。"},{"c":6,"n":39,"m":"M4","mn":"计算机网络基础","s":"网站向网民提供信息服务，网络运营商向用户提供接入服务，因此，分别称它们为____。","o":["ICP、IP","ICP、ISP","ISP、IP","UDP、TCP"],"a":"B","status":"OK","ex":"答案B。向网民提供信息服务的网站称为ICP（互联网内容提供商），向用户提供接入服务的网络运营商称为ISP（互联网服务提供商）；IP是协议不是服务商，UDP/TCP是传输协议，都与题意无关。"},{"c":6,"n":40,"m":"M4","mn":"计算机网络基础","s":"将文件从FTP服务器传输到客户机的过程称为____。","o":["上传","下载","浏览","计费"],"a":"B","status":"OK","ex":"答案B。文件从FTP服务器传到客户机称为下载；方向反过来，由客户机传到服务器才叫上传。","roast":"上传下载都分不清，你平时下片下到服务器上的？"},{"c":6,"n":41,"m":"M4","mn":"计算机网络基础","s":"张三有个E-mail地址，他总是给人说：“我有网址，把文件发到我的网址”。实际上他把E-mail地址\n和网址概念混淆了，一般个人网址是指____。","o":["电子邮件地址","服务器","个人网站","上网本"],"a":"C","status":"OK","ex":"答案C。张三说的\"个人网址\"实际指个人网站（个人主页）；电子邮件地址是\"用户名@邮件服务器域名\"的形式，与网址是两个不同的概念。"},{"c":6,"n":42,"m":"M4","mn":"计算机网络基础","s":"用户名为ks的下列四项中表示电子邮件的是____。","o":["ks@183.net","www@ks.net","183@www.net","ks.www.183.net"],"a":"A","status":"OK","ex":"答案A。电子邮件的标准格式是\"用户名@邮件服务器域名\"，题干指定用户名为ks，只有ks@183.net同时满足；D项没有@符号，B、C项的用户名都不是ks。"},{"c":6,"n":43,"m":"M4","mn":"计算机网络基础","s":"发送电子邮件时，如果接收方没有开机，那么邮件将____。","o":["丢失","保存在邮件服务器上","退回给发件人","开机时重新发送"],"a":"B","status":"OK","ex":"答案B。电子邮件采用存储转发机制，发送的邮件先保存在收件人的邮件服务器上，对方开机联网后随时可以收取，不会丢失、退回或重新发送。"},{"c":6,"n":44,"m":"M4","mn":"计算机网络基础","s":"搜索引擎可以查询海量的信息，下列网站哪个属于搜索引擎____。","o":["wwww.sina.com.cn","www.edu.cn","wwww.yahoo.com","www.baidu.com"],"a":"D","status":"OK","ex":"答案D。百度（www.baidu.com）是典型的搜索引擎网站；新浪是门户网站，www.edu.cn是中国教育和科研计算机网站点，按教材口径雅虎以门户/分类目录服务为主，故选百度。"},{"c":6,"n":45,"m":"M4","mn":"计算机网络基础","s":"下列网站哪个不能从事电子商务____。","o":["www.ctrip.com.cn","www.taobao.com.cn","www.dangdang.com","www.edu.cn"],"a":"D","status":"OK","ex":"答案D。携程、淘宝、当当都是电子商务网站，www.edu.cn是教育科研网的站点，属公益教育机构，不能从事电子商务。"},{"c":6,"n":46,"m":"M4","mn":"计算机网络基础","s":"下列不属于聊天通信软件的是____。","o":["QQ","MSN","Skype","PPLIVE"],"a":"D","status":"OK","ex":"答案D。QQ、MSN、Skype都是即时聊天通信软件，PPLive是P2P网络电视（视频点播/直播）软件，不属于聊天通信工具。"},{"c":6,"n":47,"m":"M4","mn":"计算机网络基础","s":"个人博客网站是通过互联网发表各种思想的场所，其中博客是____。","o":["博士的客人","写“网络日志”的人","写博士论文的人","博学的人"],"a":"B","status":"OK","ex":"答案B。博客（Blog）源于Weblog，即网络日志，写网络日志的人被称为博客；它与博士、博学没有任何关系。"},{"c":6,"n":48,"m":"M4","mn":"计算机网络基础","s":"以下几种说法中正确的是____。","o":["ISP是指信息服务提供商","从某种意义上讲，Internet是由分层的ISP互联构成的","ICP并不需要接入ISP就能提供互联网内容服务","校园网不需要ISP"],"a":"B","status":"OK","ex":"答案B。从结构上看，Internet确实是由分层次的各级ISP互联构成的；A错在ISP是互联网服务接入提供商，信息服务提供商是ICP，C、D错在任何内容服务和校园网都必须通过ISP接入Internet。"},{"c":6,"n":49,"m":"M4","mn":"计算机网络基础","s":"商业社区一般通过____接入Internet。","o":["校园网","当地电信服务商","政府网","以上都不是"],"a":"B","status":"OK","ex":"答案B。商业社区的用户一般通过当地电信服务商（ISP）的线路接入Internet；校园网主要服务校内，政府网也不是商业接入渠道。"},{"c":6,"n":50,"m":"M4","mn":"计算机网络基础","s":"调制解调器（modem）的功能是实现____。","o":["数字信号的编码","数字信号的整形","模拟信号的放大","模拟信号与数字信号的转换"],"a":"D","status":"OK","ex":"答案D。调制解调器的\"调制\"是把数字信号转换为模拟信号以便在电话线上传输，\"解调\"是把模拟信号还原为数字信号，核心就是模拟信号与数字信号的转换；编码、整形、放大都不是它的本职。","roast":"调制解调器干吗的都能选错，这名字取得够直白了吧。"},{"c":6,"n":51,"m":"M4","mn":"计算机网络基础","s":"下边的接入网络方式，速度最快的是____。","o":["GPRS","ADSL","ISDN","LAN"],"a":"D","status":"OK","ex":"答案D。局域网（LAN）接入带宽通常在10Mbps以上，明显快于ADSL（兆级）、ISDN（128Kbps级）和GPRS（百Kbps级）等接入方式。"},{"c":6,"n":52,"m":"M4","mn":"计算机网络基础","s":"一般所说的拨号入网，是指通过____与Internet服务器连接。","o":["微波","公用电话系统","专用电缆","电视线路"],"a":"B","status":"OK","ex":"答案B。拨号入网就是通过调制解调器，利用公用电话交换系统（电话线）拨通ISP服务器接入Internet；微波、专用电缆、电视线路都不是拨号方式。"},{"c":6,"n":53,"m":"M4","mn":"计算机网络基础","s":"安装拨号网络的目的是为了____。","o":["使Windows完整化","能够以拨号方式连入Internet","与局域网中的其他终端互联","使用免费软件"],"a":"B","status":"OK","ex":"答案B。安装拨号网络组件的目的，就是使计算机能够以拨号方式连入Internet；与\"Windows完整化\"、局域网互联、使用免费软件均无关。"},{"c":6,"n":54,"m":"M4","mn":"计算机网络基础","s":"在拨号上网过程中，在对话框中填入的用户名和密码应该是____。","o":["进入Windows时的用户名和密码","管理员的账号和密码","ISP提供的帐号和密码","邮箱的用户名和密码"],"a":"C","status":"OK","ex":"答案C。拨号上网需先向ISP开户，对话框中填入的应是从ISP申请到的账号和密码；本机Windows密码、管理员密码、邮箱密码都无法用于拨号认证。"},{"c":6,"n":55,"m":"M4","mn":"计算机网络基础","s":"双绞线的接口通常是____。","o":["RJ-45","RJ-11","RJ-32","RJ-54"],"a":"A","status":"OK","ex":"答案A。双绞线（网线）使用RJ-45水晶头接口；RJ-11是电话线接口，RJ-32、RJ-54是干扰项杜撰的型号。","roast":"RJ-45能答成RJ-54，你网线平时插哪儿的心里没数？"},{"c":6,"n":56,"m":"M4","mn":"计算机网络基础","s":"通过局域网接入Internet的配置步骤包括____。","o":["网卡驱动程序的安装","网络协议的安装","TCP/IP的设置","以上都是"],"a":"D","status":"OK","ex":"答案D。通过局域网接入Internet，需要依次完成网卡驱动程序安装、网络协议安装和TCP/IP参数设置，三项缺一不可，故选\"以上都是\"。"},{"c":6,"n":57,"m":"M4","mn":"计算机网络基础","s":"某用户配置静态IP地址通过局域网接入Internet可以上聊天工具，但是打不开网页，原因有可能是____。","o":["没有配置DNS服务器地址","没有安装TCP/IP协议","网卡故障","系统版本不支持"],"a":"A","status":"OK","ex":"答案A。能用聊天工具说明网络本身已通（客户端多按IP直接连接服务器），打不开网页说明域名解析失败，最可能原因是没配置DNS服务器地址；若TCP/IP未装或网卡故障，聊天工具也无法使用。"},{"c":6,"n":58,"m":"M4","mn":"计算机网络基础","s":"使用代理服务器时，所有用户对外占用IP数目一般为____。","o":["多个","一个","和用户数据一样","不确定"],"a":"B","status":"OK","ex":"答案B。局域网用户经代理服务器统一转发对外访问，对外一般只占用一个公网IP地址，从而缓解IP地址紧张并便于管理。"},{"c":6,"n":59,"m":"M4","mn":"计算机网络基础","s":"下面____命令可以查看网卡的MAC地址。","o":["ipconfig/release","ipconfig/renew","ipconfig/all","ipconfig/registerdns"],"a":"C","status":"OK","ex":"答案C。ipconfig /all显示网卡全部配置信息，包括物理地址（MAC）；/release释放IP租约，/renew重新申请IP，/registerdns刷新DNS注册，均查不到MAC地址。"},{"c":6,"n":60,"m":"M4","mn":"计算机网络基础","s":"下面____命令用于测试网络是否连通。","o":["GPRS/CDMA","3G","WLAN","以上都是 答案：BACAB DADBA CD"],"a":"C","status":"OK","ex":"答案C（按题库标注）。测试网络连通的标准命令是ping，但本题选项（GPRS/CDMA、3G、WLAN）均非测试命令，D项还混入了多余字符，题面数据有误，此处按库内标注的C记录，建议核对原始题库。"},{"c":7,"n":1,"m":"M4","mn":"计算机网络基础","s":"关于Internet，以下说法正确的是____。","o":["Internet属于美国","Internet属于联合国","Internet属于国际红十字会","Internet不属于某个国家或组织"],"a":"D","status":"OK","ex":"答案D。Internet是由全球各地网络互联而成的开放网络，不属于任何国家或组织；A、B、C都强行给它认了个“主人”，与事实不符。","roast":"Internet归谁管都能答错？天天上的网还带户口啊。"},{"c":7,"n":2,"m":"M4","mn":"计算机网络基础","s":"HTML是指____。","o":["超文本标识语言","超文本文件","超媒体文件","超文本传输协议"],"a":"A","status":"OK","ex":"答案A。HTML是HyperText Markup Language的缩写，中文即超文本标识语言（超文本标记语言）；D是HTTP，把标记语言和传输协议搞混了，B、C也不是HTML的含义。","roast":"HTML全称都背不住，网页是怎么敢点的？回去把书吃了。"},{"c":7,"n":3,"m":"M4","mn":"计算机网络基础","s":"Internet中URL的含义是____。","o":["统一资源定位器","Internet协议","简单邮件传输协议","传输控制协议"],"a":"A","status":"OK","ex":"答案A。URL即Uniform Resource Locator，统一资源定位器；B、C、D分别是Internet协议、SMTP（简单邮件传输协议）、TCP（传输控制协议），全是张冠李戴。","roast":"URL仨字母的中文，纯背书送分题，接不住我都替你臊得慌。"},{"c":7,"n":4,"m":"M4","mn":"计算机网络基础","s":"URL的含义是____。","o":["信息资源在网上什么位置和如何访问的统一描述方法","信息资源在网上什么位置及如何定位寻找的统一描述方法","信息资源在网上的业务类型和如何访问的统一描述方法","信息资源的网络地址的统一的描述方法"],"a":"D","status":"OK","ex":"答案D。URL统一描述的是信息资源在网络上的地址，由协议、主机（域名或IP）、路径等构成；A、B把“位置”和“如何访问”拆得含混不清，C的“业务类型”根本不是URL描述的内容。"},{"c":7,"n":5,"m":"M4","mn":"计算机网络基础","s":"www.cernet.edu.cn是Internet上一台计算机的____。","o":["IP地址","域名","协议名称","命令"],"a":"B","status":"OK","ex":"答案B。www.cernet.edu.cn是用点分隔的字符型主机名，属于域名（cernet是中国教育和科研计算机网）；IP地址是数字形式如202.112.0.36，C、D与地址类别无关。","roast":"字母加点的是域名、纯数字的是IP，这都要选错，DNS知道了都想罢工。"},{"c":7,"n":6,"m":"M4","mn":"计算机网络基础","s":"以下域名的表示中，错误的是____。","o":["shizi.sheic.edu.cn","online.sh.cn","xyz.weibei.edu.cn","sh163，net，cn"],"a":"D","status":"OK","ex":"答案D。域名各部分之间必须用英文句点“.”分隔，D项却用中文逗号“，”连接各级域名，写法本身就不合法；A、B、C都是规范的点分域名。"},{"c":7,"n":7,"m":"M4","mn":"计算机网络基础","s":"Internet为人们提供许多服务项目，最常用的是在Internet各站点之间漫游，浏览文本、图形和声音等各种信\n息，这项服务称为____。","o":["电子邮件","WWW","文件传输","网络新闻组"],"a":"B","status":"OK","ex":"答案B。在Internet各站点之间漫游、浏览文本图形声音等信息，正是WWW（万维网）服务；A是收发信件，C是传输文件，D是参与新闻讨论组，都不对号。"},{"c":7,"n":8,"m":"M4","mn":"计算机网络基础","s":"Internet Explorer浏览器本质上是一个____。","o":["连入Internet的TCP/IP程序","连入Internet的SNMP程序","浏览Internet上Web页面的服务器程序","浏览Internet上Web页面的客户程序"],"a":"D","status":"OK","ex":"答案D。IE安装在用户计算机上，负责向服务器请求并显示网页，属于客户程序；C把方向搞反了——提供Web页面的是服务器程序，A与B（SNMP是网络管理协议）也都不是浏览器的性质。"},{"c":7,"n":9,"m":"M4","mn":"计算机网络基础","s":"要打开IE窗口，可以双击桌面上的图标____。","o":["Internet Explore","网上邻居","Outlook","我的电脑"],"a":"A","status":"OK","ex":"答案A。双击桌面上的Internet Explorer图标即可打开IE窗口；B是查看局域网资源的入口，C是邮件软件，D是本机资源入口。"},{"c":7,"n":10,"m":"M4","mn":"计算机网络基础","s":"要打开新Internet Explorer窗口，应该____。","o":["按CTRL+N键","按F4键","按Ctrl+D键","按回车键"],"a":"A","status":"OK","ex":"答案A。IE中按Ctrl+N新建一个浏览器窗口；Ctrl+D是把当前页加入收藏夹，F4用于展开地址栏，回车只是确认输入。"},{"c":7,"n":11,"m":"M4","mn":"计算机网络基础","s":"如果想要控制计算机在Internet上可以访问的内容类型，可以使用IE的____功能。","o":["病毒查杀","实时监控","分级审查","远程控制"],"a":"C","status":"OK","ex":"答案C。IE的“分级审查”（内容审查程序）可以设定允许访问的内容级别，用来控制可访问的内容类型；其余三项都不是IE自带功能。"},{"c":7,"n":12,"m":"M4","mn":"计算机网络基础","s":"要在IE中停止下载网页，请按____。","o":["ESC键","Ctrl+W键","BackSpace键","Delete键"],"a":"A","status":"OK","ex":"答案A。网页还在下载时按ESC键可立即停止传输；Ctrl+W是关闭窗口，BackSpace起后退作用，Delete是删除。"},{"c":7,"n":13,"m":"M4","mn":"计算机网络基础","s":"要在IE中返回上一页，应该____。","o":["单击“后退”按钮","按F4键","按Delete键","按Ctrl+D键"],"a":"A","status":"OK","ex":"答案A。工具栏上的“后退”按钮用于返回刚浏览过的上一页；F4、Delete都不是导航键，Ctrl+D是添加收藏。"},{"c":7,"n":14,"m":"M4","mn":"计算机网络基础","s":"在Internet Explorer常规大小窗口和全屏幕模式之间切换，可按____。","o":["F5键","F11键","Ctrl+D键","Ctrl+F键"],"a":"B","status":"OK","ex":"答案B。IE中按F11可在常规窗口和全屏幕显示之间切换；F5是刷新页面，Ctrl+D添加收藏，Ctrl+F是页内查找。"},{"c":7,"n":15,"m":"M4","mn":"计算机网络基础","s":"要想在IE中看到您最近访问过的网站的列表可以____。","o":["单击“后退”按钮","按BackSpace键","按Ctrl+F键","单击“常用选项”的收藏按钮选择历史记录"],"a":"D","status":"OK","ex":"答案D。查看最近访问过的网站列表要靠“历史记录”；“后退”按钮和BackSpace只能回到紧邻的上一页，Ctrl+F是页内查找。"},{"c":7,"n":16,"m":"M4","mn":"计算机网络基础","s":"浏览Internet上的网页，需要知道____。","o":["网页的设计原则","网页制作的过程","网页的地址","网页的作者"],"a":"C","status":"OK","ex":"答案C。浏览器按网址（URL）定位网页，所以要浏览网页必须知道网页的地址；设计原则和制作过程是建站者的事，作者是无关信息。"},{"c":7,"n":17,"m":"M4","mn":"计算机网络基础","s":"在浏览网页时，下列可能泄漏隐私的是____。","o":["HTML文件","文本文件","Cookie","应用程序"],"a":"C","status":"OK","ex":"答案C。Cookie是网站存放在用户电脑里的小文件，记录浏览偏好、登录状态等个人信息，可能泄露隐私；HTML文件和文本文件只是静态内容，本身不收集用户信息。"},{"c":7,"n":18,"m":"M4","mn":"计算机网络基础","s":"在Internet上使用的基本通信协议是____。","o":["NOVELL","TCP/IP","NETBOI","IPX/SPX"],"a":"B","status":"OK","ex":"答案B。TCP/IP是Internet赖以运行的基本通信协议；NOVELL是网络系统厂商，NetBEUI和IPX/SPX主要是局域网协议，都撑不起Internet。","roast":"Internet的基本协议都能答错，你这网怕不是用信鸽连的。"},{"c":7,"n":19,"m":"M4","mn":"计算机网络基础","s":"用IE访问网页时，一般要到____才能单击鼠标访问网站里的信息。","o":["当鼠标指针变成闪烁状态时","当鼠标指针依旧是箭头形状时","当鼠标指针变成手形时","当鼠标指针箭头旁边出现一个问号时"],"a":"C","status":"OK","ex":"答案C。鼠标指针移到超链接上会变成手形，此时单击才能跳转访问；箭头状态说明指着的不是链接。","roast":"指针变手型才点得动链接，天天摸鼠标的人不该不知道。"},{"c":7,"n":20,"m":"M4","mn":"计算机网络基础","s":"如果你对网页上的一段图文信息感兴趣，想保存到本地硬盘，最好进行____操作。","o":["全选这段消息，然后按右键选“目标另存为”，保存到本地硬盘","文字、图片分开来复制","选择“文件”菜单中的“另存为”菜单命令，保存为WEB页面格式","保存这个文件的源代码即可"],"a":"B","status":"OK","ex":"答案B。对网页中图文混排的一段信息，把文字、图片分开复制保存最稳妥；A的“目标另存为”只适用于链接目标，C整页另存拿不到所选片段，D保存源代码只会得到代码。"},{"c":7,"n":21,"m":"M4","mn":"计算机网络基础","s":"如果在浏览网页时，发现了自己感兴趣的网页，想要把该网页的地址记住，以便以后访问，最好的办法是__。","o":["用笔把该网页的地址记下来","在心里记住该网页的地址","把该网页添加到收藏夹","把该网页以文本的形式保存下来"],"a":"C","status":"OK","ex":"答案C。把网页添加到收藏夹即可保存其地址，以后一键访问；用笔抄、靠心记既慢又易错，另存为文本保存的是内容不是地址。"},{"c":7,"n":22,"m":"M4","mn":"计算机网络基础","s":"如果想在Internet上搜索有关Detroit Pistons（底特律活塞）篮球队方面的信息，用____关键词可能最终有效。","o":["“Detroit Pistons”","basketball（篮球）","Detroit pistons","Sports（体育）"],"a":"A","status":"OK","ex":"答案A。给“Detroit Pistons”加引号表示按完整短语精确检索，结果最有效；不加引号会被拆成两个独立词（C就是这种情况），basketball、Sports范围太宽，命中精度低。"},{"c":7,"n":23,"m":"M4","mn":"计算机网络基础","s":"在Internet上搜索信息时，下列说法不正确的是：____。","o":["Windows and client表示检索结果必需同时满足windows和client两个条件","Windows or client表示检索结果只需满足windows和client中的一个条件即可","Windows not client表示检索结果中不能含有client","windows client表示检索结果中含有windows或client"],"a":"D","status":"OK","ex":"答案D。关键词之间用空格分隔表示“与”的关系，结果需同时含有windows和client，并不是“或”；and（与）、or（或）、not（非）的逻辑在A、B、C中的表述都是对的。"},{"c":7,"n":24,"m":"M4","mn":"计算机网络基础","s":"下列关于搜索引擎的原理说法不正确的是____。","o":["全文搜索引擎一般都有个“网络蜘蛛”，它扫描一定范围内的网站，并沿着网络上的链接从一个网页到另一个网页，采集网页资料","搜索引擎有一个索引数据库，网络机器人或网络蜘蛛采集的网页，经过其他程序进行分析，根据一定的相关度算法进行大量的计算建立网页索引，添加到这个索引数据库中","当你输入关键词进行查询时，搜索引擎会从庞大的数据库中找到符合该关键词的所有相关网页的索引呈现给我们。所以，当我们以同一关键词用不同的搜索引擎查询时，搜索结果是相同的","和全文搜索引擎一样，分类目录的整个工作过程也同样分为收集信息、分析信息和查询信息三部分，只不过分类目录的收集、分析信息两部分主要依靠人工完成"],"a":"C","status":"OK","ex":"答案C。各搜索引擎的索引数据库和相关度算法不同，同一关键词在不同引擎查出的结果并不相同，C说“结果相同”错误；A、B、D分别是对蜘蛛采集建索引和分类目录人工编辑的正确描述。"},{"c":7,"n":25,"m":"M4","mn":"计算机网络基础","s":"当在搜索引擎中输入“computer book”（用引号括起来的computer book），检索的结果最可能是____。","o":["结果满足computer和book其中的一个条件","结果中满足computer和book两个条件","结果中满足computer book这个条件，而不是满足computer或book任何一个条件","结果中包含computer或book"],"a":"C","status":"OK","ex":"答案C。computer book加引号后按整个短语精确匹配，要求结果中连续出现“computer book”，而不是分别满足两个词；A、B、D都没体现短语的整体验。"},{"c":7,"n":26,"m":"M4","mn":"计算机网络基础","s":"当你想搜索英语口语方面的mp3下载时，使检索结果最准确的关键词是____。","o":["英语口语下载","英语口语","英语  口语  mp3","英语口语  mp3  下载"],"a":"D","status":"OK","ex":"答案D。“英语口语 mp3 下载”三个词同时命中需求，检索最准确；A、B缺少mp3、下载等限定，C把“英语 口语”拆成两个词反而稀释匹配。"},{"c":7,"n":27,"m":"M4","mn":"计算机网络基础","s":"Yahoo网站在万维网上搜索的方法是____。","o":["能交替地使用分类目录和关键字搜索","既不能使用分类目录搜索，也不能使用关键字搜索","只能使用分类目录搜索","只能使用关键字搜索"],"a":"A","status":"OK","ex":"答案A。Yahoo既提供分类目录逐级查找，也提供关键词检索，两种方式可交替使用；B、C、D都把它说成单一方式。"},{"c":7,"n":28,"m":"M4","mn":"计算机网络基础","s":"关于网页快照的说法不正确的是____。","o":["“网页快照”是搜索引擎在收录网页时，备份保存在搜索引擎的服务器缓存里的内容","当检索到的网页被删除或链接失效时，即使使用网页快照也不能打开链接","网页快照中，关键字会用其他颜色显示（如红色或者黄色），因此通过网页快照可以快速定位关键词","由于网页快照以文本内容为主，因此网页快照的访问速度比一般的网页快"],"a":"B","status":"OK","ex":"答案B。网页快照保存的是搜索引擎缓存里的副本，恰恰是为了在原网页被删除、链接失效时仍能查看，“不能打开”说法错误；A、C、D都是快照的正确特点。"},{"c":7,"n":29,"m":"M4","mn":"计算机网络基础","s":"接入Internet并且支持FTP协议的两台计算机，对于它们之间的文件传输，下列说法正确的是____。","o":["只能传输文本文件","不能传输图形文件","所有文件均能传输","只能传输几种类型的文件"],"a":"C","status":"OK","ex":"答案C。FTP对文件类型没有限制，文本、图形、程序等各类文件都能在支持FTP的两台计算机之间传输；A、B、D的限定都不成立。"},{"c":7,"n":30,"m":"M4","mn":"计算机网络基础","s":"在Internet中，协议____用于文件传输。","o":["HTML","SMTP","FTP","POP"],"a":"C","status":"OK","ex":"答案C。Internet中负责文件传输的协议是FTP；HTML用于网页，SMTP和POP用于电子邮件收发。","roast":"传文件用什么协议？FTP。背下来，白给的分别往外推。"},{"c":7,"n":31,"m":"M4","mn":"计算机网络基础","s":"FTP是实现文件在网上的____。","o":["复制","移动","查询","浏览"],"a":"A","status":"OK","ex":"答案A。FTP把文件从一台计算机完整拷贝到另一台，本质是在网上复制文件；移动要删除源文件，查询、浏览都不是它的功能。"},{"c":7,"n":32,"m":"M4","mn":"计算机网络基础","s":"FTP的中文意义是____。","o":["高级程序设计语言","域名","文件传输协议","网址"],"a":"C","status":"OK","ex":"答案C。FTP即File Transfer Protocol，中文是文件传输协议；A、B、D和这个缩写毫无关系。","roast":"FTP的中文意思属于背了就给分，错了就是没翻书。"},{"c":7,"n":33,"m":"M4","mn":"计算机网络基础","s":"有关FTP下列描述不正确的是____。","o":["FTP是一个标准协议，它是在计算机和网络之间交换文件的最简单的方法","FTP可以实现即时的网上聊天","从服务器上下载文件也是一种非常普遍的使用方式","FTP通常用于将网页从创造者上传到服务器上供他人使用"],"a":"B","status":"OK","ex":"答案B。FTP只负责文件传输，不能实现网上聊天；A说它是交换文件的标准协议、C说下载是普遍用途、D说可上传网页，都是正确描述。"},{"c":7,"n":34,"m":"M4","mn":"计算机网络基础","s":"下面____是ftp服务器的地址。","o":["http://192.168.113.23","ftp://192.168.113.23","www.sina.com.cn","c:\\windows"],"a":"B","status":"OK","ex":"答案B。以ftp://开头的地址才是FTP服务器地址；http://是Web服务器，www.sina.com.cn是不带协议的域名，c:\\windows是本地磁盘路径。"},{"c":7,"n":35,"m":"M4","mn":"计算机网络基础","s":"利用FTP（文件传输协议）的最大优点是可以实现____。","o":["同一操作系统之间的文件传输","异种机上同一操作系统间的文件传输","异种机和异种操作系统之间的文件传输","同一机型上不同操作系统之间的文件传输"],"a":"C","status":"OK","ex":"答案C。FTP最大的优点是跨平台——异种机、异种操作系统之间只要都支持FTP就能互传文件，这正是它成为标准协议的意义；A、B、D都把范围收窄了。"},{"c":7,"n":36,"m":"M4","mn":"计算机网络基础","s":"FTP的主要功能是____。","o":["传送网上所有类型的文件","远程登录","收发电子邮件","浏览网页"],"a":"A","status":"OK","ex":"答案A。FTP的主要功能是在网上传送各类文件；远程登录是Telnet的事，收发邮件靠邮件协议，浏览网页靠浏览器。"},{"c":7,"n":37,"m":"M4","mn":"计算机网络基础","s":"匿名FTP是____。","o":["Internet中一种匿名信的名称","在Internet上没有主机地址的FTP","允许用户免费登录并
