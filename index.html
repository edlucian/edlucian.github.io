述中，较为全面的一项是____。","o":["只能用于编辑音频功能的计算机","带有高分辨率显示设备的、具有大容量内存和硬盘的、包含功能强大中央处理器（CPU）的，并具有音视频处理功能的计算机","只能用于编辑视频功能的计算机","带有磁带机的计算机"],"a":"B","status":"OK","ex":"答案B。多媒体计算机的要点是较高配置（大容量内存硬盘、功能强的CPU、高分辨率显示设备）加上音视频处理能力；A、C各只强调单一编辑功能，D的磁带机与多媒体能力无关。"},{"c":9,"n":5,"m":"X2","mn":"多媒体（考纲外）","s":"以下接口中，一般不能用于连接扫描仪的是____。","o":["USB","SCSI","并行接口","VGA接口"],"a":"D","status":"OK","ex":"答案D。VGA是显卡连接显示器的视频输出接口；扫描仪一般通过USB、SCSI或老式并行接口与计算机连接。"},{"c":9,"n":6,"m":"X2","mn":"多媒体（考纲外）","s":"以下设备中，不是多媒体计算机中常用的图像输入设备的是____。","o":["数码照相机","彩色扫描仪","条码读写器","数码摄像机"],"a":"C","status":"OK","ex":"答案C。条码读写器读取的是条形码编号信息，不采集图像；数码照相机、彩色扫描仪、数码摄像机才是常用的图像输入设备。"},{"c":9,"n":7,"m":"X2","mn":"多媒体（考纲外）","s":"下面功能中，不属于多媒体计算机对图形、图像处理能力的基本要求的是____。","o":["可产生丰富形象逼真的图形","实现三维动画","可以逼真、生动地显示彩色静止图像","实现一定程度的二维动画"],"a":"B","status":"OK","ex":"答案B。对图形图像处理能力的基本要求是产生逼真图形、逼真显示彩色静止图像和实现一定程度的二维动画，三维动画属于更高的处理要求，不在基本要求之列。"},{"c":9,"n":8,"m":"X2","mn":"多媒体（考纲外）","s":"声音文件中，具有较好的压缩效果并保持较好的音质是____。","o":["WAV文件","MIDI文件","MP3文件","AU文件"],"a":"C","status":"OK","ex":"答案C。MP3采用有损压缩，压缩效果好且音质损失小；WAV基本不压缩、体积大，MIDI是合成音乐文件而非录制声音，AU是Sun公司的音频格式，综合表现都不如MP3。"},{"c":9,"n":9,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频设备的描述中，正确的是____。","o":["视频设备只能采集视频数据，不能播放视频数据","视频采集卡的功能是用于采集视频数据","视频采集卡的功能是用于采集音频数据","视频设备包括音频采样卡、合成器、中高频音箱、话筒、PC的声卡、耳机等"],"a":"B","status":"OK","ex":"答案B。视频采集卡的功能就是把摄像头、录像机等来源的视频数据采集进计算机；A说视频设备只能采集不能播放不对，C把采集对象错说成音频，D罗列的声卡、音箱、话筒等其实是音频设备。"},{"c":9,"n":10,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频格式文件的描述中，正确的是____。","o":["MIDI文件很小，但MIDI文件不能被录制，必须使用特殊的硬件和软件在计算机上合成","MIDI文件很大，是通过麦克风录制的","WAV文件通常很小，可以从C","WAV文件通常比MIDI文件小"],"a":"A","status":"OK","ex":"答案A。MIDI记录的是音符等演奏指令，文件很小，且不能被录制，必须用专门的硬件和软件在计算机上合成；WAV是对声音直接采样录制的波形文件，体积远大于MIDI，B、C、D把大小和来源关系都说反了。"},{"c":9,"n":11,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频格式文件的描述中，正确的是____。","o":["mp3格式必须使用特殊的硬件和软件在计算机上合成","mp3格式与WAV格式一样，是一种不带压缩的格式","mp3格式是一种压缩格式，它能使声音文件明显缩小，其声音品质较差","mp3格式文件不必等待整个文件下载完成即可收听该文件"],"a":"D","status":"OK","ex":"答案D。MP3支持流式播放，不必等整个文件下载完即可收听；mp3不需要特殊硬件合成（A错），它本身是压缩格式并非无压缩（B错），其音质相对较好、并非品质较差（C错）。"},{"c":9,"n":12,"m":"X2","mn":"多媒体（考纲外）","s":"以下软件中，不属于音频播放软件的是____。","o":["Winamp","录音机","Premiere","RealPlayer"],"a":"C","status":"OK","ex":"答案C。Premiere是视频编辑软件，不属于音频播放软件；Winamp、RealPlayer和录音机都属于音频播放/处理类工具。"},{"c":9,"n":13,"m":"X2","mn":"多媒体（考纲外）","s":"以下软件中，不属于视频播放的软件是____。","o":["QuickTime Player","Media Player","Winamp","超级解霸"],"a":"C","status":"OK","ex":"答案C。Winamp是经典的音频播放器；QuickTime Player、Media Player、超级解霸都能播放视频，属于视频播放软件。"},{"c":9,"n":14,"m":"X2","mn":"多媒体（考纲外）","s":"以下四项中不是计算机中使用的声音文件的是____。","o":["WAV","MP3","TIF","MID"],"a":"C","status":"OK","ex":"答案C。TIF（TIFF）是图像文件格式；WAV、MP3、MID才是计算机中常用的声音文件格式。","roast":"TIF是图片格式，这都能听出声来？回去把扩展名对照表抄十遍。"},{"c":9,"n":15,"m":"X2","mn":"多媒体（考纲外）","s":"以下关于文件压缩的说法中，错误的是____。","o":["文件压缩后文件尺寸一般会变小","不同类型的文件的压缩比率是不同的","文件压缩的逆过程称为解压缩","使用文件压缩工具可以将JPG图像文件压缩70%左右"],"a":"D","status":"OK","ex":"答案D。JPG本身就是高压缩比的有损压缩图像格式，再用压缩工具压不出70%左右的空间；压缩后尺寸一般变小、不同类型文件压缩比不同、逆过程叫解压缩，这三句都是对的。"},{"c":9,"n":16,"m":"X2","mn":"多媒体（考纲外）","s":"以下关于WinRAR的描述中，错误的是____。","o":["使用WinRAR可以进行分卷压缩","使用WinRAR进行解压缩时，必须一次性解压缩压缩包中的所有文件，而不能解压缩其中的个别文件","使用WinRAR可以制作自解压的EXE文件","双击RAR压缩包打开WinRAR窗口后，一般可以直接双击其中的文件进行查看"],"a":"B","status":"OK","ex":"答案B。WinRAR可以在压缩包中勾选部分文件单独解压，“必须一次性解压所有文件”说法错误；分卷压缩、制作自解压EXE、双击包内文件直接查看都是它的常规功能。"},{"c":9,"n":17,"m":"X2","mn":"多媒体（考纲外）","s":"以下选项中，不是常用的多媒体信息压缩标准的是____。","o":["JPEG标准","MP3压缩","LWZ压缩","MPEG标准"],"a":"C","status":"OK","ex":"答案C。LZW（题面写作LWZ）是无损字典压缩算法，主要用于GIF等图像文件，不属于多媒体信息压缩标准；JPEG、MP3、MPEG分别是静态图像、音频、运动图像的压缩标准。"},{"c":9,"n":18,"m":"X2","mn":"多媒体（考纲外）","s":"以下格式中，属于音频文件格式的是____。","o":["WAV格式","JPG格式","DAT格式","MOV格式"],"a":"A","status":"OK","ex":"答案A。WAV是Windows的波形音频格式；JPG是静态图像格式，DAT在此语境指VCD视频，MOV是QuickTime视频格式。","roast":"WAV是音频都认不出来？老娘建议把格式对照表贴床头，睡前背一遍。"},{"c":9,"n":19,"m":"X2","mn":"多媒体（考纲外）","s":"以下格式中，不属于视频文件格式的是____。","o":["WMV格式","MID格式","MOV格式","MPG格式"],"a":"B","status":"OK","ex":"答案B。MID是MIDI音乐文件，属于音频；WMV、MOV、MPG都是视频文件格式。","roast":"MID放的是MIDI音乐，拿视频播放器放它放了个寂寞，这都选错？回去背格式。"},{"c":9,"n":20,"m":"X2","mn":"多媒体（考纲外）","s":"以下工具中，属于多媒体创作工具的是____。","o":["Photoshop","Fireworks","PhotoDraw","Authorware"],"a":"D","status":"OK","ex":"答案D。Authorware是典型的多媒体创作工具，负责把多种媒体集成为作品；Photoshop、Fireworks、PhotoDraw都是图像处理软件，只管图，不管多媒体集成。"},{"c":9,"n":21,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频格式文件的描述中，正确的是____。","o":["ra、ram、rpm或Real Audio格式文件大小要大于MP3文件","ra、ram、rpm格式具有非常高的压缩品质，不能进行流式处理","Real Audio格式压缩品质非常高，其声音品质比MP3文件声音品质要差","mp3格式是一种压缩格式，它能使声音文件明显缩小，其声音品质较差"],"a":"C","status":"OK","ex":"答案C。ra、ram、rpm是Real公司的流式音频格式，压缩率很高、文件比MP3小，但声音品质不如MP3；A的大小关系说反了，B错在它能流式处理，D把MP3的音质贬得不对。"},{"c":9,"n":22,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频格式文件的描述中，不正确的是____。","o":["avi格式可以将视频和音频交织在一起进行同步播放","avi格式的优点是图像质量好","avi格式可以跨多个平台使用，其缺点是体积过于庞大","avi格式可以将视频和音频交织在一起进行同步播放，而且体积非常小"],"a":"D","status":"OK","ex":"答案D。AVI图像质量好、可跨平台，缺点恰恰是体积庞大，D的“体积非常小”与事实相反；A、B、C都是对AVI的正确描述。"},{"c":9,"n":23,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频格式文件的描述中，不正确的是____。","o":["mpeg、mpg或dat格式，也就是运动图像专家组（MPEG）格式，是运动图像压缩算法的国际标准","mpeg、mpg或dat格式，也就是静止图像专家组（MPEG）格式","mpeg、mpg或dat格式被用于家用的VC","目前MPEG格式有MPEG-1、MPEG-2和MPEG-4三个压缩标准"],"a":"B","status":"OK","ex":"答案B。MPEG是运动图像专家组（Moving Picture Experts Group）的缩写，不是“静止图像专家组”，对应静态图像的标准是JPEG；A、C、D对MPEG作为运动图像压缩国际标准及家用设备、分代标准的描述正确。"},{"c":9,"n":24,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频格式文件的描述中，不正确的是____。","o":["ra、rm或rmvb格式是流式视频文件格式，用来在低速率的广域网上实时传输活动视频影像","ra、rm或rmvb格式可以根据网络数据传输速率的不同而采用不同的压缩比率","ra、rm或rmvb格式可实现影像数据的实时传送和实时播放","ra、rm或rmvb格式是Windows公司开发的一种静态图像文件格式"],"a":"D","status":"OK","ex":"答案D。ra、rm、rmvb是Real Networks公司开发的流式视频格式，可在低速率广域网上实时传输播放并按网速自适应压缩率；D说它是Windows公司的静态图像格式，完全张冠李戴。"},{"c":9,"n":25,"m":"X2","mn":"多媒体（考纲外）","s":"以下关于多媒体技术的集成特性的说法中，正确是____。","o":["指多种媒体综合使用的特性","指仅限于视频、图形两种媒体各自使用的特性","指仅限于声、光媒体各自使用的特性","指动画单一媒体使用的特性"],"a":"A","status":"OK","ex":"答案A。多媒体的集成性指多种媒体综合使用的特性；B、C、D都用“仅限”“单一”把集成性砍成了单媒体使用。"},{"c":9,"n":26,"m":"X2","mn":"多媒体（考纲外）","s":"一台典型的多媒体计算机的硬件不一定包括____。","o":["高分辨率的显示设备","大容量的内存和硬盘","扫描仪","中央处理器（CPU）"],"a":"C","status":"OK","ex":"答案C。扫描仪是可选外设，不是多媒体计算机的必备硬件；高分辨率显示设备、大容量内存硬盘和CPU才是基本配置。"},{"c":9,"n":27,"m":"X2","mn":"多媒体（考纲外）","s":"下列选项中，不属于计算机多媒体功能的是____。","o":["编辑、播放视频","播放VCD","自动扫描","编辑、播放音乐"],"a":"C","status":"OK","ex":"答案C。自动扫描不属于对音视频、图像等媒体进行采集处理的多媒体功能；编辑播放视频、播放VCD、编辑播放音乐都是典型的计算机多媒体功能。"},{"c":9,"n":28,"m":"X2","mn":"多媒体（考纲外）","s":"以下应用领域中，属于典型的多媒体应用的是____。","o":["科学计算","网上购物","音视频会议系统","网络远端控制"],"a":"C","status":"OK","ex":"答案C。音视频会议系统需要同时处理声音、图像、视频等多种媒体，是典型的多媒体应用；科学计算与多媒体无关，网上购物、网络远端控制也不是以多媒体处理为核心的应用。"},{"c":9,"n":29,"m":"X2","mn":"多媒体（考纲外）","s":"把一台普通的计算机变成多媒体计算机，要解决的关键技术不包括____。","o":["多媒体数据压编码技术","多媒体数据压解码技术","网络包分发技术","视频音频数据的输出技术"],"a":"C","status":"OK","ex":"答案C。普通计算机变成多媒体计算机要解决的关键技术是多媒体数据压缩编码与解码技术、音视频数据的实时处理和输出技术；网络包分发技术不属于这些关键技术。"},{"c":9,"n":30,"m":"X2","mn":"多媒体（考纲外）","s":"以下关于多媒体技术的描述中，错误的是____。","o":["多媒体技术将多种媒体以数字化的方式集成在一起","多媒体技术是指将多媒体进行有机组合而成的一种新的媒体应用系统","多媒体技术与计算机技术的融合开辟出一个多学科的崭新领域","多媒体技术可以不进行数模转化，直接压缩模拟音乐"],"a":"D","status":"OK","ex":"答案D。多媒体处理的前提是数字化，模拟音频必须先经模数转换变成数字信号才能存储和压缩，“不进行数模转化直接压缩模拟音乐”违背了多媒体数字化的基本前提；A、B、C都是正确表述。"},{"c":9,"n":31,"m":"X2","mn":"多媒体（考纲外）","s":"音频设备是音频输入输出设备的总称，以下包含正确的选项是____。","o":["扫描仪、中高频音箱、话筒","摄像机、多媒体控制台、数字调音台","PC中的声卡、耳机、打印机","中高频音箱、话筒、PC中的声卡、耳机、多媒体控制台、数字调音台、功放机、音箱音频采样卡、合成器"],"a":"D","status":"OK","ex":"答案D。D项中的音箱、话筒、声卡、耳机、多媒体控制台、数字调音台、功放机、音频采样卡、合成器都属于音频设备；A混入了扫描仪，B混入了摄像机，C混入了打印机。"},{"c":9,"n":32,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频设备的描述中，正确的是____。","o":["功放机是完成合成音乐（MIDI）的设备","声卡用于进行图形输出的设备","音频卡是处理视频媒体的设备","功放机是用于把来自信号源的微弱电信号进行放大的设备"],"a":"D","status":"OK","ex":"答案D。功放机的作用就是把来自信号源的微弱电信号进行放大以推动音箱；完成MIDI合成的是合成器，声卡、音频卡处理的是音频而非图形或视频，A、B、C都张冠李戴。"},{"c":9,"n":33,"m":"X2","mn":"多媒体（考纲外）","s":"只读光盘CD－ROM属于____。","o":["传播媒体","存储媒体","表现媒体","通信媒体"],"a":"B","status":"OK","ex":"答案B。按媒体分类，用于存储信息的CD-ROM属于存储媒体；表现媒体指键盘、显示器等输入输出设备。","roast":"CD-ROM是存储媒体，四个字背下来就白给的分都不要？"},{"c":9,"n":34,"m":"X2","mn":"多媒体（考纲外）","s":"默认启动Windows Media Player的方法是单击____。","o":["程序→启动→辅助工具→Windows Media Player","程序→系统→辅助工具→Windows Media Player","开始→所有程序→Windows Media Player","控制面板→附件→娱乐→Windows Media Player"],"a":"C","status":"OK","ex":"答案C。默认启动方式就是开始→所有程序→Windows Media Player；A、B的“辅助工具”路径和D的控制面板路径都不是默认方式。","roast":"点两下开始菜单就能找到的事，这也要错？"},{"c":9,"n":35,"m":"X2","mn":"多媒体（考纲外）","s":"下列有关DVD光盘与VCD光盘的描述中，正确的是____。","o":["DVD光盘的图像分辨率比VCD光盘低","DVD光盘的图像质量比VCD光盘差","DVD光盘的记录容量比VCD光盘小","DVD光盘的记录容量比VCD光盘大"],"a":"D","status":"OK","ex":"答案D。DVD的记录容量（数GB级）远大于VCD（约650MB），分辨率和图像质量也都优于VCD，所以A、B、C把优劣全说反了。"},{"c":9,"n":36,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频设备的描述中，不正确的是____。","o":["用于对摄像头或者摄像机等信号进行捕捉、并以MPEG格式存储在硬盘上的视频监控卡","用于在PC上看电视的电视卡","压缩视频信息的视频压缩卡","在PC上处理视频信号的声卡"],"a":"D","status":"OK","ex":"答案D。处理视频信号的是视频类板卡，声卡负责的是音频；视频监控卡、电视卡、视频压缩卡都是常见的视频设备，描述正确。"},{"c":9,"n":37,"m":"X2","mn":"多媒体（考纲外）","s":"以下类型的图像文件中，不经过压缩的是____。","o":["JPG","GIF","TIF","BMP"],"a":"D","status":"OK","ex":"答案D。BMP是Windows位图，逐像素原样存储、不经压缩；JPG采用有损压缩，GIF采用LZW压缩，TIF也常带压缩。","roast":"BMP不压缩是课本白纸黑字，这都记不住？回去把课本吃了。"},{"c":9,"n":38,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频设备的描述中，正确的是____。","o":["视频设备的采集和显示播放是通过音频卡来实现的","视频卡主要用于捕捉、数字化、冻结、存储、输出、放大、缩小和调整来自激光视盘机、录像机或摄像机的图像","电视卡是一种播放软件","视频卡只能进行音频的相关处理"],"a":"B","status":"OK","ex":"答案B。视频卡的功能就是捕捉、数字化、冻结、存储、输出并放大缩小调整来自激光视盘机、录像机或摄像机的图像；A错在视频采集显示靠视频卡而不是音频卡，C错在电视卡是硬件不是播放软件，D说视频卡只能处理音频更是反了。"},{"c":9,"n":39,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频、视频设备的描述中，不正确的是____。","o":["音频设备既可采集音频信号，也可播放音频信号","视频设备是音、视频输入输出设备的总称","视频信息的采集和显示播放时通过视频卡、播放软件和显示设备来实现的","视频卡可以处理一些相关的音频信息"],"a":"B","status":"OK","ex":"答案B。视频设备只是视频输入输出设备的总称，把音频也包进去的说法不对；音频设备可采集可播放、视频信息的采集和显示播放由视频卡、播放软件和显示设备实现、视频卡能处理部分相关音频，这三句都正确。"},{"c":9,"n":40,"m":"X2","mn":"多媒体（考纲外）","s":"多媒体信息在计算机中的存储形式的是____。","o":["二进制数字信息","十进制数字信息","文本信息","模拟信号"],"a":"A","status":"OK","ex":"答案A。计算机中的一切信息都以二进制形式存储，多媒体信息同样被数字化为二进制数字信息，十进制、文本或模拟信号都不是存储形式。","roast":"计算机里只有0和1，这题答错属于没开过机。"},{"c":9,"n":41,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频文件格式的描述中，正确的是____。","o":["MIDI文件通常比WAV文件小，可以从C","MIDI文件通常比MP3文件大","WAV文件通常比MP3文件小","磁带、麦克风等录制WAV文件"],"a":"D","status":"OK","ex":"答案D。WAV是对磁带、麦克风等声源直接采样录制的波形文件；MIDI只能合成不能录制（A错），MIDI文件比MP3小而非大（B错），不压缩的WAV比MP3大（C错）。"},{"c":9,"n":42,"m":"X2","mn":"多媒体（考纲外）","s":"常见的多媒体创作工具不包括____。","o":["Powerpoint","Authorware","Flash","Windows Media Player"],"a":"D","status":"OK","ex":"答案D。Windows Media Player是播放软件，不负责创作多媒体作品；PowerPoint、Authorware、Flash都能用来制作多媒体作品。"},{"c":9,"n":43,"m":"X2","mn":"多媒体（考纲外）","s":"mpeg、mpg或dat格式是运动图像专家组（MPEG）格式，采用这种格式的家用设备不包括____。","o":["DVD","收音机","VCD","SVCD"],"a":"B","status":"OK","ex":"答案B。MPEG是运动图像压缩标准，DVD、VCD、SVCD这类家用影视设备都采用它；收音机只有声音没有图像，与MPEG无关。"},{"c":9,"n":44,"m":"X2","mn":"多媒体（考纲外）","s":"Real Networks公司开发的一种新型流式视频文件格式，可用来在低速率的广域网上实时传输活动视频影像，\n实现影像数据的实时传送和实时播放。它的格式是____。","o":["rmvb","wav","mov","jpg"],"a":"A","status":"OK","ex":"答案A。rmvb正是Real Networks开发的流式视频格式，可在低速率广域网上实时传送和实时播放；wav是音频格式，mov是苹果QuickTime视频格式，jpg是静态图像格式。"},{"c":9,"n":45,"m":"X2","mn":"多媒体（考纲外）","s":"下列选项中，最常用的三维动画制作软件工具是____。","o":["3D MAX","GoldWave","Flash","Fireworks"],"a":"A","status":"OK","ex":"答案A。3D MAX（3ds Max）是最常用的三维动画制作软件；GoldWave用于音频编辑，Flash做二维动画，Fireworks处理网页图像。","roast":"三维软件抓瞎？3D MAX这名字里都写着3D了，白给。"},{"c":9,"n":46,"m":"X2","mn":"多媒体（考纲外）","s":"下列选项中，不属于音频播放软件的是____。","o":["Media Player","Winamp","RealPlayer","Dreamweaver"],"a":"D","status":"OK","ex":"答案D。Dreamweaver是网页制作软件，与音频播放无关；Media Player、Winamp、RealPlayer都是常见的音频播放软件。","roast":"拿做网页的Dreamweaver放歌，你这操作老娘看着都卡。"},{"c":9,"n":47,"m":"X2","mn":"多媒体（考纲外）","s":"下列选项中，对多媒体技术最全面的描述是____。","o":["多媒体技术只具有同步、集成特性","能够同时获取、处理、编辑、存储和展示两个以上不同类型信息媒体的技术","利用幻灯片教学技术","只能够获取单一信息媒体的技术"],"a":"B","status":"OK","ex":"答案B。多媒体技术的完整定义是能够同时获取、处理、编辑、存储和展示两个以上不同类型信息媒体的技术；A只提同步和集成，C缩成幻灯片教学，D限成单一媒体，覆盖都不全。"},{"c":9,"n":48,"m":"X2","mn":"多媒体（考纲外）","s":"以下对多媒体技术的描述中，正确的是____。","o":["只能够展示一种类型信息媒体或处理两种不同类型信息媒体的技术","能够同时获取、处理、编辑、存储和展示两种以上不同类型信息媒体的技术","不能够同时获取、处理、编辑、存储和展示两种以上不同类型信息媒体的技术","只能够同时获取、处理、编辑、存储和展示两种不同类型信息媒体的技术"],"a":"B","status":"OK","ex":"答案B。多媒体技术能够同时获取、处理、编辑、存储和展示两种以上不同类型的信息媒体；A限制为一种或两种，C直接说“不能”，D把范围钉死在恰好两种，都与定义不符。"},{"c":9,"n":49,"m":"X2","mn":"多媒体（考纲外）","s":"下列关于多媒体技术同步特性的描述中，不正确的是____。","o":["指多种媒体之间同步播放的特性","指单一媒体播放的特性","指两种以上媒体之间同步播放的特性，如视频与音频的同步","指两种以上媒体之间同步播放的特性，如声音与图像的播放同步"],"a":"B","status":"OK","ex":"答案B。同步性指的是两种以上媒体之间同步播放，如声画同步；B的“单一媒体播放”根本谈不上同步。"},{"c":9,"n":50,"m":"X2","mn":"多媒体（考纲外）","s":"下列四项中，不属于计算机多媒体功能的是____。","o":["传真","播放VCD","播放音乐","播放视频"],"a":"A","status":"OK","ex":"答案A。传真不属于计算机多媒体功能；播放VCD、播放音乐、播放视频都是多媒体计算机的常规功能。"},{"c":9,"n":51,"m":"X2","mn":"多媒体（考纲外）","s":"以下应用领域中，属于典型的多媒体应用的是____。","o":["CSCW计算机支持协同工作","视频会议系统","电子表格处理","网络远端控制"],"a":"B","status":"OK","ex":"答案B。视频会议系统同时处理音频、视频等多种媒体，是典型的多媒体应用；CSCW、电子表格处理、网络远端控制不以多媒体处理为核心。"},{"c":9,"n":52,"m":"X2","mn":"多媒体（考纲外）","s":"把一台普通的计算机变成多媒体计算机，要解决的关键技术不包括____。","o":["多媒体数据压缩编码和解码技术","网络交换技术","视频音频数据的实时处理","视频音频数据的输出技术"],"a":"B","status":"OK","ex":"答案B。多媒体计算机要解决的关键技术是数据压缩编码和解码、音视频数据的实时处理与输出，网络交换技术属于计算机网络领域，不在此列。"},{"c":9,"n":53,"m":"X2","mn":"多媒体（考纲外）","s":"下列说法中，正确的是____。","o":["视频卡本身具有图像识别的功能","文件压缩能使文件尺寸变大","多媒体计算机的主要特点是具有较强的音、视频处理能力","彩色电视信号就属于多媒体的范畴"],"a":"C","status":"OK","ex":"答案C。多媒体计算机的主要特点就是较强的音视频处理能力；视频卡本身不做图像识别（A错），压缩只能使文件变小不会变大（B错），彩色电视信号是模拟的单媒体信号、不属于多媒体范畴（D错）。"},{"c":9,"n":54,"m":"X2","mn":"多媒体（考纲外）","s":"使用多媒体的教学手段来进行教学，不能达到的目的是____。","o":["以无人值守控制的方式来进行教学","利用计算机辅助教学","提高课堂教学的生动性","增强课堂教学方式的多样性"],"a":"A","status":"OK","ex":"答案A。多媒体教学仍需教师组织与师生交互，达不到也不以“无人值守控制教学”为目的；计算机辅助教学、提高生动性、增强方式多样性都是它能实现的目标。"},{"c":9,"n":55,"m":"X2","mn":"多媒体（考纲外）","s":"音频设备是音频输入输出设备的总称，包括很多类型的产品，但不包括____。","o":["中高频音箱、音箱音频采样卡","多媒体控制台、数字调音台","打印机、激光扫描仪","功放机、话筒、PC中的声卡、合成器、耳机"],"a":"C","status":"OK","ex":"答案C。打印机和激光扫描仪属于文档/图像输入输出设备，不在音频设备之列；音箱、音频采样卡、控制台、调音台、功放机、话筒、声卡、合成器、耳机都属于音频设备。"},{"c":9,"n":56,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频设备的描述中，不正确的是____。","o":["音频卡用于处理音频媒体，包括数字化声音（Wave）、合成音乐（MIDI）、CD音频","数字调音台用于将多路输入信号进行放大、混合、分配、音质修饰和音响效果加工","功放机进行人工智能语音处理","声卡的主要功能是音频的录制与播放、编辑与音乐合成、文字语音转换、CD-ROM接口、MIDI接口、游戏接口等声卡"],"a":"C","status":"OK","ex":"答案C。功放机只负责把电信号放大推动音箱，谈不上“人工智能语音处理”；音频卡处理Wave、MIDI、CD音频，数字调音台放大混合修饰多路信号，声卡的功能罗列，这三条描述都是对的。"},{"c":9,"n":57,"m":"X2","mn":"多媒体（考纲外）","s":"声卡的主要功能不包括____。","o":["智能谱曲","文字语音转换、MIDI接口、游戏接口","音频的录制与播放、编辑","音乐合成、CD-ROM接口"],"a":"A","status":"OK","ex":"答案A。“智能谱曲”不是声卡的功能；声卡的功能包括音频录制播放与编辑、音乐合成、文字语音转换、CD-ROM接口、MIDI接口、游戏接口等，B、C、D都在其中。"},{"c":9,"n":58,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频设备的描述中，不正确的是____。","o":["视频采集卡用于采集视频数据","视频监控卡用于监听音乐","DV卡用于与数码摄像机相连，将DV影片采集到PC的硬盘","电视卡用于在PC上看电视"],"a":"B","status":"OK","ex":"答案B。视频监控卡用于捕捉摄像头等监控视频信号，“监听音乐”张冠李戴；视频采集卡采视频、DV卡连数码摄像机、电视卡在PC上看电视，这三条都正确。"},{"c":9,"n":59,"m":"X2","mn":"多媒体（考纲外）","s":"视频信息的采集和显示播放是通过____。","o":["视频卡、播放软件和显示设备来实现的","音频卡实现的","三维动画软件生成实现的","计算机运算实现的"],"a":"A","status":"OK","ex":"答案A。视频信息的采集和显示播放由视频卡、播放软件和显示设备三者配合实现，与音频卡、三维动画软件无关。","roast":"教材原句搬过来的填空，背到就是纯送分，白给都不要是吧。"},{"c":9,"n":60,"m":"X2","mn":"多媒体（考纲外）","s":"以下关于光存储系统的描述中，不正确的是____。","o":["3gp","mp4","mov","avi 答案：ADCDB ACBCA DCB"],"a":"B","status":"OK","ex":"答案B。此题考查常见多媒体文件格式概念：3gp、mov、avi、mp4同属视频/流媒体类格式；题干“光存储系统”与选项内容明显不匹配，D选项还混入了无关文字，属题库数据错位题，按给定答案B处理，不强行编造考点。"}];
var LS='dshdz_v3';
function load(){try{return JSON.parse(localStorage.getItem(LS))||{done:{},wrong:{}}}catch(e){return{done:{},wrong:{}}}}
function save(){localStorage.setItem(LS,JSON.stringify(S));}
var S=load();
var filter='ALL',order=[],idx=0;
var MODS=[['ALL','全部'],['M1','基础'],['M2','数据库'],['M3','操作系统'],['M4','网络'],['M5','Word'],['M6','Excel'],['X1','PPT'],['X2','多媒体']];
var KBD=['a','b','c','d'];

/* ---------- 统计：唯一数据源，三处展示全走这里 ---------- */
function stats(mod){
  var pool=mod&&mod!=='ALL'?BANK.filter(function(q){return q.m===mod;}):BANK;
  var total=pool.length,done=0,right=0;
  for(var i=0;i<pool.length;i++){
    var q=pool[i],a=S.done[q.c+'-'+q.n];
    if(a){done++;if(a===q.a)right++;}
  }
  return{total:total,done:done,right:right,
    rate:done?Math.round(right/done*100):0,
    pct:total?Math.round(done/total*1000)/10:0};
}
function pctText(p){return (p%1===0?p:p.toFixed(1))+'%';}
function key(q){return q.c+'-'+q.n;}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}

var ICONS={
  ok:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  bad:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  empty:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>'
};

function buildOrder(){order=BANK.map(function(q,i){return i;}).filter(function(i){return filter==='ALL'||BANK[i].m===filter;});idx=0;render();}

function chips(){
  var el=document.getElementById('chips');el.innerHTML='';
  MODS.forEach(function(a){
    var k=a[0],label=a[1],st=stats(k);
    var b=document.createElement('button');
    b.className='tab'+(k===filter?' on':'');
    b.innerHTML=label+'<span class="n">'+st.done+'/'+st.total+'</span>';
    b.onclick=function(){filter=k;buildOrder();chips();render();};
    el.appendChild(b);
  });
}

function renderSide(){
  var el=document.getElementById('side');
  var g=stats('ALL');
  var C=2*Math.PI*32;
  var h='<div class="panel"><p class="pt">学习进度</p>';
  h+='<div class="ring-row"><div class="ring">';
  h+='<svg viewBox="0 0 74 74"><circle class="track" cx="37" cy="37" r="32" fill="none" stroke-width="5"/><circle class="fill" cx="37" cy="37" r="32" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-g.pct/100)).toFixed(1)+'"/></svg>';
  h+='<div class="cv"><b>'+pctText(g.pct)+'</b><span>总进度</span></div></div>';
  h+='<div class="stat-rows">';
  h+='<div class="srow"><span class="k">已完成</span><span class="v">'+g.done+' <small>/ '+g.total+'</small></span></div>';
  h+='<div class="srow"><span class="k">答对</span><span class="v">'+g.right+'</span></div>';
  h+='<div class="srow"><span class="k">正确率</span><span class="v">'+(g.done?g.rate+'%':'—')+'</span></div>';
  h+='</div></div></div>';
  h+='<div class="panel"><p class="pt">分类进度</p>';
  MODS.forEach(function(a){
    var k=a[0];if(k==='ALL')return;
    var st=stats(k);
    if(!st.total)return;
    h+='<div class="mrow"><span class="mn">'+a[1]+'</span><span class="mbar"><i style="width:'+st.pct+'%"></i></span><span class="mc">'+st.done+'/'+st.total+'</span></div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

function render(){
  var app=document.getElementById('app');
  renderSide();
  if(!order.length){
    app.innerHTML='<div class="empty">'+ICONS.empty+'<p>这个模块没题</p></div>';update();return;
  }
  if(idx<0)idx=0;if(idx>=order.length)idx=order.length-1;
  var q=BANK[order[idx]],k=key(q);
  var answered=!!S.done[k],userSel=S.done[k]||null,userAns=S.wrong[k]||null;
  var h='<article class="qcard">';
  h+='<div class="qhead"><span class="qno">第 '+q.c+' 章 · 第 '+q.n+' 题</span><span class="qtag">'+esc(q.mn)+'</span></div>';
  h+='<h2 class="stem">'+esc(q.s)+'</h2><div class="opts">';
  ['A','B','C','D'].forEach(function(L,i){
    var cls='opt';
    if(answered){if(L===q.a)cls+=' ok';else if(L===userAns)cls+=' bad';else cls+=' dim';}
    h+='<button class="'+cls+'" data-k="'+L+'"><span class="k">'+L+'</span><span class="t">'+esc(q.o[i])+'</span></button>';
  });
  h+='</div>';
  if(answered){
    var ok=(userSel===q.a);
    var inner='<div class="feedwrap">';
    inner+='<div class="feed '+(ok?'ok':'bad')+'">'+(ok?ICONS.ok+'<span>答对了</span>':(ICONS.bad+'<span>正确答案 <span class="ans">'+q.a+'</span>'+'，你选了 '+(userSel||'—')+'</span>'))+'</div>';
    if(!ok&&q.roast){
      inner+='<div class="fb-panel"><div class="roast"><span class="rk">老娘点评</span><div class="rt">'+esc(q.roast)+'</div></div>';
      if(q.ex)inner+='<div class="explain"><div class="et">解析</div><div class="ex">'+esc(q.ex)+'</div></div>';
      inner+='</div>';
    }else if(q.ex){
      inner+='<div class="fb-panel"><div class="explain" style="border-top:none;padding-top:0"><div class="et">解析</div><div class="ex">'+esc(q.ex)+'</div></div></div>';
    }
    inner+='</div>';
    h+='<div class="after show">'+inner+'</div>';
  }else{
    h+='<div class="after"><div class="feedwrap"></div></div>';
  }
  h+='</article>';
  app.innerHTML=h;
  app.querySelectorAll('.opt').forEach(function(btn){
    btn.onclick=function(){
      if(S.done[k])return;
      var L=btn.dataset.k;
      S.done[k]=L;
      if(L!==q.a)S.wrong[k]=L;
      save();render();chips();
    };
  });
  update();
}

function update(){
  var g=stats(filter==='ALL'?'ALL':filter);
  var all=stats('ALL');
  document.getElementById('progbar').style.width=all.pct+'%';
  document.getElementById('sub').textContent='已完成 '+all.done+' / '+all.total+' 题 · 正确率 '+(all.done?all.rate+'%':'—');
  document.getElementById('pos').innerHTML='<b>'+(order.length?(idx+1):0)+'</b> / '+order.length;
  document.getElementById('btnprev').disabled=!order.length||idx<=0;
  document.getElementById('btnnext').disabled=!order.length||idx>=order.length-1;
}

function sheet(){
  var sh=document.getElementById('sheet'),list=document.getElementById('sheetlist');
  var wk=Object.keys(S.wrong);
  var all=stats('ALL');
  document.getElementById('sheettitle').textContent='错题本';
  document.getElementById('sheetstat').textContent=wk.length+' 道待重做 · 正确率 '+(all.done?all.rate+'%':'—');
  if(!wk.length){
    list.innerHTML='<div class="empty">'+ICONS.ok.replace('class="ic"','')+'<p>暂无错题，继续保持</p></div>';
  }else{
    list.innerHTML='';
    wk.forEach(function(k){
      var q=BANK.find(function(x){return key(x)===k;});if(!q)return;
      var row=document.createElement('div');row.className='wrow';
      row.innerHTML='<span class="wl"><b>第'+q.c+'章 · '+esc(q.mn)+'</b>　第'+q.n+'题</span><button class="redo" data-k="'+k+'">重做</button>';
      row.querySelector('button').onclick=function(){
        var bi=BANK.indexOf(q);
        var fi=order.indexOf(bi);
        if(fi>=0){idx=fi;}
        else{filter='ALL';buildOrder();idx=order.indexOf(bi);chips();}
        sh.classList.remove('show');render();
      };
      list.appendChild(row);
    });
  }
  sh.classList.add('show');
}

document.getElementById('btnprev').onclick=function(){if(idx>0){idx--;render();}};
document.getElementById('btnnext').onclick=function(){if(idx<order.length-1){idx++;render();}};
document.getElementById('btnsheet').onclick=sheet;
document.getElementById('sheetclose').onclick=function(){document.getElementById('sheet').classList.remove('show');};
document.getElementById('sheet').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  var i=KBD.indexOf(e.key.toLowerCase());
  if(i>=0){var btn=document.querySelector('.opt[data-k="'+e.key.toUpperCase()+'"]');if(btn)btn.click();}
  else if(e.key==='ArrowRight'){e.preventDefault();document.getElementById('btnnext').click();}
  else if(e.key==='ArrowLeft'){e.preventDefault();document.getElementById('btnprev').click();}
});
buildOrder();chips();
</script>
</body>
</html>
