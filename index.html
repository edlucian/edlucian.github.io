<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="四川单招计算机类刷题：4179 道真题/练习题，按考纲模块分类，带错题本与进度跟踪。">
<title>计算机类 · 单招刷题 · 4179 题</title>
<style>
:root{
  /* 层次暖灰阶梯 */
  --bg:#1C1B19; --panel:#22211F; --card:#292725; --hover:#32302D;
  --line:#3D3935;
  /* 文字 */
  --ink:#F0ECE5; --sub:#A7A097; --dim:#77716A;
  /* 强调与反馈 */
  --acc:#D58B68; --acc-soft:rgba(213,139,104,.12); --acc-line:rgba(213,139,104,.45);
  --ok:#8FB49A; --ok-deep:#5E7F69; --ok-soft:rgba(94,127,105,.14);
  --bad:#C98577; --bad-deep:#96574C; --bad-soft:rgba(150,87,76,.14);
  /* 圆角体系 */
  --r-lg:14px; --r-md:10px; --r-sm:6px;
  /* 动效 */
  --ease:cubic-bezier(.3,.7,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.6;
}
button{font-family:inherit}
svg{display:block}

/* ================= 顶部 ================= */
.top{
  border-bottom:1px solid var(--line);
  background:var(--panel);
}
.top-in{
  max-width:960px;margin:0 auto;padding:18px 24px 0;
}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand h1{margin:0;font-size:16.5px;font-weight:600;letter-spacing:.01em}
.brand .mark{color:var(--acc);margin-right:8px;font-weight:700}
.brand .sub{margin:0;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.prog{height:2px;background:var(--line);border-radius:1px;margin:14px 0 16px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);border-radius:1px;transition:width .45s var(--ease)}

/* ================= 模块导航 ================= */
.tabs{
  border-bottom:1px solid var(--line);
  background:var(--panel);
}
.tabs-in{
  max-width:960px;margin:0 auto;padding:0 16px 12px;
  display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
}
.tabs-in::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;cursor:pointer;border:none;border-radius:var(--r-sm);
  padding:7px 12px;font-size:13.5px;font-weight:450;color:var(--sub);
  background:transparent;transition:background .15s ease,color .15s ease;
  position:relative;white-space:nowrap;
}
.tab:hover{background:var(--hover);color:var(--ink)}
.tab.on{background:var(--card);color:var(--ink);font-weight:550;box-shadow:inset 0 -2px 0 var(--acc)}
.tab .n{font-size:11px;color:var(--dim);margin-left:5px;font-variant-numeric:tabular-nums}
.tab.on .n{color:var(--acc)}

/* ================= 主布局：桌面双栏 ================= */
.layout{
  max-width:960px;margin:0 auto;padding:22px 24px 0;
  display:grid;grid-template-columns:minmax(0,1fr) 264px;gap:20px;
  align-items:start;
}
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 16px 0}
  .side{display:none}
}

/* ================= 学习面板（侧栏） ================= */
.panel{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:18px;
}
.panel .pt{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--dim);margin:0 0 14px}
.ring-row{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.ring{position:relative;width:74px;height:74px;flex:0 0 74px}
.ring svg{width:74px;height:74px;transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .fill{stroke:var(--acc);transition:stroke-dashoffset .5s var(--ease)}
.ring .cv{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1.15;
}
.ring .cv b{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
.ring .cv span{font-size:10px;color:var(--dim)}
.stat-rows{flex:1;min-width:0}
.srow{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;font-size:12.5px}
.srow .k{color:var(--sub)}
.srow .v{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.srow .v small{color:var(--dim);font-weight:450}
.mrow{display:flex;align-items:center;gap:10px;padding:5px 0}
.mrow .mn{flex:0 0 58px;font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mbar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.mrow .mbar i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .4s var(--ease)}
.mrow .mc{flex:0 0 52px;text-align:right;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ================= 题目卡 ================= */
.qcard{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:24px 26px 8px;
  animation:rise .24s var(--ease);
}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.qcard{animation:none}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.qno{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.qtag{
  font-size:11.5px;font-weight:550;letter-spacing:.05em;
  color:var(--acc);background:var(--acc-soft);
  padding:4px 10px;border-radius:var(--r-sm);
}
.stem{font-size:17.5px;line-height:1.7;font-weight:550;margin:0 0 20px;letter-spacing:.005em;word-break:break-word;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.opt{
  display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;cursor:pointer;
  border:1px solid transparent;border-radius:var(--r-md);
  background:transparent;color:var(--ink);
  padding:14px 15px;font-size:15px;line-height:1.55;
  transition:background .15s ease,border-color .15s ease;
}
.opt:hover{background:var(--hover);border-color:var(--line)}
.opt:focus-visible{outline:2px solid var(--acc-line);outline-offset:2px}
.opt:active{background:#383531}
.opt .k{
  flex:0 0 27px;height:27px;border-radius:var(--r-sm);margin-top:1px;
  background:var(--hover);color:var(--sub);border:1px solid transparent;
  font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s,border-color .15s;
}
.opt:hover .k{border-color:var(--line)}
.opt .t{min-width:0;word-break:break-word;padding-top:2px}
.opt.sel{background:var(--acc-soft);border-color:var(--acc-line)}
.opt.sel .k{background:var(--acc);color:#1C1B19;border-color:transparent}
.opt.ok{background:var(--ok-soft);border-color:var(--ok-deep)}
.opt.ok .k{background:var(--ok-deep);color:#F0ECE5;border-color:transparent}
.opt.bad{background:var(--bad-soft);border-color:var(--bad-deep)}
.opt.bad .k{background:var(--bad-deep);color:#F0ECE5;border-color:transparent}
.opt.dim{opacity:.4}

/* ================= 反馈与解析 ================= */
.after{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .26s var(--ease),opacity .2s ease .06s}
.after.show{grid-template-rows:1fr;opacity:1}
.after>div{overflow:hidden}
.feedwrap{padding:2px 0 20px}
.feed{
  display:flex;align-items:center;gap:9px;
  font-size:14px;font-weight:550;margin-bottom:14px;
}
.feed .ic{flex:0 0 18px;width:18px;height:18px}
.feed.ok{color:var(--ok)}
.feed.bad{color:var(--bad)}
.feed .ans{font-weight:700;font-size:15px}
.fb-panel{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-md);padding:16px 18px;
}
.roast{padding:0 0 0 14px;border-left:2px solid var(--acc);margin-bottom:14px}
.roast .rk{display:block;font-size:11px;font-weight:650;letter-spacing:.1em;color:var(--acc);margin-bottom:5px}
.roast .rt{font-size:14.5px;line-height:1.65;color:var(--ink);font-weight:450;word-break:break-word;text-wrap:pretty}
.explain{border-top:1px solid var(--line);padding-top:13px}
.explain .et{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--dim);margin-bottom:7px}
.explain .ex{font-size:14.5px;line-height:1.72;color:var(--sub);word-break:break-word;text-wrap:pretty}

/* ================= 底部操作栏 ================= */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--panel);border-top:1px solid var(--line);
  padding:10px max(24px,calc((100vw - 960px)/2 + 24px)) calc(10px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:8px;
}
.bbtn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  cursor:pointer;font-weight:500;font-size:14px;
  border:1px solid var(--line);border-radius:var(--r-md);
  padding:10px 18px;color:var(--ink);background:var(--card);
  transition:background .15s ease,border-color .15s ease;
}
.bbtn svg{width:15px;height:15px}
.bbtn:hover{background:var(--hover);border-color:#4A453F}
.bbtn:active{background:#383531}
.bbtn:focus-visible{outline:2px solid var(--acc-line);outline-offset:2px}
.bbtn:disabled{opacity:.35;pointer-events:none}
.bbtn.primary{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc)}
.bbtn.primary:hover{background:rgba(213,139,104,.2)}
.bbtn.primary:active{background:rgba(213,139,104,.28)}
.bar .pos{
  flex:1;text-align:center;font-size:12.5px;font-weight:500;color:var(--sub);
  font-variant-numeric:tabular-nums;letter-spacing:.03em;
}
.bar .pos b{color:var(--ink);font-weight:650}
.gotonav{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.gotonav input{
  width:56px;padding:8px 9px;font-size:13px;text-align:center;
  border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums;
  outline:none;
}
.gotonav input:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-line)}
.gotonav .gobtn{
  cursor:pointer;font-size:12.5px;font-weight:600;color:var(--acc);
  border:1px solid var(--acc-line);border-radius:var(--r-md);
  padding:8px 11px;background:var(--acc-soft);
  transition:background .15s ease;
}
.gotonav .gobtn:hover{background:rgba(213,139,104,.2)}
@media (max-width:560px){
  .gotonav input{width:46px;padding:7px 6px}
  .gotonav .gobtn{padding:7px 8px;font-size:12px}
}

/* ================= 错题本抽屉 ================= */
.sheet{
  position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(28,27,25,.62);
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.sheet.show{opacity:1;pointer-events:auto}
.sheet .spanel{
  width:100%;max-width:680px;max-height:76vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-bottom:none;
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.35);
  transform:translateY(46px);transition:transform .32s var(--ease);
  padding:0 0 env(safe-area-inset-bottom);
}
.sheet.show .spanel{transform:translateY(0)}
.sgrab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 2px}
.shead{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 12px;border-bottom:1px solid var(--line)}
.shead h2{margin:0;font-size:15px;font-weight:600}
.shead .st{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.shead button{border:none;background:transparent;border-radius:var(--r-sm);width:30px;height:30px;font-size:14px;cursor:pointer;color:var(--sub);display:flex;align-items:center;justify-content:center}
.shead button:hover{background:var(--hover);color:var(--ink)}
.slist{overflow-y:auto;padding:2px 14px 20px}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.wrow:last-child{border-bottom:none}
.wrow .wl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
.wrow .wl b{color:var(--ink);font-weight:550}
.wrow .redo{
  flex:0 0 auto;cursor:pointer;font-size:12.5px;font-weight:550;
  border:1px solid var(--acc-line);color:var(--acc);
  background:transparent;border-radius:var(--r-sm);padding:5px 13px;
  transition:background .15s;
}
.wrow .redo:hover{background:var(--acc-soft)}
.wrow .redo:active{background:rgba(213,139,104,.22)}

.empty{text-align:center;padding:72px 20px;color:var(--dim)}
.empty svg{width:36px;height:36px;margin:0 auto 12px;opacity:.5}
.empty p{margin:0;font-size:13.5px}

/* ---- 考纲覆盖抽屉 ---- */
.synote{
  font-size:12.5px;line-height:1.7;color:var(--sub);
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);padding:12px 14px;margin:10px 6px 14px;
  text-wrap:pretty;
}
.synote b{color:var(--acc);font-weight:600}
.synote.warn{border-color:var(--acc-line)}
.smod{padding:2px 6px}
.smhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.smname{font-size:13.5px;font-weight:600;color:var(--ink)}
.smmeta{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.strow{
  display:flex;align-items:center;gap:9px;
  padding:10px 4px;border-bottom:1px solid var(--line);
  cursor:pointer;border-radius:var(--r-sm);
  transition:background .15s ease;
}
.strow:last-child{border-bottom:none}
.strow:hover{background:var(--hover)}
.strow:active{background:#383531}
.sdot{flex:0 0 7px;width:7px;height:7px;border-radius:50%}
.sdot.ok{background:var(--ok-deep)}
.sdot.thin{background:var(--acc)}
.sdot.none{background:var(--bad-deep)}
.sname{flex:1;min-width:0;font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scnt{flex:0 0 auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.sgo{flex:0 0 auto;font-size:11.5px;font-weight:550;color:var(--acc);opacity:.75}
.strow:hover .sgo{opacity:1}

/* ================= 科目切换条 ================= */
.subj{background:var(--panel)}
.subj-in{max-width:960px;margin:0 auto;padding:0 16px 10px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.subj-in::-webkit-scrollbar{display:none}
.sbtn{
  flex:0 0 auto;cursor:pointer;border:none;border-radius:var(--r-sm);
  padding:7px 16px;font-size:13.5px;font-weight:450;color:var(--sub);
  background:transparent;transition:background .15s ease,color .15s ease;
  position:relative;white-space:nowrap;
}
.sbtn:hover{background:var(--hover);color:var(--ink)}
.sbtn.on{background:var(--card);color:var(--acc);font-weight:600;box-shadow:inset 0 -2px 0 var(--acc)}
@media (max-width:560px){
  .qcard{padding:18px 16px 4px}
  .subj-in{padding:0 10px 8px}
  .sbtn{padding:8px 14px;font-size:13px}
  .stem{font-size:16.5px}
  .opt{padding:12px 12px;gap:11px}
  .top-in{padding:14px 16px 0}
  .bar{padding-left:10px;padding-right:10px;gap:6px;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .bbtn{padding:12px 14px}
  .bbtn .bt{display:none}
  .bbtn.primary .bt{display:inline}
}
/* ============ v2：多题型 / 材料题 / 题图 ============ */
.h1n{font-size:11.5px;font-weight:550;color:var(--acc);margin-left:8px;
  background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:999px;padding:1px 8px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.stem{white-space:pre-wrap;overflow-wrap:anywhere}
.qimg{margin:14px 0 2px}
.qimg img{display:block;max-width:100%;height:auto;margin:0 0 8px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--panel)}
.opts.none{display:block}
.opt.sel{border-color:var(--acc-line);background:var(--acc-soft)}
.opt.sel .k{background:var(--acc);color:#1C1B19}
.fillans{margin:6px 0 2px;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--panel);color:var(--sub);font-size:14px;line-height:1.65;white-space:pre-wrap}
.mulbar{display:flex;align-items:center;gap:12px;margin:14px 0 2px;flex-wrap:wrap}
.mulbar .muhint{font-size:12.5px;color:var(--dim)}
.mulbar .gobtn{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--acc);
  border:1px solid var(--acc-line);border-radius:var(--r-md);padding:8px 14px;background:var(--acc-soft)}
.mulbar .gobtn:hover{background:rgba(213,139,104,.2)}
.feed.ref{background:var(--panel);color:var(--sub);border:1px solid var(--line)}
.ex.noex{color:var(--dim)}
.opt.reveal{color:var(--sub)}
.opt.reveal .k{background:var(--panel);color:var(--dim)}
.matsub{margin:20px 0 4px;padding-top:16px;border-top:1px dashed var(--line)}
.mattt{margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--dim)}
.subcard{margin:0 0 12px;padding:14px 15px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel)}
.substem{margin:0 0 8px;font-size:14.5px;line-height:1.6;white-space:pre-wrap}
.substem .sno{display:inline-block;min-width:18px;margin-right:6px;color:var(--acc);font-weight:650;
  font-variant-numeric:tabular-nums}
.copt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;cursor:pointer;
  border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--ink);
  padding:9px 10px;font-size:14px;line-height:1.5;transition:background .15s ease,border-color .15s ease}
.copt:hover{background:var(--hover);border-color:var(--line)}
.copt .k{flex:0 0 23px;height:23px;border-radius:var(--r-sm);margin-top:1px;
  background:var(--hover);color:var(--sub);font-weight:600;font-size:11.5px;
  display:flex;align-items:center;justify-content:center}
.copt.ok{border-color:var(--ok-deep);background:var(--ok-soft)}
.copt.ok .k{background:var(--ok-deep);color:#10241a}
.copt.bad{border-color:var(--bad-deep);background:var(--bad-soft)}
.copt.bad .k{background:var(--bad-deep);color:#2a1210}
.copt.dim{opacity:.45}
.subfeed{margin-top:9px;font-size:12.5px}
.subfeed.ok{color:var(--ok)}
.subfeed.bad{color:var(--bad)}
@media (max-width:560px){
  .h1n{display:none}
  .subcard{padding:12px 11px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1><span class="mark">◢</span>计算机类 · 单招刷题 <span class="h1n">4179 题</span></h1>
      <p class="sub" id="sub">—</p>
    </div>
    <nav class="subj"><div class="subj-in" id="subjbar"></div></nav>
    <div class="prog"><i id="progbar"></i></div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-in" id="chips"></div>
</nav>

<div class="layout">
  <main id="app" style="min-width:0"></main>
  <aside class="side" id="side"></aside>
</div>

<footer class="bar">
  <button class="bbtn" id="btnprev">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <span class="bt">上一题</span>
  </button>
  <span class="pos" id="pos">—</span>
  <span class="gotonav">

","ex":"2023年四川单招真题。"},{"c":23,"n":4,"m":"zh","s":"对下列句子中加点词的解释，不正确的一项是","o":["夫夷以近 夷：平坦。","非常之观 非常：不平常。","后世之谬其传而莫能名者 谬：错误。","何可胜道也哉 胜：尽，完。"],"a":"C","ex":"2023年四川单招真题。"},{"c":25,"n":1,"m":"zh","s":"下列词语字形书写和加点字注音完全正确的一组是","o":["机械(xiè) 霁月光风(jì) 即往不咎(ji)","长篙(hāo) 百舸争流(gě) 买椟还珠(dú)","模型(mó) 目不暇接(xiá) 瞋目而视(chēn)","驽马(nú) 不胫而走(jìn) 相形见绌(chù)"],"a":"C","ex":"A 项中“即往不咎”应为“既往不咎”，“既”表示已经，指对过去的事情不再追究；B 项“长篙（hāo）”注音错误，正确读音为“gāo”，指撑船的长竹竿；D 项“骜马”应为“驽马”（“骜”指劣马），“不胫而走（jìn）”注音错误，正确读音为“jìng”（“胫”指小腿），“相形见细”应为“相形见绌”（“绌”指不足）。C 项字形和注音均无错误。"},{"c":25,"n":2,"m":"zh","s":"下列语段中加点的成语使用不恰当的一项是起初，美心没把这小小的酱菜当回事，觉得不过是雕虫小技。但阿奶的一番话，让她意识到这门手艺的价值——“这门手艺不该丢”“以小见大，传千到万”。于是美心开始翻箱倒柜找秘方，精心挑选材料，用心熬制酱料，那手起刀落的娴熟动作，颇有大师风范。阿奶尝后交口称赞，拿到市场上售卖，顾客们也是好评连连。","o":["雕虫小技","翻箱倒柜","手起刀落","交口称赞"],"a":"C","ex":"A 项“雕虫小技”比喻微小的技能，符合美心最初对酱菜手艺的轻视，使用恰当；B 项“翻箱倒柜”形容彻底搜寻，符合美心找秘方的动作，使用恰当；C 项“手起刀落”多形容动作果断、迅速，且常与“切菜”“斩物”等具体切割动作搭配，此处用于“挑选材料、熬制酱料”的语境，与动作场景不匹配，使用不恰当；D 项“交口称赞”指众人一起称赞，符合阿奶和顾客对酱菜的认可，使用恰当。"},{"c":25,"n":3,"m":"zh","s":"下列句子没有语病的一项是","o":["《哪吒2》设计团队以传统美学视角出发，对群山、建筑等细微之处精心布局雕琢，为剧情搭建了极具视觉张力的舞台。","全民国防教育是建设巩固国防和强大人民军队的基础性工程，是弘扬爱国主义精神、增强全民国防意识的有效途径。","在大家的共同努力下，村里种养工作的科技含量越来越高，田书记希望相关部门继续鼓励支持，促进农业绿色低碳。","双流机场全面升级1号楼服务，将显著提升运行模式和服务品质，为旅客带来更加高效、便捷、顺畅的航空出行体验。"],"a":"B","ex":"A 项句式杂糅，“以……视角出发”应改为“从……视角出发”或“以……视角”；C 项成分残缺，“促进农业绿色低碳”后缺少宾语中心语，应补充“发展”；D 项搭配不当，“提升运行模式”错误，“运行模式”可“优化”，不能“提升”，应改为“优化运行模式，提升服务品质”。B 项句子结构完整，逻辑清晰，无语病。"}],en:[{"c":16,"n":1,"m":"en","s":"Tony will be a teacher________ two years.","o":["on","at","in","by"],"a":"C","ex":"2016年四川单招真题。"},{"c":16,"n":2,"m":"en","s":"There's________ interesting on TV. Let's go out.","o":["anything","everything","something","nothing"],"a":"D","ex":"2016年四川单招真题。"},{"c":16,"n":3,"m":"en","s":"She was about to go out________ Mrs. Ford came by.","o":["when","while","so","that"],"a":"B","ex":"2016年四川单招真题。"},{"c":16,"n":4,"m":"en","s":"She teaches ________piano in school.","o":["a","the","all","不填"],"a":"D","ex":"2016年四川单招真题。"},{"c":16,"n":5,"m":"en","s":"Don't waste your time on the ga function matchQ(q,f){
  if(f==='ALL')return true;
  if(SUBJECT==='computer')return q.m===f;
  if(f.charAt(0)==='Y')return q.c===parseInt(f.slice(1),10);
  return false;
}
function stats(mod){
  var pool=mod&&mod!=='ALL'?BANK.filter(function(q){return matchQ(q,mod);}):BANK;
  var total=pool.length,done=0,right=0,graded=0;
  for(var i=0;i<pool.length;i++){
    var q=pool[i],a=S.done[key(q)];
    if(q.ch&&q.ch.length){                       /* 材料题：子题全答完才算完成 */
      if(matDone(q))done++;
      var chs=q.ch;
      for(var j=0;j<chs.length;j++){
        if(!isGraded(chs[j]))continue;
        var ca=S.done[key(q)+'.'+chs[j].id];
        if(ca){graded++;if(isRight(ca,chs[j].a))right++;}
      }
      continue;
    }
    if(a){done++;if(isGraded(q)){graded++;if(isRight(a,q.a))right++;}}
  }
  return{total:total,done:done,right:right,graded:graded,
    rate:graded?Math.round(right/graded*100):0,
    pct:total?Math.round(done/total*1000)/10:0};
}

function chr(i){return String.fromCharCode(65+i);}
function ansSet(s){if(!s)return '';return String(s).toUpperCase().split('').filter(function(c){return c>='A'&&c<='Z';}).sort().join('');}
function isMulti(q){return !!q&&q.t==='多选题';}
function isGraded(q){
  if(!q||!q.a)return false;
  if(!q.t)return true;   /* 语数英旧库没有 t 字段，按单选处理 */
  return q.t==='单选题'||q.t==='多选题'||q.t==='判断题';
}
function isRight(u,t){var a=ansSet(u),b=ansSet(t);return b!==''&&a===b;}
function ansText(q){
  if(q&&q.ak&&q.ak.length)return q.ak.join('；');
  var a=ansSet(q&&q.a);
  return a?a.split('').join(' '):'';
}
function findQ(k){
  for(var i=0;i<BANK.length;i++){
    var q=BANK[i];
    if(key(q)===k)return q;
    var chs=q.ch||[];
    for(var j=0;j<chs.length;j++){if(key(q)+'.'+chs[j].id===k)return chs[j];}
  }
  return null;
}
/* 材料题素材：父题本身没有选项，完成度看子题 */
function matDone(q){
  var chs=q.ch||[];
  if(!chs.length)return false;
  for(var i=0;i<chs.length;i++){if(!S.done[key(q)+'.'+chs[i].id])return false;}
  return true;
}
function pctText(p){return (p%1===0?p:p.toFixed(1))+'%';}
function key(q){return q.id!=null?String(q.id):(q.c+'-'+q.n);}

  h+='<div class="stat-rows">';
  h+='<div class="srow"><span class="k">已完成</span><span class="v">'+g.done+' <small>/ '+g.total+'</small></span></div>';
  h+='<div class="srow"><span class="k">答对</span><span class="v">'+g.right+'</span></div>';
  h+='<div class="srow"><span class="k">正确率</span><span class="v">'+(g.done?g.rate+'%':'—')+'</span></div>';
  h+='</div></div></div>';
  h+='<div class="panel"><p class="pt">分类进度</p>';
  modsFor().forEach(function(a){
    var k=a[0];if(k==='ALL')return;
    var st=stats(k);
    if(!st.total)return;
    h+='<div class="mrow"><span class="mn">'+a[1]+'</span><span class="mbar"><i style="width:'+st.pct+'%"></i></span><span class="mc">'+st.done+'/'+st.total+'</span></div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

function stemBlock(q){
  var h='<h2 class="stem">'+esc(q.s)+'</h2>';
  if(q.im&&q.im.length){
    h+='<div class="qimg">';
    for(var i=0;i<q.im.length;i++)h+='<img src="'+esc(q.im[i])+'" alt="题图" loading="lazy">';
    h+='</div>';
  }
  return h;
}
function renderOpts(q,k,answered,userSel){
  var n=q.o?q.o.length:0,h='';
  if(!n){
    /* 材料题父题：不给选项，交给 children；其余无选项题给一个“看答案”按钮 */
    if(q.ch&&q.ch.length)return '';
    if(answered)return '<div class="opts none"><div class="fillans">参考答案：'+esc(ansText(q)||'—')+'</div></div>';
    return '<div class="opts none"><button class="opt reveal" data-k="__show__"><span class="k">?</span><span class="t">这道题没有选项，点这里看参考答案</span></button></div>';
  }
  var multi=isMulti(q),pend=multi?(PEND[k]||''):'',sel=multi?pend:(answered?userSel:'');
  h+='<div class="opts'+(multi?' multi':'')+'">';
  for(var j=0;j<n;j++){
    var L=chr(j),cls='opt';
    if(answered){
      if(isGraded(q)){
        if(ansSet(q.a).indexOf(L)>=0)cls+=' ok';
        else if(ansSet(userSel).indexOf(L)>=0)cls+=' bad';
        else cls+=' dim';
      }else cls+=' dim';
    }else if(multi&&ansSet(pend).indexOf(L)>=0)cls+=' sel';
    h+='<button class="'+cls+'" data-k="'+L+'"><span class="k">'+L+'</span><span class="t">'+esc(q.o[j])+'</span></button>';
  }
  h+='</div>';
  if(multi&&!answered){
    var picked=ansSet(pend);
    h+='<div class="mulbar"><span class="muhint">多选题，选好后点提交'+(picked?'（已选 '+picked.split('').join(' ')+'）':'')+'</span>'
      +'<button class="gobtn" id="mulgo" data-k="'+k+'">提交</button></div>';
  }
  return h;
}
function childBlock(q){
  var base=key(q),h='<div class="matsub"><p class="mattt">本题共 '+q.ch.length+' 个小问</p>';
  for(var i=0;i<q.ch.length;i++){
    var c=q.ch[i],ck=base+'.'+c.id,cs=S.done[ck]||'';
    h+='<div class="subcard"><p class="substem"><span class="sno">'+(i+1)+'</span>'+esc(c.s)+'</p>';
    if(c.im&&c.im.length){
      h+='<div class="qimg">';
      for(var m=0;m<c.im.length;m++)h+='<img src="'+esc(c.im[m])+'" alt="题图" loading="lazy">';
      h+='</div>';
    }
    if(c.o&&c.o.length){
      h+='<div class="opts">';
      for(var j=0;j<c.o.length;j++){
        var L=chr(j),k2='copt';
        if(cs){
          if(isGraded(c)){
            if(ansSet(c.a).indexOf(L)>=0)k2+=' ok';
            else if(ansSet(cs).indexOf(L)>=0)k2+=' bad';
            else k2+=' dim';
          }else k2+=' dim';
        }
        h+='<button class="'+k2+'" data-k="'+ck+'" data-l="'+L+'"><span class="k">'+L+'</span><span class="t">'+esc(c.o[j])+'</span></button>';
      }
      h+='</div>';
    }else{
      h+='<div class="fillans">参考答案：'+esc(ansText(c)||'—')+'</div>';
    }
    if(cs&&isGraded(c)){
      h+='<div class="subfeed '+(isRight(cs,c.a)?'ok':'bad')+'">'+(isRight(cs,c.a)?'答对了':'答错，正确答案 '+esc(ansText(c)))+'</div>';
    }
    h+='</div>';
  }
  return h+'</div>';
}
function render(){
  var app=document.getElementById('app');
  renderSide();
  if(!order.length){app.innerHTML='<div class="empty">'+ICONS.empty+'<p>这个模块没题</p></div>';update();return;}
  if(idx<0)idx=0;if(idx>=order.length)idx=order.length-1;
  var q=BANK[order[idx]],k=key(q);
  var answered=!!S.done[k],userSel=S.done[k]||'';
  var h='<article class="qcard">';
  h+='<div class="qhead"><span class="qno">'+esc(q.mn||'')+'</span>'
    +'<span class="qtag">'+esc(TYPELAB[q.t]||'单选')+(isGraded(q)?'':' · 不判分')+'</span></div>';
  h+=stemBlock(q);
  h+=renderOpts(q,k,answered,userSel);
  if(answered&&(isGraded(q)||!(q.ch&&q.ch.length))){
    var inner='<div class="feedwrap">';
    if(!isGraded(q)){
      inner+='<div class="feed ref"><span>参考答案 '+esc(ansText(q)||'—')+'</span></div>';
    }else{
      var ok=isRight(userSel,q.a);
      inner+='<div class="feed '+(ok?'ok':'bad')+'">'+(ok?ICONS.ok+'<span>答对了</span>'
        :(ICONS.bad+'<span>正确答案 <span class="ans">'+esc(ansText(q))+'</span>，你选了 '+esc(userSel||'—')+'</span>'))+'</div>';
    }
    if(q.ex){
      inner+='<div class="fb-panel"><div class="explain" style="border-top:none;padding-top:0"><div class="et">解析</div><div class="ex">'+esc(q.ex)+'</div></div></div>';
    }else if(isGraded(q)){
      inner+='<div class="fb-panel"><div class="explain" style="border-top:none;padding-top:0"><div class="ex noex">题库暂无这道题的解析。</div></div></div>';
    }
    inner+='</div>';
    h+='<div class="after show">'+inner+'</div>';
  }else{
    h+='<div class="after"><div class="feedwrap"></div></div>';
  }
  if(q.ch&&q.ch.length)h+=childBlock(q);
  h+='</article>';
  app.innerHTML=h;
  app.querySelectorAll('.opt').forEach(function(btn){
    btn.onclick=function(){
      if(S.done[k])return;
      var L=btn.dataset.k;
      if(L==='__show__'){S.done[k]='*';save();render();chips();return;}
      if(!isGraded(q)){S.done[k]='*';save();render();chips();return;}
      if(isMulti(q)){
        var p=ansSet(PEND[k]||''),at=p.indexOf(L);
        PEND[k]=at>=0?(p.slice(0,at)+p.slice(at+1)):(p+L);
        render();return;
      }
      S.done[k]=L;
      if(!isRight(L,q.a))S.wrong[k]=L;
      save();render();chips();
    };
  });
  app.querySelectorAll('.copt').forEach(function(btn){
    btn.onclick=function(){
      var ck=btn.dataset.k,L=btn.dataset.l;
      if(S.done[ck])return;
      var c=findQ(ck);
      if(!c||!isGraded(c))return;
      S.done[ck]=L;
      if(!isRight(L,c.a))S.wrong[ck]=L;
      save();render();chips();
    };
  });
  var go=document.getElementById('mulgo');
  if(go)go.onclick=function(){
    var kk=go.dataset.k,p=ansSet(PEND[kk]||'');
    if(!p)return;
    var qq=findQ(kk);
    if(!qq)return;
    S.done[kk]=p;
    if(!isRight(p,qq.a))S.wrong[kk]=p;
    delete PEND[kk];
    save();render();chips();
  };
  update();
}

function update(){
  var all=stats('ALL');
  document.getElementById('progbar').style.width=all.pct+'%';
  document.getElementById('sub').textContent='共 '+all.total+' 题 · 已完成 '+all.done
    +' · 正确率 '+(all.right?all.rate+'%':'—');
  document.getElementById('pos').innerHTML='<b>'+(order.length?(idx+1):0)+'</b> / '+order.length;
  document.getElementById('btnprev').disabled=!order.length||idx<=0;
  document.getElementById('btnnext').disabled=!order.length||idx>=order.length-1;
}

function sheet(){
  var sh=document.getElementById('sheet'),list=document.getElementById('sheetlist');
  var wk=Object.keys(S.wrong);
  var all=stats('ALL');
  document.getElementById('sheettitle').textContent='错题本';
  document.getElementById('sheetstat').textContent=wk.length+' 道待重做 · 正确率 '+(all.done?all.rate+'%':'—');
  if(!wk.length){
    list.innerHTML='<div class="empty">'+ICONS.ok.replace('class="ic"','')+'<p>暂无错题，继续保持</p></div>';
  }else{
    list.innerHTML='';
    wk.forEach(function(k){
      var q=findQ(k);if(!q)return;
      var row=document.createElement('div');row.className='wrow';
      row.innerHTML='<span class="wl"><b>'+esc(q.mn||'')+'</b>　'+esc((q.s||'').slice(0,24))+'</span><button class="redo" data-k="'+k+'">重做</button>';
      row.querySelector('button').onclick=function(){
        delete S.done[k];delete S.wrong[k];save();
        var bi=BANK.indexOf(q);
        var fi=order.indexOf(bi);
        if(bi<0){filter='ALL';buildOrder();chips();}
        else if(fi>=0){idx=fi;}
        else{filter='ALL';buildOrder();idx=order.indexOf(bi);chips();}
        sh.classList.remove('show');render();
      };
      list.appendChild(row);
    });
  }
  sh.classList.add('show');
}

/* ---------- 考纲覆盖抽屉 ---------- */
var SMAP={M1:'M1',M2:'M2',M3:'M3',M4:'M4',M5:'M5',M6:'M6',M7:'X1'};
var SMETA={M1:'计算机基础',M2:'数据库基础',M3:'操作系统基础',M4:'计算机网络基础',M5:'图文编辑（Word）',M6:'电子表格（Excel）',M7:'演示文稿（PPT）'};
function thinNote(){
  var thin=[],none=[];
  SYL.modules.forEach(function(m){
    m.topics.forEach(function(t){
      if(t.status==='thin')thin.push(t.name+'（'+t.count+' 题）');
      else if(t.status==='none')none.push(t.name);
    });
  });
  var s='';
  if(thin.length)s+='⚠ 薄弱考点：'+thin.join('、')+'——考纲列出但题量偏少，建议补练。';
  if(none.length)s+='空白考点：'+none.join('、')+'。';
  if(!s)s='各考点题量均已达 5 题以上，未发现明显薄弱环节。';
  return '<div class="synote warn">'+s+'</div>';
}
function renderSyl(){
  var el=document.getElementById('syllist');
  var h='<div class="synote">四川高职单招计算机类·职业适应性测试。客观题（单选 51% · 多选 16% · 判断 33%）共 200 分，考点覆盖如下，全部为笔试客观题。</div>';
  SYL.modules.forEach(function(m){
    h+='<div class="smod"><div class="smhead"><span class="smname">'+esc(m.name)+'</span><span class="smmeta">应知占比 '+m.weight+' · '+m.total+' 题</span></div>';
    m.topics.forEach(function(t){
      var dot=t.status==='ok'?'ok':(t.status==='thin'?'thin':'none');
      h+='<div class="strow" data-mid="'+m.id+'" data-s="'+(t.sample||'')+'">'
        +'<span class="sdot '+dot+'"></span><span class="sname">'+esc(t.name)+'</span>'
        +'<span class="scnt">'+t.count+' 题</span><span class="sgo">去刷 ›</span></div>';
    });
    h+='</div>';
  });
  h+=thinNote();
  el.innerHTML=h;
  el.querySelectorAll('.strow').forEach(function(row){
    row.onclick=function(){
      sylJump(row.dataset.mid, row.dataset.s);
    };
  });
}
function sylJump(mid, sample){
  var f=SMAP[mid]||mid;
  filter=f;buildOrder();chips();
  if(sample){
    var p=sample.split('-');
    var bi=-1;
    for(var i=0;i<BANK.length;i++){if(BANK[i].c==p[0]&&BANK[i].n==p[1]){bi=i;break;}}
    var fi=order.indexOf(bi);
    if(fi>=0)idx=fi;else idx=0;
  }
  document.getElementById('sylsheet').classList.remove('show');
  render();
}
document.getElementById('btnsyl').onclick=function(){
  renderSyl();
  document.getElementById('sylsheet').classList.add('show');
};
document.getElementById('sylclose').onclick=function(){document.getElementById('sylsheet').classList.remove('show');};
document.getElementById('sylsheet').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});

document.getElementById('btnprev').onclick=function(){if(idx>0){idx--;render();}};
document.getElementById('btnnext').onclick=function(){if(idx<order.length-1){idx++;render();}};
function doJump(){
  var inp=document.getElementById('goto'),v=parseInt(inp.value,10);
  if(isNaN(v)||!order.length){inp.value='';return;}
  if(v<1)v=1;if(v>order.length)v=order.length;
  idx=v-1;render();inp.value='';
}
document.getElementById('btnjump').onclick=doJump;
document.getElementById('goto').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();doJump();}
  e.stopPropagation();
});
document.getElementById('btnsheet').onclick=sheet;
document.getElementById('sheetclose').onclick=function(){document.getElementById('sheet').classList.remove('show');};
document.getElementById('sheet').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  var i=KBD.indexOf(e.key.toLowerCase());
  if(i>=0){var btn=document.querySelector('.opt[data-k="'+e.key.toUpperCase()+'"]');if(btn)btn.click();}
  else if(e.key==='ArrowRight'){e.preventDefault();document.getElementById('btnnext').click();}
  else if(e.key==='ArrowLeft'){e.preventDefault();document.getElementById('btnprev').click();}
});
renderSubj();document.getElementById('btnsyl').style.display=(SUBJECT==='computer')?'':'none';
buildOrder();chips();
</script>
