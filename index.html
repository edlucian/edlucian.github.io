","s":"下列四项中，合法的电子邮件地址是____。","o":["hou-em.Hxing.com.cn","em.hxing.com,cn-zhou","em.hxing.com.cn@zhou","zhou@em.Hxing.com.cn"],"a":"D","status":"OK","ex":"答案D。只有D符合“用户名@域名”的合法格式；A用连字符代替了@，B用逗号分隔且没有@，C把域名放在@前、用户名放在@后，完全颠倒。"},{"c":7,"n":47,"m":"M4","mn":"计算机网络基础","s":"Outlook的主要功能是____。","o":["创建电子邮件账户","搜索网上信息","接收、发送电子邮件","电子邮件加密"],"a":"C","status":"OK","ex":"答案C。Outlook是电子邮件客户端，核心功能是接收和发送电子邮件；创建账户只是使用前的设置，搜索网上信息另有搜索引擎，加密不是它的主业。"},{"c":7,"n":48,"m":"M4","mn":"计算机网络基础","s":"电子邮箱系统不具有的功能是____。","o":["撰写邮件","发送邮件","接受邮件","自动删除邮件"],"a":"D","status":"OK","ex":"答案D。电子邮箱系统具备撰写、发送、接收邮件的基本功能，删除邮件要用户自己动手，“自动删除”不属于其功能。"},{"c":7,"n":49,"m":"M4","mn":"计算机网络基础","s":"在Outlook中，关于发送电子邮件的说法不正确的是____。","o":["可以发送文本文件","可以发送图片文件","可以发送超文本文件","可以发送实物包裹"],"a":"D","status":"OK","ex":"答案D。电子邮件传的是数字信息，实物包裹不可能顺着网线寄过去；文本、图片、超文本文件都可以作为正文或附件发送。"},{"c":7,"n":50,"m":"M4","mn":"计算机网络基础","s":"当电子邮件在发送过程中有误时，则____。","o":["电子邮件将自动把有误的邮件删除","邮件将丢失","电子邮件系统会将原邮件退回，并给出不能寄达的原因","电子邮件系统会将原邮件退回，但不给出不能寄达的原因"],"a":"C","status":"OK","ex":"答案C。邮件因地址错误等原因无法寄达时，系统会把原邮件退回给发件人，并附上不能寄达的原因；既不会被自动删除，也不会凭空丢失。"},{"c":7,"n":51,"m":"M4","mn":"计算机网络基础","s":"关于发送电子邮件，下列说法中正确的是____。","o":["你必须先接入Internet，别人才可以给你发送电子邮件","你只有打开了自己的计算机，别人才可以给你发送电子邮件","只要你有E-Mail地址，别人就可以给你发送电子邮件","没有E-Mail地址，也可以收发送电子邮件"],"a":"C","status":"OK","ex":"答案C。邮件由邮件服务器代收，只要有E-Mail地址，别人随时可以发信给你，与你是否开机、是否在线无关；A、B把在线当成收信前提，D没有地址根本无法收发。"},{"c":7,"n":52,"m":"M4","mn":"计算机网络基础","s":"网页上看到你收到的邮件的主题行的开始位置有“回复：”或“Re：”字样时，表示该邮件是：____。","o":["对方拒收的邮件","当前的邮件","对方回复的答复邮件","希望对方答复的邮件"],"a":"C","status":"OK","ex":"答案C。主题以“回复：”或“Re：”开头，说明这是对方针对某封来信发出的答复邮件；其余三种解读都没有依据。"},{"c":7,"n":53,"m":"M4","mn":"计算机网络基础","s":"你想给某人通过Email发送某个小文件时，你必须____。","o":["在主题上写含有小文件","把这个小文件“复制”一下，粘贴在邮件内容里","无法办到","使用粘贴文件功能，通过插入附加文件完成"],"a":"D","status":"OK","ex":"答案D。发送文件要用插入附件（附加文件）功能，把文件作为附件随邮件发出；正文只能贴文本，主题栏更装不下文件。"},{"c":7,"n":54,"m":"M4","mn":"计算机网络基础","s":"在Outlook窗口中，新邮件的“抄送”文本框输入的多个电子信箱的地址之间，应用____作分隔。","o":["分号（；）","逗号（，）","冒号（：）","空格"],"a":"A","status":"OK","ex":"答案A。Outlook抄送栏中多个邮箱地址之间用分号（;）分隔；逗号、冒号、空格都不是它认可的地址分隔符。"},{"c":7,"n":55,"m":"M4","mn":"计算机网络基础","s":"用Outlook接收电子邮件时，收到的邮件中带有回形针状标志，说明该邮件____。","o":["有病毒","有附件","没有附件","有黑客"],"a":"B","status":"OK","ex":"答案B。回形针标志表示该邮件带有附件，跟病毒、黑客没有必然联系。","roast":"回形针=附件，这图标天天见还能认错？"},{"c":7,"n":56,"m":"M4","mn":"计算机网络基础","s":"当你登录你在某网站注册的邮箱，页面上的“发件箱”文件夹一般保存着的是____。","o":["你已经抛弃的邮件","你已经撰写好，但是还没有成功发送的邮件","包含有不礼貌语句的邮件","包含有不合时宜想法的邮件"],"a":"B","status":"OK","ex":"答案B。“发件箱”存放已撰写但尚未成功发送的邮件，发送成功的会转入“已发送邮件”文件夹；A、C、D都是凑数的干扰项。"},{"c":7,"n":57,"m":"M4","mn":"计算机网络基础","s":"在Outlook中设置唯一电子邮件账号：kao@sina.com，现成功接收到一封来自shi@sina.com的邮件，则以\n下说法正确的是____。","o":["在收件箱中有kao@sina.com邮件","在收件箱中有shi@sina.com邮件","在本地文件夹中有kao@sina.com邮件","在本地文件夹中有shi@sina.com邮件"],"a":"B","status":"OK","ex":"答案B。这封邮件的发件人是shi@sina.com，收件箱里显示的自然是来自shi@sina.com的邮件；kao@sina.com只是本机设置的收件账号，不是邮件来源。"},{"c":7,"n":58,"m":"M4","mn":"计算机网络基础","s":"使用Outlook的通讯簿，可以很好管理邮件，下列说法正确的是____。","o":["在通讯簿中可以建立联系人组","两个联系人组中的信箱地址不能重复","只能将已收到邮件的发件人地址加入到通讯簿中","更改某人的信箱地址，其相应的联系人组中的地址不会自动更新"],"a":"A","status":"OK","ex":"答案A。通讯簿支持建立联系人组，群发时一次选中全组；组间地址可以重复，联系人也能手动添加，联系人地址修改后组内信息会随之更新，B、C、D都不对。"},{"c":7,"n":59,"m":"M4","mn":"计算机网络基础","s":"如果要添加一个新的帐号，应选择Outlook中的____菜单。","o":["文件","查看","工具","邮件"],"a":"A","status":"OK","ex":"答案A。添加新的电子邮件账户属于账户设置操作，按本题教材的Outlook操作口径，该功能在“文件”菜单中完成。"},{"c":7,"n":60,"m":"M4","mn":"计算机网络基础","s":"Outlook Express中设置唯一的电子邮件帐号：kao@sina.com，现成功发送一封电子邮件给shi@sina.com，则\n发送完成后____。","o":["Ctrl+Shift+B","Ctrl+B","Shift+B","Ctrl+Shift 答案:CAACD BDACB ADADC BCCAB A"],"a":"D","status":"OK","ex":"答案D。此题数据已错乱：题干问“发送完成后”的结果，四个选项却是组合键，D项还混入了其他题的答案串，选项与问法对不上，按批次给定答案D照录；知识点上，Outlook发送成功的邮件会存入“已发送邮件”文件夹。"},{"c":3,"n":1,"m":"M5","mn":"图文编辑（Word）","s":"Word具有的功能是____。","o":["表格处理、无线通信","发送邮件、自动更正","绘制图形、浏览网页","表格处理、绘制图形、自动更正"],"a":"D","status":"OK","ex":"答案D。表格处理、绘制图形、自动更正都是Word自带的基本功能；A混入无线通信、B混入发送邮件、C混入浏览网页，都不是Word干的事，只有D三项全属实。"},{"c":3,"n":2,"m":"M5","mn":"图文编辑（Word）","s":"在Word编辑状态下，若要在当前窗口中绘制自选图形，则可选择的前两步操作依次是单击____。","o":["“文件”选项卡、“新建”项","“开始”选项卡、“粘贴”命令按钮","“审阅”选项卡、“新建批注”命令按钮","“插入”选项卡、“形状”命令按钮"],"a":"D","status":"OK","ex":"答案D。画自选图形走“插入”选项卡→“形状”这条路；“新建”是开新文档，“粘贴”管内容搬移，“新建批注”管审阅意见，都跟画图无关。"},{"c":3,"n":3,"m":"M5","mn":"图文编辑（Word）","s":"在Word编辑状态下，若要进行字体效果的设置（如设置文字三维效果等），首先应打开____。","o":["“剪贴板”窗格","“段落”对话框","“字体”对话框","“样式”窗格"],"a":"C","status":"OK","ex":"答案C。三维效果这类字体特效集中在“字体”对话框里设置；剪贴板窗格管复制粘贴，段落对话框管缩进行距，样式窗格管样式集，都不管字符特效。"},{"c":3,"n":4,"m":"M5","mn":"图文编辑（Word）","s":"Word文档中，每个段落都有自己的段落标记，段落标记的位置在____。","o":["段落的首部","段落的结尾处","段落的中间位置","段落中，但用户找不到的位置"],"a":"B","status":"OK","ex":"答案B。段落标记（回车符）标志段落的结束，固定在段落结尾处；它不在段首、段中，也不是什么“找不到的位置”。","roast":"段落标记就是回车符，回车当然敲在段尾，这送分题都丢，老娘替你的回车键不值。"},{"c":3,"n":5,"m":"M5","mn":"图文编辑（Word）","s":"在Word编辑状态下，对于选定的文字不能进行的设置是____。","o":["加下划线","加着重号","动态效果","自动版式"],"a":"D","status":"OK","ex":"答案D。下划线、着重号、动态效果都能通过字体设置对选定文字生效；“自动版式”是对文档版式的说法，不属于对选定文字能做的设置。"},{"c":3,"n":6,"m":"M5","mn":"图文编辑（Word）","s":"在Word编辑状态下，若光标位于表格外右侧的行尾处，按Enter（回车）键，结果为____。","o":["光标移到下一列","光标移到下一行，表格行数不变","插入一行，表格行数改变","在本单元格内换行，表格行数不变"],"a":"C","status":"OK","ex":"答案C。光标停在表格外右侧的行尾段落标记处按Enter，会在该行下面插入一行，表格行数增加；在单元格内按Enter才是单元格内换行，行数不变，别把两种情况搞混。"},{"c":3,"n":7,"m":"M5","mn":"图文编辑（Word）","s":"关于Word中的多文档窗口操作，以下叙述中错误的是____。","o":["Word的文档窗口可以拆分为两个文档窗口","多个文档编辑工作结束后，不能一个一个地存盘或关闭文档窗口","Word允许同时打开多个文档进行编辑，每个文档有一个文档窗口","多文档窗口间的内容可以进行剪切、粘贴和复制等操作"],"a":"B","status":"OK","ex":"答案B。多个文档编辑结束后完全可以逐个存盘、逐个关闭，B说“不能”故错；A窗口可拆分、C允许多文档同时编辑、D窗口间可剪切复制粘贴都是正确的叙述。"},{"c":3,"n":8,"m":"M5","mn":"图文编辑（Word）","s":"在word中，创建表格不应该使用的方法是____。","o":["使用“自选绘图”工具画一个","使用表格拖曳方式","使用“插入表格”命令","使用“快速表格”命令"],"a":"A","status":"OK","ex":"答案A。建表格的正路是“插入表格”（可拖曳选定行列数）和“快速表格”套用现成样式；“自选绘图”是画图形的工具，拿它画个表格不属于创建表格的方法。"},{"c":3,"n":9,"m":"M5","mn":"图文编辑（Word）","s":"在Word中，下述关于分栏操作的说法，正确的是____。","o":["可以将指定的段落分成指定宽度的两栏","任何视图下均可看到分栏效果","设置的各栏宽度和间距与页面宽度无关","栏与栏之间不可以设置分割线"],"a":"A","status":"OK","ex":"答案A。分栏可以对选定段落设置栏数和栏宽；B错在草稿、大纲视图下看不到分栏效果，C错在栏宽和间距受页面宽度约束，D错在分隔线是可以勾选显示的。"},{"c":3,"n":10,"m":"M5","mn":"图文编辑（Word）","s":"在Word编辑状态下，改变段落的缩进方式、调整左右边界等操作，最直观、快速的方法是利用____。","o":["菜单栏","工具栏","格式栏","标尺"],"a":"D","status":"OK","ex":"答案D。标尺上直接拖缩进滑块和页边界游标，缩进、左右边界一目了然，最直观快速；菜单和工具栏要一层层点，做不到这么随手。"},{"c":3,"n":11,"m":"M5","mn":"图文编辑（Word）","s":"在Word编辑状态下，要将另一文档的内容全部添加在当前文档的当前光标处，应选择的操作是依次单击__。","o":["“文件”选项卡和“打开”项","“文件”选项卡和“新建”项","“插入”选项卡和“对象”命令按钮","“插入”选项卡和“超链接”命令按钮"],"a":"C","status":"OK","ex":"答案C。用“插入”选项卡的“对象”命令（文件中的文字）能把另一文档的全部内容插到当前光标处；“打开”“新建”只是另开一个文档窗口，超链接只建跳转链接，都不搬内容。"},{"c":3,"n":12,"m":"M5","mn":"图文编辑（Word）","s":"在Word编辑状态下，进行选定文本行间距的设置，应选择的操作是依次单击____。","o":["“文件”选项卡按钮和“新建”项","“开始”选项卡按钮和“段落”功能区的对话框启动器","“开始”选项卡按钮和“字体”功能区的对话框启动器","“页面布局”选项卡按钮和“页面设置”功能区的对话框启动器"],"a":"B","status":"OK","ex":"答案B。行距属于段落格式，在“开始”选项卡点“段落”功能区的对话框启动器打开段落对话框设置；字体功能区管字符，页面设置管纸张，都管不着行距。"},{"c":3,"n":13,"m":"M5","mn":"图文编辑（Word）","s":"在Word编辑状态下，不可以进行的操作是____。","o":["对选定的段落进行页眉、页脚设置","在选定的段落内进行查找、替换","对选定的段落进行拼写和语法检查","对选定的段落进行字数统计"],"a":"A","status":"OK","ex":"答案A。页眉页脚是按“节”整体设置的，不能只对选定的段落生效；查找替换、拼写检查、字数统计都支持只针对选定范围操作。"},{"c":3,"n":14,"m":"M5","mn":"图文编辑（Word）","s":"在Word的默认状态下，能够直接打开最近使用过的文档的方法是____。","o":["单击快速访问工具栏上的“打开”按钮","选择“文件”选项卡中的“打开”项","快捷键Ctrl+O","单击“文件”选项卡按钮，在文件列表中选择"],"a":"D","status":"OK","ex":"答案D。点开“文件”选项卡，列表里直接列着最近用过的文档，选中即开；A、B、C都是打开任意文件的途径，还得再翻目录找路径，算不上“直接打开最近用过的”。"},{"c":3,"n":15,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，当前编辑的文档是C盘中的d1.docx文档，要将该文档复制到D盘，应当使用____。","o":["“文件”选项卡中的“另存为”命令","“文件”选项卡中的“保存”命令","“文件”选项卡中的“新建”命令","“文件”选项卡中的“粘贴”命令"],"a":"A","status":"OK","ex":"答案A。“另存为”允许重新指定保存位置，把文档存到D盘；“保存”只会写回原位置C盘，新建是开空文档，粘贴管的是内容不是文件本身。"},{"c":3,"n":16,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，当前正编辑一个新建文档“文档1”，当执行“文件”选项卡中的“保存”命令后___。","o":["“文档1”被存盘","弹出“另存为”对话框，供进一步操作","自动以“文档1”为名存盘","不能以“文档1”存盘"],"a":"B","status":"OK","ex":"答案B。“文档1”是未命名的新文档，没有路径和正式文件名，执行“保存”时Word会先弹“另存为”对话框，让你指定文件名和位置；不会自动存盘，更不会以“文档1”为名直接落盘。"},{"c":3,"n":17,"m":"M5","mn":"图文编辑（Word）","s":"在Word中，当多个已命名的文档打开时，关于保存这些文档的说法中正确的是____。","o":["用“文件”选项卡中的“保存”命令，只能保存活动文档","用“文件”选项卡中的“保存”命令，可以重命名保存所有文档","用“文件”选项卡中的“保存”命令，可一次性保存所有打开的文档","用“文件”选项卡中的“全部保存”命令保存所有打开的文档"],"a":"A","status":"OK","ex":"答案A。“保存”命令只作用于当前活动窗口的那一个文档，其余文档要逐个切换保存；“全部保存”并不是“文件”选项卡里的命令，B、C说的“一次性保存所有”不成立。"},{"c":3,"n":18,"m":"M5","mn":"图文编辑（Word）","s":"在Word中，关于快速表格样式的用法，以下说法正确的是____。","o":["只能使用快速表格样式生成表格","可在生成新表时使用快速表格样式","每种快速表格样式已经固定，，不能对其进行任何形式的更改","在使用一种快速表格样式后，不能再更改为其他样式"],"a":"B","status":"OK","ex":"答案B。插入新表格时可以选用快速表格样式直接套现成格式；它不是唯一的建表方式，样式本身可以修改，用完也还能再换成别的样式，“固定不能改”是胡说。"},{"c":3,"n":19,"m":"M5","mn":"图文编辑（Word）","s":"在Word中，如果插入表格的内外框线是虚线，假如光标在表格中，要想将框线变成实线，应使用命令是___。","o":["“开始”选项卡的“更改样式”","“页面布局”选项卡的“边框和底纹”","“插入”选项卡的“形状”","“视图”选项卡的“新建窗口”"],"a":"B","status":"OK","ex":"答案B。表格框线的虚实要在“边框和底纹”对话框里改，按题库口径从“页面布局”选项卡打开；“更改样式”管整套样式，形状是画图工具，新建窗口是多开窗口，都管不到框线。"},{"c":3,"n":20,"m":"M5","mn":"图文编辑（Word）","s":"要将文档中选定的文字移动到指定的位置去，首先对它进行的操作是单击____。","o":["“开始”选项卡中的“复制”命令","“开始”选项卡中的“清除”命令","“开始”选项卡中的“剪切”命令","“开始”选项卡中的“粘贴”命令"],"a":"C","status":"OK","ex":"答案C。移动的第一步是“剪切”——把选定文字从原处取下送入剪贴板，再到目标位置粘贴；复制是保留原件，清除是删除，粘贴是移动的最后一步不是第一步。"},{"c":3,"n":21,"m":"M5","mn":"图文编辑（Word）","s":"在Word的“文件”选项卡中，“最近所用文件”项下显示文档名的个数最多可设置为____。","o":["10个","20个","25个","30个"],"a":"C","status":"OK","ex":"答案C。“文件”选项卡下“最近所用文件”列表能显示的文档个数有设置上限，最多25个；10、20、30都与该上限不符。"},{"c":3,"n":22,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，执行“复制”命令后____。","o":["插入点所在的段落内容被复制到剪贴板","被选择的内容被复制到剪贴板","光标所在的段落内容被复制到剪贴板","被选择的内容被复制到插入点处"],"a":"B","status":"OK","ex":"答案B。执行“复制”后，被选定的内容进入剪贴板，原处内容原样不动；跟插入点所在的段落没有关系，也不会直接出现在插入点处——那是“粘贴”的活。"},{"c":3,"n":23,"m":"M5","mn":"图文编辑（Word）","s":"在Word中“打开”文档的作用是____。","o":["将指定的文档从剪贴板中读入，并显示出来","为指定的文档打开一个空白窗口","将指定的文档从外存中读入，并显示出来","显示并打印指定文档的内容"],"a":"C","status":"OK","ex":"答案C。“打开”的作用是把指定文档从外存（磁盘）读入内存并显示出来供编辑；它跟剪贴板无关，开空白窗口是“新建”干的事，显示并打印那是打印命令。","roast":"打开就是把文件从硬盘里读出来，跟剪贴板八竿子打不着，这定义题都错，硬盘白插了。"},{"c":3,"n":24,"m":"M5","mn":"图文编辑（Word）","s":"Word的“文件”选项卡中显示的文件名所对应的文件是____。","o":["当前被操作的文件","当前已经打开的所有文件","最近被操作过的文件","扩展名是docx的所有文件"],"a":"C","status":"OK","ex":"答案C。“文件”选项卡里显示的文件名是最近操作过的文件清单，方便快速再次打开；它既不代表当前正打开的所有文件，也不是所有docx文件的汇总。"},{"c":3,"n":25,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，执行编辑命令“粘贴”后____。","o":["将文档中被选择的内容复制的当前插入点处","将文档中被选择的内容移到剪贴板","将剪贴板中的内容移到当前插入点处","将剪贴板中的内容复制到当前插入点处"],"a":"D","status":"OK","ex":"答案D。粘贴是把剪贴板中的内容复制到当前插入点处，剪贴板内容并不因此消失；C说“移到”不对，A混淆了对象——粘贴搬的是剪贴板里的东西，不是文档中被选择的内容。"},{"c":3,"n":26,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，进行字体设置操作后，按新设置的字体显示的文字是____。","o":["插入点所在段落中的文字","文档中被选择的文字","插入点所在行中的文字","文档的全部文字"],"a":"B","status":"OK","ex":"答案B。字体设置只作用于文档中被选定的文字；未选文字时才对插入点之后新输入的内容生效，绝不会对整篇文档一次性生效。"},{"c":3,"n":27,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态设置了标尺，可以同时显示水平标尺和垂直标尺的视图方式____。","o":["普通方式","页面方式","大纲方式","全屏显示方式"],"a":"B","status":"OK","ex":"答案B。页面视图按打印效果呈现整页，水平标尺和垂直标尺同时显示；草稿视图和大纲视图只有水平标尺，全屏显示连标尺都藏起来。"},{"c":3,"n":28,"m":"M5","mn":"图文编辑（Word）","s":"设定打印纸张大小时，应当使用的命令是____。","o":["“文件”选项卡中的“另存为”项","“文件”选项卡中的“打印”项","“视图”选项卡中的“显示比例”项","“页面布局”选项卡中的“主题”项"],"a":"B","status":"OK","ex":"答案B。打印纸张大小在“文件”选项卡的“打印”界面里选择；另存为管存盘，显示比例只管屏幕上看的大小，主题管的是配色样式。"},{"c":3,"n":29,"m":"M5","mn":"图文编辑（Word）","s":"当前活动窗口是文档d1.docx的窗口，单击该窗口的“最小化”按钮后____。","o":["不显示d1.docx文档内容，但d1.docx文档并未关闭","该窗口和d1.docx文档都被关闭","d1.docx文档未关闭，且继续显示其内容","关闭了d1.docx文档但该窗口并未关闭"],"a":"A","status":"OK","ex":"答案A。最小化只是把窗口收起来，文档仍处于打开状态，只是内容不再显示；关文档要执行“关闭”，最小化不等于关闭。"},{"c":3,"n":30,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，要选定表格的单元格，应该____。","o":["右击该单元格并在快捷菜单中操作","在“插入”选项卡的“插图”功能区中操作","双击该表格","在“开始”选项卡中的“样式”功能区中操作"],"a":"A","status":"OK","ex":"答案A。右击单元格弹出快捷菜单，里面有“选择”行、列、表格等操作；“插图”功能区管插入图片形状，“样式”功能区管格式样式，双击表格只是进入编辑状态。"},{"c":3,"n":31,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，可以显示页面四角的视图方式____。","o":["草稿视图方式","页面视图方式","大纲视图方式","各种视图方式"],"a":"B","status":"OK","ex":"答案B。页面视图按打印效果显示整页，页边距和页面四角都能看到；草稿、大纲视图只处理文字流，页眉页脚、页面四角这些纸面元素不显示。"},{"c":3,"n":32,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，要在文档中添加符号☆，第一步应该打开____。","o":["“文件”选项卡","“开始”选项卡","“格式”选项卡","“插入”选项卡"],"a":"D","status":"OK","ex":"答案D。特殊符号☆要通过“插入”选项卡的“符号”命令插入；“格式”选项卡在这个版本里根本不存在，文件、开始选项卡里也没有插符号的入口。","roast":"插符号去“插入”选项卡，名字都明示了还能选错？选项卡这名字是白取的。"},{"c":3,"n":33,"m":"M5","mn":"图文编辑（Word）","s":"进入Word的编辑状态后，进行中文与英文标点符号之间切换的快捷键是____。","o":["Shift+空格","Shift+Ctrl","Shift+.","Ctrl+."],"a":"D","status":"OK","ex":"答案D。Ctrl+句号（Ctrl+.）用于中文与英文标点符号之间的切换；Shift+空格切的是全角半角，Ctrl+Shift切的是输入法，Shift+.只是输入大于号，别混。","roast":"Ctrl+.切中英文标点、Shift+空格切全半角，背两句就白给的分，错了纯属没背书。"},{"c":3,"n":34,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，文档窗口显示出水平标尺，拖动水平标尺上沿的“首行缩进”滑块，则____。","o":["文档中各段落的首行起始位置都重新确定","文档中被选择的各段落首行起始位置都重新确定","文档中各行的起始位置都重新确定","插入点所在行的起始位置被重新确定"],"a":"B","status":"OK","ex":"答案B。拖动“首行缩进”滑块只影响被选定的各段落的首行起始位置；没有选定内容时才只作用于插入点所在段落，“文档中各段落”“各行”都夸大了作用范围。"},{"c":3,"n":35,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，打开了w1.docx文档，若要将经过编辑后的文档以“w2.docx”为名存盘，应当执\n行“文件”选项卡中的命令是____。","o":["保存","另存为HTML","另存为","版本"],"a":"C","status":"OK","ex":"答案C。换名字存盘就选“另存为”：原w1.docx保留不动，编辑后的内容以w2.docx存成新文件；“保存”只会覆盖原名，另存为HTML是存成网页格式，“版本”不干这事。"},{"c":3,"n":36,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，被编辑文档中的文字有“四号”、“五号”、“16”磅、“18”磅4种，下列关于\n所设定字号大小的比较中，正确的是____。","o":["“四号”大于“五号”","“四号”小于“五号”","“16”磅大于“18”磅","字的大小一样，字体不同"],"a":"A","status":"OK","ex":"答案A。中文字号的规则是号数越大字越小，所以“四号”大于“五号”；磅值正相反，16磅小于18磅，C恰好说反；中文字号和磅数是两套刻度，谈不上字一样大。"},{"c":3,"n":37,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，可以使插入点快速移到文档首部的组合键是____。","o":["Ctrl+Home","Alt+Home","Home","PageUp"],"a":"A","status":"OK","ex":"答案A。Ctrl+Home一步把插入点移到文档首部，Ctrl+End移到文档尾部；Home只回到本行行首，PageUp只是向上翻屏，都到不了文档头。","roast":"Ctrl+Home到头、Ctrl+End到尾，一对键背一次吃四年，这分都丢，键盘都替你臊。"},{"c":3,"n":38,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，打开了一个文档，进行“保存”操作后，该文档____。","o":["被保存在原文件夹下","可以保存在已有的其他文件夹下","可以保存在新建文件夹下","保存后文档被关闭"],"a":"A","status":"OK","ex":"答案A。对已打开的文档执行“保存”，内容直接写回原文件夹下的原文件，不弹对话框也不关闭文档；想换位置换名字存得用“另存为”。"},{"c":3,"n":39,"m":"M5","mn":"图文编辑（Word）","s":"在Word编辑状态，具有设定文档行间距命令的功能区是____。","o":["“字体”功能区","“样式”功能区","“段落”功能区","“插图”功能区"],"a":"C","status":"OK","ex":"答案C。行间距是段落格式，设定行距的命令在“开始”选项卡的“段落”功能区；“字体”区管字符，“插图”区管图片，“样式”区管样式集，都不管行距。"},{"c":3,"n":40,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，选择了文档全文，若在“段落”对话框中设置行距为20磅的格式，应当选\n择“行距”列表框中的____。","o":["单倍行距","1.5倍行距","固定值","多倍行距"],"a":"C","status":"OK","ex":"答案C。要设定固定的20磅行距，得在行距列表里选“固定值”再填磅数；单倍、1.5倍、多倍行距都是按字号倍数折算的，定不了精确磅数。"},{"c":3,"n":41,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，对当前文档中的文字进行“字数统计”操作，应当使用的功能区是____。","o":["“字体”功能区","“段落”功能区","“样式”功能区","“校对”功能区"],"a":"D","status":"OK","ex":"答案D。字数统计在“审阅”选项卡的“校对”功能区里；字体、段落、样式功能区都是排版格式工具，不做统计。"},{"c":3,"n":42,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，打开文档ABC，修改后另存为ABD，则文档ABC____。","o":["被文档ABD覆盖","被修改未关闭","被修改并关闭","未修改被关闭"],"a":"D","status":"OK","ex":"答案D。另存为ABD只是把修改结果写到新文件ABD，磁盘上的ABC一个字节没改，随后当前文档切换为ABD，ABC被关闭——所以是“未修改被关闭”。"},{"c":3,"n":43,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态中，给字母A加上标，如“A2”，应使用“开始”选项卡中的____。","o":["“字体”对话框","“段落”对话框","“更改样式”命令","“样式”对话框"],"a":"A","status":"OK","ex":"答案A。上标是字符格式，在“开始”选项卡打开“字体”对话框（或点字体功能区里的上标按钮）来设置；“段落”管段落格式，“样式”“更改样式”管样式，都做不了上标。"},{"c":3,"n":44,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态中，粘贴操作的组合键是____。","o":["Ctrl+A","Ctrl+C","Ctrl+V","Ctrl+X"],"a":"C","status":"OK","ex":"答案C。粘贴的组合键是Ctrl+V；Ctrl+C是复制，Ctrl+X是剪切，Ctrl+A是全选，一组四兄弟别背串了。","roast":"Ctrl+C复制、Ctrl+V粘贴，幼儿园机房的入门题，还错就把键盘掰下来背。"},{"c":3,"n":45,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态中，对已经输入的文档进行分栏操作，需要打开____。","o":["“文件”功能区","“视图”选项卡","“页面布局”选项卡","“插入”选项卡"],"a":"C","status":"OK","ex":"答案C。分栏命令在“页面布局”选项卡里，选定文字后点分栏选栏数即可；“文件”区是后台管理，“视图”区管显示方式，“插入”区管插入对象，都放不下分栏。"},{"c":3,"n":46,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态中，使插入点快速移动到文档尾的操作是____。","o":["PageUp","Alt+End","Ctrl+End","PageDown"],"a":"C","status":"OK","ex":"答案C。Ctrl+End把插入点直接移到文档尾部，Ctrl+Home移到文档头部；PageUp/PageDown只翻屏，Alt+End不是Word的移动文档尾组合键。","roast":"Ctrl+End跳文档尾，跟Ctrl+Home凑一对的送分键，这对都记不住，快捷键直接零分起步。"},{"c":3,"n":47,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态中，如果要输入希腊字母Ω，则操作命令所在的功能区是____。","o":["字体","符号","样式","段落"],"a":"B","status":"OK","ex":"答案B。希腊字母Ω这类特殊字符在“插入”选项卡的“符号”功能区里插入；字体功能区只改字符外观，得先把符号插进去才有得改。","roast":"找Ω去“符号”功能区，字都写在功能区名上了，错这题是没长眼。"},{"c":3,"n":48,"m":"M5","mn":"图文编辑（Word）","s":"在Word的编辑状态，设置了一个由多个行和列组成的空表格，将插入点定在某个单元格内，右击该单元格，\n在弹出的快捷菜单中移动鼠标至“选择”项，在弹出的列表中选定“行”项，同样操作再选定“列”项，\n则表格中被选择的部分是____。","o":["插入点所在的行","插入点所在的列","一个单元格","整个表格"],"a":"D","status":"OK","ex":"答案D。先通过“选择”选中插入点所在的行，再同样操作选中插入点所在的列，行列交叉覆盖整张表，所以最终被选中的是整个表格；选行、选列、选单元格都只是中间状态。"},{"c":3,"n":49,"m":"M5","mn":"图文编辑（Word）","s":"在Word中，如果要使文档内容横向打印，在“页面设置”中应选择的选项卡是____。","o":["文档网格","纸张","版式","页边距"],"a":"D","status":"OK","ex":"答案D。横向/纵向的纸张方向选项放在“页面设置”对话框的“页边距”选项卡里；文档网格管每页行列数，纸张选项卡管纸型尺寸，版式管节与页眉页脚等排版选项。"},{"c":3,"n":50,"m":"M5","mn":"图文编辑（Word）","s":"在Word编辑状态中，对已经输入的文档设置首字下沉，需要使用的是____。","o":["“剪贴板”功能区","“段落”功能区","“文本”功能区","“窗口”功能区"],"a":"C","status":"OK","ex":"答案C。首字下沉在“插入”选项卡的“文本”功能区里设置；它是针对段落首字符的特殊排版，跟剪贴板、段落、窗口功能区都不沾边。"},{"c":3,"n":51,"m":"M5","mn":"图文编辑（Word）","s":"在Word的文档中，选定文档某行内容后，使用鼠标拖动方法将其移动时，配合的键盘操作是____。","o":["单击“文件”选项卡中的“新建”命令","单击快速访问工具栏上的“快速打印”按钮命令","单击“开始”选项卡中的“粘贴”命令","单击“文件”选项卡中的“打印”命令 答案：CADCB CCBCD"],"a":"D","status":"OK","ex":"此题题干与选项明显不匹配：题干问拖动移动文本的键盘配合（拖动移动本身不需按键，按住Ctrl拖动是复制），而四个选项都是文档操作命令。按题库给定答案取D：“文件”选项卡中的“打印”命令可打开打印设置界面；A新建文档、C粘贴均与打印无关，B快速打印按钮会跳过设置直接送打印。"},{"c":4,"n":1,"m":"M6","mn":"电子表格（Excel）","s":"Excel2010中的电子工作表具有____。","o":["一维结构","二维结构","三维结构","树结构"],"a":"B","status":"OK","ex":"答案B。工作表由行、列两个方向交织构成，是典型的二维结构；“三维”是把整个工作簿的多张表叠起来才有的说法，树结构是文件夹式的层级，都不是单张工作表的形态。"},{"c":4,"n":2,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，日期数据的数据类型属于____。","o":["数字型","文字型","逻辑型","时间型"],"a":"A","status":"OK","ex":"答案A。Excel内部把日期按数字序列号存储，日期本质上是数字型，所以才能做加减运算；Excel的基本数据类型里并没有独立的“时间型”。"},{"c":4,"n":3,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010的电子工作表中建立的数据表，通常把每一行称为一个____。","o":["记录","字段","属性","关键字"],"a":"A","status":"OK","ex":"答案A。数据表中一行就是一条记录，对应一个完整对象的信息；列才叫字段或属性，关键字指能唯一标识记录的列，三者别混。"},{"c":4,"n":4,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010的电子工作表中建立的数据表，通常把每一列称为一个____。","o":["记录","元组","属性","关键字"],"a":"C","status":"OK","ex":"答案C。数据表的一列对应一个属性（也叫字段）；行是记录，元组是关系数据库里“行”的术语，关键字是能唯一区分记录的属性，B错在用 relational 的行术语冒充列。"},{"c":4,"n":5,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，按下Delete键将清除被选区域中所有单元格的____。","o":["内容","格式","批注","所有信息"],"a":"A","status":"OK","ex":"答案A。Delete键只清除内容，格式和批注原样保留；想连格式批注一起清得用“清除→全部清除”，D的“所有信息”是干扰。","roast":"Delete清内容、清除按钮管全套，背一下分工就白给的分，往外推是几个意思。"},{"c":4,"n":6,"m":"M6","mn":"电子表格（Excel）","s":"Excel2010的每个工作表中，最小操作单元是____。","o":["单元格","一行","一列","一张表"],"a":"A","status":"OK","ex":"答案A。单元格是工作表中能编辑、存储数据的最小操作单元；行、列、整表都是单元格的集合，层次更大。","roast":"最小单元=单元格，这题都错，老娘建议把课本吃了再谈考Excel。"},{"c":4,"n":7,"m":"M6","mn":"电子表格（Excel）","s":"在具有常规格式的单元格中输入数值后，其显示方式是____。","o":["左对齐","右对齐","居中","随机"],"a":"B","status":"OK","ex":"答案B。常规格式下数值默认右对齐，文本默认左对齐，逻辑值居中，这是Excel固定的显示规矩。"},{"c":4,"n":8,"m":"M6","mn":"电子表格（Excel）","s":"在具有常规格式的单元格中输入文本后，其显示方式是____。","o":["左对齐","右对齐","居中","随机"],"a":"A","status":"OK","ex":"答案A。文本默认左对齐，与数值的右对齐正好相反，逻辑值（TRUE/FALSE）才是居中显示。"},{"c":4,"n":9,"m":"M6","mn":"电子表格（Excel）","s":"对电子工作表中所选择的区域不能够进行操作的是____。","o":["调整行高尺寸","调整列宽尺寸","修改条件格式","保存文档"],"a":"D","status":"OK","ex":"答案D。调整行高、列宽和修改条件格式都是针对选中区域进行的操作，而“保存文档”作用于整个文件，与选了哪块区域无关。"},{"c":4,"n":10,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010的页面设置中，不能够设置____。","o":["页面","每页字数","页边距","页眉/页脚"],"a":"B","status":"OK","ex":"答案B。页面设置里能设页面方向、页边距、页眉/页脚等，根本没有“每页字数”这一项，字数统计是另外的功能。"},{"c":4,"n":11,"m":"M6","mn":"电子表格（Excel）","s":"在一个单元格引用的行地址或列地址前，若表示为绝对地址则添加的字符是____。","o":["@","#","$","%"],"a":"C","status":"OK","ex":"答案C。行号或列标前加$即表示该部分为绝对引用，如$D$25、$D2；@、#、%在单元格地址里没有这种用途。","roast":"一个$符号的事都能错，老娘建议你把键盘供起来天天拜。"},{"c":4,"n":12,"m":"M6","mn":"电子表格（Excel）","s":"在一个单元格的三维地址中，工作表名与列标之间的字符为____。","o":["！","#","$","%"],"a":"A","status":"OK","ex":"答案A。跨表引用写作“工作表名!单元格地址”，如Sheet1!B2，感叹号！就是工作表名与列标之间的分隔符。","roast":"Sheet1!A1天天见，这个符号都记不住就别怪分数不认你。"},{"c":4,"n":13,"m":"M6","mn":"电子表格（Excel）","s":"假定一个单元格的地址为$D$25，则此地址的表示方式是____。","o":["相对地址","绝对地址","混合地址","三维地址"],"a":"B","status":"OK","ex":"答案B。$D$25的行和列前都带$，是完全绝对地址；混合地址是行列只有一边带$，如$D2。"},{"c":4,"n":14,"m":"M6","mn":"电子表格（Excel）","s":"假定一个单元格的地址为$D2，则此地址的表示方式是____。","o":["相对地址","绝对地址","混合地址","三维地址"],"a":"C","status":"OK","ex":"答案C。$D2只有列标前带$、行号前没有，属于典型的混合地址；两边全带$才是绝对地址。"},{"c":4,"n":15,"m":"M6","mn":"电子表格（Excel）","s":"在向一个单元格输入公式或函数时，其前导字符必须是____。","o":["=",">","<","%"],"a":"A","status":"OK","ex":"答案A。Excel规定公式必须以等号=开头，后面才能写函数和运算式；没有=，输入内容只会被当成普通文本或数值。","roast":"公式开头打等号，这是Excel的ABC，错这题老娘都替你臊得慌。"},{"c":4,"n":16,"m":"M6","mn":"电子表格（Excel）","s":"假定单元格D3中保存的公式为=B3+C3，若把它移动到E4中，则E4中保存的公式为____。","o":["=B3+C3","=C3+D3","=B4+C4","=C4+D4"],"a":"A","status":"OK","ex":"答案A。移动公式只是把公式原样搬到新位置，内容不变、引用不调整；只有复制才会按新位置平移相对引用。"},{"c":4,"n":17,"m":"M6","mn":"电子表格（Excel）","s":"假定单元格D3中保存的公式为=B3+C3，若把它复制到E4中，则E4中保存的公式为____。","o":["=B3+C3","=C3+D3","=B4+C4","=C4+D4"],"a":"D","status":"OK","ex":"答案D。复制时相对引用随目标平移：从D3到E4右移一列、下移一行，B3+C3相应变为C4+D4；若是移动则公式原样保留（即A）。"},{"c":4,"n":18,"m":"M6","mn":"电子表格（Excel）","s":"假定一个单元格所存入的公式为=13*2+7，则当该单元格处于非编辑状态时显示的内容为____。","o":["13*2+7","=13*2+7","33","=33"],"a":"C","status":"OK","ex":"答案C。非编辑状态下单元格显示公式的计算结果33；编辑状态下才看得见=13*2+7，且结果前不会再挂等号。"},{"c":4,"n":19,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中求一组数值的最大值函数为____。","o":["AVERAGE","MAX","MIN","SUM"],"a":"B","status":"OK","ex":"答案B。MAX求最大值，MIN求最小值，AVERAGE求平均，SUM求和，四个函数各管一摊，别对号入座错了。","roast":"MAX和MIN都分不清，这分数白给的白给，收好不谢。"},{"c":4,"n":20,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中求一组数值的平均值函数为____。","o":["AVERAGE","MAX","MIN","SUM"],"a":"A","status":"OK","ex":"答案A。AVERAGE就是求平均值，词根average本身就是“平均”；SUM求和，MAX/MIN取最大最小。","roast":"average是平均这种初中单词都不认识？这题答错老娘无话可说。"},{"c":4,"n":21,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，对数据表进行排序时，在“排序”对话框中能够指定的排序关键字个数限制为____。","o":["1个","2个","3个","任意"],"a":"D","status":"OK","ex":"答案D。Excel2010的排序对话框可以点“添加条件”不断追加排序关键字，没有个数上限；“最多3个”是老版本Excel的限制。"},{"c":4,"n":22,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010的自动筛选中，每个标题上的下三角按钮都对应着一个____。","o":["下拉菜单","对话框","窗口","工具栏"],"a":"A","status":"OK","ex":"答案A。自动筛选后每个标题单元格出现下三角按钮，点开是一个下拉列表菜单，在其中勾选筛选值或设自定义条件。"},{"c":4,"n":23,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010的高级筛选中，条件区域中同一行的条件是____。","o":["或的关系","与的关系","非的关系","异或的关系"],"a":"B","status":"OK","ex":"答案B。高级筛选条件区域中同一行的多个条件是“与”关系，必须同时满足；不同行才是“或”关系。"},{"c":4,"n":24,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010的高级筛选中，条件区域中不同行的条件是____。","o":["或的关系","与的关系","非的关系","异或的关系"],"a":"A","status":"OK","ex":"答案A。条件区域中不同行的条件是“或”关系，满足任一即可被筛出；同一行是“与”，这两句口诀记反就全军覆没。"},{"c":4,"n":25,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010的图表中，能反映出数据变化趋势的图表类型是____。","o":["柱形图","折线图","饼图","气泡图"],"a":"B","status":"OK","ex":"答案B。折线图用线段连接各期数据点，最能体现数据随时间的变化趋势；柱形图重在各期数量比较，饼图重在构成占比。","roast":"看趋势用折线，看图说话级别的常识，连这都错老娘嘴上不留情了。"},{"c":4,"n":26,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010的图表中，水平X轴通常用来作为____。","o":["排序轴","分类轴","数值轴","时间轴"],"a":"B","status":"OK","ex":"答案B。图表的水平X轴是分类轴，用来摆放类别名称；数值轴通常在纵轴Y方向上。","roast":"X轴放分类、Y轴放数值，纯背书题，背了就分到手。"},{"c":4,"n":27,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，编辑图表时，图表工具下的三个选项卡不包括____。","o":["设计","布局","编辑","格式"],"a":"C","status":"OK","ex":"答案C。选中图表后出现图表工具，包含设计、布局、格式三个选项卡，没有叫“编辑”的选项卡。"},{"c":4,"n":28,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，图表工具下包含的选项卡个数为____。","o":["1","2","3","4"],"a":"C","status":"OK","ex":"答案C。图表工具下就是设计、布局、格式共三个选项卡，与上一题的考点一体两面。"},{"c":4,"n":29,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，从工作表中删除所选定的一列，则需要使用“开始”选项卡中的____。","o":["“删除”按钮","“清除”按钮","“剪切”按钮","“复制”按钮"],"a":"A","status":"OK","ex":"答案A。删除列要用“删除”按钮，整列从表中拿掉、右侧列前移；“清除”只清内容或格式，列本身还在。"},{"c":4,"n":30,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010的电子工作表中，若要清除所选区域内的信息时，则需要使用“开始”选项卡中的____。","o":["“删除”按钮","“清除”按钮","“剪切”按钮","“复制”按钮"],"a":"B","status":"OK","ex":"答案B。清除所选区域的信息用“清除”按钮，可分别选清内容、格式或批注；“删除”会把整个单元格或行列拿掉并移动周边数据，动作大得多。"},{"c":4,"n":31,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，如果只需要删除所选区域的内容，则应执行的操作是____。","o":["“清除”→“清除批注”","“清除”→“全部清除”","“清除”→“清除内容”","“清除”→“清除格式”"],"a":"C","status":"OK","ex":"答案C。“清除→清除内容”只删数据，格式和批注保留；“全部清除”连格式带批注一起清，超出“只需要删内容”的题意。"},{"c":4,"n":32,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，利用“查找和替换”对话框____。","o":["只能做替换","只能做查找","既能做查找又能做替换","只能做一次查找或替换"],"a":"C","status":"OK","ex":"答案C。“查找和替换”对话框有两个选项卡，查找、替换都能做，还支持全部替换和逐个替换，D的“只能一次”纯属瞎编。"},{"c":4,"n":33,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010的工作表中，____。","o":["行和列都不可以被隐藏","只能隐藏行","只能隐藏列","行和列都可以被隐藏"],"a":"D","status":"OK","ex":"答案D。行和列都能隐藏：右键行号或列标选“隐藏”即可，之后也能用“取消隐藏”恢复，A/B/C都把话说死了。"},{"c":4,"n":34,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，若要选择一个工作表的所有单元格，则应单击____。","o":["表标签","列标行与行号列相交的单元格","左下角单元格","右上角单元格"],"a":"B","status":"OK","ex":"答案B。单击列标行与行号列相交处的全选按钮（列标A左侧、行号1上方的方块）即选中整表所有单元格；表标签是用来切换不同工作表的。"},{"c":4,"n":35,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，右击一个工作表的标签不能够进行____。","o":["插入一个工作表","删除一个工作表","重命名一个工作表","打印一个工作表"],"a":"D","status":"OK","ex":"答案D。右击工作表标签弹出的菜单有插入、删除、重命名、移动或复制等命令，但没有“打印”一项，打印要走文件菜单。"},{"c":4,"n":36,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，若需要删除一个工作表，则应右键单击它的表标签，从所弹出的菜单列表中选择____。","o":["“重命名”菜单项","“插入”菜单项","“删除”菜单项","“工作表标签颜色”菜单项"],"a":"C","status":"OK","ex":"答案C。右键表标签选“删除”即删掉整张工作表且无法撤销；重命名、插入、标签颜色都在同一菜单里，但都干不了删表这件事。"},{"c":4,"n":37,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，“页眉/页脚”的设置属于____。","o":["“单元格格式”对话框","“打印”对话框","“插入函数”对话框","“页面设置”对话框"],"a":"D","status":"OK","ex":"答案D。页眉/页脚属于“页面设置”对话框（页面布局选项卡→页面设置组），单元格格式管单元格外观，打印对话框管打印执行。"},{"c":4,"n":38,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，假定一个单元格的地址表示为$D25，则该单元格的行地址为____。","o":["D","25","30","45"],"a":"B","status":"OK","ex":"答案B。$D25中D是列标（其前的$表示列绝对），25是行号，所以行地址就是25。"},{"c":4,"n":39,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，单元格引用G12的绝对地址表示为____。","o":["G12","G$12","$G12","$G$12"],"a":"D","status":"OK","ex":"答案D。绝对引用要求行列前都加$，G12写成$G$12；$G12或G$12都只是混合引用，G12仍是相对引用。"},{"c":4,"n":40,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，单元格F22的混合地址表示为____。","o":["$F$22","22#F","$F22","F22"],"a":"C","status":"OK","ex":"答案C。混合地址是行列只有一边带$，$F22表示列绝对、行相对；$F$22是绝对地址，F22是相对地址。"},{"c":4,"n":41,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，假定一个单元格的引用为M$18，则该单元格的行地址表示属于____。","o":["相对引用","绝对引用","混合引用","二维地址引用"],"a":"B","status":"OK","ex":"答案B。M$18整条引用虽是混合引用，但题问的是行地址部分——行号18前带$，行地址属于绝对引用；列标M没带$才是相对的那部分。"},{"c":4,"n":42,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，单元格引用的列标前加上字符$，而行号前不加字符$，这属于____。","o":["相对引用","绝对引用","混合引用","任意引用"],"a":"C","status":"OK","ex":"答案C。列标前带$、行号前不带（如$A1），正是混合引用的定义；全带$是绝对引用，全不带是相对引用。"},{"c":4,"n":43,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，若要表示“数据表1”上的B2到G8的整个单元格区域，则应书写为____。","o":["数据表1#B2:G8","数据表1$B2:G8","数据表1!B2:G8","数据表1:B2:G8"],"a":"C","status":"OK","ex":"答案C。跨表引用区域写作“工作表名!区域”，即数据表1!B2:G8；#、$都不是工作表名与区域的分隔符。"},{"c":4,"n":44,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，若要表示当前工作表中B2到F6的整个单元格区域，则应书写为____。","o":["B2.F6","B2:F6","B2,F6","B2-F6"],"a":"B","status":"OK","ex":"答案B。同一张表中连续矩形区域用冒号连接首尾单元格，B2:F6即从B2到F6的整块区域；逗号是联合多个不连续引用，点和减号不是区域符。"},{"c":4,"n":45,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，已知工作表中C3和D3单元格的值分别为2和5，E3单元格中的计算公式为=C3+D3，\n则E3单元格的值为____。","o":["2","5","7","3"],"a":"C","status":"OK","ex":"答案C。E3的公式=C3+D3把两格数值相加，2+5=7，其余选项不对应任何计算结果。"},{"c":4,"n":46,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010的一个工作表上的某一个单元格中，若要输入计算公式2008-4-5，则正确的输入为____。","o":["2008-4-5","=2008-4-5","’2008-4-5","”2008-4-5”"],"a":"B","status":"OK","ex":"答案B。直接输入2008-4-5会被Excel识别为日期2008年4月5日；前面加=才按算式计算得1999，前缀'是强制按文本存，加引号也是文本。"},{"c":4,"n":47,"m":"M6","mn":"电子表格（Excel）","s":"在Excel2010中，若首先在单元格C2中输入的一个计算公式为=B$2，接着拖曳此单元格填充C3:C8，\n则在C8单元格中得到的公式为____。","o":["面积图","柱形图","折线图","饼图 答案：BDACD  BABDA"],"a":"C","status":"OK","ex":"此题题干考查混合引用的填充规律：=B$2中行号带$为绝对、列标相对，向下填充时行号锁死、列标不变，C8中得到的公式仍为=B$2；本批选项疑似录入串题（显示为图表类型并混入答案串），解析按知识点如实给出，答案依原批次记为C。"},{"c":1,"n":1,"m":"M1","mn":"计算机基础","s":"自计算机问世至今已经经历了4个时代，划分时代的主要依据是计算机的____。","o":["规模","功能","性能","构成元件"],"a":"D","status":"OK","ex":"答案D。四个时代分别对应电子管、晶体管、中小规模集成电路、大规模/超大规模集成电路，分代依据就是构成元件；规模、功能、性能只是元件更替带来的结果，不是划分标准。","roast":"换时代就是换零件，这都不背，老娘都替你的计算机史着急。"},{"c":1,"n":2,"m":"M1","mn":"计算机基础","s":"一般认为，世界上第一台电子数字计算机诞生于____。","o":["1946年","1952年","1959年","1962年"],"a":"A","status":"OK","ex":"答案A。世界上第一台电子数字计算机ENIAC于1946年在美国诞生，其余年份都晚于它。","roast":"1946年，课本第一页就写着，答错等于书白买。"},{"c":1,"n":3,"m":"M1","mn":"计算机基础","s":"世界上第一台电子数字计算机采用的电子器件是____。","o":["大规模集成电路","集成电路","晶体管","电子管"],"a":"D","status":"OK","ex":"答案D。ENIAC采用的电子器件是电子管；晶体管是第二代，集成电路是第三代，大规模集成电路属第四代，全排在它后面。","roast":"第一代配电子管，跟1+1=2一样白给，接不住回去把课本吃了。"},{"c":1,"n":4,"m":"M1","mn":"计算机基础","s":"第一代计算机体积大、耗电多、性能低，其主要原因是受制于____。","o":["工艺水平","元器件","设计水平","原材料"],"a":"B","status":"OK","ex":"答案B。第一代计算机用电子管，电子管本身体积大、发热高、寿命短，才导致整机体积大耗电多；工艺、设计、原材料是次要因素，根源在元器件。"},{"c":1,"n":5,"m":"M1","mn":"计算机基础","s":"第二代电子计算机的主要元件是____。","o":["继电器","晶体管","电子管","集成电路"],"a":"B","status":"OK","ex":"答案B。第二代计算机用晶体管取代电子管；电子管属第一代，集成电路要到第三代才登场。","roast":"一代管、二代晶体管，这口诀不背，老娘也没法救你。"},{"c":1,"n":6,"m":"M1","mn":"计算机基础","s":"以集成电路为基本元件的第三代计算机出现的时间为____。","o":["1965-1970","1964-1975","1960-1969","1950-1970"],"a":"A","status":"OK","ex":"答案A。第三代计算机以中小规模集成电路为元件，通常划为1965—1970年；其余区间都不对应这个分代。"},{"c":1,"n":7,"m":"M1","mn":"计算机基础","s":"第三代计算机采用的主要电子器件为____。","o":["电子管","小规模集成电路","大规模集成电路","晶体管"],"a":"B","status":"OK","ex":"答案B。第三代采用中小规模集成电路；电子管、晶体管分别是第一、二代，大规模集成电路是第四代的特征。"},{"c":1,"n":8,"m":"M1","mn":"计算机基础","s":"采用超大规模集成电路的计算机是计算机发展中的____。","o":["第4代","第3代","第2代","第1代"],"a":"A","status":"OK","ex":"答案A。第四代计算机以大规模和超大规模集成电路为逻辑元件，其余各代都不是。","roast":"超大规模四个字都摆在那儿了还选错，老娘服了。"},{"c":1,"n":9,"m":"M1","mn":"计算机基础","s":"当前的计算机一般被认为是第四代计算机，它所采用的逻辑元件是____。","o":["晶体管","集成电路","电子管","大规模集成电路"],"a":"D","status":"OK","ex":"答案D。当前第四代计算机采用大规模（及超大规模）集成电路作逻辑元件；笼统的集成电路对应第三代，晶体管、电子管更早。"},{"c":1,"n":10,"m":"M1","mn":"计算机基础","s":"Intel公司使用LSI率先推出微处理器4004，宣布第四代计算机问世是在____。","o":["1946年","1958年","1965年","1971年"],"a":"D","status":"OK","ex":"答案D。1971年Intel用LSI技术率先推出微处理器4004，标志第四代计算机问世；1946、1958、1965大致是第一、二、三代的起始年份。"},{"c":1,"n":11,"m":"M1","mn":"计算机基础","s":"计算机可分为数字计算机、模拟计算机和混合计算机，这种分类的依据是计算机的____。","o":["功能和价格","性能和规律","处理数据的方式","使用范围"],"a":"C","status":"OK","ex":"答案C。数字计算机处理离散数字量，模拟计算机处理连续模拟量，混合计算机两者兼有，分类依据是处理数据的方式；与价格、使用范围无关。"},{"c":1,"n":12,"m":"M1","mn":"计算机基础","s":"电子计算机按使用范围分类，可以分为____。","o":["电子数字计算机和电子模拟计算机","科学与过程计算计算机、工业控制计算机和数据计算机","通用计算机和专用计算机","巨型计算机、大中型机、小型计算机和微型计算机"],"a":"C","status":"OK","ex":"答案C。按使用范围分为通用计算机和专用计算机；A是按处理数据方式的分类，D是按规模的分类。"},{"c":1,"n":13,"m":"M1","mn":"计算机基础","s":"某型计算机峰值性能为数千亿次/秒，主要用于大型科学与工程计算和大规模数据处理，它属于____。","o":["巨型计算机","小型计算机","微型计算机","专用计算机"],"a":"A","status":"OK","ex":"答案A。峰值达数千亿次/秒、面向大型科学与工程计算和大规模数据处理的机器属于巨型计算机；小型机、微型机性能差几个量级，专用机是按用途而非性能归类的。"},{"c":1,"n":14,"m":"M1","mn":"计算机基础","s":"电子计算机按规模划分，可以分为____。","o":["数字电子计算机和模拟电子计算机","通用计算机和专用计算机","科学与过程计算计算机、工业控制计算机和数据计算机","巨型计算机、大中型机、小型计算机和微型计算机"],"a":"D","status":"OK","ex":"答案D。按规模分为巨型机、大中型机、小型机和微型机；A按处理数据方式、B按使用范围、C是按用途领域的分法。"},{"c":1,"n":15,"m":"M1","mn":"计算机基础","s":"个人计算机属于____。","o":["微型计算机","小型计算机","中型计算机","小巨型计算机"],"a":"A","status":"OK","ex":"答案A。PC（个人计算机）属于微型计算机；它比小型机、中型机规模更小，小巨型机是另一类高性价比产品，不指PC。"},{"c":1,"n":16,"m":"M1","mn":"计算机基础","s":"既可以接收、处理和输出模拟量，也可以接收、处理和输出数字量的是____。","o":["电子数字计算机","电子模拟计算机","数模混合计算机","通用计算机"],"a":"C","status":"OK","ex":"答案C。数模混合计算机既能接收处理输出模拟量，也能处理数字量；数字机只处理数字量，模拟机只处理模拟量，通用机是按使用范围分的类。"},{"c":1,"n":17,"m":"M1","mn":"计算机基础","s":"下列关于通用计算机的描述中，不正确的是____。","o":["用于解决不同类型问题而设计","用途广泛","是一种用途广泛、结构复杂的计算机","只可进行科学计算"],"a":"D","status":"OK","ex":"答案D。通用计算机的定位正是用途广泛、面向不同类型问题设计，只可进行科学计算与通用性直接矛盾；A、B、C都是对通用机的正确描述。"},{"c":1,"n":18,"m":"M1","mn":"计算机基础","s":"下列关于专用计算机的描述中，不正确的是____。","o":["用途广泛","针对性强、效率高","结构相对简单","为某种特定目的而设计"],"a":"A","status":"OK","ex":"答案A。专用机为某种特定目的设计，针对性强、效率高而结构相对简单，恰恰不是用途广泛；B、C、D都是对专用机的正确描述。"},{"c":1,"n":19,"m":"M1","mn":"计算机基础","s":"电子数字计算机的运算对象是____。","o":["模拟量","混合量","脉冲","不连续量"],"a":"D","status":"OK","ex":"答案D。电子数字计算机的运算对象是离散的、不连续的量（数字量）；模拟量是模拟计算机的对象，脉冲只是信号形式，混合量不对应数字机。"},{"c":1,"n":20,"m":"M1","mn":"计算机基础","s":"将计算机分为巨型计算机、微型计算机和工作站的分类标准是____。","o":["计算机处理数据的方式","计算机的使用范围","计算机的规模和处理能力","计算机出现的时间"],"a":"C","status":"OK","ex":"答案C。巨型机、微型机、工作站是按计算机的规模和处理能力划分的；按处理数据方式分是数字/模拟/混合，按使用范围分是通用/专用。"},{"c":1,"n":21,"m":"M1","mn":"计算机基础","s":"以下不属于电子数字计算机特点的是____。","o":["运算快速","计算精度高","形状粗笨","通用性强"],"a":"C","status":"OK","ex":"答案C。电子数字计算机的特点是运算快、精度高、有记忆和逻辑判断、通用性强；形状粗笨是早期电子管机器的外观印象，不是计算机的特点。"},{"c":1,"n":22,"m":"M1","mn":"计算机基础","s":"计算机可以进行自动处理的基础是____。","o":["存储程序","快速运算","能进行逻辑判断","计算精度高"],"a":"A","status":"OK","ex":"答案A。计算机能自动连续工作的基础是存储程序：程序和数据预先存入内存，机器按地址自动逐条执行；快速运算、逻辑判断、精度高都是特性而非自动处理的前提。"},{"c":1,"n":23,"m":"M1","mn":"计算机基础","s":"计算机进行数值计算时的高精确度主要决定于____。","o":["计算速度","内存容量","外存容量","基本字长"],"a":"D","status":"OK","ex":"答案D。数值计算的高精确度主要由基本字长决定，字长越长可表示的二进制位数越多、精度越高；速度和内外存容量与精度无直接关系。"},{"c":1,"n":24,"m":"M1","mn":"计算机基础","s":"计算机具有逻辑判断能力，主要取决于____。","o":["硬件","体积","编制的软件","基本字长"],"a":"C","status":"OK","ex":"答案C。计算机的逻辑判断能力来自人们编制的软件（程序），程序安排的逻辑运算和分支使机器能判断；硬件只提供执行平台，体积、字长与判断能力无关。"},{"c":1,"n":25,"m":"M1","mn":"计算机基础","s":"计算机的通用性使其可以求解不同的算术和逻辑问题，这主要取决于计算机的____。","o":["高速运算","指令系统","可编程性","存储功能"],"a":"C","status":"OK","ex":"答案C。可编程性使同一台机器装入不同程序就能求解不同的算术和逻辑问题，这是通用性的根源；指令系统、高速运算、存储功能只是支撑手段。"},{"c":1,"n":26,"m":"M1","mn":"计算机基础","s":"计算机具有很强的记忆能力的基础是____。","o":["大容量存储装置","自动编程","编辑判断能力","通用性强"],"a":"A","status":"OK","ex":"答案A。计算机的记忆能力建立在容量足够大的存储装置上，靠它保存程序和数据；自动编程、通用性与记忆无关，编辑判断能力属干扰说法。"},{"c":1,"n":27,"m":"M1","mn":"计算机基础","s":"计算机的主要特点是具有运算速度快、精度高和____。","o":["用十进制数记数","自动编程","无须记忆","存储记忆"],"a":"D","status":"OK","ex":"答案D。计算机的主要特点是运算速度快、计算精度高、具有存储记忆能力；计算机内部用二进制记数而非十进制，自动编程更谈不上是它的特点。"},{"c":1,"n":28,"m":"M1","mn":"计算机基础","s":"计算机的“逻辑判断能力”是指____。","o":["计算机拥有很大的存储装置","计算机是由程序规定其操作过程","计算机的运算速度很高，远远高于人的计算机速度","计算机能够进行逻辑运算，并根据逻辑运算的结果选择相应的处理"],"a":"D","status":"OK","ex":"答案D。逻辑判断能力指计算机能进行逻辑运算，并根据运算结果选择相应的处理；A说的是存储，B说的是程序控制过程，C说的是速度，都不是逻辑判断。"},{"c":1,"n":29,"m":"M1","mn":"计算机基础","s":"计算机的通用性表现在____。","o":["由于计算机的可编程性，计算机能够在各行各业得到广泛的应用","计算机是由程序规定其操作过程","计算机的运算速度很高，远远高于人的计算速度","计算机能够进行逻辑运算，并根据逻辑运算的结果选择相应的处理"],"a":"A","status":"OK","ex":"答案A。通用性表现为凭借可编程性，同一台计算机能在各行各业得到广泛应用；B是程序控制，C是速度，D是逻辑判断，均非通用性的表现。"},{"c":1,"n":30,"m":"M1","mn":"计算机基础","s":"“同一台计算机，只要安装不同的软件或连接到不同的设备上，就可以完成不同的任务”是指计算机具有__。","o":["高速运算的能力","极强的通用性","逻辑判断能力","很强的记忆能力"],"a":"B","status":"OK","ex":"答案B。同一台机器换软件、连不同设备就能完成不同任务，说的正是计算机极强的通用性；高速运算、逻辑判断、记忆能力都与题意无关。"},{"c":1,"n":31,"m":"M1","mn":"计算机基础","s":"当前计算机的应用领域极为广泛，但其应用最早的领域是____。","o":["数据处理","科学计算","人工智能","过程控制"],"a":"B","status":"OK","ex":"答案B。计算机应用最早的领域是科学计算（数值计算）；数据处理、过程控制、人工智能都是后来陆续发展起来的领域。"},{"c":1,"n":32,"m":"M1","mn":"计算机基础","s":"最早设计计算机的目的是进行科学计算，其主要计算的问题面向于____。","o":["科研","军事","商业","管理"],"a":"B","status":"OK","ex":"答案B。第一台电子计算机是为计算炮弹弹道设计的，最初面向军事需求；科研、商业、管理都是后来的应用方向。"},{"c":1,"n":33,"m":"M1","mn":"计算机基础","s":"计算机应用中最诱人、也是难度最大且目前研究最活跃的领域之一是____。","o":["人工智能","信息处理","过程控制","辅助设计"],"a":"A","status":"OK","ex":"答案A。人工智能是让计算机模仿人的高级思维活动的领域，公认最诱人、难度最大且研究最活跃；信息处理、过程控制、辅助设计相对成熟。"},{"c":1,"n":34,"m":"M1","mn":"计算机基础","s":"当前气象预报已广泛采用数值预报方法，这种预报方法会涉及计算机应用中的____。","o":["科学计算和数据处理","科学计算和辅助设计","科学计算和过程控制","数据处理和辅助设计"],"a":"A","status":"OK","ex":"答案A。数值预报要解气象方程做大规模数值计算（科学计算），又要处理海量气象观测资料（数据处理）；辅助设计与预报无关，过程控制不占主体。"},{"c":1,"n":35,"m":"M1","mn":"计算机基础","s":"利用计算机对指纹进行识别、对图像和声音进行处理所属的应用领域是____。","o":["科学计算","自动控制","辅助设计","信息处理"],"a":"D","status":"OK","ex":"答案D。指纹识别、图像和声音处理都是对信息进行采集、加工和分析，属信息处理领域；它们既不是科学计算，也不是自动控制或辅助设计。"},{"c":1,"n":36,"m":"M1","mn":"计算机基础","s":"计算机最主要的工作特点是____。","o":["存储程序与自动控制","高速度与高精度","可靠性与可用性","有记忆能力"],"a":"A","status":"OK","ex":"答案A。计算机最主要的工作特点是存储程序与自动控制，这也是冯·诺依曼体制的核心；高速度高精度、可靠性、记忆能力都是重要特点但不是最根本的。"},{"c":1,"n":37,"m":"M1","mn":"计算机基础","s":"用来表示计算机辅助设计的英文缩写是____。","o":["CAI","CAM","CAD","CAT"],"a":"C","status":"OK","ex":"答案C。CAD即Computer Aided Design（计算机辅助设计）；CAI是辅助教学，CAM是辅助制造，CAT是辅助测试。","roast":"CAD三个字母白送的，接不住就把英语和课本一起吃了。"},{"c":1,"n":38,"m":"M1","mn":"计算机基础","s":"利用计算机来模仿人的高级思维活动称为____。","o":["数据处理","自动控制","计算机辅助系统","人工智能"],"a":"D","status":"OK","ex":"答案D。利用计算机模仿人的高级思维活动称为人工智能；数据处理是信息加工，自动控制是对生产过程的控制，辅助系统是CAD/CAM一类。"},{"c":1,"n":39,"m":"M1","mn":"计算机基础","s":"计算机网络的目标是实现____。","o":["数据处理","文献检索","资源共享和信息传输","信息传输"],"a":"C","status":"OK","ex":"答案C。计算机网络的目标是实现资源共享和信息传输；只提信息传输漏掉资源共享，数据处理、文献检索只是网络上的应用。"},{"c":1,"n":40,"m":"M1","mn":"计算机基础","s":"下列四项中，不属于多媒体所包括的媒体类型的是____。","o":["X光","图像","音频","视频"],"a":"A","status":"OK","ex":"答案A。多媒体通常包括文本、图形图像、音频、视频、动画等媒体类型；X光是射线，不属于多媒体的媒体类型。"},{"c":1,"n":41,"m":"M1","mn":"计算机基础","s":"信息实际上指_____。","o":["基本素材","非数值数据","数值数据","处理后的数据"],"a":"D","status":"OK","ex":"答案D。信息是数据经过加工处理后得到的有意义的内容，即处理后的数据；基本素材指原始数据，数值与非数值只是数据的类别。"},{"c":1,"n":42,"m":"M1","mn":"计算机基础","s":"在计算机领域，信息是____。","o":["客观事物属性的表示","未经处理的数据","一种连续变化的模拟量","由客观事物得到的、使人们能够认知客观事物的各种消息、情报、数字、信号等所包括的内容"],"a":"D","status":"OK","ex":"答案D。信息指由客观事物得到的、使人们能够认知客观事物的各种消息、情报、数字、信号等所包含的内容；A是数据的定义，B、C与信息的概念不符。"},{"c":1,"n":43,"m":"M1","mn":"计算机基础","s":"在计算机领域，数据是____。","o":["客观事物属性的表示","实际存在的数字","一种连续变化的模拟量","由客观事物得到的、使人们能够认知客观事物的各种消息、情报、数字、信号等所包括的内容"],"a":"A","status":"OK","ex":"答案A。在计算机领域，数据是客观事物属性的表示，是信息的载体；D描述的是信息的内容，B、C都不是数据的规范定义。"},{"c":1,"n":44,"m":"M1","mn":"计算机基础","s":"在计算机领域，信息经过转化而成为计算机能够处理的____。","o":["数据","数值","模拟量","字符"],"a":"A","status":"OK","ex":"答案A。信息只有转化为数据（编码成计算机能处理的形式）后才能被计算机处理；数值、字符只是数据的具体形式，模拟量也要先转换成数据。"},{"c":1,"n":45,"m":"M1","mn":"计算机基础","s":"在计算机领域，客观事物的属性表示为____。","o":["数据","数值","模拟量","信息"],"a":"A","status":"OK","ex":"答案A。在计算机领域，客观事物的属性用数据来表示，数据是信息的具体形式；信息是数据所承载的内容，两者不能倒置。"},{"c":1,"n":46,"m":"M1","mn":"计算机基础","s":"在计算机领域，未经处理的数据只是____。","o":["基本素材","非数值数据","数值数据","处理后的数据"],"a":"A","status":"OK","ex":"答案A。未经处理的数据只是记录客观事物属性的基本素材，经加工后才成为信息；B、C是数据的类型，D是加工后的结果。"},{"c":1,"n":47,"m":"M1","mn":"计算机基础","s":"下列不属于信息的是____。","o":["报上登载举办商品展销的消息","电视中计算机产品广告","计算机","各班各科成绩"],"a":"C","status":"OK","ex":"答案C。展销消息、产品广告、各班成绩都是数据表达出的信息；计算机是一台设备，本身不属于信息。"},{"c":1,"n":48,"m":"M1","mn":"计算机基础","s":"数据是信息的载体，它的不同形式有数值、文字、语言、图形和____。","o":["多媒体","表达式","函数","图像"],"a":"D","status":"OK","ex":"答案D。数据的表现形式有数值、文字、语言、图形、图像等；多媒体是多种媒体的统称而非一种数据形式，表达式和函数也不在这组列举里。"},{"c":1,"n":49,"m":"M1","mn":"计算机基础","s":"对于信息，下列说法错误的是____。","o":["信息是可以处理的","信息是可以传播的","信息是可以共享的","信息可以不依附于某种载体而存在"],"a":"D","status":"OK","ex":"答案D。信息必须依附于某种载体才能存在和传播，D的说法违背这一点，是错误项；可处理、可传播、可共享都是信息的基本特征。"},{"c":1,"n":50,"m":"M1","mn":"计算机基础","s":"用语言、文字、符号、场景、图像、声音等方式表达的内容统称为____。","o":["信息技术","信息社会","信息","信息处理"],"a":"C","status":"OK","ex":"答案C。用语言、文字、符号、场景、图像、声音等方式表达的内容统称为信息；信息技术是处理信息的手段，信息社会是社会形态，都不是内容本身。"},{"c":1,"n":51,"m":"M1","mn":"计算机基础","s":"在下面的描述中，正确的是____。","o":["外存中的信息可直接被CPU处理","键盘是输入设备，显示器是输出设备","操作系统是一种很重要的应用软件","计算机中使用的汉字编码和ASCII码是相同的"],"a":"B","status":"OK","ex":"答案B。键盘是输入设备、显示器是输出设备，说法正确；外存中的信息必须先调入内存才能被CPU处理，操作系统是系统软件不是应用软件，汉字编码与ASCII码并不相同。"},{"c":1,"n":52,"m":"M1","mn":"计算机基础","s":"一个完备的计算机系统应该包含计算机的____。","o":["主机和外设","硬件和软件","CPU和存储器","控制器和运算器"],"a":"B","status":"OK","ex":"答案B。完备的计算机系统=硬件系统+软件系统，缺了软件机器什么也干不了；A、C、D都只是硬件层面的局部组成。"},{"c":1,"n":53,"m":"M1","mn":"计算机基础","s":"计算机系统由两大部分组成，它们是____。","o":["系统软件和应用软件","主机和外部设备","硬件系统和软件系统","输入设备和输出设备"],"a":"C","status":"OK","ex":"答案C。计算机系统由硬件系统和软件系统两大部分组成；A只是软件的再分类，B、D都只覆盖硬件的一部分。"},{"c":1,"n":54,"m":"M1","mn":"计算机基础","s":"构成计算机物理实体的部件被称为____。","o":["计算机系统","计算机硬件","计算机软件","计算机程序"],"a":"B","status":"OK","ex":"答案B。构成计算机物理实体的部件统称计算机硬件；软件是程序、数据和相关文档，程序只是软件的组成部分。"},{"c":1,"n":55,"m":"M1","mn":"计算机基础","s":"组成计算机主机的主要是____。","o":["运算器和控制器","中央处理器和主存储器","运算器和外设","运算器和存储器"],"a":"B","status":"OK","ex":"答案B。主机由中央处理器（CPU）和主存储器（内存）构成；运算器和控制器是CPU的内部组成，A、D的表述都不完整。"},{"c":1,"n":56,"m":"M1","mn":"计算机基础","s":"微型计算机的微处理器芯片上集成了____。","o":["CPU和RAM","控制器和运算器","控制器和RAM","运算器和I/O接口"],"a":"B","status":"OK","ex":"答案B。微处理器芯片上集成的是运算器和控制器，二者合称CPU；RAM是内存芯片、I/O接口都不集成在微处理器内。"},{"c":1,"n":57,"m":"M1","mn":"计算机基础","s":"以下不属于计算机外部设备的是____。","o":["输入设备","中央处理器和主存储器","输出设备","外存储器"],"a":"B","status":"OK","ex":"答案B。CPU和主存储器属于主机部分，不算外部设备；输入设备、输出设备和外存储器都属于外设。"},{"c":1,"n":58,"m":"M1","mn":"计算机基础","s":"以下说法正确的是____。","o":["计算机系统包括硬件系统和软件系统","小型机亦称微机","数字计算机可直接处理连续变化的模拟量","主机包括CPU、显示器"],"a":"A","status":"OK","ex":"答案A。计算机系统包括硬件系统和软件系统，正确；小型机不等于微机，数字计算机不能直接处理连续模拟量，主机包括CPU和内存、不含显示器。"},{"c":1,"n":59,"m":"M1","mn":"计算机基础","s":"计算机系统中运行的程序、数据及相应的文档的集合称为____。","o":["主机","软件系统","系统软件","应用软件"],"a":"B","status":"OK","ex":"答案B。计算机系统中运行的程序、数据及相应文档的集合称为软件系统；系统软件和应用软件只是软件系统的两个子类，主机是硬件概念。"},{"c":1,"n":60,"m":"M1","mn":"计算机基础","s":"以下不属于计算机软件系统的是____。","o":["程序","程序使用的数据","外存储器","与程序相关的文档"],"a":"C","status":"OK","ex":"答案C。软件系统由程序、程序使用的数据和相关文档组成；外存储器是物理硬件，不属于软件系统。"},{"c":1,"n":61,"m":"M1","mn":"计算机基础","s":"下面各组设备中，同时包括了输入设备、输出设备和存储设备的是____。","o":["CRT、CPU、ROM","绘图仪、鼠标器、键盘","鼠标器、绘图仪、光盘","磁带、打印机、激光印字机"],"a":"C","status":"OK","ex":"答案C。鼠标器是输入设备、绘图仪是输出设备、光盘是存储设备，三类齐备；A中CRT是输出设备且CPU是主机部件，B缺存储设备，D缺输入设备。"},{"c":1,"n":62,"m":"M1","mn":"计算机基础","s":"个人计算机（PC）必备的外部设备是____。","o":["键盘和鼠标","显示器和键盘","键盘和打印机","显示器和扫描仪"],"a":"B","status":"OK","ex":"答案B。PC必备的外部设备是显示器（输出）和键盘（输入），少了就无法完成基本人机交互；鼠标可有触控板等替代，打印机和扫描仪都不是必备。"},{"c":1,"n":63,"m":"M1","mn":"计算机基础","s":"在微型计算机的各种设备中，既用于输入又用于输出的设备是____。","o":["磁盘驱动器","键盘","鼠标","绘图仪"],"a":"A","status":"OK","ex":"答案A。磁盘驱动器既能读出数据（输入）又能写入数据（输出），是双向设备；键盘、鼠标只能输入，绘图仪只能输出。"},{"c":1,"n":64,"m":"M1","mn":"计算机基础","s":"冯·诺依曼结构计算机的五大基本构件包括运算器、存储器、输入设备、输出设备和____。","o":["显示器","控制器","硬盘存储器","鼠标器"],"a":"B","status":"OK","ex":"答案B。冯·诺依曼结构五大构件为运算器、控制器、存储器、输入设备、输出设备，缺的是控制器；显示器、硬盘、鼠标只是具体的输入输出或存储设备。","roast":"五大件背不出五，你计算机基础这章基本白学了。"},{"c":1,"n":65,"m":"M1","mn":"计算机基础","s":"时至今日，计算机仍采用“存储程序”原理，原理的提出者是____。","o":["莫尔","比尔·盖茨","冯·诺依曼","科得（E.F.Codd）"],"a":"C","status":"OK","ex":"答案C。存储程序原理由冯·诺依曼提出，奠定了现代计算机体系结构；莫尔、比尔·盖茨、科得都不是该原理的提出者。","roast":"冯·诺依曼，教科书上那张脸都认不出，老娘替你臊得慌。"},{"c":1,"n":66,"m":"M1","mn":"计算机基础","s":"冯·诺依曼计算机的基本原理是____。","o":["程序外接","逻辑连接","数据内置","程序存储"],"a":"D","status":"OK","ex":"答案D。冯·诺依曼计算机的基本原理是程序存储（存储程序）：程序与数据一起预先存入内存，机器自动取指执行；其余说法均非该原理。","roast":"存储程序仨字摆在那儿闭眼选，这分丢了老娘都懒得骂。"},{"c":1,"n":67,"m":"M1","mn":"计算机基础","s":"计算机中，运算器的主要功能是完成____。","o":["代数和逻辑运算","代数和四则运算","算术和逻辑运算","算术和代数运算"],"a":"C","status":"OK","ex":"答案C。运算器的主要功能是完成算术运算和逻辑运算两大类；代数运算不是规范说法，四则、代数的组合都漏了逻辑运算。","roast":"算术+逻辑，两词送分，错一个字老娘都嫌你手抖。"},{"c":1,"n":68,"m":"M1","mn":"计算机基础","s":"计算机系统中用来保存程序和数据，以及运算的中间结果和最后结果的装置是____。","o":["RAM","内存和外存","ROM","高速缓存"],"a":"B","status":"OK","ex":"答案B。保存程序、数据以及运算中间结果和最后结果的是存储器系统，即内存和外存的总称；RAM、ROM、高速缓存都只是其中的一部分。"},{"c":1,"n":69,"m":"M1","mn":"计算机基础","s":"超市收款台检查货物的条形码，这属于对计算机系统的信息____。","o":["输入","输出","显示","打印"],"a":"A","status":"OK","ex":"答案A。扫描条形码是把商品信息送入计算机，属于信息的输入；输出、显示、打印都是向外送信息的方向，方向反了。"},{"c":1,"n":70,"m":"M1","mn":"计算机基础","s":"下列不属于计算机输入设备的是____。","o":["光笔","打印机","键盘","鼠标"],"a":"B","status":"OK","ex":"答案B。打印机是输出设备，不属于输入设备；光笔、键盘、鼠标都是典型的输入设备。","roast":"打印机往纸上吐东西是输入还是输出，你说呢？"},{"c":1,"n":71,"m":"M1","mn":"计算机基础","s":"在计算机领域中，通常用大写英文字母B来表示____。","o":["字","字长","字节","二进制位"],"a":"C","status":"OK","ex":"答案C。大写B表示字节（Byte），小写b表示二进制位（bit），两者不能混；字和字长另用word等表述。","roast":"大写B就是字节，背不出这个老娘只能当你书没发下来。"},{"c":1,"n":72,"m":"M1","mn":"计算机基础","s":"指令的操作码表示的是____。","o":["做什么操作","停止操作","操作结果","操作地址"],"a":"A","status":"OK","ex":"答案A。指令由操作码和地址码组成，操作码表示做什么操作（操作性质）；操作对象所在的位置由地址码给出，停止操作只是操作码涵盖的一种情形。"},{"c":1,"n":73,"m":"M1","mn":"计算机基础","s":"为解决某一特定的问题而设计的指令序列称为____。","o":["文档","语言","系统","程序"],"a":"D","status":"OK","ex":"答案D。为解决某一特定问题而设计的指令序列称为程序；文档是说明资料，语言是编写程序的工具，系统是另一层概念。","roast":"程序=指令序列，白给分接不住就别说自己学过计算机。"},{"c":1,"n":74,"m":"M1","mn":"计算机基础","s":"计算机一次能处理数据的最大位数称为该机器的____。","o":["字节","字长","处理速度","存储容量"],"a":"B","status":"OK","ex":"答案B。字长指CPU一次能并行处理和传送的二进制数据的最大位数，是衡量机器性能的核心指标之一；字节是存储单位，处理速度和存储容量与“一次处理多少位”无关。"},{"c":1,"n":75,"m":"M1","mn":"计算机基础","s":"与计算机的计算精度密切相关的指标是____。","o":["字节","字长","处理速度","存储容量"],"a":"B","status":"OK","ex":"答案B。计算精度由字长决定，字长越长可表示的有效位数越多、精度越高；字节只是计量单位，速度和容量管的是快慢与大小，不管精度。"},{"c":1,"n":76,"m":"M1","mn":"计算机基础","s":"衡量计算机存储能力的指标是____。","o":["字节","字长","处理速度","存储容量"],"a":"D","status":"OK","ex":"答案D。存储容量直接衡量机器能容纳多少信息；字节是计量单位本身而不是指标，字长和速度属于其他性能维度。"},{"c":1,"n":77,"m":"M1","mn":"计算机基础","s":"计算机内部用于处理数据和指令的编码是____。","o":["十进制码","二进制码","ASCII码","汉字编码"],"a":"B","status":"OK","ex":"答案B。计算机内部一切数据和指令都以二进制码表示和处理；ASCII码、汉字编码只是字符的编码方案，进机器后同样变成二进制。"},{"c":1,"n":78,"m":"M1","mn":"计算机基础","s":"在计算机中，信息的最小单位是____。","o":["字节","位","字","KB"],"a":"B","status":"OK","ex":"答案B。位（bit）是信息的最小单位，只能表示0或1；字节由8个位组成，字和KB都是更大的单位。"},{"c":1,"n":79,"m":"M1","mn":"计算机基础","s":"在计算机领域中，通常用英文单词“byte”来表示____。","o":["字","字长","字节","二进制位"],"a":"C","status":"OK","ex":"答案C。byte就是“字节”的英文单词，1字节=8位；bit才是二进制位，别把这俩单词搞混。","roast":"byte就是字节，查词典都嫌多余，这分送得比白开水还白。"},{"c":1,"n":80,"m":"M1","mn":"计算机基础","s":"8个字节含二进制位____。","o":["8个","16个","32个","64个"],"a":"D","status":"OK","ex":"答案D。1字节=8位，8个字节就是8×8=64个二进制位。"},{"c":1,"n":81,"m":"M1","mn":"计算机基础","s":"计算机能计算有大量数据和程序语句的问题，起主要作用的因素是____。","o":["大尺寸的彩显","快速的打印机","大容量内外存储器","好的程序设计语言"],"a":"C","status":"OK","ex":"答案C。要处理“大量”数据和程序语句，前提是装得下，大容量内外存储器是基础；显示器和打印机不参与数据规模，语言好坏不决定容量。"},{"c":1,"n":82,"m":"M1","mn":"计算机基础","s":"通常所说的“裸机”是指计算机仅有____。","o":["硬件系统","软件","指令系统","CPU"],"a":"A","status":"OK","ex":"答案A。“裸机”指不安装任何软件的计算机，即只有硬件系统；CPU只是硬件的一部分，说CPU不完整。","roast":"裸机就是光溜溜只剩硬件的机器，词面意思都能猜出来，答错的老娘替你臊得慌。"},{"c":1,"n":83,"m":"M1","mn":"计算机基础","s":"能够将高级语言源程序加工为目标程序的系统软件是____。","o":["解释程序","汇编程序","编译程序","编辑程序"],"a":"C","status":"OK","ex":"答案C。编译程序把高级语言源程序整体翻译成目标程序；解释程序逐句解释执行不生成目标程序，汇编程序处理的是汇编语言，编辑程序只管写代码。"},{"c":1,"n":84,"m":"M1","mn":"计算机基础","s":"计算机系统应包括硬件和软件两部分，软件又必须包括____。","o":["接口软件","系统软件","应用软件","支撑软件"],"a":"B","status":"OK","ex":"答案B。系统软件（操作系统、语言处理程序等）是计算机运行必不可少的基础，没有它机器根本无法启动；应用软件按需选配，所以“必须”包括的是系统软件。"},{"c":1,"n":85,"m":"M1","mn":"计算机基础","s":"下列计算机软件中，属于系统软件的是____。","o":["用C语言编写的求解一元二次方程的程序","工资管理软件","用汇编语言编写的一个练习程序","Windows操作系统"],"a":"D","status":"OK","ex":"答案D。操作系统是典型的系统软件；前三项都是为解决具体问题编写的程序，属于应用软件。"},{"c":1,"n":86,"m":"M1","mn":"计算机基础","s":"计算机操作系统是一种____。","o":["系统软件","应用软件","工具软件","调试软件"],"a":"A","status":"OK","ex":"答案A。操作系统是最基本的系统软件，负责管理软硬件资源；它不为某项具体业务服务，所以不是应用软件。","roast":"操作系统是系统软件，名字都把答案写在脑门上了，这都选错纯属没长眼。"},{"c":1,"n":87,"m":"M1","mn":"计算机基础","s":"下列4种计算机软件中属于应用软件的是____。","o":["财务管理系统","DOS","Windows98","Windows2000"],"a":"A","status":"OK","ex":"答案A。财务管理系统面向具体业务，属于应用软件；DOS、Windows98、Windows2000全是操作系统，属于系统软件。"},{"c":1,"n":88,"m":"M1","mn":"计算机基础","s":"某单位的人事管理程序属于____。","o":["系统程序","系统软件","应用软件","目标软件"],"a":"C","status":"OK","ex":"答案C。人事管理程序面向单位的具体管理业务，属于应用软件；系统软件是管理机器资源的基础软件，不针对具体业务。"},{"c":1,"n":89,"m":"M1","mn":"计算机基础","s":"计算机执行某种操作的命令被称为____。","o":["指令","程序","程序设计语言","指令系统"],"a":"A","status":"OK","ex":"答案A。计算机执行某种操作的命令叫指令；程序是指令的有序集合，指令系统是一台机器全部指令的集合，别把“一条”和“一堆”搞混。"},{"c":1,"n":90,"m":"M1","mn":"计算机基础","s":"为解决某一问题而设计的一系列有序的语句的集合被称为____。","o":["指令","程序","程序设计语言","指令系统"],"a":"B","status":"OK","ex":"答案B。为解决某一问题而设计的一系列有序语句的集合叫程序；单条的是指令，全部指令构成指令系统，程序设计语言只是写程序的工具。"},{"c":1,"n":91,"m":"M1","mn":"计算机基础","s":"与二进制数11111110等值的十进制数是____。","o":["251","252","253","254"],"a":"D","status":"OK","ex":"答案D。11111111B=255，末位再减1就是11111110B=254；也可按位权展开128+64+32+16+8+4+2=254，251、252、253都是算错的结果。"},{"c":1,"n":92,"m":"M1","mn":"计算机基础","s":"计算机中的所有信息都是以二进制方式表示的，主要理由是____。","o":["运算速度快","节约元件","所需的物理元件最简单","信息处理方便"],"a":"C","status":"OK","ex":"答案C。采用二进制的根本原因是只需“通/断”两种稳定状态的物理元件，最容易实现且最可靠；速度快、省元件是由此带来的好处，不是根本理由。"},{"c":1,"n":93,"m":"M1","mn":"计算机基础","s":"在计算机内部，数据加工、处理和传送的形式是____。","o":["二进制码","八进制码","十进制码","十六进制码"],"a":"A","status":"OK","ex":"答案A。机器内部一切信息的加工、处理和传送都用二进制；八进制和十六进制只是给人看的书写简化形式，机器内部并不使用。"},{"c":1,"n":94,"m":"M1","mn":"计算机基础","s":"下列4组数应依次为二进制、八进制和十六进制，符合这个要求的是____。","o":["11，78，19","12，77，10","12，80，10","11，77，19"],"a":"D","status":"OK","ex":"答案D。二进制数码只能是0和1，12非法排除B、C；八进制数码最大到7，78非法排除A；D中11、77、19分别符合二进制、八进制、十六进制的数码要求。"},{"c":1,"n":95,"m":"M1","mn":"计算机基础","s":"在下列4个数中数值最大的是____。","o":["123D","111101B","56O","80H"],"a":"D","status":"OK","ex":"答案D。统一换算成十进制：123D=123，111101B=61，56O=5×8+6=46，80H=8×16=128，所以80H最大。"},{"c":1,"n":96,"m":"M1","mn":"计算机基础","s":"下列各类进制的整数中，值最大的是____。","o":["十进制数11","八进制数11","十六进制数11","二进制数11"],"a":"C","status":"OK","ex":"答案C。同样两个“1”，按位权算：十六进制11=17，十进制11=11，八进制11=9，二进制11=3；基数越大同符号的值越大，十六进制最大。"},{"c":1,"n":97,"m":"M1","mn":"计算机基础","s":"在R进制数中，能使用的最小数字符号是____。","o":["0","1","-1","R-1"],"a":"A","status":"OK","ex":"答案A。R进制使用0到R-1共R个数码，最小的是0；R-1是最大数码，负数不是进位制的数码。"},{"c":1,"n":98,"m":"M1","mn":"计算机基础","s":"在微型计算机中，应用最普遍的字符编码是____。","o":["BCD码","ASCII码","汉字编码","补码"],"a":"B","status":"OK","ex":"答案B。ASCII是微机中英文字符的标准编码，应用最普遍；BCD码用于十进制数，汉字编码针对汉字，补码是带符号数的表示法，都不是字符编码。"},{"c":1,"n":99,"m":"M1","mn":"计算机基础","s":"下列字符中ASCII码值最小的是____。","o":["a","A","f","Z"],"a":"B","status":"OK","ex":"答案B。ASCII值规律：数字小于大写字母，大写字母小于小写字母，同组内按字母顺序递增；A(65)<Z(90)<a(97)<f(102)，所以A最小。"},{"c":1,"n":100,"m":"M1","mn":"计算机基础","s":"已知英文字母m的ASCII码值为109，那么英文字母p的ASCII码值为____。","o":["111","112","113","114"],"a":"B","status":"OK","ex":"答案B。字母的ASCII值按字母表顺序递增1：m(109)→n(110)→o(111)→p(112)。"},{"c":1,"n":101,"m":"M1","mn":"计算机基础","s":"对输入到计算机中的某种非数值型数据用二进制数来表示的转换规则被称为____。","o":["编码","数制","校检","信息"],"a":"A","status":"OK","ex":"答案A。用二进制表示非数值数据（如字符）的转换规则叫编码，ASCII、汉字编码都是编码方案；数制是计数进位方法，校验用于查错。"},{"c":1,"n":102,"m":"M1","mn":"计算机基础","s":"ASCII码可以表示的字符个数是____。","o":["256","255","128","127"],"a":"C","status":"OK","ex":"答案C。标准ASCII码用7位二进制编码，共2的7次方即128个字符；256对应8位的扩展ASCII，不是标准ASCII。"},{"c":1,"n":103,"m":"M1","mn":"计算机基础","s":"字符a对应的ASCII码值是____。","o":["90","96","97","98"],"a":"C","status":"OK","ex":"答案C。小写字母a的ASCII值是97，这是固定值要背；90对应大写Z，98是小写b。","roast":"a=97，课本上印了八百遍的数字，背不下来老娘真没辙。"},{"c":1,"n":104,"m":"M1","mn":"计算机基础","s":"字符A对应的ASCII码值是____。","o":["64","65","66","69"],"a":"B","status":"OK","ex":"答案B。大写字母A的ASCII值是65，固定值要背；66是字符B，64谁的码值都不是。","roast":"A=65跟a=97一样是必背数，白给的分都不捡，你图什么？"},{"c":1,"n":105,"m":"M1","mn":"计算机基础","s":"计算机内部用于汉字信息的存储、运算的信息代码称为____。","o":["汉字输入码","汉字内码","汉字字形码","汉字输入码"],"a":"B","status":"OK","ex":"答案B。汉字内码是机内存储、加工汉字信息用的代码；输入码用于键盘录入，字形码用于显示和打印输出，各管一段。"},{"c":1,"n":106,"m":"M1","mn":"计算机基础","s":"计算机中，存储一个汉字的内码所需的字节数是____。","o":["1个","8个","2个","4个"],"a":"C","status":"OK","ex":"答案C。一个汉字内码占2个字节（每字节最高位置1，以便与ASCII字符区分）；英文字符才占1个字节。"},{"c":1,"n":107,"m":"M1","mn":"计算机基础","s":"“美国信息交换标准代码”的缩写是____。","o":["EBCDIC","ASCII","GB2312 80","BCD"],"a":"B","status":"OK","ex":"答案B。ASCII即American Standard Code for Information Interchange，正是“美国信息交换标准代码”的缩写；EBCDIC是IBM的扩展编码，BCD是十进制数的二进制编码。","roast":"把中文全称翻回英文缩写，这题答错就是单词都没背。"},{"c":1,"n":108,"m":"M1","mn":"计算机基础","s":"微型计算机与外部设备之间的信息传输方式有____。","o":["仅串行方式","串行方式或并行方式","连接方式","仅并行方式"],"a":"B","status":"OK","ex":"答案B。微机与外设之间串行（一位一位传）和并行（多位同时传）两种方式都普遍使用；“仅串行”“仅并行”说法太绝对，直接排除。"},{"c":1,"n":109,"m":"M1","mn":"计算机基础","s":"固定在计算机主机箱箱体上的、起到连接计算机各种部件的纽带和桥梁作用的是____。","o":["CPU","主板","外存","内存"],"a":"B","status":"OK","ex":"答案B。主板固定在机箱内，CPU、内存、各种接口卡都装在它上面，起连接各部件的纽带和桥梁作用；CPU和内存是插在主板上的部件本身。"},{"c":1,"n":110,"m":"M1","mn":"计算机基础","s":"运算器、控制器和寄存器属于____。","o":["算术逻辑单元","主板","CPU","累加器"],"a":"C","status":"OK","ex":"答案C。CPU由运算器、控制器和寄存器组成；算术逻辑单元（ALU）只是运算器的核心部分，主板和累加器更不是这仨的归属。"},{"c":1,"n":111,"m":"M1","mn":"计算机基础","s":"下列计算机存储器中，读写速度最快的是____。","o":["内存","硬盘","光盘","软盘"],"a":"A","status":"OK","ex":"答案A。内存是半导体存储器，CPU直接访问，速度远快于硬盘、光盘、软盘这些外存设备。"},{"c":1,"n":112,"m":"M1","mn":"计算机基础","s":"计算机的内存容量可能不同，而计算容量的基本单位都是____。","o":["字","页","字节","位"],"a":"C","status":"OK","ex":"答案C。存储容量的基本计算单位是字节（Byte）；位是最小信息单位但容量按字节计，字和页不是容量计量单位。"},{"c":1,"n":113,"m":"M1","mn":"计算机基础","s":"中央处理器（CPU）可直接读写的计算机存储部件是_____。","o":["内存","硬盘","软盘","外存"],"a":"A","status":"OK","ex":"答案A。CPU只能直接读写内存（主存）；硬盘、软盘等外存的数据必须先调入内存，CPU才能处理。"},{"c":1,"n":114,"m":"M1","mn":"计算机基础","s":"计算机存储单元中存储的内容____。","o":["可以是数据和指令","只能是数据","只能是程序","只能是指令"],"a":"A","status":"OK","ex":"答案A。冯·诺依曼计算机中数据和指令都以二进制形式存放在存储单元里，机器不作区分，所以存储内容既可以是数据也可以是指令。"},{"c":1,"n":115,"m":"M1","mn":"计算机基础","s":"ROM中的信息是____。","o":["由计算机制造厂预先写入的","在计算机通电启动时写入的","根据用户需求不同，由用户随时写入的","由程序临时写入的"],"a":"A","status":"OK","ex":"答案A。ROM是只读存储器，信息由制造厂出厂时预先写入，断电不丢失，用户不能随时改写；随时写入、临时写入都是RAM的特征。"},{"c":1,"n":116,"m":"M1","mn":"计算机基础","s":"下列各类计算机存储器中，断电后其中信息会丢失的是____。","o":["ROM","RAM","硬盘","软盘"],"a":"B","status":"OK","ex":"答案B。RAM是随机存取存储器，断电后信息全部丢失，属易失性存储；ROM和磁盘、软盘都是非易失性的，断电信息仍在。"},{"c":1,"n":117,"m":"M1","mn":"计算机基础","s":"下列叙述中，正确的一条是____。","o":["鼠标既是输入设备又是输出设备","激光打印机属于击打式打印机","使用杀毒软件可以防止网络黑客","温度是影响计算机正常工作的重要因素"],"a":"D","status":"OK","ex":"答案D。环境温度确实影响计算机稳定工作；鼠标只是输入设备，激光打印机是非击打式打印机，杀毒软件防病毒但防不了网络黑客。"},{"c":1,"n":118,"m":"M1","mn":"计算机基础","s":"以微处理器为核心，配上存储器、输入输出接口电路及系统总线可以组成____。","o":["CPU","微型计算机系统","微型计算机","软件系统"],"a":"C","status":"OK","ex":"答案C。微处理器配上存储器、I/O接口电路和系统总线，构成的是微型计算机的硬件实体；再配上软件才叫微型计算机系统，单独的微处理器只是CPU。"},{"c":1,"n":119,"m":"M1","mn":"计算机基础","s":"下列诸因素中，对微型计算机工作影响最小的是____。","o":["尘土","噪声","温度","湿度"],"a":"B","status":"OK","ex":"答案B。尘土会堵塞散热通道，温度、湿度直接影响电路稳定工作；噪声只吵人，不影响机器内部电路。"},{"c":1,"n":120,"m":"M1","mn":"计算机基础","s":"下列叙述中错误的是____。","o":["计算机要长期使用，不要长期闲置不用","为了延长计算机的寿命，应避免频繁开关机","计算机使用几小时后，应关机一会儿再用","在计算机附近应避免磁场干扰"],"a":"C","status":"OK","ex":"答案C。现代计算机完全可以长时间连续运行，“用几小时必须关机歇一会儿”没有依据；避免长期闲置、减少频繁开关机、远离磁场干扰都是正确的保养常识。"},{"c":1,"n":121,"m":"M1","mn":"计算机基础","s":"在微型计算机中，微处理器的主要功能是进行____。","o":["算术计算","逻辑运算","算术逻辑运算","算术逻辑运算及全机的控制"],"a":"D","status":"OK","ex":"答案D。微处理器即CPU，包含运算器和控制器，既要完成算术逻辑运算，又要控制全机协调工作；只选算术或只选逻辑都只说了一半。"},{"c":1,"n":122,"m":"M1","mn":"计算机基础","s":"决定微处理器性能优劣的重要指标是____。","o":["内存的大小","微处理器的尺寸","主频","内存储器"],"a":"C","status":"OK","ex":"答案C。主频是决定微处理器性能的重要指标，主频越高运算节拍越快；内存大小是整机指标，尺寸更不是性能指标。"},{"c":1,"n":123,"m":"M1","mn":"计算机基础","s":"在微型计算机中，微处理器芯片上集成的是____。","o":["控制器和运算器","控制器和存储器","CPU和控制器","运算器和I/O接口"],"a":"A","status":"OK","ex":"答案A。微处理器芯片上集成的是运算器和控制器（及寄存器）；存储器是独立的芯片，I/O接口也不集成在CPU芯片上。"},{"c":1,"n":124,"m":"M1","mn":"计算机基础","s":"当运行某个程序时，如果发现存储容量不够，最直接和有效的解决办法是____。","o":["把磁盘换成光盘","把软盘换成硬盘","使用高容量磁盘","扩充内存"],"a":"D","status":"OK","ex":"答案D。运行程序时容量不够指的是内存不足，最直接有效的办法是扩充内存；换磁盘、光盘动的是外存，解决不了内存不够。"},{"c":1,"n":125,"m":"M1","mn":"计算机基础","s":"决定可用的外设和与外设交换数据的速度的是____。","o":["输入输出数据传输速度","内存容量","外存容量","运算速度"],"a":"A","status":"OK","ex":"答案A。与外设交换数据的快慢由输入输出数据传输速度决定；内存容量、外存容量、运算速度管的是存储和运算，不是这条通道。"},{"c":1,"n":126,"m":"M1","mn":"计算机基础","s":"微机系统与外部交换信息主要是通过____。","o":["输入输出设备","键盘","光盘","内存"],"a":"A","status":"OK","ex":"答案A。微机系统通过输入输出设备与外界交换信息；键盘只是输入设备的一种，光盘是外存，内存是内部存储部件，都不是交换通道的全貌。"},{"c":1,"n":127,"m":"M1","mn":"计算机基础","s":"磁盘和磁盘驱动器是微型计算机的外存储设备，可实现对信息的____。","o":["输入","输出","输入和输出","记录和过滤"],"a":"C","status":"OK","ex":"答案C。磁盘既可读（输入）又可写（输出），磁盘驱动器配合完成读写，所以是既能输入又能输出的设备。"},{"c":1,"n":128,"m":"M1","mn":"计算机基础","s":"在对磁盘及其驱动器的叙述中有许多专用术语，而与其无关的是____。","o":["密度","磁道","扇区","光标"],"a":"D","status":"OK","ex":"答案D。密度、磁道、扇区都是描述磁盘结构的专用术语；光标是屏幕上指示输入位置的符号，跟磁盘没有任何关系。"},{"c":1,"n":129,"m":"M1","mn":"计算机基础","s":"当前微型计算机上采用的外存储器中，大部分不包括____。","o":["硬盘","光盘","软盘","磁带"],"a":"D","status":"OK","ex":"答案D。微机常用的外存储器是硬盘、光盘、软盘；磁带机主要用于大中型计算机的数据备份，微机上基本不用。"},{"c":1,"n":130,"m":"M1","mn":"计算机基础","s":"下列四项中，计算机外（辅）存储器是指____。","o":["RAM","ROM","磁盘","虚盘"],"a":"C","status":"OK","ex":"答案C。磁盘是外（辅）存储器；RAM、ROM都是内存，虚盘（虚拟盘）是用内存模拟的，本质仍属内存。"},{"c":1,"n":131,"m":"M1","mn":"计算机基础","s":"具有多媒体功能的微型计算机系统，通常都配有CD-ROM，这是一种____。","o":["只读内存储器","只读大容量软盘","只读硬盘存储器","只读光盘存储器"],"a":"D","status":"OK","ex":"答案D。CD-ROM即Compact Disc Read-Only Memory，只读光盘存储器，属于外存；把它说成内存、软盘、硬盘都是字面理解错误。"},{"c":1,"n":132,"m":"M1","mn":"计算机基础","s":"键盘一般分为4个区域，其中Shift为换档键，它的位置在____。","o":["主键盘区","小键盘区","功能键区","编辑键区"],"a":"A","status":"OK","ex":"答案A。Shift换档键位于主键盘区，左右各一个；小键盘区、功能键区、编辑键区都没有Shift。","roast":"低头瞄一眼自己键盘就能答对的题，丢这分老娘是真的服。"},{"c":1,"n":133,"m":"M1","mn":"计算机基础","s":"计算机鼠标器具有简单、直观、移动速度快等优点，但下列四项中不能用鼠标点击的是____。","o":["键盘","菜单","图标","按钮"],"a":"A","status":"OK","ex":"答案A。菜单、图标、按钮都是屏幕上的显示对象，可以用鼠标点击；键盘是独立的实体输入设备，鼠标点不着它。"},{"c":1,"n":134,"m":"M1","mn":"计算机基础","s":"计算机显示器画面的清晰度决定于显示器的____。","o":["亮度","色彩","分辨率","图形"],"a":"C","status":"OK","ex":"答案C。显示器的清晰度由分辨率决定，分辨率越高图像越细腻；亮度、色彩只影响观感，不决定清晰程度。"},{"c":1,"n":135,"m":"M1","mn":"计算机基础","s":"下面关于计算机显示器的叙述，正确的是：显示器是____。","o":["输入设备","输出设备","输入输出设备","存储设备"],"a":"B","status":"OK","ex":"答案B。显示器把计算机的处理结果呈现给用户，是输出设备；它不向计算机输入信息，所以不是输入输出设备。","roast":"显示器是输出设备，天天盯着它还不认识，该面壁的是你。"},{"c":1,"n":136,"m":"M1","mn":"计算机基础","s":"打印机是计算机系统的常用输出设备，当前输出速度最快的是____。","o":["点阵打印机","喷墨打印机","激光打印机","热敏打印机"],"a":"C","status":"OK","ex":"答案C。激光打印机打印速度快、质量高，是当前输出速度最快的打印机；点阵打印机靠钢针击打色带，速度最慢。"},{"c":1,"n":137,"m":"M1","mn":"计算机基础","s":"一台计算机的字长是4个字节，这意味着它____。","o":["能处理的字符串最多由4个英文字母组成","在CPU中作为一个整体加以传送处理的二进制数码为32位","能处理的数值最大为4位十进制数9999","在CPU中运算的结果最大为232"],"a":"B","status":"OK","ex":"答案B。字长4字节=4×8=32位，指CPU作为一个整体传送和处理的二进制数码是32位；字长与能处理的字符串长度、十进制数上限、运算结果上限都不是一回事。"},{"c":1,"n":138,"m":"M1","mn":"计算机基础","s":"计算机的技术指标有多种，而最主要的应该是____。","o":["语言、外设和速度","主频、字长和内存容量","外设、内存容量和体积","软件、速度和重量"],"a":"B","status":"OK","ex":"答案B。主频决定速度、字长决定精度、内存容量决定能处理的数据规模，这是计算机最主要的三项技术指标；外设、体积、重量都不是主要指标。"},{"c":1,"n":139,"m":"M1","mn":"计算机基础","s":"微型计算机的主频很大程度上决定了计算机的运行速度，它是指____。","o":["计算机的运行速度快慢","微处理器时钟工作频率","基本指令操作次数","单位时间的存取数量"],"a":"B","status":"OK","ex":"答案B。主频就是微处理器内部时钟的工作频率，单位是赫兹；它本身是“频率”，说成运行速度、指令次数或存取数量都不准确。"},{"c":1,"n":140,"m":"M1","mn":"计算机基础","s":"微处理器芯片的位数即____。","o":["速度","字长","主频","周期"],"a":"B","status":"OK","ex":"答案B。微处理器芯片的位数即一次能处理的二进制位数，就是字长；速度、主频、周期是另外的性能概念。","roast":"芯片位数就是字长，这俩词是等号关系，背下来就行，这分不拿白不拿。"},{"c":1,"n":141,"m":"M1","mn":"计算机基础","s":"字长16位的计算机，它表示____。","o":["数以16位二进制数表示","数以十六进制来表示","可处理16个字符串","数以两个八进制表示"],"a":"A","status":"OK","ex":"答案A。字长16位表示机器能以16位二进制数为一个整体来表示和处理数；“十六进制”是望文生义，字符串和八进制更是风马牛不相及。"},{"c":1,"n":142,"m":"M1","mn":"计算机基础","s":"“32位微型计算机”中的32指的是____。","o":["微机型号","内存容量","运算速度","机器的字长"],"a":"D","status":"OK","ex":"答案D。“32位微型计算机”中的32指机器字长为32位，即CPU一次处理32位二进制数；与微机型号、内存容量、运算速度都无关。"},{"c":1,"n":143,"m":"M1","mn":"计算机基础","s":"计算机配置的内存的容量为128MB或128MB以上，其中的128MB是指____。","o":["128×1000×1000×8个字节","128×1000×1000字节","128×1024×1024×8个字节","128×1024×1024个字节"],"a":"D","status":"OK","ex":"答案D。按二进制口径1MB=1024KB=1024×1024字节，所以128MB=128×1024×1024字节；A、B用1000进位是十进制算法，C还多乘了个8——那是换算成位。"},{"c":1,"n":144,"m":"M1","mn":"计算机基础","s":"下列描述中不正确的是____。","o":["多媒体技术最主要的两个特点是集成性和交互性","各种高级语言的翻译程序都属于系统软件","内存容量是计算机的主要性能指标之一","所有计算机的字长都是固定不变的"],"a":"D","status":"OK","ex":"答案D。不同计算机的字长可以不同，“所有计算机的字长固定不变”说法错误；多媒体的集成性交互性、高级语言翻译程序属系统软件、内存容量是主要指标，这三条都对。"},{"c":1,"n":145,"m":"M1","mn":"计算机基础","s":"为使在本系统中开发的硬、软件能推广到多种系统中，需要考虑本系统的____。","o":["兼容性","可靠性","可扩充性","可用性"],"a":"A","status":"OK","ex":"答案A。要使本系统开发的软硬件能推广到多种系统上使用，靠的是兼容性；可靠性看故障率，可扩充性看升级空间，可用性看易用程度，都不是跨系统通用这件事。"},{"c":1,"n":146,"m":"M1","mn":"计算机基础","s":"微型计算机内存容量的大小，一般是指____的容量。","o":["字长","内存容量","主频","硬盘容量 答案：ABABA  DBBBD  AAACD"],"a":"B","status":"OK","ex":"答案B。内存容量就是指内存（RAM）能存储信息的总量；字长、主频是CPU相关指标，硬盘容量属于外存，别跟内存混为一谈。"},{"c":8,"n":1,"m":"M1","mn":"计算机基础","s":"下面说法正确的是____。","o":["信息的泄漏只在信息的传输过程中发生","信息的泄漏只在信息的存储过程中发生","信息的泄漏在信息的传输和存储过程中都会发送","信息的泄漏在信息的传输和存储过程中都不会发送"],"a":"C","status":"OK","ex":"信息在传输途中可被窃听，在存储介质上可被复制窃取，两个环节都存在泄漏风险，C正确；A、B各只说了一半，D则完全否认泄漏的可能性。"},{"c":8,"n":2,"m":"M1","mn":"计算机基础","s":"计算机安全在网络环境中，并不能提供安全保护的是____。","o":["信息的载体","信息的处理、传输","信息的存储、访问","信息语意的正确性"],"a":"D","status":"OK","ex":"网络环境中的计算机安全保护信息的载体、传输处理、存储访问等环节，但管不了信息内容本身的语义对不对，那是内容质量问题，D正确；A、B、C都在安全保护范围内。"},{"c":8,"n":3,"m":"M1","mn":"计算机基础","s":"下列不属于可用性服务的技术是____。","o":["备份","身份鉴别","在线恢复","灾难恢复"],"a":"B","status":"OK","ex":"备份、在线恢复、灾难恢复的目的都是让系统在受损后尽快恢复服务，属于可用性服务；身份鉴别属于认证服务，解决的是'你是谁'的问题，与可用性无关。"},{"c":8,"n":4,"m":"M1","mn":"计算机基础","s":"信息安全并不涉及的领域是____。","o":["计算机技术和网络技术","法律制度","公共道德","人身安全"],"a":"D","status":"OK","ex":"信息安全涉及计算机与网络技术、法律制度、公共道德等领域；人身安全属于生产安防范畴，不属于信息安全涉及的领域，D正确。"},{"c":8,"n":5,"m":"M1","mn":"计算机基础","s":"计算机病毒是____。","o":["一种有破坏性的程序","使用计算机时容易感染的一种疾病","一种计算机硬件系统故障","计算机软件系统故障"],"a":"A","status":"OK","ex":"计算机病毒的本质是人为编写的具有破坏性的程序代码；B把病毒当成生理疾病，C、D把病毒和软硬件故障混为一谈，全错。","roast":"病毒是程序不是感冒，定义题都要犹豫，老娘劝你把课本吃了。"},{"c":8,"n":6,"m":"M1","mn":"计算机基础","s":"信息安全属性不包括____。","o":["保密性","可靠性","可审性","透明性"],"a":"D","status":"OK","ex":"信息安全的基本属性是保密性、完整性、可用性、可控性、可审性、可靠性等，A、B、C都在其中；'透明性'不是信息安全属性，D正确。"},{"c":8,"n":7,"m":"M1","mn":"计算机基础","s":"在以下人为的恶意攻击行为中，属于主动攻击的是____。","o":["发送被篡改的数据","数据窃听","数据流分析","截获数据包"],"a":"A","status":"OK","ex":"主动攻击会对数据流进行篡改或伪造，'发送被篡改的数据'改动了信息本身，A正确；窃听、流量分析、截获都只是观察获取、不动数据流，属于被动攻击。"},{"c":8,"n":8,"m":"M1","mn":"计算机基础","s":"被动攻击其所以难以被发现，是因为____。","o":["它一旦盗窃成功，马上自行消失","它隐藏在计算机系统内部大部分时间是不活动的","它隐藏的手段更高明","它并不破坏数据流"],"a":"D","status":"OK","ex":"被动攻击只窃听观察、不修改不破坏数据流，通信看起来完全正常、毫无异常迹象，所以难以被发现，D正确；A、C不成立，B说的是恶意程序潜伏，不是被动攻击难发现的原因。"},{"c":8,"n":9,"m":"M1","mn":"计算机基础","s":"下面最难防范的网络攻击是____。","o":["计算机病毒","假冒","修改数据","窃听"],"a":"D","status":"OK","ex":"窃听是被动攻击，不改动数据、不留痕迹，受害者根本察觉不到，因此最难防范，D正确；病毒、假冒、修改数据都会留下可检测的异常，相对好防。"},{"c":8,"n":10,"m":"M1","mn":"计算机基础","s":"计算机病毒平时潜伏在____。","o":["内存","外存","CPU","I/O设备"],"a":"B","status":"OK","ex":"病毒平时以文件形式寄居在硬盘、U盘等外存中，被运行时才进入内存发作；断电后内存清空，CPU和I/O设备本身不存病毒，B正确。","roast":"病毒潜伏在哪都记不住，真中了毒可别哭，背一遍就白给的分。"},{"c":8,"n":11,"m":"M1","mn":"计算机基础","s":"下面关于计算机病毒说法正确的是____。","o":["都具有破坏性","有些病毒无破坏性","都破坏EXE文件","不破坏数据，只破坏文件"],"a":"A","status":"OK","ex":"按教材定义，凡是病毒都具有破坏性，只是破坏程度轻重不同，A正确；B与之矛盾；C、D过于绝对，病毒未必都感染EXE文件，也完全可能破坏数据。"},{"c":8,"n":12,"m":"M1","mn":"计算机基础","s":"下面关于计算机病毒产生的原因，说法正确的是____。","o":["计算机病毒是计算机硬件设计的失误产生的","计算机病毒是人为制造的","计算机病毒必须清除掉后，计算机才能使用，否则一定会造成灾难性的后果","计算机病毒是在编程时由于疏忽而造成的软件错误"],"a":"B","status":"OK","ex":"病毒是有人出于特定目的故意编写出来的程序，B正确；硬件设计失误、编程疏忽造成的只是普通故障或bug，不是病毒；C说法太绝对，染毒不等于必然灾难。"},{"c":8,"n":13,"m":"M1","mn":"计算机基础","s":"下面，说法错误的是____。","o":["计算机病毒程序可以通过链接到Word的宏命令上去执行","计算机病毒程序可以链接到数据库文件上去执行","木马程序可以通过打开一个图片文件去传播","计算机病毒程序可以链接到可执行文件上去执行"],"a":"B","status":"OK","ex":"病毒可以链接到Word宏命令和可执行文件上执行，木马也可能借伪装成图片的文件传播，这些说法都对；但数据库文件是纯数据文件、不含可执行代码，病毒无法链接其上执行，B的说法错误。"},{"c":8,"n":14,"m":"M1","mn":"计算机基础","s":"密码技术主要是用来____。","o":["实现信息的可用性","实现信息的完整性","实现信息的可控性","实现信息的保密性"],"a":"D","status":"OK","ex":"加密就是让未授权者看不懂信息内容，直接服务于保密性，D正确；完整性靠校验机制保障，可控性靠访问控制保障，可用性更不是加密能解决的。"},{"c":8,"n":15,"m":"M1","mn":"计算机基础","s":"下列情况中，破坏了数据的完整性的攻击是____。","o":["木马攻击","不承认做过信息的递交行为","数据在传输中途被窃听","数据在传输中途被篡改"],"a":"D","status":"OK","ex":"完整性要求信息不被未授权篡改，传输中途被篡改正是破坏完整性，D正确；窃听破坏的是保密性，'不承认递交'破坏的是不可抵赖性，木马攻击主要威胁系统控制权。"},{"c":8,"n":16,"m":"M1","mn":"计算机基础","s":"下面属于被动攻击的手段是____。","o":["假冒","修改信息","流量分析","拒绝服务"],"a":"C","status":"OK","ex":"流量分析只对截获的信息量做统计观察、不改动数据流，是典型的被动攻击，C正确；假冒、修改信息、拒绝服务都要对系统或数据'动手'，属于主动攻击。"},{"c":8,"n":17,"m":"M1","mn":"计算机基础","s":"下面关于防火墙说法错误的是____。","o":["防火墙可以防止病毒通过网络传播","防火墙可以由路由器实现","所有进出网络的通信流都应该通过防火墙","防火墙可以过滤外网的访问"],"a":"A","status":"OK","ex":"防火墙按策略过滤网络通信，防不住伪装成正常文件传播的病毒，防病毒要靠杀毒软件，A说法错误；B、C、D都是防火墙的正确描述。"},{"c":8,"n":18,"m":"M1","mn":"计算机基础","s":"认证技术包括____。","o":["消息认证和身份认证","身份认证和DNA认证","压缩技术和身份认证","数字签名和IP地址认证"],"a":"A","status":"OK","ex":"认证技术按教材分为消息认证和身份认证两大类，前者验证信息的真实完整，后者验证用户身份，A正确；DNA认证、IP地址认证、压缩技术都是拼凑的干扰项，不是认证技术的标准分类。","roast":"两大类背一遍就送分，这都记不住，老娘都替你脸红。"},{"c":8,"n":19,"m":"M1","mn":"计算机基础","s":"下面关于计算机病毒说法错误的是____。","o":["新买的计算机也会受到计算机病毒的攻击","防病毒软件不会检查出压缩文件内部的病毒","任何防病毒软件都不会查出和杀掉所有的病毒","任何计算机病毒都有标识码"],"a":"B","status":"OK","ex":"现在的防病毒软件普遍支持解包扫描，能查出压缩文件内部的病毒，B说'不会查出'是错的；A、C、D都是教材认可的客观说法（新机器同样可能中毒、没有杀软能查杀所有病毒、病毒都有标识码）。"},{"c":8,"n":20,"m":"M1","mn":"计算机基础","s":"下面，不属于计算机安全要解决的问题是____。","o":["安全法规的建立","要保证操作员人身安全","安全技术","制定安全管理制度"],"a":"B","status":"OK","ex":"计算机安全要解决的问题包括安全法规的建立、安全技术、安全管理制度的制定，都是信息层面的事；操作员人身安全属于生产安全管理，B不属于。"},{"c":8,"n":21,"m":"M1","mn":"计算机基础","s":"根据访问控制实现方法不同，下面，不属于访问控制技术的是____。","o":["强制访问控制","自主访问控制","自由访问控制","基于角色的访问控制"],"a":"C","status":"OK","ex":"访问控制按实现方法分为强制访问控制、自主访问控制和基于角色的访问控制，A、B、D都是真实技术；'自由访问控制'是生造的名词，C不属于。"},{"c":8,"n":22,"m":"M1","mn":"计算机基础","s":"下面，错误的说法是____。","o":["阳光直射计算机会影响计算机的正常操作","带电安装内存条可能导致计算机某些部件的损坏","灰尘可能导致计算机线路短路","可以利用电子邮件进行病毒传播"],"a":"A","status":"OK","ex":"阳光直射至多造成屏幕反光、机身温度偏高，并不影响计算机的正常操作，A说法错误；带电插内存条易击穿部件、灰尘易导致短路、电子邮件可传播病毒，B、C、D都是正确常识。"},{"c":8,"n":23,"m":"M1","mn":"计算机基础","s":"计算机安全属性不包括____。","o":["信息不能暴露给未经授权的人","信息传输中不能被篡改","信息能被授权的人按要求所使用","信息的语义必须客观准确"],"a":"D","status":"OK","ex":"计算机安全属性对应保密、完整、可用等要求：A是保密性，B是完整性，C是可用性；'信息的语义必须客观准确'属于信息质量问题，不在安全属性之列，D正确。"},{"c":8,"n":24,"m":"M1","mn":"计算机基础","s":"下列情况中，破坏了数据的完整性的攻击是____。","o":["假冒他人地址发送数据","不承认做过信息的递交行为","数据在传输中途被篡改","数据在传输中途被窃听"],"a":"C","status":"OK","ex":"完整性要求信息在传输中不被未授权改动，中途被篡改正是破坏了完整性，C正确；假冒他人地址破坏真实性，不承认递交破坏不可抵赖性，被窃听破坏保密性。"},{"c":8,"n":25,"m":"M1","mn":"计算机基础","s":"下列操作，可能使得计算机感染病毒的操作是_____。","o":["强行拔掉U盘","删除文件","强行关闭计算机","拷贝他人U盘上的游戏"],"a":"D","status":"OK","ex":"病毒主要靠拷贝带毒文件传播，拷贝他人U盘上的游戏正是典型的感染途径，D正确；拔U盘、删文件、强关计算机最多伤数据伤硬件，不会引入病毒。"},{"c":8,"n":26,"m":"M1","mn":"计算机基础","s":"使用大量垃圾信息，占用带宽（拒绝服务）的攻击，破坏了计算机安全中的____。","o":["保密性","完整性","可用性","可靠性"],"a":"C","status":"OK","ex":"拒绝服务攻击用海量垃圾信息占满带宽和系统资源，让合法用户无法获得服务，破坏的正是可用性，C正确；保密性、完整性、可靠性都不受这种攻击方式的直接破坏。","roast":"题干里都写着'拒绝服务'四个字了，服务不可用对应可用性，这分不拿老娘替你急。"},{"c":8,"n":27,"m":"M1","mn":"计算机基础","s":"下列情况中，破坏了数据的保密性的攻击是____。","o":["假冒他人发送数据","不承认做过信息的递交行为","数据在传输中途被篡改","数据在传输中途被窃听"],"a":"D","status":"OK","ex":"保密性要求信息不暴露给未经授权者，传输途中被窃听就是泄密，D正确；假冒破坏真实性，不承认递交破坏不可抵赖性，被篡改破坏完整性。"},{"c":8,"n":28,"m":"M1","mn":"计算机基础","s":"流量分析是指通过对截获的信息量的统计来分析其中有用的信息，它____。","o":["属于主动攻击，破坏信息的可用性","属于主动攻击，破坏信息的保密性","属于被动攻击，破坏信息的完整性","属于被动攻击，破坏信息的保密性"],"a":"D","status":"OK","ex":"流量分析不改动任何数据内容，只统计截获信息的流量、频度来推测有用信息，因此属于被动攻击，且泄露的是通信双方和通信量这类保密信息，破坏保密性，D正确。"},{"c":8,"n":29,"m":"M1","mn":"计算机基础","s":"计算机病毒通常要破坏系统中的某些文件或数据，它____。","o":["属于主动攻击，破坏信息的可用性","属于主动攻击，破坏信息的可审性","属于被动攻击，破坏信息的可审性","属于被动攻击，破坏信息的可用性"],"a":"A","status":"OK","ex":"病毒对系统中的文件和数据发动破坏，使系统无法正常提供服务，属于主动攻击且破坏可用性，A正确；它不是不改动数据的被动攻击，也不是针对可审性的行为。"},{"c":8,"n":30,"m":"M1","mn":"计算机基础","s":"计算机安全中的实体安全主要是指____。","o":["计算机物理硬件实体的安全","操作员人身实体的安全","数据库文件的安全","应用程序的安全"],"a":"A","status":"OK","ex":"实体安全指计算机物理硬件实体（主机、外设、存储介质、机房环境等）的安全，A正确；B扯到了人，C、D属于数据和软件层面的安全，都不是'实体'。"},{"c":8,"n":31,"m":"M1","mn":"计算机基础","s":"对计算机病毒，叙述正确的是____。","o":["有些病毒可能破坏硬件系统","有些病毒无破坏性","都破坏操作系统","不破坏数据，只破坏程序"],"a":"A","status":"OK","ex":"像CIH这类病毒可以改写BIOS、破坏硬件系统，'有些病毒可能破坏硬件'成立，A正确；B与'病毒必有破坏性'的定义矛盾，C、D过于绝对，病毒既可破坏操作系统也可破坏数据。"},{"c":8,"n":32,"m":"M1","mn":"计算机基础","s":"计算机病毒最主要的特征是____。","o":["传染性和破坏性","破坏性和突发性","欺骗性和偶发性","变异性和周期性"],"a":"A","status":"OK","ex":"传染性和破坏性是病毒最主要、最基本的两大特征，缺一不成其为病毒，A正确；突发性、欺骗性、变异性只是部分病毒的表现，算不上最主要特征。","roast":"传染性+破坏性，六个字背一辈子都值得，这都丢分老娘真想拿书拍你。"},{"c":8,"n":33,"m":"M1","mn":"计算机基础","s":"计算机染上病毒后，不可能出现的现象是____。","o":["系统出现异常启动或经常“死机”","程序或数据无故丢失","磁盘空间变小","电源风扇的声音突然变大"],"a":"D","status":"OK","ex":"异常启动、经常死机、程序数据无故丢失、磁盘空间异常变小都是典型染毒症状；电源风扇声音突然变大是散热或积灰等硬件问题，与病毒无关，D不可能由病毒引起。"},{"c":8,"n":34,"m":"M1","mn":"计算机基础","s":"计算机病毒是指在计算机磁盘上进行自我复制的____。","o":["一段程序","一条命令","一个标记","一个文件"],"a":"A","status":"OK","ex":"计算机病毒的本质是一段能在磁盘上自我复制的程序代码，A正确；单条命令、标记都谈不上自我复制，病毒通常寄生在别的文件里而不是一个独立完整文件。","roast":"病毒是一段程序，教材第一句定义，白给分接不住就别上考场了。"},{"c":8,"n":35,"m":"M1","mn":"计算机基础","s":"下面关于计算机病毒说法正确的是____。","o":["正版的操作系统也会受计算机病毒的攻击","网络病毒传播的唯一方式是通过发送邮件来传播","防病毒软件无法查出压缩文件中的病毒","一台计算机只要杀死了某种病毒，则该计算机不会再感染这种病毒"],"a":"A","status":"OK","ex":"正版系统同样存在漏洞，照样会被病毒攻击，A正确；B错在'唯一'，病毒传播途径很多；C错在绝对化，现代杀软能查压缩包内病毒；D错在杀过毒并没有免疫力，仍可能再感染。"},{"c":8,"n":36,"m":"M1","mn":"计算机基础","s":"下面关于计算机病毒的特征，说法错误的是____。","o":["计算机病毒可以直接或间接执行","通过计算机杀毒软件可以找到计算机病毒的文件名","计算机病毒可以利用操作系统的漏洞隐藏自己","计算机病毒的攻击有激发条件"],"a":"B","status":"OK","ex":"病毒寄生在宿主文件之中，没有自己独立的文件名，杀毒软件报出的是宿主文件和病毒名称，'找到计算机病毒的文件名'说法错误，B为答案；A、C、D都是病毒的真实特性。"},{"c":8,"n":37,"m":"M1","mn":"计算机基础","s":"下列关于防火墙的说法错误的是____。","o":["防火墙即可以预防外部的非法访问，也可以预防内网对外网的非法访问","防火墙对大多数病毒无预防能力","防火墙可以抵抗最新的未设置策略的攻击","防火墙可以阻断攻击，但不能消灭攻击源"],"a":"C","status":"OK","ex":"防火墙只能按已配置的安全策略拦截通信，对策略未覆盖的最新攻击无能为力，C说法错误；A、B、D都是正确描述，防火墙确实防不了大多数病毒，只能阻断攻击而不能消灭攻击源。"},{"c":8,"n":38,"m":"M1","mn":"计算机基础","s":"针对计算机病毒，以下说法正确的是____。","o":["所谓良性病毒是指：虽叫做计算机病毒，但实际对计算机的运行无任何影响","任何计算机病毒都有清除的办法","计算机病毒具有周期性","计算机病毒的特征码是不会变化的"],"a":"B","status":"OK","ex":"病毒一旦被分析掌握，总能找到对应的清除方法，B正确；良性病毒也会占用资源影响运行，'无任何影响'错；周期性不是病毒的特征；病毒会变异，特征码并非一成不变。"},{"c":8,"n":39,"m":"M1","mn":"计算机基础","s":"360安全卫士可以有效保护各种系统账户安全的是____。","o":["清理垃圾","木马查杀","系统修复","系统升级"],"a":"B","status":"OK","ex":"盗号主要靠木马窃取账号密码，因此'木马查杀'才是保护系统账户安全的核心功能，B正确；清理垃圾、系统修复、系统升级都不针对盗号威胁。"},{"c":8,"n":40,"m":"M1","mn":"计算机基础","s":"下面不属于网络安全服务的是____。","o":["入侵检测技术","防火墙技术","身份认证技术","语义完整性技术"],"a":"D","status":"OK","ex":"入侵检测、防火墙、身份认证都是标准的网络安全服务；'语义完整性技术'是拼凑出来的名词，不属于网络安全服务，D正确。"},{"c":8,"n":41,"m":"M1","mn":"计算机基础","s":"下面不属于网络安全服务的是____。","o":["访问控制技术","数据加密技术","身份认证技术","数据统一性技术"],"a":"D","status":"OK","ex":"访问控制、数据加密、身份认证都是网络安全服务，A、B、C属于；'数据统一性技术'是生造的概念，D不属于。"},{"c":8,"n":42,"m":"M1","mn":"计算机基础","s":"下面，说法正确的是____。","o":["TCSEC系统评价准则是一个评估计算机系统安全性能的一个标准","TCSEC系统评价准则是一个评估计算机系统性能高低的一个标准","TCSEC系统评价准则是一个评估计算机系统稳定性高低的一个标准","TCSEC系统评价准则是一个评估计算机系统性价比的一个标准"],"a":"A","status":"OK","ex":"TCSEC（可信计算机系统评估准则）是评估计算机系统安全性能、划分安全等级的标准，A正确；把它说成评估性能、稳定性、性价比的标准全都跑偏了。"},{"c":8,"n":43,"m":"M1","mn":"计算机基础","s":"访问控制中的“授权”是用来____。","o":["限制用户对资源的访问权限","控制用户可否上网","控制操作系统是否可以启动","控制是否有收发邮件的权限"],"a":"A","status":"OK","ex":"授权就是给用户分配对具体资源的访问权限，是访问控制的核心，A正确；能否上网、系统启动、收发邮件都不是'授权'概念所针对的对象。"},{"c":8,"n":44,"m":"M1","mn":"计算机基础","s":"下面关于认证技术说法正确的是____。","o":["认证技术可以识别所访问的IP地址是否合法","DNA认证是目前计算机身份认证方式中最常用的认证方式","账户名和口令认证方式是计算机身份认证技术中最常用的认证方式","信息认证必须有专门的硬件支持才可以实现"],"a":"C","status":"OK","ex":"账户名加口令是目前最常用、最普及的身份认证方式，C正确；识别IP合法性不是认证技术的典型说法，DNA认证成本高根本不常用，信息认证靠软件算法即可实现、无需专门硬件。"},{"c":8,"n":45,"m":"M1","mn":"计算机基础","s":"计算机安全属性中的保密性是指____。","o":["用户的身份要保密","用户使用信息的时间要保密","用户使用的主机号要保密","确保信息不暴露给未经授权的实体"],"a":"D","status":"OK","ex":"保密性的标准定义就是确保信息不暴露给未经授权的实体，D正确；A、B、C只是把'保密'狭隘地理解成藏身份、藏时间、藏主机号，都不是定义本身。","roast":"保密性的定义一句话背下来就送分，这都丢，回去把课本吃了。"},{"c":8,"n":46,"m":"M1","mn":"计算机基础","s":"针对计算机病毒的传染性，正确的说法是____。","o":["计算机病毒能传染给未感染此类病毒的计算机","计算机病毒能传染给使用该计算机的操作员","计算机病毒也能传染给已感染此类病毒的计算机","计算机病毒不能传染给安装了杀毒软件的计算机"],"a":"A","status":"OK","ex":"传染性就是把自身复制传给未感染此类病毒的计算机，A正确；病毒传不了人，B荒谬；已感染同类病毒的机器谈不上再被'传染'，C无意义；装了杀毒软件照样可能中招，D错。"},{"c":8,"n":47,"m":"M1","mn":"计算机基础","s":"计算机安全属性中的可用性是指____。","o":["得到授权的实体在需要时能访问资源和得到服务","网络速度要达到一定的要求","软件必须功能完整","数据库的数据必须可靠"],"a":"A","status":"OK","ex":"可用性指得到授权的实体在需要时能够访问资源、得到服务，A正确；网速达标、软件功能完整、数据可靠都不是'可用性'这一安全属性的定义内容。"},{"c":8,"n":48,"m":"M1","mn":"计算机基础","s":"下面，关于计算机安全属性说法不正确的是____。","o":["计算机的安全属性包括：保密性、完整性、不可抵赖性、可靠性等","计算机的安全属性包括：保密性、完整性、不可抵赖性、可用性等","计算机的安全属性包括：可靠性、完整性、保密性、正确性等","计算机的安全属性包括：保密性、完整性、可用性、可靠性等"],"a":"C","status":"OK","ex":"保密性、完整性、可用性、可靠性、不可抵赖性都是计算机安全属性，A、B、D所列均属之；C混入了'正确性'，正确性不属于安全属性，故C错误。"},{"c":8,"n":49,"m":"M1","mn":"计算机基础","s":"下列服务中，不属于可用性服务的是____。","o":["备份","防病毒技术","灾难恢复","加密技术"],"a":"D","status":"OK","ex":"备份、防病毒技术、灾难恢复都是为了保障系统'随时能用'，属于可用性服务；加密技术保障的是保密性，D不属于可用性服务。"},{"c":8,"n":50,"m":"M1","mn":"计算机基础","s":"下面无法预防计算机病毒的做法是____。","o":["经常运行防病毒软件","经常升级防病毒软件","经常改变计算机的口令","不要轻易打开陌生人的邮件"],"a":"C","status":"OK","ex":"改变计算机口令防的是账号被盗用，对预防病毒毫无作用，C正确；运行、升级防病毒软件和不乱开陌生人邮件都是有效的防毒措施。"},{"c":8,"n":51,"m":"M1","mn":"计算机基础","s":"系统安全主要是指____。","o":["应用系统安全","硬件系统安全","数据库系统安全","操作系统安全"],"a":"D","status":"OK","ex":"计算机安全中'系统安全'特指操作系统安全，它是所有应用软件运行的基础平台，D正确；应用系统、数据库系统的安全都建立在操作系统安全之上，不叫系统安全。","roast":"系统安全=操作系统安全，教材原话照背就送分，白给都不要是吧。"},{"c":8,"n":52,"m":"M1","mn":"计算机基础","s":"计算机安全的属性并不包括____。","o":["要保证信息传送时，非授权放无法理解所发送信息的语义","要保证信息传送时，信息不被篡改和破坏","要保证合法的用户能得到相应的服务","要保证信息使用的合理性"],"a":"D","status":"OK","ex":"A说的是保密性、B是完整性、C是可用性，都属于计算机安全属性的要求；'信息使用的合理性'不是安全属性的内容，D正确。"},{"c":8,"n":53,"m":"M1","mn":"计算机基础","s":"信息认证技术不包括验证____。","o":["消息发送的时间","发送的消息序号","消息传送中是否被窃听","信息传送中是否被修改"],"a":"C","status":"OK","ex":"信息认证可以验证消息的时间、序号以及是否被修改，但窃听不改变消息本身、无法通过认证发现，C不属于信息认证的验证内容。"},{"c":8,"n":54,"m":"M1","mn":"计算机基础","s":"关于防火墙的功能，说法错误的是____。","o":["所有进出网络的通信流必须经过防火墙","所有进出网络的通信流必须有安全策略的确认和授权","防火墙能保护站点不被任意连接","防火墙可以代替防病毒软件"],"a":"D","status":"OK","ex":"防火墙按安全策略控制通信流，但它防不了病毒，更代替不了防病毒软件，D错误；A、B、C都是对防火墙功能的正确描述。"},{"c":8,"n":55,"m":"M1","mn":"计算机基础","s":"360安全卫士的功能不包括____。","o":["电脑体验","图形、图像处理","木马查杀","系统修复"],"a":"B","status":"OK","ex":"电脑体验、木马查杀、系统修复都是360安全卫士的功能，A、C、D属于；图形图像处理是图像编辑软件的活，与安全卫士无关，B不属于。"},{"c":8,"n":56,"m":"M1","mn":"计算机基础","s":"下面，针对360安全卫士软件，说法错误的是____。","o":["360安全卫士可以检测出系统是否有漏洞","360安全卫士可以在下载时查出下载对象中是否有可疑的木马程序","360安全卫士可以自动进行碎片整理","360安全卫士可以通过“清理插件”来提高计算机的运行速度"],"a":"C","status":"OK","ex":"磁盘碎片整理是操作系统自带工具（碎片整理程序）的功能，360安全卫士并不会自动进行碎片整理，C说法错误；A、B、D都是它的真实功能。"},{"c":8,"n":57,"m":"M1","mn":"计算机基础","s":"拥有查杀木马、清理插件、修复漏洞、电脑体验等多种功能，并独创了“木马防火墙”功能的软件是____。","o":["Office软件","微软浏览器","360安全卫士","迅雷"],"a":"C","status":"OK","ex":"'木马防火墙'是360安全卫士的招牌功能，题干所列的查杀木马、清理插件、修复漏洞、电脑体验正是它的功能清单，C正确；Office是办公软件，微软浏览器是上网工具，迅雷是下载工具。","roast":"把360的广告词念一遍让你认，这分拿不下来老娘都替你臊得慌。"},{"c":8,"n":58,"m":"M1","mn":"计算机基础","s":"下面，不属于360安全卫士的重要功能的是____。","o":["电脑体验","文字处理","木马查杀","清理插件"],"a":"B","status":"OK","ex":"电脑体验、木马查杀、清理插件都是360安全卫士的核心功能，A、C、D属于；文字处理是Word这类办公软件的功能，B不属于。"},{"c":8,"n":59,"m":"M1","mn":"计算机基础","s":"Windows操作系统在逻辑设计上的缺陷或者编写时产生的错误称为____。","o":["系统垃圾","系统漏洞","系统插件","木马病毒"],"a":"B","status":"OK","ex":"操作系统在逻辑设计上的缺陷或编写错误就称为'系统漏洞'，B正确；系统垃圾指冗余无用文件，插件是依附于系统的小程序，木马病毒是恶意程序，都不是'缺陷或错误'本身。","roast":"题干把定义都念完了，照着认一遍就送分，这都能错，服了。"},{"c":8,"n":60,"m":"M1","mn":"计算机基础","s":"下面对计算机“日志”文件，说法错误的是____。","o":["“木马”不会主动传播","“木马”通常没有既定的攻击目标","“木马”更多的目的是“偷窃”","“木马”有特定的图标 答案：DCDCC CCBBC DABDA CADDD"],"a":"C","status":"OK","ex":"按选项判断：木马不主动传播（不自我复制）、通常没有既定的攻击目标、有特定图标（伪装成正常程序）都是教材认可的说法；教材认为木马的主要目的是远程控制目标主机，'更多的目的是偷窃'与之不符，故选C。"},{"c":5,"n":1,"m":"X1","mn":"演示文稿（考纲外）","s":"PowerPoint2010演示文稿文件的扩展名是____。","o":["ppsx","pptx","ppt","pps"],"a":"B","status":"OK","ex":"答案B。pptx是PowerPoint 2007及以后版本演示文稿的默认扩展名；ppsx是放映格式，ppt和pps是2003版文稿及放映格式的老扩展名。","roast":"pptx都记不住？送分题送出门了你还能摔一跤，老娘服了。"},{"c":5,"n":2,"m":"X1","mn":"演示文稿（考纲外）","s":"PowerPoint中选择了某种设计模板，幻灯片原来的背景是否显示____。","o":["可以选择","不能选择","不能忽略模板","不改变"],"a":"A","status":"OK","ex":"答案A。应用设计模板后原有背景并非被强制覆盖，用户可以选择是否保留原背景；B、C把话说死了，D\"不改变\"又与应用模板会改变外观相矛盾。"},{"c":5,"n":3,"m":"X1","mn":"演示文稿（考纲外）","s":"演示文稿中，超链接中所链接的目标可以是____。","o":["计算机硬盘中的可执行文件","其他幻灯片文件","同一演示文稿的某一张幻灯片","以上都可以"],"a":"D","status":"OK","ex":"答案D。PowerPoint超链接的目标范围很宽：计算机硬盘中的可执行文件、其他幻灯片文件、同一演示文稿内的某张幻灯片都能链接；A、B、C各自只说对了一部分，所以选\"以上都可以\"。"},{"c":5,"n":4,"m":"X1","mn":"演示文稿（考纲外）","s":"在PowerPoint中，停止幻灯片播放的快捷键是____。","o":["Enter","Shift","Esc","Ctrl"],"a":"C","status":"OK","ex":"答案C。Esc是终止幻灯片放映的标准键；Enter用于翻到下一对象，Shift和Ctrl只是修饰键，单独按不会结束放映。","roast":"Esc退出放映都不知道，你键盘是拿来敲核桃的吗。"},{"c":5,"n":5,"m":"X1","mn":"演示文稿（考纲外）","s":"在Powerpoint2010中，要设置幻灯片循环放映，应使用的选项卡是____。","o":["开始","视图","幻灯片放映","审阅"],"a":"C","status":"OK","ex":"答案C。循环放映在\"幻灯片放映\"选项卡的\"设置幻灯片放映\"中勾选\"循环放映，按Esc键终止\"；开始、视图、审阅选项卡里没有这项设置。"},{"c":5,"n":6,"m":"X1","mn":"演示文稿（考纲外）","s":"如果要从一张幻灯片“溶解”到下一张幻灯片，应使用____选项卡进行设置。","o":["动作设置","切换","幻灯片切换","自定义动画"],"a":"B","status":"OK","ex":"答案B。\"溶解\"是幻灯片之间的过渡效果，在2010版的\"切换\"选项卡中设置；\"幻灯片切换\"是2003版的旧菜单叫法，\"自定义动画\"管的是对象动画，与换片效果无关。"},{"c":5,"n":7,"m":"X1","mn":"演示文稿（考纲外）","s":"如果要从第2张幻灯片跳转到第8张幻灯片，应使用“幻灯片放映”选项卡中的____。","o":["排练计时","广播幻灯片","录制幻灯片演示","自定义幻灯片放映"],"a":"D","status":"OK","ex":"答案D。用\"幻灯片放映\"选项卡中的\"自定义幻灯片放映\"可以挑选和组织要放映的幻灯片子集，从而从第2张跳到第8张接续播放；排练计时管时间，广播和录制幻灯片演示与跳转无关。"},{"c":5,"n":8,"m":"X1","mn":"演示文稿（考纲外）","s":"PowerPoint2010中插入图表是用于____。","o":["用于演示和比较数据","可视化地显示文本","可以说明一个进程","可以显示一个组织结构图"],"a":"A","status":"OK","ex":"答案A。图表的用途是把数据可视化地演示和比较；说明进程要靠流程类SmartArt，显示组织结构用组织结构图，都不是图表的职责。"},{"c":5,"n":9,"m":"X1","mn":"演示文稿（考纲外）","s":"在PowerPoint2010中，能够将文本中字符简体转换成繁体的设置____。","o":["在“审阅”选项卡中","在“开始”选项卡中","在“格式”选项卡中","在“插入”选项卡中"],"a":"A","status":"OK","ex":"答案A。简繁转换功能在\"审阅\"选项卡中，与Word一致；其余选项卡没有这个功能。"},{"c":5,"n":10,"m":"X1","mn":"演示文稿（考纲外）","s":"在PowerPoint2010中，对幻灯片的重新排序、添加和删除等操作，以及审视整体构思都特别有用的视图是____。","o":["幻灯片视图","幻灯片浏览视图","大纲视图","备注页视图"],"a":"B","status":"OK","ex":"答案B。幻灯片浏览视图以缩略图形式平铺全部幻灯片，最适合重新排序、添加删除和审视整体构思；幻灯片视图适合逐张编辑，大纲视图侧重文本层级，备注页视图用于查看备注。"},{"c":5,"n":11,"m":"X1","mn":"演示文稿（考纲外）","s":"在PowerPoint中，若需将幻灯片从打印机输出，可以用下列快捷键____。","o":["Shift+P","Shift+L","Ctrl+P","Alt+P"],"a":"C","status":"OK","ex":"答案C。Ctrl+P是Office各组件通用的打印快捷键；Shift+P、Shift+L、Alt+P都不是打印命令。","roast":"Ctrl+P打印，Office全家桶通用的键位，背不下来老娘真的会笑出声。"},{"c":5,"n":12,"m":"X1","mn":"演示文稿（考纲外）","s":"在PowerPoint2010中，若要插入组织结构图，应该进行的操作是____。","o":["插入自选图形","插入来自文件的图形","在“插入”选项卡中的SmartArt图形选项中选择“层次结构”图形","在“插入”选项卡中的图表选项中选择“层次图形”"],"a":"C","status":"OK","ex":"答案C。组织结构图通过\"插入\"选项卡中的SmartArt图形选择\"层次结构\"类型来创建；自选图形和插入文件图片做不出标准的层次结构，图表选项里也不存在\"层次图形\"这一类。"},{"c":5,"n":13,"m":"X1","mn":"演示文稿（考纲外）","s":"在PowerPoint中，当向幻灯片中添加数据表时，首先从电子表格复制数据，然后用“开始”选项卡\n中的____命令。","o":["全选","清除","粘贴","替换"],"a":"C","status":"OK","ex":"答案C。从电子表格复制数据后，用\"开始\"选项卡中的\"粘贴\"命令把数据放入幻灯片的数据表；全选、清除、替换都不是完成这一步的操作。"},{"c":5,"n":14,"m":"X1","mn":"演示文稿（考纲外）","s":"编辑幻灯片母版时，在标题区或文本区添加各幻灯片都共有文本的方法是____。","o":["选择带有文本占位符的幻灯片版式","单击直接输入","使用文本框输入","使用模板"],"a":"A","status":"OK","ex":"答案A。在母版中选择带有文本占位符的版式并输入文本，文本会出现在所有应用该版式的幻灯片上；直接单击输入或用文本框添加的内容只对单张幻灯片有效。"},{"c":5,"n":15,"m":"X1","mn":"演示文稿（考纲外）","s":"在幻灯片中插入的声音元素，幻灯片播放时____。","o":["用鼠标单击声音图标，才能开始播放","只能在有声音图标的幻灯片中播放，不能跨幻灯片连续播放","只能连续播放声音，中途不能停止","可以按需要灵活设置声音元素的播放"],"a":"D","status":"OK","ex":"答案D。幻灯片中插入的声音可以按需灵活设置：单击图标播放、自动播放、跨幻灯片连续播放、中途停止都可以；A、B、C各自把播放方式说死了。"},{"c":5,"n":16,"m":"X1","mn":"演示文稿（考纲外）","s":"若使幻灯片播放时，从“盒装展开”效果变换到下一张幻灯片，需要设置____。","o":["自定义动画","放映方式","幻灯片切换","自定义放映"],"a":"C","status":"OK","ex":"答案C。\"盒装展开\"是幻灯片之间的换片过渡效果，属于\"幻灯片切换\"的设置范围；自定义动画针对幻灯片内对象，放映方式和自定义放映不设置效果样式。"},{"c":5,"n":17,"m":"X1","mn":"演示文稿（考纲外）","s":"在PowerPoint2010中，需要在幻灯片中同时移动多个对象时____。","o":["只能以英寸为单位移动这些对象","一次只能移动一个对象","可以将这些对象编组，把它们视为一个整体","修改演示文稿中各个幻灯片的布局"],"a":"C","status":"OK","ex":"答案C。将多个对象编组（组合）后即可作为一个整体同时移动；\"一次只能移动一个\"与事实相反，以英寸为单位和修改布局都不是移动多对象的办法。"},{"c":5,"n":18,"m":"X1","mn":"演示文稿（考纲外）","s":"从头播放幻灯片文稿时，需要跳过第5~9张幻灯片接续播放，应设置____。","o":["隐藏幻灯片","设置幻灯片版式","幻灯片切换方式","删除5~9张幻灯片"],"a":"A","status":"OK","ex":"答案A。把第5~9张设为\"隐藏幻灯片\"，从头放映时会自动跳过它们且内容保留；改版式和切换方式实现不了跳页，直接删除则幻灯片真没了。"},{"c":5,"n":19,"m":"X1","mn":"演示文稿（考纲外）","s":"如果将演示文稿放在另外一台没有安装Powerpoint软件的电脑上播放，需要进行____。","o":["复制/粘贴操作","重新安装软件和文件","打包操作","新建幻灯片文件"],"a":"C","status":"OK","ex":"答案C。通过\"打包\"（打包成CD）操作可把播放器、链接的文件等一并带上，在没装PowerPoint的电脑上也能放映；单纯复制粘贴文件过去会打不开。"},{"c":5,"n":20,"m":"X1","mn":"演示文稿（考纲外）","s":"为Powerpoint2010中已选定的文字设置“陀螺转”动画效果的操作方法是____。","o":["选择“幻灯片放映”选项卡中的“动画方案”","选择“幻灯片放映”选项卡中的“自定义动画”","选择“动画”选项卡中的动画效果","选择“格式”选项卡中的“样式和格式”"],"a":"C","status":"OK","ex":"答案C。2010版中给选定文字设置\"陀螺旋\"这类对象动画，统一在\"动画\"选项卡中选择动画效果；\"动画方案\"\"自定义动画\"是2003版旧菜单，\"格式\"选项卡里管样式不管动画。"},{"c":5,"n":21,"m":"X1","mn":"演示文稿（考纲外）","s":"广播幻灯片操作，应选择的功能区是____。","o":["视图","审阅","动画","幻灯片放映"],"a":"D","status":"OK","ex":"答案D。\"广播幻灯片\"按钮位于\"幻灯片放映\"选项卡中；视图、审阅、动画选项卡里都没有这个功能。"},{"c":5,"n":22,"m":"X1","mn":"演示文稿（考纲外）","s":"若要使幻灯片按规定的时间，实现连续自动播放，应进行____。","o":["设置放映方式","打包操作","排练计时","幻灯片切换"],"a":"C","status":"OK","ex":"答案C。排练计时会记录排练时每张幻灯片的实际停留时间，配合自动放映即可按规定时间连续播放；设置放映方式只是换片方式选项，打包与播放节奏无关，切换设置也不记录时间。"},{"c":5,"n":23,"m":"X1","mn":"演示文稿（考纲外）","s":"PowerPoint2010中，可实现幻灯片中文本替换的快捷键是____。","o":["Ctrl+H","Shift+H","Ctrl+Shift+H","Ctrl+F"],"a":"A","status":"OK","ex":"答案A。Ctrl+H是\"替换\"快捷键，Ctrl+F是\"查找\"，Shift+H和Ctrl+Shift+H都不是替换命令。","roast":"Ctrl+H替换、Ctrl+F查找，这套键位都记不住，Office算是白摸了。"},{"c":5,"n":24,"m":"X1","mn":"演示文稿（考纲外）","s":"若要在幻灯片中插入垂直文本，应选择的选项是____。","o":["“开始”选项卡的“文本框”按钮","“审阅”选项卡的“文本框”按钮","“格式”选项卡的“文本框”按钮","“插入”选项卡的“文本框”按钮"],"a":"D","status":"OK","ex":"答案D。文本框（含垂直文本框）按钮在\"插入\"选项卡中；开始、审阅、格式选项卡下没有插入文本框的入口。"},{"c":5,"n":25,"m":"X1","mn":"演示文稿（考纲外）","s":"设置背景时，若使所选择的背景仅适用于当前所选择的幻灯片，应该按____。","o":["“全部应用”按钮","“关闭”按钮","“取消”按钮","“重置背景”按钮"],"a":"B","status":"OK","ex":"答案B。设置背景后直接点\"关闭\"按钮，背景只应用于当前选中的幻灯片；点\"全部应用\"才会铺满整个演示文稿，\"取消\"\"重置背景\"都不会保存该设置。"},{"c":5,"n":26,"m":"X1","mn":"演示文稿（考纲外）","s":"在幻灯片上设置的超级链接，可以使幻灯片播放时自由跳转到____。","o":["不能跳转到某一张幻灯片","某一幻灯片的自动排练计时","不能跳转到某一个Web页面","某一个可以执行的文件"],"a":"D","status":"OK","ex":"答案D。放映时超链接可以跳转到某一个可执行的文件；而A、C声称\"不能跳转到某张幻灯片/Web页面\"本身就错——这两个恰恰是超链接的常规目标，B的\"自动排练计时\"也不是链接目标。"},{"c":5,"n":27,"m":"X1","mn":"演示文稿（考纲外）","s":"在PowerPoint2010幻灯片中，不可以插入____文件。","o":["Avi","Wav","Bmp","Exe"],"a":"D","status":"OK","ex":"答案D。Avi视频、Wav音频、Bmp图片都是幻灯片可插入的媒体和图像格式；Exe是可执行程序文件，不能作为内容插入幻灯片。"},{"c":5,"n":28,"m":"X1","mn":"演示文稿（考纲外）","s":"广播幻灯片的快捷键是____。","o":["Ctrl+F5","Ctrl+F1","Shift+F5","Shift+F1"],"a":"A","status":"OK","ex":"答案A。PPT2010中\"广播幻灯片\"的快捷键是Ctrl+F5；Shift+F5是\"从当前幻灯片开始放映\"，F1系组合键与广播无关。","roast":"Ctrl+F5广播，纯背的题，连背都不肯背还考什么试。"},{"c":5,"n":29,"m":"X1","mn":"演示文稿（考纲外）","s":"幻灯片放映时使光标变成“激光笔”效果的操作是____。","o":["按Ctrl+F5","按Shift+F5","按住Ctrl键的同时，按住鼠标的左键","执行“幻灯片放映”→“自定义放映”命令"],"a":"C","status":"OK","ex":"答案C。放映时按住Ctrl键的同时按住鼠标左键，光标会变成\"激光笔\"（红点）效果；Ctrl+F5是广播、Shift+F5是从当前页放映，都与激光笔无关。"},{"c":5,"n":30,"m":"X1","mn":"演示文稿（考纲外）","s":"对幻灯片进行“排练计时”的设置，其主要的作用是____。","o":["预置幻灯片播放时的动画效果","预置幻灯片播放时的放映方式","预置幻灯片的播放次序","预置幻灯片播放的时间控制"],"a":"D","status":"OK","ex":"答案D。排练计时记录的是每张幻灯片放映所花费的时间，作用是预置播放的时间控制；它既不设置动画和放映方式，也不改变播放次序。"},{"c":5,"n":31,"m":"X1","mn":"演示文稿（考纲外）","s":"将编辑好的幻灯片保存到Web，需要进行的操作是____。","o":["“文件”选项卡中，在“保存并发送”选项中选择","直接保存幻灯片文件","超级链接幻灯片文件","需要在制作网页的软件中重新制作"],"a":"A","status":"OK","ex":"答案A。2010版把发布类功能集中在\"文件\"选项卡的\"保存并发送\"中，选择相应选项即可将幻灯片保存到Web；直接保存只存本地，做超链接或用网页软件重做都不是正确路径。"},{"c":5,"n":32,"m":"X1","mn":"演示文稿（考纲外）","s":"下面关于插入图片、文字、自选图形等对象的操作描述，正确的是____。","o":["幻灯片片间切换的速度","幻灯片的背景","幻灯片中某一对象的动画效果","幻灯片设计模板 答案：BBDDD CACAC"],"a":"B","status":"OK","ex":"此题题干与选项匹配有缺损（D选项末尾残留了原答案串），无法从现存选项还原原始设问，按既定答案取B\"幻灯片的背景\"；A、C、D分别涉及切换速度、对象动画、设计模板，与答案B不符。"},{"c":9,"n":1,"m":"X2","mn":"多媒体（考纲外）","s":"以下关于多媒体技术的描述中，错误的是____。","o":["多媒体技术将多种媒体以数字化的方式集成在一起","多媒体技术是指将多种媒体进行有机组合而成的一种新的媒体应用系统","多媒体技术就是能用来观看的数字电影技术","多媒体技术与计算机技术的融合开辟出一个多学科的崭新领域"],"a":"C","status":"OK","ex":"答案C。多媒体技术是把文字、声音、图像等多种媒体以数字化方式集成、有机组合而成的应用系统，C把它缩小成“能观看的数字电影技术”，以偏概全；A、B、D都是对多媒体技术的正确表述。"},{"c":9,"n":2,"m":"X2","mn":"多媒体（考纲外）","s":"以下硬件设备中，不是多媒体硬件系统必须包括的是____。","o":["计算机最基本的硬件设备","CD-ROM","音频输入、输出和处理设备","多媒体通信传输设备"],"a":"D","status":"OK","ex":"答案D。多媒体硬件系统由计算机基本硬件、CD-ROM、音频输入输出和处理设备等构成，多媒体通信传输设备只在联网应用中才需要，不属于必须包括的部分。"},{"c":9,"n":3,"m":"X2","mn":"多媒体（考纲外）","s":"以下设备中，不属于音频设备的是____。","o":["声卡","DV卡","音箱","话筒"],"a":"B","status":"OK","ex":"答案B。DV卡用于连接数码摄像机、把DV影片采集到电脑硬盘，属于视频设备；声卡、音箱、话筒才是音频输入输出设备。","roast":"DV是Digital Video，视频俩字都写在名字里了，这都能归进音频，老娘替你的耳朵捏把汗。"},{"c":9,"n":4,"m":"X2","mn":"多媒体（考纲外）","s":"下列对多媒体计算机的描
