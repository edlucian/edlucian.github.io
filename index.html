1","mn":"演示文稿","s":"幻灯片放映时使光标变成“激光笔”效果的操作是____。","o":["按Ctrl+F5","按Shift+F5","按住Ctrl键的同时，按住鼠标的左键","执行“幻灯片放映”→“自定义放映”命令"],"a":"C","status":"OK","ex":"答案C。放映时按住Ctrl键的同时按住鼠标左键，光标会变成\"激光笔\"（红点）效果；Ctrl+F5是广播、Shift+F5是从当前页放映，都与激光笔无关。"},{"c":5,"n":30,"m":"X1","mn":"演示文稿","s":"对幻灯片进行“排练计时”的设置，其主要的作用是____。","o":["预置幻灯片播放时的动画效果","预置幻灯片播放时的放映方式","预置幻灯片的播放次序","预置幻灯片播放的时间控制"],"a":"D","status":"OK","ex":"答案D。排练计时记录的是每张幻灯片放映所花费的时间，作用是预置播放的时间控制；它既不设置动画和放映方式，也不改变播放次序。"},{"c":5,"n":31,"m":"X1","mn":"演示文稿","s":"将编辑好的幻灯片保存到Web，需要进行的操作是____。","o":["“文件”选项卡中，在“保存并发送”选项中选择","直接保存幻灯片文件","超级链接幻灯片文件","需要在制作网页的软件中重新制作"],"a":"A","status":"OK","ex":"答案A。2010版把发布类功能集中在\"文件\"选项卡的\"保存并发送\"中，选择相应选项即可将幻灯片保存到Web；直接保存只存本地，做超链接或用网页软件重做都不是正确路径。"},{"c":5,"n":32,"m":"X1","mn":"演示文稿","s":"下面关于插入图片、文字、自选图形等对象的操作描述，正确的是____。","o":["幻灯片片间切换的速度","幻灯片的背景","幻灯片中某一对象的动画效果","幻灯片设计模板 答案：BBDDD CACAC"],"a":"B","status":"OK","ex":"此题题干与选项匹配有缺损（D选项末尾残留了原答案串），无法从现存选项还原原始设问，按既定答案取B\"幻灯片的背景\"；A、C、D分别涉及切换速度、对象动画、设计模板，与答案B不符。"},{"c":9,"n":1,"m":"X2","mn":"多媒体（考纲外）","s":"以下关于多媒体技术的描述中，错误的是____。","o":["多媒体技术将多种媒体以数字化的方式集成在一起","多媒体技术是指将多种媒体进行有机组合而成的一种新的媒体应用系统","多媒体技术就是能用来观看的数字电影技术","多媒体技术与计算机技术的融合开辟出一个多学科的崭新领域"],"a":"C","status":"OK","ex":"答案C。多媒体技术是把文字、声音、图像等多种媒体以数字化方式集成、有机组合而成的应用系统，C把它缩小成“能观看的数字电影技术”，以偏概全；A、B、D都是对多媒体技术的正确表述。"},{"c":9,"n":2,"m":"X2","mn":"多媒体（考纲外）","s":"以下硬件设备中，不是多媒体硬件系统必须包括的是____。","o":["计算机最基本的硬件设备","CD-ROM","音频输入、输出和处理设备","多媒体通信传输设备"],"a":"D","status":"OK","ex":"答案D。多媒体硬件系统由计算机基本硬件、CD-ROM、音频输入输出和处理设备等构成，多媒体通信传输设备只在联网应用中才需要，不属于必须包括的部分。"},{"c":9,"n":3,"m":"X2","mn":"多媒体（考纲外）","s":"以下设备中，不属于音频设备的是____。","o":["声卡","DV卡","音箱","话筒"],"a":"B","status":"OK","ex":"答案B。DV卡用于连接数码摄像机、把DV影片采集到电脑硬盘，属于视频设备；声卡、音箱、话筒才是音频输入输出设备。","roast":"DV是Digital Video，视频俩字都写在名字里了，这都能归进音频，我替你的耳朵捏把汗。"},{"c":9,"n":4,"m":"X2","mn":"多媒体（考纲外）","s":"下列对多媒体计算机的描述中，较为全面的一项是____。","o":["只能用于编辑音频功能的计算机","带有高分辨率显示设备的、具有大容量内存和硬盘的、包含功能强大中央处理器（CPU）的，并具有音视频处理功能的计算机","只能用于编辑视频功能的计算机","带有磁带机的计算机"],"a":"B","status":"OK","ex":"答案B。多媒体计算机的要点是较高配置（大容量内存硬盘、功能强的CPU、高分辨率显示设备）加上音视频处理能力；A、C各只强调单一编辑功能，D的磁带机与多媒体能力无关。"},{"c":9,"n":5,"m":"X2","mn":"多媒体（考纲外）","s":"以下接口中，一般不能用于连接扫描仪的是____。","o":["USB","SCSI","并行接口","VGA接口"],"a":"D","status":"OK","ex":"答案D。VGA是显卡连接显示器的视频输出接口；扫描仪一般通过USB、SCSI或老式并行接口与计算机连接。"},{"c":9,"n":6,"m":"X2","mn":"多媒体（考纲外）","s":"以下设备中，不是多媒体计算机中常用的图像输入设备的是____。","o":["数码照相机","彩色扫描仪","条码读写器","数码摄像机"],"a":"C","status":"OK","ex":"答案C。条码读写器读取的是条形码编号信息，不采集图像；数码照相机、彩色扫描仪、数码摄像机才是常用的图像输入设备。"},{"c":9,"n":7,"m":"X2","mn":"多媒体（考纲外）","s":"下面功能中，不属于多媒体计算机对图形、图像处理能力的基本要求的是____。","o":["可产生丰富形象逼真的图形","实现三维动画","可以逼真、生动地显示彩色静止图像","实现一定程度的二维动画"],"a":"B","status":"OK","ex":"答案B。对图形图像处理能力的基本要求是产生逼真图形、逼真显示彩色静止图像和实现一定程度的二维动画，三维动画属于更高的处理要求，不在基本要求之列。"},{"c":9,"n":8,"m":"X2","mn":"多媒体（考纲外）","s":"声音文件中，具有较好的压缩效果并保持较好的音质是____。","o":["WAV文件","MIDI文件","MP3文件","AU文件"],"a":"C","status":"OK","ex":"答案C。MP3采用有损压缩，压缩效果好且音质损失小；WAV基本不压缩、体积大，MIDI是合成音乐文件而非录制声音，AU是Sun公司的音频格式，综合表现都不如MP3。"},{"c":9,"n":9,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频设备的描述中，正确的是____。","o":["视频设备只能采集视频数据，不能播放视频数据","视频采集卡的功能是用于采集视频数据","视频采集卡的功能是用于采集音频数据","视频设备包括音频采样卡、合成器、中高频音箱、话筒、PC的声卡、耳机等"],"a":"B","status":"OK","ex":"答案B。视频采集卡的功能就是把摄像头、录像机等来源的视频数据采集进计算机；A说视频设备只能采集不能播放不对，C把采集对象错说成音频，D罗列的声卡、音箱、话筒等其实是音频设备。"},{"c":9,"n":10,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频格式文件的描述中，正确的是____。","o":["MIDI文件很小，但MIDI文件不能被录制，必须使用特殊的硬件和软件在计算机上合成","MIDI文件很大，是通过麦克风录制的","WAV文件通常很小，可以从C","WAV文件通常比MIDI文件小"],"a":"A","status":"OK","ex":"答案A。MIDI记录的是音符等演奏指令，文件很小，且不能被录制，必须用专门的硬件和软件在计算机上合成；WAV是对声音直接采样录制的波形文件，体积远大于MIDI，B、C、D把大小和来源关系都说反了。"},{"c":9,"n":11,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频格式文件的描述中，正确的是____。","o":["mp3格式必须使用特殊的硬件和软件在计算机上合成","mp3格式与WAV格式一样，是一种不带压缩的格式","mp3格式是一种压缩格式，它能使声音文件明显缩小，其声音品质较差","mp3格式文件不必等待整个文件下载完成即可收听该文件"],"a":"D","status":"OK","ex":"答案D。MP3支持流式播放，不必等整个文件下载完即可收听；mp3不需要特殊硬件合成（A错），它本身是压缩格式并非无压缩（B错），其音质相对较好、并非品质较差（C错）。"},{"c":9,"n":12,"m":"X2","mn":"多媒体（考纲外）","s":"以下软件中，不属于音频播放软件的是____。","o":["Winamp","录音机","Premiere","RealPlayer"],"a":"C","status":"OK","ex":"答案C。Premiere是视频编辑软件，不属于音频播放软件；Winamp、RealPlayer和录音机都属于音频播放/处理类工具。"},{"c":9,"n":13,"m":"X2","mn":"多媒体（考纲外）","s":"以下软件中，不属于视频播放的软件是____。","o":["QuickTime Player","Media Player","Winamp","超级解霸"],"a":"C","status":"OK","ex":"答案C。Winamp是经典的音频播放器；QuickTime Player、Media Player、超级解霸都能播放视频，属于视频播放软件。"},{"c":9,"n":14,"m":"X2","mn":"多媒体（考纲外）","s":"以下四项中不是计算机中使用的声音文件的是____。","o":["WAV","MP3","TIF","MID"],"a":"C","status":"OK","ex":"答案C。TIF（TIFF）是图像文件格式；WAV、MP3、MID才是计算机中常用的声音文件格式。","roast":"TIF是图片格式，这都能听出声来？回去把扩展名对照表抄十遍。"},{"c":9,"n":15,"m":"X2","mn":"多媒体（考纲外）","s":"以下关于文件压缩的说法中，错误的是____。","o":["文件压缩后文件尺寸一般会变小","不同类型的文件的压缩比率是不同的","文件压缩的逆过程称为解压缩","使用文件压缩工具可以将JPG图像文件压缩70%左右"],"a":"D","status":"OK","ex":"答案D。JPG本身就是高压缩比的有损压缩图像格式，再用压缩工具压不出70%左右的空间；压缩后尺寸一般变小、不同类型文件压缩比不同、逆过程叫解压缩，这三句都是对的。"},{"c":9,"n":16,"m":"X2","mn":"多媒体（考纲外）","s":"以下关于WinRAR的描述中，错误的是____。","o":["使用WinRAR可以进行分卷压缩","使用WinRAR进行解压缩时，必须一次性解压缩压缩包中的所有文件，而不能解压缩其中的个别文件","使用WinRAR可以制作自解压的EXE文件","双击RAR压缩包打开WinRAR窗口后，一般可以直接双击其中的文件进行查看"],"a":"B","status":"OK","ex":"答案B。WinRAR可以在压缩包中勾选部分文件单独解压，“必须一次性解压所有文件”说法错误；分卷压缩、制作自解压EXE、双击包内文件直接查看都是它的常规功能。"},{"c":9,"n":17,"m":"X2","mn":"多媒体（考纲外）","s":"以下选项中，不是常用的多媒体信息压缩标准的是____。","o":["JPEG标准","MP3压缩","LWZ压缩","MPEG标准"],"a":"C","status":"OK","ex":"答案C。LZW（题面写作LWZ）是无损字典压缩算法，主要用于GIF等图像文件，不属于多媒体信息压缩标准；JPEG、MP3、MPEG分别是静态图像、音频、运动图像的压缩标准。"},{"c":9,"n":18,"m":"X2","mn":"多媒体（考纲外）","s":"以下格式中，属于音频文件格式的是____。","o":["WAV格式","JPG格式","DAT格式","MOV格式"],"a":"A","status":"OK","ex":"答案A。WAV是Windows的波形音频格式；JPG是静态图像格式，DAT在此语境指VCD视频，MOV是QuickTime视频格式。","roast":"WAV是音频都认不出来？我建议把格式对照表贴床头，睡前背一遍。"},{"c":9,"n":19,"m":"X2","mn":"多媒体（考纲外）","s":"以下格式中，不属于视频文件格式的是____。","o":["WMV格式","MID格式","MOV格式","MPG格式"],"a":"B","status":"OK","ex":"答案B。MID是MIDI音乐文件，属于音频；WMV、MOV、MPG都是视频文件格式。","roast":"MID放的是MIDI音乐，拿视频播放器放它放了个寂寞，这都选错？回去背格式。"},{"c":9,"n":20,"m":"X2","mn":"多媒体（考纲外）","s":"以下工具中，属于多媒体创作工具的是____。","o":["Photoshop","Fireworks","PhotoDraw","Authorware"],"a":"D","status":"OK","ex":"答案D。Authorware是典型的多媒体创作工具，负责把多种媒体集成为作品；Photoshop、Fireworks、PhotoDraw都是图像处理软件，只管图，不管多媒体集成。"},{"c":9,"n":21,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频格式文件的描述中，正确的是____。","o":["ra、ram、rpm或Real Audio格式文件大小要大于MP3文件","ra、ram、rpm格式具有非常高的压缩品质，不能进行流式处理","Real Audio格式压缩品质非常高，其声音品质比MP3文件声音品质要差","mp3格式是一种压缩格式，它能使声音文件明显缩小，其声音品质较差"],"a":"C","status":"OK","ex":"答案C。ra、ram、rpm是Real公司的流式音频格式，压缩率很高、文件比MP3小，但声音品质不如MP3；A的大小关系说反了，B错在它能流式处理，D把MP3的音质贬得不对。"},{"c":9,"n":22,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频格式文件的描述中，不正确的是____。","o":["avi格式可以将视频和音频交织在一起进行同步播放","avi格式的优点是图像质量好","avi格式可以跨多个平台使用，其缺点是体积过于庞大","avi格式可以将视频和音频交织在一起进行同步播放，而且体积非常小"],"a":"D","status":"OK","ex":"答案D。AVI图像质量好、可跨平台，缺点恰恰是体积庞大，D的“体积非常小”与事实相反；A、B、C都是对AVI的正确描述。"},{"c":9,"n":23,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频格式文件的描述中，不正确的是____。","o":["mpeg、mpg或dat格式，也就是运动图像专家组（MPEG）格式，是运动图像压缩算法的国际标准","mpeg、mpg或dat格式，也就是静止图像专家组（MPEG）格式","mpeg、mpg或dat格式被用于家用的VC","目前MPEG格式有MPEG-1、MPEG-2和MPEG-4三个压缩标准"],"a":"B","status":"OK","ex":"答案B。MPEG是运动图像专家组（Moving Picture Experts Group）的缩写，不是“静止图像专家组”，对应静态图像的标准是JPEG；A、C、D对MPEG作为运动图像压缩国际标准及家用设备、分代标准的描述正确。"},{"c":9,"n":24,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频格式文件的描述中，不正确的是____。","o":["ra、rm或rmvb格式是流式视频文件格式，用来在低速率的广域网上实时传输活动视频影像","ra、rm或rmvb格式可以根据网络数据传输速率的不同而采用不同的压缩比率","ra、rm或rmvb格式可实现影像数据的实时传送和实时播放","ra、rm或rmvb格式是Windows公司开发的一种静态图像文件格式"],"a":"D","status":"OK","ex":"答案D。ra、rm、rmvb是Real Networks公司开发的流式视频格式，可在低速率广域网上实时传输播放并按网速自适应压缩率；D说它是Windows公司的静态图像格式，完全张冠李戴。"},{"c":9,"n":25,"m":"X2","mn":"多媒体（考纲外）","s":"以下关于多媒体技术的集成特性的说法中，正确是____。","o":["指多种媒体综合使用的特性","指仅限于视频、图形两种媒体各自使用的特性","指仅限于声、光媒体各自使用的特性","指动画单一媒体使用的特性"],"a":"A","status":"OK","ex":"答案A。多媒体的集成性指多种媒体综合使用的特性；B、C、D都用“仅限”“单一”把集成性砍成了单媒体使用。"},{"c":9,"n":26,"m":"X2","mn":"多媒体（考纲外）","s":"一台典型的多媒体计算机的硬件不一定包括____。","o":["高分辨率的显示设备","大容量的内存和硬盘","扫描仪","中央处理器（CPU）"],"a":"C","status":"OK","ex":"答案C。扫描仪是可选外设，不是多媒体计算机的必备硬件；高分辨率显示设备、大容量内存硬盘和CPU才是基本配置。"},{"c":9,"n":27,"m":"X2","mn":"多媒体（考纲外）","s":"下列选项中，不属于计算机多媒体功能的是____。","o":["编辑、播放视频","播放VCD","自动扫描","编辑、播放音乐"],"a":"C","status":"OK","ex":"答案C。自动扫描不属于对音视频、图像等媒体进行采集处理的多媒体功能；编辑播放视频、播放VCD、编辑播放音乐都是典型的计算机多媒体功能。"},{"c":9,"n":28,"m":"X2","mn":"多媒体（考纲外）","s":"以下应用领域中，属于典型的多媒体应用的是____。","o":["科学计算","网上购物","音视频会议系统","网络远端控制"],"a":"C","status":"OK","ex":"答案C。音视频会议系统需要同时处理声音、图像、视频等多种媒体，是典型的多媒体应用；科学计算与多媒体无关，网上购物、网络远端控制也不是以多媒体处理为核心的应用。"},{"c":9,"n":29,"m":"X2","mn":"多媒体（考纲外）","s":"把一台普通的计算机变成多媒体计算机，要解决的关键技术不包括____。","o":["多媒体数据压编码技术","多媒体数据压解码技术","网络包分发技术","视频音频数据的输出技术"],"a":"C","status":"OK","ex":"答案C。普通计算机变成多媒体计算机要解决的关键技术是多媒体数据压缩编码与解码技术、音视频数据的实时处理和输出技术；网络包分发技术不属于这些关键技术。"},{"c":9,"n":30,"m":"X2","mn":"多媒体（考纲外）","s":"以下关于多媒体技术的描述中，错误的是____。","o":["多媒体技术将多种媒体以数字化的方式集成在一起","多媒体技术是指将多媒体进行有机组合而成的一种新的媒体应用系统","多媒体技术与计算机技术的融合开辟出一个多学科的崭新领域","多媒体技术可以不进行数模转化，直接压缩模拟音乐"],"a":"D","status":"OK","ex":"答案D。多媒体处理的前提是数字化，模拟音频必须先经模数转换变成数字信号才能存储和压缩，“不进行数模转化直接压缩模拟音乐”违背了多媒体数字化的基本前提；A、B、C都是正确表述。"},{"c":9,"n":31,"m":"X2","mn":"多媒体（考纲外）","s":"音频设备是音频输入输出设备的总称，以下包含正确的选项是____。","o":["扫描仪、中高频音箱、话筒","摄像机、多媒体控制台、数字调音台","PC中的声卡、耳机、打印机","中高频音箱、话筒、PC中的声卡、耳机、多媒体控制台、数字调音台、功放机、音箱音频采样卡、合成器"],"a":"D","status":"OK","ex":"答案D。D项中的音箱、话筒、声卡、耳机、多媒体控制台、数字调音台、功放机、音频采样卡、合成器都属于音频设备；A混入了扫描仪，B混入了摄像机，C混入了打印机。"},{"c":9,"n":32,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频设备的描述中，正确的是____。","o":["功放机是完成合成音乐（MIDI）的设备","声卡用于进行图形输出的设备","音频卡是处理视频媒体的设备","功放机是用于把来自信号源的微弱电信号进行放大的设备"],"a":"D","status":"OK","ex":"答案D。功放机的作用就是把来自信号源的微弱电信号进行放大以推动音箱；完成MIDI合成的是合成器，声卡、音频卡处理的是音频而非图形或视频，A、B、C都张冠李戴。"},{"c":9,"n":33,"m":"X2","mn":"多媒体（考纲外）","s":"只读光盘CD－ROM属于____。","o":["传播媒体","存储媒体","表现媒体","通信媒体"],"a":"B","status":"OK","ex":"答案B。按媒体分类，用于存储信息的CD-ROM属于存储媒体；表现媒体指键盘、显示器等输入输出设备。","roast":"CD-ROM是存储媒体，四个字背下来就白给的分都不要？"},{"c":9,"n":34,"m":"X2","mn":"多媒体（考纲外）","s":"默认启动Windows Media Player的方法是单击____。","o":["程序→启动→辅助工具→Windows Media Player","程序→系统→辅助工具→Windows Media Player","开始→所有程序→Windows Media Player","控制面板→附件→娱乐→Windows Media Player"],"a":"C","status":"OK","ex":"答案C。默认启动方式就是开始→所有程序→Windows Media Player；A、B的“辅助工具”路径和D的控制面板路径都不是默认方式。","roast":"点两下开始菜单就能找到的事，这也要错？"},{"c":9,"n":35,"m":"X2","mn":"多媒体（考纲外）","s":"下列有关DVD光盘与VCD光盘的描述中，正确的是____。","o":["DVD光盘的图像分辨率比VCD光盘低","DVD光盘的图像质量比VCD光盘差","DVD光盘的记录容量比VCD光盘小","DVD光盘的记录容量比VCD光盘大"],"a":"D","status":"OK","ex":"答案D。DVD的记录容量（数GB级）远大于VCD（约650MB），分辨率和图像质量也都优于VCD，所以A、B、C把优劣全说反了。"},{"c":9,"n":36,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频设备的描述中，不正确的是____。","o":["用于对摄像头或者摄像机等信号进行捕捉、并以MPEG格式存储在硬盘上的视频监控卡","用于在PC上看电视的电视卡","压缩视频信息的视频压缩卡","在PC上处理视频信号的声卡"],"a":"D","status":"OK","ex":"答案D。处理视频信号的是视频类板卡，声卡负责的是音频；视频监控卡、电视卡、视频压缩卡都是常见的视频设备，描述正确。"},{"c":9,"n":37,"m":"X2","mn":"多媒体（考纲外）","s":"以下类型的图像文件中，不经过压缩的是____。","o":["JPG","GIF","TIF","BMP"],"a":"D","status":"OK","ex":"答案D。BMP是Windows位图，逐像素原样存储、不经压缩；JPG采用有损压缩，GIF采用LZW压缩，TIF也常带压缩。","roast":"BMP不压缩是课本白纸黑字，这都记不住？回去把课本吃了。"},{"c":9,"n":38,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频设备的描述中，正确的是____。","o":["视频设备的采集和显示播放是通过音频卡来实现的","视频卡主要用于捕捉、数字化、冻结、存储、输出、放大、缩小和调整来自激光视盘机、录像机或摄像机的图像","电视卡是一种播放软件","视频卡只能进行音频的相关处理"],"a":"B","status":"OK","ex":"答案B。视频卡的功能就是捕捉、数字化、冻结、存储、输出并放大缩小调整来自激光视盘机、录像机或摄像机的图像；A错在视频采集显示靠视频卡而不是音频卡，C错在电视卡是硬件不是播放软件，D说视频卡只能处理音频更是反了。"},{"c":9,"n":39,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频、视频设备的描述中，不正确的是____。","o":["音频设备既可采集音频信号，也可播放音频信号","视频设备是音、视频输入输出设备的总称","视频信息的采集和显示播放时通过视频卡、播放软件和显示设备来实现的","视频卡可以处理一些相关的音频信息"],"a":"B","status":"OK","ex":"答案B。视频设备只是视频输入输出设备的总称，把音频也包进去的说法不对；音频设备可采集可播放、视频信息的采集和显示播放由视频卡、播放软件和显示设备实现、视频卡能处理部分相关音频，这三句都正确。"},{"c":9,"n":40,"m":"X2","mn":"多媒体（考纲外）","s":"多媒体信息在计算机中的存储形式的是____。","o":["二进制数字信息","十进制数字信息","文本信息","模拟信号"],"a":"A","status":"OK","ex":"答案A。计算机中的一切信息都以二进制形式存储，多媒体信息同样被数字化为二进制数字信息，十进制、文本或模拟信号都不是存储形式。","roast":"计算机里只有0和1，这题答错属于没开过机。"},{"c":9,"n":41,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频文件格式的描述中，正确的是____。","o":["MIDI文件通常比WAV文件小，可以从C","MIDI文件通常比MP3文件大","WAV文件通常比MP3文件小","磁带、麦克风等录制WAV文件"],"a":"D","status":"OK","ex":"答案D。WAV是对磁带、麦克风等声源直接采样录制的波形文件；MIDI只能合成不能录制（A错），MIDI文件比MP3小而非大（B错），不压缩的WAV比MP3大（C错）。"},{"c":9,"n":42,"m":"X2","mn":"多媒体（考纲外）","s":"常见的多媒体创作工具不包括____。","o":["Powerpoint","Authorware","Flash","Windows Media Player"],"a":"D","status":"OK","ex":"答案D。Windows Media Player是播放软件，不负责创作多媒体作品；PowerPoint、Authorware、Flash都能用来制作多媒体作品。"},{"c":9,"n":43,"m":"X2","mn":"多媒体（考纲外）","s":"mpeg、mpg或dat格式是运动图像专家组（MPEG）格式，采用这种格式的家用设备不包括____。","o":["DVD","收音机","VCD","SVCD"],"a":"B","status":"OK","ex":"答案B。MPEG是运动图像压缩标准，DVD、VCD、SVCD这类家用影视设备都采用它；收音机只有声音没有图像，与MPEG无关。"},{"c":9,"n":44,"m":"X2","mn":"多媒体（考纲外）","s":"Real Networks公司开发的一种新型流式视频文件格式，可用来在低速率的广域网上实时传输活动视频影像，\n实现影像数据的实时传送和实时播放。它的格式是____。","o":["rmvb","wav","mov","jpg"],"a":"A","status":"OK","ex":"答案A。rmvb正是Real Networks开发的流式视频格式，可在低速率广域网上实时传送和实时播放；wav是音频格式，mov是苹果QuickTime视频格式，jpg是静态图像格式。"},{"c":9,"n":45,"m":"X2","mn":"多媒体（考纲外）","s":"下列选项中，最常用的三维动画制作软件工具是____。","o":["3D MAX","GoldWave","Flash","Fireworks"],"a":"A","status":"OK","ex":"答案A。3D MAX（3ds Max）是最常用的三维动画制作软件；GoldWave用于音频编辑，Flash做二维动画，Fireworks处理网页图像。","roast":"三维软件抓瞎？3D MAX这名字里都写着3D了，白给。"},{"c":9,"n":46,"m":"X2","mn":"多媒体（考纲外）","s":"下列选项中，不属于音频播放软件的是____。","o":["Media Player","Winamp","RealPlayer","Dreamweaver"],"a":"D","status":"OK","ex":"答案D。Dreamweaver是网页制作软件，与音频播放无关；Media Player、Winamp、RealPlayer都是常见的音频播放软件。","roast":"拿做网页的Dreamweaver放歌，你这操作我看着都卡。"},{"c":9,"n":47,"m":"X2","mn":"多媒体（考纲外）","s":"下列选项中，对多媒体技术最全面的描述是____。","o":["多媒体技术只具有同步、集成特性","能够同时获取、处理、编辑、存储和展示两个以上不同类型信息媒体的技术","利用幻灯片教学技术","只能够获取单一信息媒体的技术"],"a":"B","status":"OK","ex":"答案B。多媒体技术的完整定义是能够同时获取、处理、编辑、存储和展示两个以上不同类型信息媒体的技术；A只提同步和集成，C缩成幻灯片教学，D限成单一媒体，覆盖都不全。"},{"c":9,"n":48,"m":"X2","mn":"多媒体（考纲外）","s":"以下对多媒体技术的描述中，正确的是____。","o":["只能够展示一种类型信息媒体或处理两种不同类型信息媒体的技术","能够同时获取、处理、编辑、存储和展示两种以上不同类型信息媒体的技术","不能够同时获取、处理、编辑、存储和展示两种以上不同类型信息媒体的技术","只能够同时获取、处理、编辑、存储和展示两种不同类型信息媒体的技术"],"a":"B","status":"OK","ex":"答案B。多媒体技术能够同时获取、处理、编辑、存储和展示两种以上不同类型的信息媒体；A限制为一种或两种，C直接说“不能”，D把范围钉死在恰好两种，都与定义不符。"},{"c":9,"n":49,"m":"X2","mn":"多媒体（考纲外）","s":"下列关于多媒体技术同步特性的描述中，不正确的是____。","o":["指多种媒体之间同步播放的特性","指单一媒体播放的特性","指两种以上媒体之间同步播放的特性，如视频与音频的同步","指两种以上媒体之间同步播放的特性，如声音与图像的播放同步"],"a":"B","status":"OK","ex":"答案B。同步性指的是两种以上媒体之间同步播放，如声画同步；B的“单一媒体播放”根本谈不上同步。"},{"c":9,"n":50,"m":"X2","mn":"多媒体（考纲外）","s":"下列四项中，不属于计算机多媒体功能的是____。","o":["传真","播放VCD","播放音乐","播放视频"],"a":"A","status":"OK","ex":"答案A。传真不属于计算机多媒体功能；播放VCD、播放音乐、播放视频都是多媒体计算机的常规功能。"},{"c":9,"n":51,"m":"X2","mn":"多媒体（考纲外）","s":"以下应用领域中，属于典型的多媒体应用的是____。","o":["CSCW计算机支持协同工作","视频会议系统","电子表格处理","网络远端控制"],"a":"B","status":"OK","ex":"答案B。视频会议系统同时处理音频、视频等多种媒体，是典型的多媒体应用；CSCW、电子表格处理、网络远端控制不以多媒体处理为核心。"},{"c":9,"n":52,"m":"X2","mn":"多媒体（考纲外）","s":"把一台普通的计算机变成多媒体计算机，要解决的关键技术不包括____。","o":["多媒体数据压缩编码和解码技术","网络交换技术","视频音频数据的实时处理","视频音频数据的输出技术"],"a":"B","status":"OK","ex":"答案B。多媒体计算机要解决的关键技术是数据压缩编码和解码、音视频数据的实时处理与输出，网络交换技术属于计算机网络领域，不在此列。"},{"c":9,"n":53,"m":"X2","mn":"多媒体（考纲外）","s":"下列说法中，正确的是____。","o":["视频卡本身具有图像识别的功能","文件压缩能使文件尺寸变大","多媒体计算机的主要特点是具有较强的音、视频处理能力","彩色电视信号就属于多媒体的范畴"],"a":"C","status":"OK","ex":"答案C。多媒体计算机的主要特点就是较强的音视频处理能力；视频卡本身不做图像识别（A错），压缩只能使文件变小不会变大（B错），彩色电视信号是模拟的单媒体信号、不属于多媒体范畴（D错）。"},{"c":9,"n":54,"m":"X2","mn":"多媒体（考纲外）","s":"使用多媒体的教学手段来进行教学，不能达到的目的是____。","o":["以无人值守控制的方式来进行教学","利用计算机辅助教学","提高课堂教学的生动性","增强课堂教学方式的多样性"],"a":"A","status":"OK","ex":"答案A。多媒体教学仍需教师组织与师生交互，达不到也不以“无人值守控制教学”为目的；计算机辅助教学、提高生动性、增强方式多样性都是它能实现的目标。"},{"c":9,"n":55,"m":"X2","mn":"多媒体（考纲外）","s":"音频设备是音频输入输出设备的总称，包括很多类型的产品，但不包括____。","o":["中高频音箱、音箱音频采样卡","多媒体控制台、数字调音台","打印机、激光扫描仪","功放机、话筒、PC中的声卡、合成器、耳机"],"a":"C","status":"OK","ex":"答案C。打印机和激光扫描仪属于文档/图像输入输出设备，不在音频设备之列；音箱、音频采样卡、控制台、调音台、功放机、话筒、声卡、合成器、耳机都属于音频设备。"},{"c":9,"n":56,"m":"X2","mn":"多媒体（考纲外）","s":"以下对音频设备的描述中，不正确的是____。","o":["音频卡用于处理音频媒体，包括数字化声音（Wave）、合成音乐（MIDI）、CD音频","数字调音台用于将多路输入信号进行放大、混合、分配、音质修饰和音响效果加工","功放机进行人工智能语音处理","声卡的主要功能是音频的录制与播放、编辑与音乐合成、文字语音转换、CD-ROM接口、MIDI接口、游戏接口等声卡"],"a":"C","status":"OK","ex":"答案C。功放机只负责把电信号放大推动音箱，谈不上“人工智能语音处理”；音频卡处理Wave、MIDI、CD音频，数字调音台放大混合修饰多路信号，声卡的功能罗列，这三条描述都是对的。"},{"c":9,"n":57,"m":"X2","mn":"多媒体（考纲外）","s":"声卡的主要功能不包括____。","o":["智能谱曲","文字语音转换、MIDI接口、游戏接口","音频的录制与播放、编辑","音乐合成、CD-ROM接口"],"a":"A","status":"OK","ex":"答案A。“智能谱曲”不是声卡的功能；声卡的功能包括音频录制播放与编辑、音乐合成、文字语音转换、CD-ROM接口、MIDI接口、游戏接口等，B、C、D都在其中。"},{"c":9,"n":58,"m":"X2","mn":"多媒体（考纲外）","s":"以下对视频设备的描述中，不正确的是____。","o":["视频采集卡用于采集视频数据","视频监控卡用于监听音乐","DV卡用于与数码摄像机相连，将DV影片采集到PC的硬盘","电视卡用于在PC上看电视"],"a":"B","status":"OK","ex":"答案B。视频监控卡用于捕捉摄像头等监控视频信号，“监听音乐”张冠李戴；视频采集卡采视频、DV卡连数码摄像机、电视卡在PC上看电视，这三条都正确。"},{"c":9,"n":59,"m":"X2","mn":"多媒体（考纲外）","s":"视频信息的采集和显示播放是通过____。","o":["视频卡、播放软件和显示设备来实现的","音频卡实现的","三维动画软件生成实现的","计算机运算实现的"],"a":"A","status":"OK","ex":"答案A。视频信息的采集和显示播放由视频卡、播放软件和显示设备三者配合实现，与音频卡、三维动画软件无关。","roast":"教材原句搬过来的填空，背到就是纯送分，白给都不要是吧。"},{"c":9,"n":60,"m":"X2","mn":"多媒体（考纲外）","s":"以下关于光存储系统的描述中，不正确的是____。","o":["3gp","mp4","mov","avi 答案：ADCDB ACBCA DCB"],"a":"B","status":"OK","ex":"答案B。此题考查常见多媒体文件格式概念：3gp、mov、avi、mp4同属视频/流媒体类格式；题干“光存储系统”与选项内容明显不匹配，D选项还混入了无关文字，属题库数据错位题，按给定答案B处理，不强行编造考点。"},{"m":"M1","mn":"计算机基础","s":"关于云计算，下列说法正确的是____。","o":["使用云计算必须先购买昂贵的服务器","云计算通过网络按需提供计算资源，用户按使用量付费","云计算就是把文件拷贝到U盘里保存","云计算只能在手机上使用"],"a":"B","ex":"云计算的本质是把计算、存储等资源集中在云端，用户通过网络按需获取并按用量付费；A与云计算'无需自建机房'的优势相反，C说的只是本地存储，D则错误地限制了终端类型，电脑、平板、手机都可以是云端服务的入口。","n":147,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"某企业向云服务商租用虚拟服务器和存储空间，操作系统和应用软件都由自己安装配置，这种服务模式属于____。","o":["SaaS","PaaS","IaaS","区块链即服务"],"a":"C","ex":"IaaS（基础设施即服务）只提供服务器、存储、网络等基础资源，上层的系统、软件由用户自己部署，与题干相符；SaaS是直接使用现成软件，PaaS提供的是开发和运行平台，两者都不需要用户从装系统开始搭环境。","n":148,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"小明打开网页就能在线编辑文档，不用安装任何软件，这种云服务模式属于____。","o":["SaaS","IaaS","PaaS","DaaS"],"a":"A","ex":"软件即服务（SaaS）把现成的应用软件部署在云端，用户通过浏览器直接使用，无需安装维护；IaaS给的是裸的服务器和存储，PaaS给的是开发平台，都与'拿来即用的软件'不符。","roast":"网页版文档你天天用还选错，我建议先把正确答案抄十遍。","n":149,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"某云平台为开发者提供编程语言运行环境、数据库和开发工具，开发者只需专注编写自己的代码，这种服务模式属于____。","o":["SaaS","IaaS","区块链即服务","PaaS"],"a":"D","ex":"PaaS（平台即服务）提供开发和运行环境，开发者只管写代码，环境搭建交给云平台；IaaS只给基础设施，SaaS给的是面向最终用户的成品软件，两者都不符合'面向开发者的平台'这一定位。","n":150,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"某银行出于数据安全考虑，自建了一套仅供本行内部使用的云计算平台，这属于____。","o":["公有云","私有云","混合云","边缘计算"],"a":"B","ex":"私有云是为单一组织自建自用的云，资源不对外共享，符合银行数据安全的需要；公有云面向公众多租户共享，混合云是公有云与私有云的组合而题干没有体现，边缘计算是靠近数据源头的计算方式，不属于云的部署形态。","n":151,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"关于公有云，下列说法正确的是____。","o":["必须部署在企业内部机房","用户需要自己购买并维护所有硬件","由云服务商建设运营，面向公众按需提供服务，多用户共享资源","只能运行一种操作系统"],"a":"C","ex":"公有云由服务商投资建设并运维，用户通过网络按需租用，多个用户共享同一套底层资源池；A、B恰恰是私有云或自建机房的做法，D纯属虚构限制，公有云平台可承载多种操作系统。","n":152,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"下列选项中，不属于大数据'4V'特征的是____。","o":["Volume（数据量大）","Variety（类型多样）","Velocity（处理速度快）","Virtue（美德）"],"a":"D","ex":"大数据的4V指Volume海量、Variety多样、Velocity高速、Value价值密度低但整体价值高，'Virtue美德'是凑出来的干扰项，与数据特征毫无关系。","n":153,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"下列场景中，不属于大数据应用的是____。","o":["电商平台根据浏览记录推荐商品","地图软件根据海量轨迹预测路况","用算盘统计全班的平均分","平台分析用户消费数据做精准营销"],"a":"C","ex":"大数据应用的核心是对海量数据进行采集、分析和挖掘；推荐、路况预测、精准营销都建立在海量数据分析之上，用算盘算平均分只是传统手工计算，既无海量数据也无分析挖掘。","n":154,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"大数据分析区别于传统抽样调查的理念是____。","o":["倾向于分析全体数据，而不是只抽取部分样本","只关心个别精确数字，数据越多越麻烦","数据量越少越好分析","拒绝使用文本、图片等非结构化数据"],"a":"A","ex":"大数据思维的重要转变是从抽样分析走向全体数据分析，并接受数据的混杂性；B、C与'数据越多价值越大'的方向相反，D更错——非结构化数据（文本、图片、视频）正是大数据的重要组成部分。","n":155,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"大数据在价值方面的特点是____。","o":["每一条数据的价值都很高","单条数据价值密度低，但海量数据汇聚挖掘后整体价值高","数据本身永远没有价值","数据的价值与数量毫无关系"],"a":"B","ex":"'价值密度低'是4V特征之一：单条记录看似平常，但海量数据汇总后通过挖掘分析能产生高整体价值，例如全程监控录像里有用的画面可能只有几秒；A把整体价值错安到单条数据上，C、D直接与大数据的基本认识相悖。","n":156,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"下列属于大数据应用的是____。","o":["手工抄写学生的成绩单","用计算器算一道加法题","把纸质档案扫描存档","打车平台根据海量历史和实时数据动态调度车辆"],"a":"D","ex":"大数据应用要对海量数据进行采集、存储和分析挖掘，打车平台的动态调度正是对海量出行数据实时分析的结果；抄成绩单、算加法只是简单的手工或计算操作，扫描存档只有存储环节，都没有'海量数据分析'。","n":157,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"关于云计算与大数据的关系，下列说法正确的是____。","o":["云计算为大数据提供存储和计算资源的支撑","两者互不相干","搞大数据就必须放弃云计算","云计算只能处理数据量很小的任务"],"a":"A","ex":"海量数据的存储和并行计算依托云计算的分布式架构才能低成本、高效率地完成，两者相辅相成；B否认联系，C把互补关系说成对立，D与云计算弹性扩展、适合大规模计算的特点完全相反。","n":158,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"物联网体系结构从下到上依次是____。","o":["应用层、网络层、感知层","感知层、网络层、应用层","网络层、感知层、应用层","应用层、感知层、网络层"],"a":"B","ex":"物联网三层架构自下而上为感知层（采集信息）→网络层（传输信息）→应用层（处理信息并面向具体应用），可以记成'先感知、再传输、最后用'；其余选项都把三层的顺序打乱了。","roast":"从下往上数三层，这题再错，我替你的老师扶一下眼镜。","n":159,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"下列设备中，属于物联网感知层的是____。","o":["温湿度传感器","路由器","云端服务器","手机上的控制APP"],"a":"A","ex":"感知层的任务是采集物理世界的信息，传感器、RFID标签、摄像头等都属于感知层；路由器承担数据传输属于网络层，云端服务器和手机APP属于应用层的处理与交互部分。","n":160,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"RFID技术的主要用途是____。","o":["给手机无线充电","压缩视频文件","非接触式自动识别物体","制作网页动画"],"a":"C","ex":"RFID即射频识别，通过无线电信号非接触地自动识别物体并读写数据，公交卡、门禁卡、仓储盘点都是典型应用；无线充电、视频压缩、动画制作与'识别物体'这一定位完全无关。","roast":"公交卡天天刷，这题是我撒的糖，接不住没天理。","n":161,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"物联网三层架构中，主要负责把数据安全、可靠地传送出去的是____。","o":["感知层","应用层","数据层","网络层"],"a":"D","ex":"网络层由互联网、移动通信网、无线传感器网络等组成，负责把感知层采集的数据可靠地传到应用端；感知层负责采集，应用层负责处理和服务，'数据层'根本不属于物联网标准三层架构。","n":162,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"智能家居中用手机远程控制家电，这类面向用户的具体服务属于物联网体系结构的____。","o":["感知层","应用层","网络层","物理层"],"a":"B","ex":"应用层把物联网数据与行业需求结合，面向用户提供具体服务，智能家居、智慧农业、车联网都在这一层；感知层管采集、网络层管传输，物理层是通信领域的概念，不属于物联网标准三层的说法。","n":163,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"传感器在物联网中的作用是____。","o":["将温度、光照等物理量转换成计算机能处理的信号","给物联网设备充电","负责显示网页页面","对传输的数据进行加密"],"a":"A","ex":"传感器是感知层的核心器件，把温度、湿度、光照、压力等物理量转化为电信号或数字数据，供后续传输和处理；供电、显示、加密都不是传感器的本职，分别属于电源、显示和安全模块的活。","n":164,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"人工智能的英文缩写是____。","o":["AS","AR","AI","VR"],"a":"C","ex":"AI是Artificial Intelligence（人工智能）的缩写；AR是增强现实，VR是虚拟现实，AS不是人工智能的通用缩写，别把三个相近的缩写混在一起。","roast":"这题要错，我当场表演一个鲸鱼喷水。","n":165,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"机器学习的基本思想是____。","o":["让计算机从大量数据中自动学习规律，而不是由人把所有规则都写死","由人工把每一条判断规则一条条输入计算机","定期把硬盘格式化就能实现智能","在机箱上贴'人工智能'标签"],"a":"A","ex":"机器学习的核心是用数据训练模型，让计算机自己总结规律并用于预测判断，人工穷举规则既低效又覆盖不了复杂场景；后两个选项是纯干扰，与学习算法毫无关系。","n":166,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"关于深度学习，下列说法正确的是____。","o":["它与机器学习毫无关系","就是人工把所有答案背下来","不需要任何数据就能完成训练","它是机器学习的一个分支，依靠多层神经网络自动学习特征"],"a":"D","ex":"深度学习以多层神经网络为基础，能从海量数据中自动逐层提取特征，是机器学习的重要分支；A割裂了两者关系，C与'需要大量训练数据'的事实相反，B则把机器学习曲解成死记硬背。","n":167,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"图灵测试用来判断____。","o":["计算机的运行速度有多快","机器能否表现出与人难以区分的智能行为","显示器分辨率够不够高","硬盘容量是不是够大"],"a":"B","ex":"图灵测试由图灵提出：测试者隔着屏幕与人和机器对话，若分不清对方是谁，就认为该机器具有智能，它衡量的是智能行为而非硬件性能；速度、分辨率、容量都是硬件指标，与'是否具有智能'无关。","n":168,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"下列不属于人工智能典型应用的是____。","o":["人脸识别解锁手机","语音助手与人对话","用扫描仪把一张纸扫成图片","自动驾驶汽车"],"a":"C","ex":"扫描只是把纸面图像光学复制成电子文件，没有学习、判断和决策环节；人脸识别、语音交互、自动驾驶都需要模型对数据进行分析判断，是人工智能的典型落地场景。","n":169,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"手机能把人说的话自动转成文字，这项技术属于人工智能中的____。","o":["语音识别","图像识别","数据加密","视频剪辑"],"a":"A","ex":"语音识别让机器'听懂'人类语言并转换成文本；图像识别处理的对象是图片，数据加密属于信息安全技术，视频剪辑是多媒体编辑操作，都与'把语音转文字'无关。","n":170,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"与4G相比，5G最突出的特点是____。","o":["只能用来打电话","高速率、低时延、大连接","只支持文字聊天","必须插网线才能使用"],"a":"B","ex":"5G的三大应用场景对应高速率（增强移动宽带）、低时延高可靠（面向车联网、工业控制）和大连接（海量物联网设备）；A、C都是2G时代都早已超越的能力，D更是胡扯——5G是无线移动通信技术，恰恰不靠网线。","n":171,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"5G让海量物联网设备同时在线成为可能，主要依靠的是它的____。","o":["屏幕尺寸更大","电池更耐用","资费一定更便宜","大连接特性，每平方公里可支持约百万级设备接入"],"a":"D","ex":"5G的大连接场景（mMTC）支持每平方公里约100万台设备同时联网，为物联网大规模部署提供了网络基础；屏幕、电池是终端属性不是网络能力，资费也不是支撑海量连接的技术原因。","n":172,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"移动互联网可以理解为____。","o":["传统的固定电话网络","只能发短信的通信网络","移动通信技术与互联网技术融合的产物","一种新型打印机"],"a":"C","ex":"移动互联网=移动通信网+互联网，用户用手机等终端随时随地接入互联网并使用各类应用；固定电话网和短信网络都是传统单一业务，打印机是外设，都谈不上'移动+互联'的融合。","n":173,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"区块链最核心的特征是____。","o":["去中心化，数据由网络中多个节点共同维护，不依赖单一中心机构","账本必须由一家公司集中管理","所有数据保存在一台超级计算机里","需要财务人员每天人工对账"],"a":"A","ex":"区块链是分布式账本，数据由全网节点共同记录、相互校验，没有唯一的中心控制点；集中管理、单点存储、人工对账恰恰是区块链要替代的传统模式。","roast":"'去中心化'把'去'字圈出来就是答案，我出这题纯属送温暖。","n":174,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"区块链上的数据一经写入就很难被篡改，主要原因是____。","o":["数据是用手写上去的","服务器功率特别大","没有人对改数据感兴趣","链式结构配合密码学哈希，改动任何区块都会被其他节点发现"],"a":"D","ex":"每个区块都包含前一区块的哈希值，环环相扣，篡改一处就会导致后续所有区块校验失败，并且要在多数节点同时改写才可能生效，代价极高，所以数据难以篡改；A、B、C都不是技术原因。","n":175,"c":8,"status":"OK"},{"m":"M1","mn":"计算机基础","s":"下列场景中，最适合应用区块链技术的是____。","o":["用Word写一篇周报","食品溯源，记录流通各环节信息以防篡改","手绘一幅油画","给手机贴一张钢化膜"],"a":"B","ex":"区块链适合多方参与、需要防篡改和全程可追溯的场景，食品供应链上各环节主体互不信任，恰好需要分布式账本固化记录；数字货币、电子存证同理；写周报、画画、贴膜既无多方协作也无防篡改需求，用不上它。","n":176,"c":8,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"操作系统属于____。","o":["应用软件","系统软件","工具软件","办公软件"],"a":"B","ex":"操作系统负责管理和控制计算机的软硬件资源，是计算机系统必不可少的系统软件，也是系统软件的核心；工具软件、办公软件都是运行在操作系统之上的应用软件。","roast":"系统软件和应用软件是第一章第一句话，背了就白给，这都错我真懒得骂。","n":47,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"下列不属于操作系统主要管理功能的是____。","o":["处理机管理","存储管理","文件管理","文字排版"],"a":"D","ex":"操作系统五大管理功能是处理机管理、存储管理、设备管理、文件管理和作业管理；文字排版是 Word 这类应用软件的功能，跟操作系统没关系。","n":48,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"一台计算机要正常运行其他软件，必须先安装____。","o":["办公软件","图像处理软件","杀毒软件","操作系统"],"a":"D","ex":"操作系统是最基本的系统软件，没有它裸机连其他软件都无法安装和运行；办公、图像处理、杀毒软件都是应用软件，必须在操作系统之上运行。","roast":"没系统连开机桌面都进不去，这题考的是常识不是知识。","n":49,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 属于____的操作系统。","o":["单用户单任务","多用户单任务","单用户多任务","批处理"],"a":"C","ex":"Windows 7 允许一个用户同时打开并运行多个程序，是典型的单用户多任务操作系统；DOS 才是单用户单任务，Windows 7 也不是批处理系统。","n":50,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"为文件分配存储空间、实现按名存取，属于操作系统的____功能。","o":["文件管理","设备管理","处理机管理","存储管理"],"a":"A","ex":"文件管理负责文件的存储、检索、共享和保护，用户按文件名就能找到并使用文件；调度 CPU 运行程序属于处理机管理，管理内存属于存储管理，控制外设属于设备管理。","n":51,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"操作系统的“设备管理”功能主要负责____。","o":["管理文件的目录结构","为多个用户分配上机时间","管理和控制输入输出设备","翻译源程序"],"a":"C","ex":"设备管理负责外部设备的分配、启动、驱动和回收，比如协调打印机、键盘、鼠标的工作；目录结构归文件管理，机时分配是作业管理的活，翻译源程序是编译程序的事。","n":52,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 操作系统向用户提供的操作界面属于____。","o":["命令行界面","图形用户界面","纯字符界面","语音界面"],"a":"B","ex":"Windows 用窗口、图标、菜单、鼠标来完成操作，是典型的图形用户界面（GUI）；命令行和纯字符界面是 DOS 时代的操作方式，语音界面并不是 Windows 的基本操作界面。","n":53,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"计算机从通电到出现 Windows 7 桌面，正确的顺序是____。","o":["通电自检→装入操作系统→进入桌面","进入桌面→自检→装入操作系统","装入操作系统→自检→通电","通电→进入桌面→自检"],"a":"A","ex":"开机后先由 BIOS 完成加电自检，确认硬件正常，再从磁盘把操作系统装入内存，系统就绪后才显示桌面；后面三种顺序都把流程记乱了。","n":54,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"桌面上的“图标”代表____。","o":["文件、文件夹、程序等对象的图形标志","一张只能观赏的图片","显示器的品牌型号","内存容量的标志"],"a":"A","ex":"图标是文件、文件夹、程序、快捷方式等对象的图形化表示，双击图标就能打开对应对象；它不是装饰图片，更和显示器、内存的参数无关。","n":55,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"窗口右上角三个控制按钮从左到右依次是____。","o":["最小化、最大化（还原）、关闭","关闭、最大化、最小化","最大化、最小化、关闭","关闭、最小化、最大化"],"a":"A","ex":"右上角固定是“最小化—最大化（还原）—关闭”的顺序，关闭按钮在最右端并带红叉；其余选项把按钮位置全记反了。","roast":"天天看着右上角还记不住顺序，建议把显示器倒过来看两眼。","n":56,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"单击窗口右上角的“最小化”按钮后，该程序____。","o":["被关闭并退出内存","变成桌面上的图标","缩小为任务栏上的一个按钮","停止运行等待卸载"],"a":"C","ex":"最小化只是把窗口收起，程序在后台继续运行，窗口缩小成任务栏上的按钮；最小化不等于关闭，也不会产生桌面图标。","n":57,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"关于窗口和对话框的区别，下列说法正确的是____。","o":["对话框可以像窗口一样随意改变大小","对话框没有标题栏","窗口可以最小化，对话框一般不能最小化","对话框和窗口完全一样"],"a":"C","ex":"窗口能最大化、最小化和改变大小；对话框大小固定，一般没有最小化、最大化按钮，但有标题栏，所以 A、B、D 都是错的。","n":58,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"菜单项后面带有省略号（…）表示____。","o":["该菜单项当前不可用","单击后会弹出一个对话框","该菜单项还有下一级子菜单","该菜单项已被选中"],"a":"B","ex":"带省略号表示选择后还要进一步设置，会弹出对话框让用户补充信息；带右三角表示有子菜单，呈灰色表示当前不可用，带对勾才表示已选中。","n":59,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"用鼠标拖动窗口的标题栏，可以____。","o":["移动窗口位置","改变窗口大小","关闭窗口","复制窗口内容"],"a":"A","ex":"按住标题栏拖动是整体挪动窗口位置；想改大小得拖边框或四角，关窗口要点关闭按钮，拖标题栏都做不到。","n":60,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"用鼠标拖动窗口的边框或四角，可以____。","o":["移动窗口位置","改变窗口大小","最小化窗口","在窗口间切换"],"a":"B","ex":"拖边框或四角是在调整窗口尺寸，此时鼠标指针变成双向箭头；移动位置靠拖标题栏，最小化靠按钮，切换窗口用 Alt+Tab 或点击任务栏按钮。","n":61,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在多个打开的窗口之间快速切换，应使用的快捷键是____。","o":["Ctrl+Tab","Shift+Tab","Tab","Alt+Tab"],"a":"D","ex":"Alt+Tab 是 Windows 标准的多窗口切换组合键，按住 Alt 连按 Tab 即可在打开的窗口间选择；Tab 用于对话框内移动焦点，另外两个组合键不承担窗口切换。","roast":"Alt+Tab 都不会，平时切窗口是靠关了再开吗？","n":62,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"要使窗口铺满整个桌面，应单击标题栏右侧的____按钮。","o":["最小化","最大化","关闭","还原"],"a":"B","ex":"最大化按钮把窗口放大到铺满桌面，之后它自动变成“还原”按钮；最小化是收起窗口，关闭是退出程序，还原按钮只在窗口已最大化时出现。","n":63,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"双击窗口标题栏的空白处，通常的效果是____。","o":["关闭窗口","移动窗口","在最大化和还原之间切换","复制窗口"],"a":"C","ex":"双击标题栏空白处等价于单击最大化/还原按钮，两种状态来回切换；关闭窗口必须用关闭按钮或关闭命令，双击标题栏不会关窗口。","n":64,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 Windows 中，文件名里不允许使用的字符是____。","o":["空格和汉字","英文字母和数字","\\ / : * ? \" < > |","下划线"],"a":"C","ex":"Windows 规定文件名中禁止出现 \\ / : * ? \" < > | 这 9 个半角字符；空格、汉字、字母、数字、下划线都可以正常用在文件名里。","roast":"这9个字符是死规定，背错一次文件就存不上，教训比你记得牢。","n":65,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"文件扩展名（后缀名）的作用是____。","o":["决定文件的大小","显示文件的创建时间","加快文件的打开速度","标识文件的类型"],"a":"D","ex":"扩展名标明文件属于什么类型，系统据此选用对应的程序打开它，例如 .txt 是文本文件、.docx 是 Word 文档；它和文件大小、创建时间、打开速度都没有关系。","n":66,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 Windows 7 中新建文件夹，正确的操作是____。","o":["双击任意文件夹即可新建","在目标位置空白处右击，选择“新建→文件夹”","只能进入控制面板新建","按 Delete 键新建"],"a":"B","ex":"标准做法是在目标位置的空白处右击，从快捷菜单选“新建→文件夹”（资源管理器里的“新建文件夹”按钮也可以）；双击是打开，Delete 是删除，控制面板里没有这功能。","n":67,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 中文件和文件夹的组织结构是____。","o":["网状结构","环形结构","树形结构","星形结构"],"a":"C","ex":"Windows 采用树形目录结构：磁盘分区是树根，向下逐层分出文件夹和子文件夹，文件挂在各级节点上；网状、环形、星形是网络拓扑的说法，不用于文件组织。","n":68,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"关于“路径”，下列说法正确的是____。","o":["路径就是文件的扩展名","同一个文件夹里可以存在两个完全同名的文件","路径无法用字符表示出来","路径指明文件或文件夹在磁盘上的位置"],"a":"D","ex":"路径由盘符和各级文件夹名组成，用来唯一确定文件在树形结构中的位置，如 D:\\资料\\笔记.txt；扩展名管类型，同一文件夹不允许同名文件，路径完全可以书写。","n":69,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在资源管理器中要同时选中多个不连续的文件，应按住____键依次单击。","o":["Shift","Ctrl","Alt","Esc"],"a":"B","ex":"按住 Ctrl 逐个单击可以挑选不连续的多个对象；Shift+单击选的是连续一段，Alt 和 Esc 不参与选择操作。","n":70,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"先单击一个文件，再按住 Shift 键单击另一个文件，选中的是____。","o":["这两个文件及它们之间的全部连续文件","多个不连续的文件","窗口内的全部文件","只能选中后一个文件"],"a":"A","ex":"Shift 配合单击做的是“连续选段”，起点到终点之间的文件全部被选中；不连续选择靠 Ctrl，全选靠 Ctrl+A。","n":71,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"文件被设置为“只读”属性后，____。","o":["文件不能再被删除","文件不能再被复制","修改后保存时系统会提示，但文件仍可删除","文件会被自动加密"],"a":"C","ex":"只读属性只是防止文件被轻易改写，保存修改时系统会弹出提示，但删除、复制、移动都不受限制；“只读等于不能删”“只读等于加密”都是想当然。","n":72,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"要查找所有以“报告”开头、扩展名为 docx 的文件，搜索时应输入____。","o":["*报告.docx","报告?.docx","?.docx","报告*.docx"],"a":"D","ex":"通配符 * 代表任意多个字符，“报告*.docx”能匹配“报告”开头、docx 结尾的一批文件；*报告.docx 变成了“报告”结尾，? 只顶一个字符，含义全变了。","n":73,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 文件名中的通配符“?”代表____。","o":["任意多个字符","任意一个字符","一个空格","一个数字"],"a":"B","ex":"问号只代表一个任意字符，如“第?课.docx”可同时匹配“第1课.docx”“第A课.docx”；代表任意多个字符的是星号 *。","n":74,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"关于“剪切”和“复制”，下列说法正确的是____。","o":["剪切后原位置的文件仍然保留","复制后原位置的文件会消失","复制和剪切的效果完全相同","剪切配合粘贴后，原位置不再保留该文件"],"a":"D","ex":"复制是另做一个副本，原文件原地不动；剪切配合粘贴是“搬家”，粘贴完成后原位置就没有这个文件了；A、B把两种操作的效果说反了，C根本不成立。","n":75,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"对文件重命名后，____。","o":["只有文件名改变，内容和位置都不变","文件内容随之改变","文件大小随之改变","文件位置随之改变"],"a":"A","ex":"重命名只改名字这一样东西，内容、大小、存放位置都不变；注意别顺手改扩展名，否则系统可能认不出文件类型。","n":76,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 的“回收站”是____。","o":["内存中的一块区域","U盘上的一块区域","CPU 中的高速缓存","硬盘上的一块区域"],"a":"D","ex":"回收站是硬盘分区中划出的一块存储空间，删除的文件仍占硬盘空间，断电也不会消失；内存断电即清空，U盘、CPU 缓存跟回收站都不沾边。","roast":"回收站在硬盘上、断电不清空——记不住的人，删完重要文件拔一次电源就长记性了。","n":77,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"下列关于回收站的说法，错误的是____。","o":["放入回收站的文件可以还原到原位置","清空回收站后，其中的文件一般无法恢复","回收站的容量大小可以设置","从U盘中删除的文件也会进入回收站"],"a":"D","ex":"U盘等可移动存储设备上的删除是直接删除，不经过回收站；能还原、清空后难恢复、容量可调都是回收站的正确特征。","n":78,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"按 Shift+Delete 组合键删除文件，结果是____。","o":["文件被放入回收站","文件不经过回收站直接删除","文件被复制到剪贴板","文件被自动重命名"],"a":"B","ex":"Shift+Delete 是“彻底删除”，文件不进回收站，无法再用还原的办法找回；单独按 Delete 才是把文件丢进回收站。","n":79,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"把回收站中的文件“还原”后，文件会回到____。","o":["桌面","C 盘根目录","被删除前的原位置","回收站的上一级文件夹"],"a":"C","ex":"还原就是把文件送回删除前所在的原始文件夹；不会跑到桌面或C盘根目录，也不存在“回收站上一级”这种位置。","n":80,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"清空回收站后，回收站中的文件____。","o":["被移动到硬盘的其他位置","自动备份到U盘","一般无法恢复","转存到剪贴板"],"a":"C","ex":"清空后文件占用的磁盘空间被释放，一般无法再通过系统操作找回；不存在“转移”“备份”这种好事，所以清空前务必确认里面没有要紧文件。","n":81,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"回收站图标有“空”和“满”两种状态，它取决于____。","o":["回收站容量设置的大小","里面是否有未清空的被删文件","硬盘剩余空间的多少","计算机的系统版本"],"a":"B","ex":"回收站里存着删除而未清空的文件时图标显示“满”（有纸），清空后变“空”；图标只反映有没有内容，跟容量、剩余空间、版本都无关。","n":82,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 的“剪贴板”是____。","o":["硬盘中的一块区域","U盘上的一块区域","一个专门存放文件的文件夹","内存中的一块临时存储区域"],"a":"D","ex":"剪贴板是系统在内存中开辟的临时存储区，断电或重启后内容就没了；它不在硬盘和U盘上，也不是文件夹，所以不能长期保存数据。","n":83,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"剪贴板中已有内容，再执行一次新的“复制”，则剪贴板中____。","o":["原内容被新内容覆盖","新旧两条内容同时保留","内容被自动清空","新旧内容自动合并"],"a":"A","ex":"Windows 剪贴板一次只保存最近一次复制或剪切的内容，新复制直接覆盖旧内容，不存历史也不合并；要用旧内容得先粘贴出来，再复制新的。","n":84,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"把整个屏幕的画面复制到剪贴板，应按____键。","o":["Alt+PrintScreen","Ctrl+PrintScreen","PrintScreen","Shift+PrintScreen"],"a":"C","ex":"单独按 PrintScreen 截取整个屏幕存入剪贴板；Alt+PrintScreen 只截取当前活动窗口；Ctrl、Shift 与它的组合不是系统定义的截屏键。","n":85,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"“复制→粘贴”的工作过程是____。","o":["复制时数据直接写入目标位置","粘贴时数据从剪贴板取出，送到目标位置","复制和粘贴都不经过剪贴板","剪贴板只能存放文字"],"a":"B","ex":"复制或剪切先把选中内容放进剪贴板，粘贴再把内容从剪贴板送到目标位置，剪贴板就是中转站；说“不经过剪贴板”是错的，剪贴板也能存图片、文件等，不止文字。","n":86,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 Windows 中，集中查看和更改计算机系统设置的工具是____。","o":["资源管理器","回收站","记事本","控制面板"],"a":"D","ex":"控制面板集中管理系统显示、鼠标键盘、用户账户、程序、日期时间等设置；资源管理器管理文件，回收站存放被删除的文件，记事本是文本编辑工具。","roast":"控制面板都不知道，你电脑开机全靠缘分是吧。","n":87,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 中，调整屏幕分辨率应通过桌面右键快捷菜单中的____命令进行。","o":["个性化","屏幕分辨率","小工具","管理"],"a":"B","ex":"右击桌面空白处选择“屏幕分辨率”可直接调整分辨率和刷新率；“个性化”设置主题、桌面背景和屏幕保护，“小工具”是桌面侧边栏小应用，“管理”打开计算机管理控制台。","n":88,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 中更换桌面背景图片的正确操作是____。","o":["右击“计算机”图标，选择“设备管理器”","打开“回收站”，右击文件选择“还原”","右击桌面空白处，选择“个性化”，再单击“桌面背景”","双击任务栏时钟打开设置窗口"],"a":"C","ex":"个性化窗口中的“桌面背景”可设置图片位置和背景图片；设备管理器管理硬件驱动，回收站用于恢复删除文件，时钟窗口只管日期时间。","n":89,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 中要设置屏幕保护程序，应右击桌面空白处并选择____命令进入设置。","o":["个性化","小工具","管理","图形属性"],"a":"A","ex":"“个性化”窗口中有“屏幕保护程序”图标，可设置屏保样式和等待时间；“管理”进入计算机管理，“图形属性”是显卡驱动设置，均与屏幕保护无关。","n":90,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"要调整鼠标双击的速度，应在控制面板中打开____窗口进行设置。","o":["键盘","鼠标","显示","系统"],"a":"B","ex":"双击速度属于“鼠标”属性中“鼠标键”选项卡的设置项；“键盘”属性管重复延迟和重复率，“显示”管分辨率，“系统”查看计算机基本信息。","n":91,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"控制面板的“键盘”属性中，可以设置的项目是____。","o":["双击速度","指针形状","光标颜色","字符重复延迟"],"a":"D","ex":"键盘属性可设置字符重复延迟、字符重复率和光标闪烁频率；双击速度和指针形状在“鼠标”属性中设置，光标颜色不在键盘属性里调整。","n":92,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"任务栏右下角显示的时间不正确，最快的修改方法是____。","o":["双击任务栏时钟，在弹出的对话框中修改","删除时间显示后重装系统","打开“计算机”逐个文件夹查找时间设置","重启计算机让时间自动变准"],"a":"A","ex":"双击任务栏通知区的时钟即可打开“日期和时间”对话框进行修改；重启不会校准时间，移动文件夹和重装系统与时间设置无关。","roast":"双击时钟都能答错，我建议你连时区一起修一修。","n":93,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"要更改系统中货币符号和日期时间的显示格式，应使用控制面板中的____。","o":["用户账户","程序和功能","区域和语言","日期和时间"],"a":"C","ex":"“区域和语言”对话框的“格式”选项卡设置数字、货币、日期时间的显示格式；用户账户管理登录账户，程序和功能用于卸载软件，日期和时间只管系统时钟本身。","n":94,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在一台多名用户共用的计算机上，为每人建立独立账户应使用的工具是____。","o":["设备管理器","控制面板中的“用户账户”","磁盘管理","任务管理器"],"a":"B","ex":"控制面板的“用户账户”可创建新账户、更改账户类型和密码；设备管理器管理硬件驱动，磁盘管理进行分区操作，任务管理器管理运行中的程序。","n":95,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"下列关于 Windows 7 计算机管理员账户的说法，正确的是____。","o":["不能安装新的软件","只能运行别人已经装好的程序","没有权限更改其他账户的设置","可以安装软件，创建和删除其他用户账户"],"a":"D","ex":"管理员账户拥有最高权限，可安装卸载软件、创建删除更改其他账户；前三项描述的是标准（受限）账户的特征。","n":96,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 的“个性化”窗口中，不能直接设置的项目是____。","o":["硬盘分区大小","桌面背景","窗口颜色","屏幕保护程序"],"a":"A","ex":"个性化窗口可设置主题、桌面背景、窗口颜色、声音和屏幕保护程序；硬盘分区需要“磁盘管理”等工具，与个性化无关。","n":97,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"想查看本机 CPU 型号和内存容量，最快捷的方法是____。","o":["打开记事本输入 system","在控制面板中卸载程序","右击“计算机”图标，选择“属性”","打开任务管理器格式化磁盘"],"a":"C","ex":"右击“计算机”选择“属性”即打开系统窗口，显示 Windows 版本、处理器型号和内存容量；卸载程序与查看配置无关，“格式化磁盘”是破坏性操作且任务管理器里根本没有这项。","n":98,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 Windows 7 中卸载已安装的应用程序，正确做法是____。","o":["在桌面上删除它的快捷方式","通过“控制面板→程序和功能”选择卸载","直接删除其安装文件夹","在任务管理器中结束该进程"],"a":"B","ex":"“程序和功能”（卸载程序）会调用卸载向导，同时清除程序文件和注册信息；删快捷方式或只删文件夹会残留注册表信息导致系统混乱，结束进程只是让程序停止运行。","n":99,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 Windows 中安装应用软件，通常的做法是____。","o":["把软件压缩包移动到桌面即完成安装","重命名软件文件夹的名称","新建一个空文件夹代替安装","运行软件提供的安装程序（如 Setup.exe），按向导逐步完成"],"a":"D","ex":"安装软件需要运行安装程序，由向导完成文件复制、注册和配置；移动压缩包、改名、建空文件夹都不会完成安装所需的环境注册。","n":100,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 中，能直接打开任务管理器的组合键是____。","o":["Ctrl+Shift+Esc","Ctrl+Alt+Home","Alt+F4","Ctrl+Shift+Delete"],"a":"A","ex":"Ctrl+Shift+Esc 直接调出任务管理器；Alt+F4 关闭当前窗口；Ctrl+Alt+Del 打开安全选项界面还需再选一次；Ctrl+Shift+Delete 常用于清除浏览器数据。","n":101,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 任务管理器不能完成的操作是____。","o":["查看正在运行的应用程序","结束未响应的程序","卸载软件","查看 CPU 使用率"],"a":"C","ex":"任务管理器用于查看和结束应用程序、进程以及监视性能和联网；卸载软件必须在“程序和功能”中进行，任务管理器没有这个功能。","n":102,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"某个程序长时间显示“未响应”，最恰当的处理是____。","o":["立即拔掉计算机电源","按 Alt+F4 强行关机","用任务管理器选中该程序并结束任务","反复单击窗口直到恢复"],"a":"B","ex":"任务管理器中选中未响应程序单击“结束任务”最安全有效；拔电源和强关机可能损坏数据，反复点击没有效果。","n":103,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 中，一个正在被执行的程序称为____。","o":["文件夹","快捷方式","驱动程序","进程"],"a":"D","ex":"进程是正在运行的程序实体，任务管理器的“进程”选项卡能查看每个进程占用的 CPU 和内存；文件夹是存放文件的容器，快捷方式指向目标对象，驱动程序管理硬件。","n":104,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"任务管理器的“性能”选项卡中，可以观察到的信息是____。","o":["CPU 使用率和物理内存使用情况","计算机的价格","用户账户的密码","打印机的墨水余量"],"a":"A","ex":"性能选项卡显示 CPU 使用率、CPU 使用记录和物理内存占用等实时数据；账户密码加密存储无法查看，价格和墨水余量更不归它管。","n":105,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在多个打开的窗口之间快速切换，可以使用的组合键是____。","o":["Ctrl+C","Alt+F4","Alt+Tab","Ctrl+Z"],"a":"C","ex":"Alt+Tab 在打开的窗口之间循环切换；Ctrl+C 是复制，Ctrl+Z 是撤销，Alt+F4 关闭当前窗口。","roast":"Alt+Tab 都选不出来，以后多窗口刷题的时候可怎么活哟。","n":106,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"按国标汉字编码（GB2312）存储时，一个汉字需要____。","o":["1 个字节","2 个字节","4 个字节","8 个字节"],"a":"B","ex":"国标机内码规定一个汉字占两个字节，一个英文字符占一个字节，这是历年必考的固定结论。","roast":"两个字节，纯背诵题，这再错就是把书卖给收废品的了。","n":107,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"关于 ASCII 码，下列说法正确的是____。","o":["每个 ASCII 字符用 2 个字节存储","ASCII 码可以表示所有汉字","ASCII 码是图形图像的编码","基本 ASCII 码用 1 个字节表示一个字符，共 128 种编码"],"a":"D","ex":"基本 ASCII 码共 128 个编码，用一个字节存储（最高位为 0）；它无法表示汉字，汉字由国标码体系编码，图像另有各自的编码方式。","n":108,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"GB2312—80《信息交换用汉字编码字符集·基本集》共收录汉字和符号____个。","o":["7445","128","256","1024"],"a":"A","ex":"GB2312 收录 6763 个汉字和 682 个非汉字图形符号，合计 7445 个；128 是基本 ASCII 码的字符数，256 是一个字节能表示的编码总数。","n":109,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 默认设置下，开启或关闭中文输入法（中英文输入切换）的组合键是____。","o":["Ctrl+Shift","Alt+Tab","Ctrl+Space","Ctrl+Alt+Del"],"a":"C","ex":"Ctrl+Space 在中文和英文输入状态之间切换；Ctrl+Shift 是在不同输入法之间轮流切换，Alt+Tab 切换窗口，Ctrl+Alt+Del 打开安全选项界面。","n":110,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"输入法状态条中，在全角和半角状态之间切换的组合键是____。","o":["Ctrl+Esc","Shift+Space","Alt+Space","Ctrl+Enter"],"a":"B","ex":"Shift+Space 切换全角/半角，全角字符占一个汉字宽度；Ctrl+Esc 打开开始菜单，Alt+Space 打开当前窗口的控制菜单，Ctrl+Enter 常用于发送消息。","n":111,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"输入汉字时，要在中文标点和英文标点之间切换，默认的组合键是____。","o":["Ctrl+Shift","Shift+Space","Ctrl+Alt","Ctrl+句号（Ctrl+.）"],"a":"D","ex":"中文输入法下 Ctrl+句号 切换中英文标点，如中文句号“。”与英文“.”；Shift+Space 管全半角，Ctrl+Shift 管输入法切换，Ctrl+Alt 与标点无关。","n":112,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"用拼音输入法输入“鲸”字时敲击键盘的字母编码，属于汉字的____。","o":["输入码（外码）","机内码","字形码","地址码"],"a":"A","ex":"输入码是用户通过键盘录入汉字时使用的编码，如拼音码、五笔码；机内码是计算机内部存储处理汉字用的编码，字形码用于显示打印的点阵信息，用户敲的字母与后两者无关。","n":113,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"一个 16×16 点阵的汉字字形码占用的存储空间是____。","o":["16 字节","64 字节","32 字节","256 字节"],"a":"C","ex":"每行 16 个点即 16 位合 2 个字节，16 行共 16×2=32 字节；按公式“点阵行数×列数÷8”计算即可。","n":114,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"对磁盘进行格式化，下列说法正确的是____。","o":["格式化能把坏磁盘修成新磁盘","格式化会划分磁道和扇区，并清除磁盘上原有的数据","格式化可以增大磁盘的容量","格式化只是给磁盘换一个名字"],"a":"B","ex":"格式化按文件系统划分磁道、扇区并建立文件分配表，同时清除原有数据；它不能修复物理损坏，不会增加容量，改名字用重命名即可。","n":115,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"关于“快速格式化”和“完全格式化”，下列说法正确的是____。","o":["两者都会逐扇区检测坏扇区","快速格式化比完全格式化更耗时","快速格式化能修复磁盘的物理损坏","快速格式化只删除文件分配表等信息，不扫描检测坏扇区"],"a":"D","ex":"快速格式化只重建文件系统信息、清空文件分配表，速度更快但不检测坏扇区；完全格式化才会逐扇区扫描检测，两种方式都修不了物理损坏。","n":116,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"“磁盘清理”程序的主要作用是____。","o":["删除临时文件、回收站等无用文件，释放磁盘空间","整理文件的碎片","修复损坏的扇区","给磁盘加密"],"a":"A","ex":"磁盘清理扫描并清除临时文件、Internet 缓存、回收站内容等无用文件以释放空间；碎片整理是另一个程序，修扇区和加密都不属于清理的功能。","roast":"名字里都写着“清理”了，这题答错建议把自己也清理一下。","n":117,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"磁盘碎片整理程序的主要作用是____。","o":["删除感染病毒的文件","扩大磁盘的可用容量","把分散存储的文件内容重新整理为连续存放，加快读写速度","卸载不用的软件"],"a":"C","ex":"文件长期增删后会分散在不连续的簇中，碎片整理将其重新排列为连续存放，减少寻道时间、加快读写；它不杀毒、不卸载软件，也不会凭空增加容量。","n":118,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 中打开“磁盘碎片整理程序”的路径之一是____。","o":["控制面板→鼠标→工具","开始→所有程序→附件→系统工具→磁盘碎片整理程序","任务栏→通知区→打印机","“计算机”→右击“回收站”→整理"],"a":"B","ex":"开始菜单的“附件→系统工具”里有磁盘碎片整理程序；另外右击磁盘→属性→“工具”选项卡也能找到；鼠标属性、回收站和通知区与此无关。","n":119,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"将一块物理硬盘划分为 C、D、E 等多个逻辑磁盘的过程称为____。","o":["格式化","碎片整理","磁盘清理","硬盘分区"],"a":"D","ex":"分区把物理硬盘划分为一个或多个逻辑驱动器（C、D、E…）；格式化是在分区上建立文件系统，碎片整理和磁盘清理都不改变分区结构。","n":120,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"与 FAT32 相比，NTFS 文件系统的优点是____。","o":["支持设置文件访问权限，安全性更高，可支持更大容量的磁盘","所有文件都不能被删除","不需要操作系统就能使用","只能存放文本文件"],"a":"A","ex":"NTFS 支持文件访问权限、加密、磁盘配额和大容量分区，Windows 7 系统盘使用 NTFS；FAT32 没有安全权限且单个文件最大 4GB。","n":121,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"一个大小为 5GB 的高清电影文件无法复制到 FAT32 格式的 U 盘中，最可能的原因是____。","o":["U 盘已加密","文件被隐藏","FAT32 文件系统不支持单个超过 4GB 的文件","电影文件有版权保护"],"a":"C","ex":"FAT32 的文件分配表结构决定了单个文件最大 4GB，超过就无法存放，换用 NTFS 或 exFAT 格式即可解决；这与版权、隐藏和加密无关。","n":122,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 安装时，系统盘（C 盘）推荐使用的文件系统是____。","o":["FAT32","NTFS","FAT16","ext4"],"a":"B","ex":"NTFS 支持文件权限、加密和大容量磁盘，是 Windows 7 系统盘的推荐文件系统；FAT16 容量小且老旧，FAT32 缺少安全特性，ext4 是 Linux 的文件系统。","n":123,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"查看 D 盘剩余可用空间的方法是____。","o":["双击“回收站”图标","打开记事本输入 dir","按 Ctrl+Alt+Del","打开“计算机”窗口，查看磁盘图标下方的容量条，或右击 D 盘选择“属性”"],"a":"D","ex":"“计算机”窗口中每个磁盘图标下方有蓝色容量条，右击磁盘选择“属性”可看到精确的总容量和剩余空间；回收站、记事本和安全界面都显示不了磁盘容量。","roast":"这题都答错，我很好奇你平时是怎么摸到游戏安装包的。","n":124,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"出厂的 U 盘通常采用的、兼容性最好的文件系统是____。","o":["FAT32","NTFS","ext4","HFS+"],"a":"A","ex":"FAT32 被绝大多数设备支持，Windows、车载系统、电视都能直接读写，所以 U 盘出厂多为 FAT32；ext4 属于 Linux，HFS+ 属于苹果 Mac，NTFS 在部分外接设备上不能直接写入。","n":125,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"文件在磁盘上分配存储空间的最小单位是____。","o":["字节","磁道","簇","盘片"],"a":"C","ex":"簇是文件系统分配磁盘空间的最小单位，文件再小也至少占用一个簇；扇区是磁盘读写的基本物理单位，磁道是盘面上的同心圆，字节只是容量计量单位。","n":126,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"MS-DOS 是一种____操作系统。","o":["多用户多任务","单用户单任务","单用户多任务","网络多任务"],"a":"B","ex":"DOS 一次只能被一个用户使用，且同一时间只能运行一个任务，属于单用户单任务系统；Windows 属于单用户多任务，Unix/Linux 才是多用户多任务。","roast":"第一章送分题，这都选错，本鱼都想替你把键盘收了。","n":127,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"UNIX 是一种____操作系统。","o":["单用户单任务","单用户多任务","批处理单任务","分时多用户多任务"],"a":"D","ex":"UNIX 采用分时技术，可同时供多个用户使用，每个用户又能同时运行多个任务，是典型的分时多用户多任务系统；前三个选项都把它的能力和 DOS 或 Windows 弄混了。","n":128,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Linux 操作系统是由芬兰大学生____于 1991 年首次发布的。","o":["比尔·盖茨","史蒂夫·乔布斯","林纳斯·托瓦兹（Linus Torvalds）","肯·汤普森"],"a":"C","ex":"Linux 由 Linus Torvalds 在 1991 年开发并公布源代码，是免费开源的类 Unix 系统；肯·汤普森参与的是 UNIX 的开发，比尔·盖茨和乔布斯分别与微软、苹果相关。","n":129,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 采用的内核是____。","o":["Windows NT 6.1","Windows NT 5.1","MS-DOS 7.0","Windows 9x 内核"],"a":"A","ex":"Windows 7 的内核版本号是 NT 6.1，Vista 是 NT 6.0，XP 是 NT 5.1；采用 DOS 内核的是 Windows 95/98/Me 这类 9x 系统。","n":130,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"批处理操作系统的主要特点是____。","o":["用户随时能与作业交互","只能处理一个字符","必须由用户逐个手动启动每个作业","作业成批提交、系统自动依次处理"],"a":"D","ex":"批处理系统把若干作业成批提交，由系统按顺序自动调度完成，处理过程中用户不能干预；A、D 正好说反，C 是瞎编的能力描述。","n":131,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"分时操作系统中，CPU 把运行时间划分成很短的____，轮流为每个终端用户服务。","o":["批作业","中断向量","时间片","进程段"],"a":"C","ex":"分时系统按时间片轮转的方式把 CPU 轮流分配给各终端，使每个用户都感觉自己在独占计算机；时间片是它的核心概念，其余选项都不是划分 CPU 时间的单位。","n":132,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"导弹制导、工业过程控制等对响应时间和可靠性要求极高的场合，适合采用____操作系统。","o":["批处理","分时","网络","实时"],"a":"D","ex":"实时系统要求在规定时间内对外部事件作出及时响应，且可靠性高，因此广泛用于工业控制和军事领域；批处理无交互、分时只保证轮流服务但不保证严格时限。","n":133,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"按用户数和任务数分类，Windows 7 属于____操作系统。","o":["单用户多任务","单用户单任务","多用户单任务","多用户多任务"],"a":"A","ex":"Windows 7 面向单个用户，但可以同时运行多个程序，属于单用户多任务；DOS 是单用户单任务，Unix/Linux 是多用户多任务。","n":134,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 DOS 系统中，软盘驱动器使用的盘符是____。","o":["C: 和 D:","A: 和 B:","E: 和 F:","Z: 和 Y:"],"a":"B","ex":"DOS 规定 A:、B: 固定分配给软盘驱动器，硬盘从 C: 开始编号；C:、D: 及以后的盘符与硬盘、光盘等设备对应。","n":135,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"DOS 中文件路径里各级目录之间的分隔符是____。","o":["/","\\",".",";"],"a":"C","ex":"DOS 和 Windows 都用反斜杠 \\ 作为路径分隔符，例如 C:\\WINDOWS\\system32；斜杠 / 是 Unix/Linux 系统的路径分隔符。","n":136,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"DOS 通配符 * 可以代替____。","o":["任意一个字符","一个指定字符","回车符","任意多个字符"],"a":"D","ex":"* 代表任意多个（包括零个）字符，如 *.TXT 表示所有扩展名为 TXT 的文件；只代表任意一个字符的是通配符 ?。","roast":"星号问号都分不清，考试时文件全在跟你捉迷藏。","n":137,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"DOS 通配符 ? 可以代替____。","o":["任意一个字符","任意多个字符","固定数字","所有汉字"],"a":"A","ex":"? 只代表它所在位置上的任意一个字符，如 AB?D 可匹配 ABCD、AB1D 等；代替任意多个字符的是 *，两者常配合使用。","n":138,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"DOS 中绝对路径必须从____开始描述。","o":["当前目录","根目录","上级目录","软盘"],"a":"B","ex":"绝对路径从根目录（\\）出发逐级写到目标文件，如 \\WINDOWS\\system32；从当前目录出发的是相对路径，两者起点不同。","n":139,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"DOS 中用于显示磁盘目录内容和文件清单的命令是____。","o":["CD","COPY","DIR","DEL"],"a":"C","ex":"DIR 用来列出目录下的文件和子目录；CD 改变当前目录，COPY 复制文件，DEL 删除文件，功能各不相同。","n":140,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 的资源管理器以树形结构管理资源，树形结构的根是____。","o":["计算机","本地磁盘 C:","用户文件夹","桌面"],"a":"D","ex":"资源管理器导航窗格的最顶层是桌面，计算机、库、网络等都是它下面一级的分支；C 盘只是计算机节点下的一个磁盘分支。","n":141,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 资源管理器提供的文件（夹）查看方式共有____。","o":["8 种","4 种","16 种","2 种"],"a":"A","ex":"Windows 7 的查看方式有超大图标、大图标、中等图标、小图标、列表、详细信息、平铺、内容共 8 种，比 XP 多了超大图标和内容两种。","roast":"数指头的题，数错说明你手指头比脑子勤快。","n":142,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 资源管理器中，选择“详细信息”查看方式后，窗口将显示文件的____。","o":["名称、图标颜色、作者、密码","名称、修改日期、类型、大小","创建者、计算机名、路径、批注","首字节、扇区号、簇号、校验码"],"a":"B","ex":"详细信息视图按列显示名称、修改日期、类型、大小等常规信息，还可单击列标题排序；密码、扇区、簇号这类内容并不显示在该视图中。","n":143,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 中的“库”是____。","o":["存放所有安装软件的目录","一种硬件设备","虚拟的文件夹容器，可将多个不同位置的文件夹聚合显示","回收站的另一种名称"],"a":"C","ex":"库（文档、图片、音乐、视频等）本身不存储文件，只是把分散在磁盘各处的文件夹汇集到一起统一查看管理；真正的文件仍存放在各自的原始位置。","n":144,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 Windows 7 中，打开资源管理器的快捷键是____。","o":["Ctrl+E","Alt+E","Win+E","Shift+E"],"a":"C","ex":"按 Windows 徽标键+E 可直接打开资源管理器；Ctrl/Alt/Shift 与 E 的组合都不是该功能的标准快捷键。","roast":"Win+E 每天摸几百遍的键，记不住只能说明你没干过活。","n":145,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 资源管理器导航窗格中，默认包含的项目组是____。","o":["回收站","收藏夹、库、计算机、网络","控制面板","网上邻居"],"a":"B","ex":"Win7 导航窗格从上到下依次是收藏夹、库、计算机、网络四组；控制面板要经开始菜单进入，网上邻居是 XP 时代的叫法，回收站则在桌面上。","n":146,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 资源管理器的地址栏采用“面包屑”式设计，单击地址栏中某一级文件夹名称后的下拉箭头，可以____。","o":["查看并跳转到该层级的子文件夹或常用位置","删除该文件夹","重命名该文件夹","隐藏该文件夹"],"a":"A","ex":"地址栏把当前路径分成若干按钮，点某一级的下拉箭头会展开该层下的子文件夹，选择后直接跳转过去；它只做导航，不做删除、重命名这类修改操作。","n":147,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 Windows 7 资源管理器窗口右上角的搜索框中输入关键字后，系统默认的搜索范围是____。","o":["整个互联网","整个计算机的所有磁盘","回收站","当前文件夹（含其子文件夹）"],"a":"D","ex":"资源管理器的搜索框是即时搜索，输入后立即在当前打开的文件夹及其子文件夹范围内查找；要扩大范围需先切换到更高层目录或使用地址栏的库、计算机位置。","n":148,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"要让 Windows 7 显示具有隐藏属性的文件，应通过____进行设置。","o":["显示属性","任务栏属性","文件夹选项","搜索框"],"a":"C","ex":"打开“组织→文件夹和搜索选项”（即文件夹选项），在“查看”选项卡里选择“显示隐藏的文件、文件夹和驱动器”；显示属性管外观，任务栏属性管任务栏，都管不了文件显隐。","n":149,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 资源管理器默认的“排序方式”不包括____。","o":["颜色","名称","类型","大小"],"a":"A","ex":"默认排序方式有名称、修改日期、类型、大小等，文件没有“颜色”这种排序依据；其余三项都是常用排序项。","n":150,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 Windows 7 资源管理器中新建文件夹，应在右键快捷菜单中选择____命令。","o":["刷新","新建→文件夹","属性","排序方式"],"a":"B","ex":"空白处右击选择“新建→文件夹”即可建立新文件夹并输入名称；刷新只是重读显示内容，属性用于查看设置，排序方式只改变显示顺序。","n":151,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"要让 Windows 7 显示文件的扩展名，应在文件夹选项的“查看”选项卡中____。","o":["勾选“隐藏已知文件类型的扩展名”","勾选“在单独的进程中打开文件夹窗口”","勾选“始终显示图标，从不显示缩略图”","取消勾选“隐藏已知文件类型的扩展名”"],"a":"D","ex":"默认状态下系统隐藏常见类型的扩展名，取消勾选“隐藏已知文件类型的扩展名”后即可显示；A 是恢复隐藏，C、D 与扩展名显示无关。","n":152,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"下列不属于文件常见基本属性的是____。","o":["只读","隐藏","存档","打印"],"a":"D","ex":"文件的基本属性包括只读、隐藏、存档（以及系统属性），在属性对话框中设置；“打印”不是文件的属性。","n":153,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"将文件设置为只读属性后，该文件____。","o":["不能被随意修改或覆盖，删除时会给出确认提示","不能被复制","不能被移动到其他磁盘","会自动加密"],"a":"A","ex":"只读属性限制的是写操作：修改后不能以原名直接保存，删除时系统会提示确认；只读文件照样可以复制、移动，加密是另外的高级属性。","n":154,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"为防止重要文件在资源管理器中被看到，可将该文件的属性设置为____。","o":["只读","存档","系统","隐藏"],"a":"D","ex":"隐藏属性使文件在默认设置下不出现在资源管理器窗口中；只读防修改，存档供备份程序标记，系统属性属于系统文件专用。","n":155,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 规定，文件名中不能包含的字符是____。","o":["空格和汉字","字母和数字","\\ / : * ? \" < > |","下划线 _"],"a":"C","ex":"Windows 文件名禁止使用 \\ / : * ? \" < > | 这 9 个字符，因为它们被系统用于路径、通配符等用途；空格、汉字、字母数字和下划线都可以出现在文件名中。","roast":"文件名里塞星号还问为什么建不出来，通配符白学了是吧。","n":156,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 中文件（夹）名称的最大长度约为____。","o":["8 个字符","11 个字符","128 个字符","255 个字符"],"a":"D","ex":"Windows 支持长文件名，名称最长可达 255 个字符；8+3 是 DOS 时代的 8.3 短文件名规则。","n":157,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"文件扩展名的主要作用是____。","o":["标识文件的类型","决定文件的大小","决定文件的存储位置","加密文件内容"],"a":"A","ex":"扩展名跟在主名后的小数点后，用来标识文件类型，系统据此关联打开程序；文件大小、位置由内容本身和存放路径决定，与扩展名无关。","n":158,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"下列文件名中，合法的是____。","o":["a*b.docx","我的 文件.txt","x/y.png","CON?.exe"],"a":"B","ex":"文件名可以包含空格和汉字，“我的 文件.txt”合法；其余选项分别含有 *、/、? 这三个被禁止的字符，无法创建。","n":159,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 对文件名中英文字母大小写的处理是____。","o":["区分大小写","全部强制转成大写","不区分大小写","大小写必须一致才能打开"],"a":"C","ex":"Windows 的文件名不区分大小写，ABC.txt 和 abc.txt 会被视为同一个文件，但系统会保留输入时的大小写形式；区分大小写的是 Linux 等系统。","n":160,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在资源管理器中要一次选中多个不连续的文件，应____。","o":["逐一拖动鼠标框选","按住 Shift 键逐个单击","按住 Alt 键逐个单击","按住 Ctrl 键逐个单击"],"a":"D","ex":"Ctrl+单击用于选中或取消不连续的多个对象；Shift+单击选中的是连续区域，Alt 键不参与选择，拖动框选只能选出一片连续区域。","roast":"Ctrl 和 Shift 都按不明白，文件管理这关你怕是过不去了。","n":161,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在资源管理器中要选中一组连续排列的文件，可以先单击第一个文件，再____。","o":["按住 Shift 键单击最后一个文件","按住 Ctrl 键单击最后一个文件","按住 Alt 键单击最后一个文件","双击最后一个文件"],"a":"A","ex":"Shift+单击可以把第一次单击到本次单击之间的连续区域全部选中；Ctrl+单击是挑选不连续对象，双击则直接打开文件。","n":162,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在资源管理器中选定当前文件夹内全部文件的快捷键是____。","o":["Ctrl+C","Ctrl+A","Ctrl+V","Ctrl+Z"],"a":"B","ex":"Ctrl+A（All）选中当前窗口中的全部对象；Ctrl+C 复制，Ctrl+V 粘贴，Ctrl+Z 撤销，都是编辑操作而非选择操作。","roast":"Ctrl+A，A 是 All，记住这个单词这道题就是白送。","n":163,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在已选中多个文件的情况下，要取消其中某一个文件的选中状态，应____。","o":["单击该文件外的空白处","按 Esc 键","按住 Ctrl 键单击该文件","双击该文件"],"a":"C","ex":"按住 Ctrl 单击已选中的文件可单独取消它的选中状态，其余保持选中；单击空白处会取消全部选择，双击会打开该文件。","n":164,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 Windows 7 中，右击任务栏空白处可以对已打开的窗口进行____排列。","o":["压缩排列","层叠窗口、堆叠显示窗口、并排显示窗口","随机排列","按文件大小排列"],"a":"B","ex":"任务栏快捷菜单提供层叠窗口、堆叠显示窗口、并排显示窗口三种窗口排列方式；窗口排列针对的是打开的窗口，与文件大小无关。","n":165,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"Windows 7 资源管理器中，下列不属于“排序方式”选项的是____。","o":["名称","修改日期","类型","分辨率"],"a":"D","ex":"排序方式包括名称、修改日期、类型、大小等，分辨率是图像自身的参数，不能作为文件排序依据。","n":166,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 Windows 7 的 CMD 窗口中，查看当前目录下有哪些文件和子文件夹，应使用的命令是____。","o":["cd","dir","md","type"],"a":"B","ex":"dir 是目录列表命令，专门用来列文件和文件夹；cd 只切换当前目录，md 是新建目录，type 用来显示文本文件的内容。","roast":"这题要是能错，我建议先把键盘供起来再做题。","n":167,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 中执行 dir /w，与直接执行 dir 相比，显示方式的主要变化是____。","o":["每显示满一屏就暂停","以宽行格式显示，一行列出多个文件名","把隐藏文件也显示出来","把子目录中的文件也显示出来"],"a":"B","ex":"/w 是 wide 的缩写，按宽行精简显示，一行放多个文件名；逐屏暂停是 /p，显示所有属性文件是 /a，递归列子目录是 /s。","n":168,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"当前目录下文件较多，希望 dir 显示满一屏后暂停，按任意键再继续显示下一屏，应使用的命令是____。","o":["dir /w","dir /s","dir /p","dir /a"],"a":"C","ex":"/p 即 pause，每满一屏暂停等待按键；/w 是宽行显示不会停，/s 用于连子目录一起列，/a 用于按属性筛选显示。","n":169,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 中不仅要列出当前目录下的文件，还要把各级子目录里的文件一并列出来，应使用的命令是____。","o":["dir","dir /p","dir /w","dir /s"],"a":"D","ex":"/s 让 dir 递归进入各级子目录，把里面的文件也列出来；不带参数的 dir 只列当前目录，/p 和 /w 只改变显示方式，不会进入子目录。","n":170,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"当前目录下有隐藏文件，用 dir 查看时看不到它们，要把隐藏文件也一起显示出来，应执行____。","o":["dir /a","dir /w","dir /p","dir /s"],"a":"A","ex":"/a 表示显示指定属性的所有文件，默认就把隐藏文件列出来；dir 不加 /a 时不显示隐藏和系统文件，而 /w、/p、/s 都不改变这种属性筛选。","n":171,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"关于 dir 命令的参数，下列说法正确的是____。","o":["/w 表示显示文件的详细属性信息","/a 表示每显示一屏暂停一次","/p 表示按文件名排序显示","/s 表示把子目录中的文件也一并列出"],"a":"D","ex":"/s 的作用就是递归列出子目录内容；/p 是逐屏暂停不是排序，/w 是宽行精简显示不是详细属性，/a 是按属性筛选不是暂停。","n":172,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 中，当前提示符为 C:\\>，要进入 C 盘根目录下的 STUDY 文件夹，应使用的命令是____。","o":["cd /STUDY","md STUDY","cd STUDY","dir STUDY"],"a":"C","ex":"cd 后面跟子目录名，表示进入该目录；md 是新建目录不是进入，dir 只是查看列表，而且 Windows 的路径分隔符是 \\ 不是 /。","n":173,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"当前目录为 C:\\STUDY\\COMPUTER，要返回上一级目录 C:\\STUDY，应使用的命令是____。","o":["cd\\","cd /","cd .","cd.."],"a":"D","ex":"cd 后的两个点..代表上一级目录，cd.. 就是退回一级；cd\\ 是直接回到根目录，单独一个点.代表当前目录，斜杠 / 不是返回上级的写法。","n":174,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"当前目录为 C:\\STUDY\\COMPUTER\\CMD，无论嵌套了多少层，都要一条命令直接回到 C 盘根目录，应使用____。","o":["cd\\","cd..","cd/","md\\"],"a":"A","ex":"cd 后跟反斜杠 \\，反斜杠代表根目录，一条命令就能回到盘符根；cd.. 每次只退一级，cd/ 写法错误，md 是建目录的命令跟回根无关。","n":175,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 中直接输入 cd 并回车，后面不跟任何参数，它的作用是____。","o":["返回根目录","显示当前目录的完整路径","清除屏幕显示","进入当前目录的上一级"],"a":"B","ex":"cd 不带参数时只显示当前所在的完整路径，并不会移动位置；回根目录用 cd\\，清屏是 cls，回上一级要用 cd..。","n":176,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 中，要在当前目录下新建一个名为 TEST 的文件夹，应使用的命令是____。","o":["cd TEST","rd TEST","dir TEST","md TEST"],"a":"D","ex":"md 即 make directory，用来新建目录；cd 是进入目录，rd 是删除目录，dir 是列目录内容，都干不了新建的活。","n":177,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"当前目录下的空文件夹 OLD 已经没有用了，要把它删除，应使用的命令是____。","o":["md OLD","dir OLD","cd OLD","rd OLD"],"a":"D","ex":"rd 即 remove directory，用来删除空目录；md 是新建目录方向反了，cd 只是进去看看，dir 只是查看列表，都不是删除。","n":178,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"文件夹 WORK 中还存放着文件，在 CMD 中执行 rd WORK，结果是____。","o":["文件夹连同其中的文件一起被删除","只删除文件夹中的文件，保留文件夹","命令出错，提示目录不是空的，文件夹不会被删除","系统重启后自动删除该文件夹"],"a":"C","ex":"rd 只能删除空目录，目录里还有文件时会报错拒绝删除，起到防误删的保护作用；要连内容一起删得用 rd /s 并确认，本题只写了 rd。","n":179,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"关于 md 和 rd 命令，下列说法正确的是____。","o":["md 用来删除目录，rd 用来新建目录","rd 可以直接删除含有文件的目录","md 和 rd 都必须先进入要操作的目录才能使用","md 可以一次新建目录，rd 只能删除空目录"],"a":"D","ex":"md 建目录、rd 删目录，两者分工明确且都可以带路径直接操作；rd 直接删非空目录会报错，两个命令的职责说法也和实际相反。","n":180,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"要在 D 盘根目录下新建文件夹 EXAM，当前目录是 C:\\，下列命令正确的是____。","o":["md D:\\EXAM","cd D:\\EXAM","rd D:\\EXAM","md EXAM"],"a":"A","ex":"md 后面可以带完整路径，在当前目录是 C 盘时也能直接在 D 盘建目录；cd 只是切换过去建不了，rd 是删除方向反了，不带路径的 md EXAM 会在当前 C 盘目录下建，位置不对。","n":181,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 窗口中，屏幕上命令和结果堆了很多行，想把窗口内容全部清除、只保留顶部提示符，应使用的命令是____。","o":["ver","cls","dir","cd"],"a":"B","ex":"cls 即 clear screen，作用就是清屏；ver 是看系统版本，dir 是列文件，cd 是切换目录，都跟清屏无关。","n":182,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 中想查看当前安装的 Windows 操作系统版本号，应使用的命令是____。","o":["time","ver","date","vol"],"a":"B","ex":"ver 是 version 的缩写，显示 Windows 版本信息；date 看日期，time 看时间，vol 显示磁盘卷标和序列号，没有一个管版本。","n":183,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 中执行 date 命令并回车，系统会____。","o":["显示当前系统日期并提示输入新日期","只显示当前系统日期，不提示输入","直接修改日期","显示当前系统时间"],"a":"A","ex":"交互环境下 date 会先显示当前日期，并提示输入新日期，直接回车则保持不变；它管的是日期不是时间，显示时间是 time 命令的事。","n":184,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 中想查看并可以修改当前系统时间，应使用的命令是____。","o":["date","cls","time","ver"],"a":"C","ex":"time 命令显示当前时间并允许输入新时间；date 管日期，cls 清屏，ver 看版本，时间这摊事只有 time 管。","n":185,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"下列 CMD 命令与功能的对应关系中，错误的是____。","o":["cls——清除屏幕","ver——查看系统版本","dir——显示日期","md——新建目录"],"a":"C","ex":"dir 的功能是列出目录中的文件和子目录，显示日期是 date 命令的活；其余对应关系都正确。","n":186,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 Windows 7 的 CMD 窗口中，将当前目录下的文件 a.txt 复制到 D 盘 bak 文件夹中的命令是____。","o":["copy a.txt D:\\bak","move a.txt D:\\bak","del a.txt D:\\bak","type a.txt D:\\bak"],"a":"A","ex":"copy 用于复制文件，复制后原文件仍在；move 是移动命令，原位置的文件会消失；del 是删除文件的命令；type 用于显示文本文件内容，都不能完成复制。","n":187,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 窗口中执行命令 copy a.txt b.txt，其作用是____。","o":["将 a.txt 的内容追加到 b.txt 的末尾","将 a.txt 复制一份并命名为 b.txt，原 a.txt 仍然存在","将 a.txt 改名为 b.txt，原 a.txt 不再存在","将 a.txt 与 b.txt 两个文件合并成一个文件"],"a":"B","ex":"copy 源文件 目标文件 的作用是复制文件，原文件保留，执行后 a.txt 和 b.txt 同时存在；A 是 copy a.txt+b.txt 的合并用法；C 是 ren 或 move 的效果；D 的合并要用加号连接而不是空格。","n":188,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"要将 D:\\data 文件夹及其中的全部子文件夹和文件复制到 E 盘根目录，应使用的命令是____。","o":["copy D:\\data E:\\","type D:\\data E:\\","ren D:\\data E:\\","xcopy D:\\data E:\\ /s"],"a":"D","ex":"xcopy 可以复制目录及其子目录（目录树），加 /S 参数表示复制所有子目录；copy 一次只能复制文件，遇到文件夹会报错；type 是显示文本内容的命令；ren 是重命名命令。","n":189,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"使用 xcopy 命令复制目录时，要求连同所有子目录一起复制，即使是空子目录也要复制，应使用的参数是____。","o":["/s","/y","/e","/p"],"a":"C","ex":"xcopy /E 复制所有子目录，包括空目录；/S 只复制子目录但不包括空目录；/Y 表示覆盖目标文件时不提示确认；/P 表示创建每个目标文件前提示确认。","n":190,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 中执行 copy a.txt D:\\bak 时，若目标位置已存在同名文件 a.txt，希望系统不询问直接覆盖，应在命令中加参数____。","o":["/p","/s","/q","/y"],"a":"D","ex":"copy /Y 表示覆盖目标文件时不再提示确认，直接覆盖；/P 的作用相反，是创建每个目标文件前提示确认；/S 和 /Q 不是 copy 命令的参数，/S 是 xcopy 复制子目录的参数。","n":191,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"关于 copy 命令和 xcopy 命令，下列说法正确的是____。","o":["copy 可以复制整个文件夹（包括子文件夹），xcopy 只能复制单个文件","xcopy 可以复制目录及其子目录（目录树），copy 只能复制文件","xcopy 和 copy 功能完全相同，可以互相替代","copy 命令比 xcopy 命令的功能更强大"],"a":"B","ex":"xcopy 是 copy 的扩展版本，能够复制目录和子目录（目录树），copy 一次只能处理文件；A 把两者的能力说反了；C 错误，两者功能有明显差别；D 错误，xcopy 的功能更强大。","n":192,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 窗口中，删除当前目录下的文件 a.txt 的命令是____。","o":["rd a.txt","md a.txt","del a.txt","cd a.txt"],"a":"C","ex":"del（别名 erase）用于删除文件；rd 用于删除目录且不能删除文件；md 是新建目录；cd 是切换当前目录。","roast":"del 删文件、rd 删文件夹、md 建文件夹，这题我闭着眼睛都能选对，喂饭的你要是还错，罚你抄十遍。","n":193,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 中执行 del 命令删除文件时，希望系统在删除前显示确认提示，由用户按 Y 或 N 决定是否删除，应使用的命令是____。","o":["del /p a.txt","del /q a.txt","del /f a.txt","del /s a.txt"],"a":"A","ex":"del /P 在删除每一个文件之前提示确认；/Q 是安静模式，配合通配符删除时不提示；/F 用于强制删除只读文件；/S 表示删除当前目录及其子目录中的同名文件。","n":194,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 窗口中，要删除当前目录及其所有子目录中扩展名为 bak 的全部文件，应使用的命令是____。","o":["del bak /a","rd *.bak","del *.bak /s","del /p *.bak"],"a":"C","ex":"del /S 表示删除当前目录及其所有子目录中的指定文件，配合通配符 *.bak 可一次删完全部备份文件；rd 只能删除目录不能删除文件；A 中 del bak 删的是名为 bak 的文件，且 /a 是按属性筛选的参数；/P 是逐个确认删除，不是批量删除。","n":195,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"关于 del 命令和 rd 命令的区别，下列说法正确的是____。","o":["del 用于删除文件，rd 用于删除目录（文件夹）","del 用于删除目录，rd 用于删除文件","两者都能删除文件和目录，效果相同","del 只能删除目录，不能删除文件"],"a":"A","ex":"del（别名 erase）删除的是文件；rd（rmdir 的缩写）删除的是目录，不加参数只能删除空目录，加 /s 参数可删除目录及其中的全部内容；B、D 把两者的功能说反了；C 错误，del 不能删除目录，rd 不能直接删除文件。","n":196,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 Windows 7 的 CMD 窗口中，显示当前目录下文本文件 a.txt 内容的命令是____。","o":["cat a.txt","dir a.txt","type a.txt","ren a.txt"],"a":"C","ex":"type 用于把文本文件的内容显示在屏幕上；cat 是 Linux 系统里的命令，Windows 7 的 CMD 中没有；dir 只列出文件清单，并不显示内容；ren 是重命名命令。","n":197,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 窗口中执行 type abc.exe（abc.exe 是一个可执行程序文件），屏幕上最可能出现的结果是____。","o":["正常启动并运行该程序","提示 type 不是内部或外部命令","把该程序复制一份到当前目录","显示一堆无法辨认的乱码"],"a":"D","ex":"type 把文件内容当作文本原样输出到屏幕，exe 是二进制文件，输出的是无法辨认的乱码；type 只负责显示内容，既不能运行程序也不能复制文件；type 本身是 CMD 的内部命令，不会报找不到命令。","roast":"拿 type 开 exe 还想看出说明书？乱码警告，这题白送，选错了小鱼干都替你心疼。","n":198,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 窗口中，要把当前目录下的文件 old.txt 改名为 new.txt，应使用的命令是____。","o":["copy old.txt new.txt","ren old.txt new.txt","del old.txt new.txt","dir old.txt new.txt"],"a":"B","ex":"ren（rename 的缩写）用于重命名，执行后 old.txt 这个名字不再存在；copy 是复制，会生成新文件 new.txt 但 old.txt 仍保留着，不算改名；del 是删除文件；dir 是显示目录清单，都不能完成改名。","n":199,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"关于 ren 命令，下列说法正确的是____。","o":["ren 改名后文件的内容会丢失","ren 只能给文件改名，不能给文件夹改名","ren 既能给文件改名，也能给文件夹改名","ren 可以把文件移动到其他文件夹中"],"a":"C","ex":"ren 命令对文件和文件夹都可以重命名，改名只换名字，文件的内容和所在位置都不变，不会丢失内容；把文件搬到其他文件夹是 move 命令的功能，不是 ren 干的活。","n":200,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 中执行 move note.txt D:\\docs（D:\\docs 文件夹已存在）后，下列说法正确的是____。","o":["note.txt 被移动到 D:\\docs 中，原位置的 note.txt 消失","note.txt 被复制到 D:\\docs 中，原位置的 note.txt 仍然存在","note.txt 被直接删除，D:\\docs 中没有该文件","note.txt 的内容被清空后留在原位置"],"a":"A","ex":"move 是移动命令，把文件从一个位置搬到另一个位置，原位置不再保留该文件；复制后原文件仍在是 copy 的效果；move 既不会把文件删掉也不会清空内容，文件完好地出现在目标文件夹中。","n":201,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 窗口中，要把当前目录下的所有 .txt 文件移动到 D 盘 bak 文件夹（该文件夹已存在）中，应使用的命令是____。","o":["copy *.txt D:\\bak","type *.txt D:\\bak","ren *.txt D:\\bak","move *.txt D:\\bak"],"a":"D","ex":"move 支持通配符，可以一次把所有匹配的 .txt 文件移动到目标文件夹，移动后原位置不再保留；copy 只能完成复制，原文件仍在；type 是显示文本内容的命令；ren 是重命名，不能把文件搬到别的文件夹。","n":202,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 中，通配符 * 和 ? 都可以代表文件名中的字符，它们的区别是____。","o":["* 代表任意多个字符，? 只代表一个任意字符","? 代表任意多个字符，* 只代表一个任意字符","* 和 ? 都只能代表一个字符，两者没有区别","* 只能代表字母，? 只能代表数字"],"a":"A","ex":"星号 * 可以匹配任意多个（包括零个）字符，问号 ? 只匹配该位置上的一个字符；B 把两者的作用说反了；C 错误，两者匹配能力不同；通配符对字母、数字等任意字符都有效，不存在只代表字母或数字的限制。","n":203,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"当前目录下有文件 abc.txt、a1.txt、abcd.doc，执行命令 del a?.txt 后被删除的文件是____。","o":["abc.txt","a1.txt","abcd.doc","abc.txt 和 a1.txt 都被删除"],"a":"B","ex":"del a?.txt 中的 ? 只匹配一个字符，能匹配的是「a+任意一个字符+.txt」形式的文件，当前目录下只有 a1.txt 符合；abc.txt 中 a 后面是两个字符 bc，不匹配；abcd.doc 扩展名不是 txt，也不匹配。","n":204,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"在 CMD 中执行 dir *.doc，其作用是____。","o":["显示当前目录下所有文件的完整内容","删除当前目录下所有扩展名为 doc 的文件","把当前目录下所有 doc 文件复制到其他位置","列出当前目录下所有扩展名为 doc 的文件"],"a":"D","ex":"dir 是列表命令，*.doc 中的 * 匹配任意多个字符，所以列出的是所有扩展名为 doc 的文件；dir 只显示清单，不显示文件内容，更不会删除或复制文件，删除要用 del，复制要用 copy。","n":205,"c":2,"status":"OK"},{"m":"M3","mn":"操作系统基础","s":"关于绝对路径和相对路径，下列说法正确的是____。","o":["绝对路径是从根目录（如 D:\\）开始写起的路径，相对路径是从当前目录开始写起的路径","绝对路径是从当前目录开始写起的路径，相对路径是从根目录开始写起的路径","绝对路径和相对路径都必须从盘符开始写","相对路径只能用来表示文件，不能用来表示文件夹"],"a":"A","ex":"绝对路径从根目录开始，完整写出到达目标的路线（如 D:\\docs\\a.txt），相对路径以当前目录为起点（如 ..\\bak 或 docs\\a.txt）；B 把两者说反了；相对路径不一定带盘符，C 错误；相对路径同样可以表示文件夹，D 错误。","n":206,"c":2,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"PowerPoint 2010的主要用途是____。","o":["处理电子表格","制作演示文稿","编辑数据库","编写程序代码"],"a":"B","ex":"PowerPoint专门用来制作和放映演示文稿（幻灯片），常用于教学、汇报、产品展示；电子表格是Excel的活，数据库管理不属于办公三件套里PowerPoint的职能。","roast":"这题都能错，那我上课真是一边讲一边漏了。","n":33,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"某个文件的扩展名是ppsx，双击它后会____。","o":["打开编辑窗口","弹出另存为对话框","提示文件损坏","直接开始放映幻灯片"],"a":"D","ex":"ppsx是PowerPoint 2007及以后版本的放映格式文件，双击后不进入编辑状态而是直接全屏放映；要编辑它得先启动PowerPoint再用打开命令选择该文件。","n":34,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"PowerPoint 2010模板文件的扩展名是____。","o":["potx","pptx","ppsx","pot"],"a":"A","ex":"potx是PowerPoint 2007及以后版本模板文件的标准扩展名；pptx是演示文稿扩展名，ppsx是放映格式，pot是PowerPoint 2003的老模板扩展名，四个别混。","n":35,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"一个演示文稿由若干张____组成。","o":["工作表","文档页","幻灯片","工作簿"],"a":"C","ex":"演示文稿的基本组成单位是幻灯片，一页就是一张；工作表和工作簿是Excel里的概念，文档页是Word的说法，串台了就全错。","roast":"幻灯片、工作表都分不清，Excel听了都要摇头。","n":36,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"普通视图下，用来输入演讲者提示文字的窗格是____。","o":["大纲窗格","备注窗格","幻灯片窗格","状态栏"],"a":"B","ex":"备注窗格专门用来写演讲提示，放映时观众看不到；大纲窗格显示标题和文字结构，幻灯片窗格是编辑当前页的主区域。","n":37,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"能在一个窗口中同时看到多张幻灯片缩略图、便于整体查看的视图是____。","o":["幻灯片浏览视图","普通视图","备注页视图","阅读视图"],"a":"A","ex":"幻灯片浏览视图把所有幻灯片按缩略图平铺排列，便于整体浏览和调整顺序；普通视图一次只重点编辑一张幻灯片。","n":38,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"PowerPoint 2010窗口底部状态栏右侧的视图按钮中，不包含____。","o":["普通视图","幻灯片浏览视图","备注页视图","阅读视图"],"a":"C","ex":"状态栏右侧固定提供普通、幻灯片浏览、阅读视图三个按钮和放映按钮；备注页视图要在视图选项卡里才能进入，状态栏上没有它。","n":39,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"用PowerPoint 2010制作演示文稿并保存，默认的文件类型（扩展名）是____。","o":["ppt","potx","txt","pptx"],"a":"D","ex":"pptx是PowerPoint 2007及以后版本的默认保存格式；ppt是2003版老格式，potx是模板格式，txt是纯文本根本存不了幻灯片。","roast":"pptx都记不住？送分题送出门你还能摔一跤，我服了。","n":40,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在PowerPoint 2010中新建一张幻灯片的快捷键是____。","o":["Ctrl+N","Ctrl+M","Ctrl+P","Ctrl+E"],"a":"B","ex":"Ctrl+M是插入新幻灯片的快捷键；Ctrl+N是新建整个演示文稿文件，Ctrl+P是打印，Ctrl+E在段落对齐里是居中，三个都是来捣乱的。","n":41,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"“新建幻灯片”和“版式”按钮位于____选项卡。","o":["设计","插入","开始","视图"],"a":"C","ex":"新建幻灯片、版式都属于开始选项卡里的幻灯片组；设计选项卡管主题和背景，插入选项卡管各类对象，视图选项卡管视图切换和母版。","n":42,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在普通视图中新建一张幻灯片时，默认使用的版式是____。","o":["标题幻灯片","空白","两栏内容","标题和内容"],"a":"D","ex":"新建幻灯片时默认套用“标题和内容”版式；“标题幻灯片”版式一般只给整套文稿的第一页用，空白版式什么都不带。","n":43,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在幻灯片缩略图列表中选中某张幻灯片后按Delete键，结果是____。","o":["删除选中的幻灯片","删除幻灯片中的文本框","删除全部幻灯片","弹出删除确认框"],"a":"A","ex":"选中整张幻灯片后按Delete直接删除该页，不弹确认框；只有选中的是页内某个对象时，按Delete删的才是对象。","roast":"删除还等电脑弹框问你？它没那么多废话，删了就是删了。","n":44,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"复制一张幻灯片后，把副本放到新位置的快捷键是____。","o":["Ctrl+X","Ctrl+V","Ctrl+C","Ctrl+Z"],"a":"B","ex":"完整流程是Ctrl+C复制、Ctrl+V粘贴；Ctrl+X是剪切，Ctrl+Z是撤销。复制只负责留副本，粘贴这一步才真正生成新页。","n":45,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在幻灯片浏览视图下，按住____键并单击可以同时选中多张不连续的幻灯片。","o":["Shift","Alt","Tab","Ctrl"],"a":"D","ex":"Ctrl+单击用来挑不连续的多张；Shift+单击选的是起点到终点之间的连续多张；Alt和Tab根本不参与选择操作。","n":46,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"要让某张幻灯片在放映时被跳过，应使用____选项卡中的“隐藏幻灯片”命令。","o":["幻灯片放映","插入","开始","动画"],"a":"A","ex":"隐藏幻灯片命令在幻灯片放映选项卡里，执行后该页缩略图编号上会出现斜线标记；动画选项卡只管动画效果，管不了页面显不显示。","n":47,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"对幻灯片执行“隐藏幻灯片”后，下列说法正确的是____。","o":["放映时该页不显示，但仍保留在文稿中","该幻灯片被彻底删除","该幻灯片变成空白页","隐藏后不能再取消"],"a":"A","ex":"隐藏只是放映时跳过这一页，幻灯片本身还在文件里，再点一次“隐藏幻灯片”就能取消；删除和隐藏是两码事，别混。","n":48,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在幻灯片浏览视图下先单击第一张幻灯片，再按住____键单击最后一张，可选中两张之间的全部幻灯片。","o":["Ctrl","Alt","Shift","Esc"],"a":"C","ex":"Shift+单击选连续区间，和上一题的Ctrl+单击（选不连续）正好凑成一对，考试就爱把它俩放一起考。","n":49,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"不小心误删了一张幻灯片，想找回来应立即按____。","o":["Ctrl+S","Ctrl+F","Ctrl+Y","Ctrl+Z"],"a":"D","ex":"Ctrl+Z撤销上一步操作，刚删错的幻灯片能完整恢复；Ctrl+S是保存，Ctrl+F是查找，Ctrl+Y是恢复被撤销的操作，方向正好相反。","n":50,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"选中第3张幻灯片后单击“新建幻灯片”，新幻灯片将出现在____。","o":["第3张之后，成为新的第4张","整个文稿最前面","第3张之前，成为新的第3张","文稿最后面"],"a":"A","ex":"新幻灯片总是插在当前选中幻灯片的后面；想让新页排在最前面，得先选中第1张再新建。","n":51,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"普通视图左侧的大纲窗格中，主要显示各张幻灯片的____。","o":["背景颜色","标题和正文文字","动画列表","切换效果"],"a":"B","ex":"大纲窗格按层次列出每页的标题和文字内容，适合批量整理文字；背景、动画、切换这些设置在大纲里看不到。","n":52,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在文本框中输入文字后按回车键，光标会____。","o":["跳到下一张幻灯片","结束文本框编辑","移到文本框内下一行","删除前一个字符"],"a":"C","ex":"文本框里回车就是普通换行，光标移到下一行，文本框还在；它和“按Esc退出编辑”是两件事，更不会直接翻页。","n":53,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在幻灯片中插入文本框，应使用____选项卡。","o":["插入","设计","切换","审阅"],"a":"A","ex":"文本框、图片、艺术字、表格、图表、音频、视频这些对象全在插入选项卡里，设计管主题背景，切换管翻页效果，审阅管拼写和批注。","roast":"插入选项卡就是个大超市，买东西认准门口就行，这也要错？","n":54,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"下列关于文本框的说法正确的是____。","o":["文本框内文字不能改变字体","横排文本框只能输入一个字","占位符和文本框都能用来输入文字","删除文本框会同时删除整张幻灯片"],"a":"C","ex":"占位符（版式自带的提示框）和手动插入的文本框都能输入文字；文本框内文字可以任意设置字体字号，删除文本框只删掉这个对象，幻灯片本身还在。","n":55,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"艺术字建立后，要改变其颜色和轮廓样式，应使用____选项卡。","o":["动画","格式","视图","引用"],"a":"B","ex":"选中艺术字后功能区会出现绘图工具-格式选项卡，填充、轮廓、样式都在这里改；动画管的是它动不动，视图管窗口布局，PowerPoint里根本没有引用选项卡。","n":56,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"下列对象中，插入幻灯片后不能再编辑其文字内容的是____。","o":["文本框","艺术字","占位符","剪贴画（图片）"],"a":"D","ex":"剪贴画插入后是图片，整体被当作图形对象处理，里面的字变成像素，改不了；文本框、艺术字、占位符都是文字对象，双击就能继续改字。","n":57,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"PowerPoint 2010中插入图片后，默认的环绕方式问题是——实际上幻灯片里的图片可以____。","o":["只能放在固定位置","被拖动到幻灯片任意位置","必须铺满整张幻灯片","只能靠左对齐"],"a":"B","ex":"幻灯片里的图片是浮动对象，选中后直接拖到哪儿都行，还能用格式选项卡精确调整大小位置；Word里那套“嵌入式环绕”的束缚在PPT里不存在。","n":58,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"要插入“来自文件”的图片，应执行插入图片下拉列表中的____命令。","o":["剪贴画","屏幕截图","来自文件","相册"],"a":"C","ex":"插入图片按钮下拉列表里有来自文件、剪贴画、屏幕截图等命令，来自文件用于打开本机图片；相册是批量导入一组照片的专门功能。","n":59,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在幻灯片中插入表格后，要合并相邻的两个单元格，先选中它们，再使用____选项卡中的合并单元格命令。","o":["插入","布局","动画","幻灯片放映"],"a":"B","ex":"选中表格后功能区出现表格工具，其下有设计和布局两个选项卡，合并单元格在布局选项卡里；设计选项卡管表格样式配色。","n":60,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"下列关于幻灯片中图表的说法正确的是____。","o":["插入图表时会同时打开数据表供编辑","插入图表后数据只能看不能改","图表只能来自Excel文件","图表颜色永远不能改"],"a":"A","ex":"插入图表时PowerPoint会弹出一张自带的Excel数据表，改表里数字图就跟着变；图表数据随时可编辑，颜色也能在设计选项卡里换。","n":61,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在幻灯片中插入音频文件后，小喇叭图标在放映时的显示方式是____。","o":["一直在屏幕上","只在第一张出现","变成文字提示","放映时不会出现在放映画面中"],"a":"D","ex":"放映画面里看不到小喇叭图标，声音照常播放，观众只闻其声不见其标；编辑状态下才能看见并选中这个图标。","n":62,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"要在幻灯片放映时播放一段视频，应通过____选项卡插入该视频文件。","o":["插入","视图","开始","审阅"],"a":"A","ex":"插入选项卡里单击视频命令，可选来自文件的影片；插入后选中视频还能在播放选项卡里设置自动播放还是单击播放。","n":63,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"幻灯片母版的主要作用是____。","o":["统一设置整套幻灯片的格式","放映时自动播放音乐","统计幻灯片张数","为每张幻灯片单独设置动画"],"a":"A","ex":"在母版里改字体、占位符位置、背景等，所有套用该母版的幻灯片一起跟着变，省得一页页改；母版不涉及放映音乐和动画。","roast":"母版就是服装厂的总图纸，改图纸所有衣服跟着改，一件件手缝的傻孩子才一页页手改。","n":64,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"要进入幻灯片母版编辑状态，应单击____选项卡中的“幻灯片母版”按钮。","o":["设计","视图","开始","动画"],"a":"B","ex":"视图选项卡里有母版视图组，包含幻灯片母版、讲义母版、备注母版；平时改页内内容用普通视图，改全局样式才进母版。","n":65,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"关于幻灯片母版和版式的关系，正确的说法是____。","o":["每种版式都是母版下的一张母版版式页，受母版控制","版式比母版级别高","母版和版式互不相干","一张幻灯片必须使用母版里没有的版式"],"a":"A","ex":"母版下挂若干种版式（标题幻灯片、标题和内容、空白等），母版改动会带动所有版式，版式改动只影响套用它的页面；母版是上级，版式是下级。","n":66,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"修改幻灯片母版上的标题字体后，使用默认版式的幻灯片____。","o":["只有第一张跟着变","标题字体全部跟着变","字体不变","全部内容消失"],"a":"B","ex":"改母版是全局生效，所有套用默认版式的页面标题字体统一更新；想让某一张特殊化，得回普通视图单独改那一张。","n":67,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"应用设计模板（主题）后，PowerPoint会统一改变幻灯片的____。","o":["幻灯片的张数","音频文件的音量","放映时的动画速度","背景、颜色和字体方案"],"a":"D","ex":"设计模板（主题）一次性提供背景、配色和字体方案，点一下全稿换装；它管样式不管张数，更管不了音量和动画速度。","n":68,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"“设计”选项卡中的“主题”组的作用是____。","o":["设置段落行距","插入超链接","为演示文稿应用统一的配色和样式方案","切换视图"],"a":"C","ex":"主题组提供一整套背景、颜色、字体的组合方案，单击即全稿应用；超链接在插入选项卡，行距在开始选项卡的段落组里。","n":69,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"如果只想改变某一张幻灯片的背景而不影响其他幻灯片，在设置背景后应____。","o":["单击全部应用","单击“应用”按钮","关闭文件","直接放映"],"a":"B","ex":"设置背景格式对话框里，“应用”只作用于当前选中的一张，“全部应用”才铺满全稿；只想改一张就点应用，手别滑。","roast":"全部应用一点，整副牌全换脸，改崩了别哭着来找我要撤销键。","n":70,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"下列关于PowerPoint 2010母版的说法，错误的是____。","o":["母版决定整套文稿的默认格式","可以在母版中设置占位符的位置和格式","每张幻灯片都受母版影响","母版中的内容在普通视图中可以直接拖动"],"a":"D","ex":"母版里的占位符要在母版视图里才编辑得动，普通视图看到的是应用效果；A、B、C都是母版的正常属性，D动作场所说反了。","n":71,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"按住____键的同时拖动鼠标绘制形状，可以画出正方形或正圆。","o":["Alt","Ctrl","Shift","Esc"],"a":"C","ex":"Shift起约束作用：拖动画矩形时得到正方形，画椭圆时得到正圆；Alt没有这个功能，Ctrl配合拖动是复制对象，Esc只是取消当前操作。","n":72,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在PowerPoint 2010中，自定义动画包括进入、强调、退出和____四种类型。","o":["切换","翻页","动作路径","动画刷"],"a":"C","ex":"自定义动画只有进入、强调、退出、动作路径四类；切换是幻灯片换页效果，动画刷是复制动画格式的工具，都不属于动画类型。","n":73,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"要让标题从无到有出现在幻灯片上，应为其添加____动画。","o":["进入","退出","强调","动作路径"],"a":"A","ex":"进入动画使对象从无到有显示出来；退出动画使对象消失；强调动画只改变已有对象的外观（如放大、变色），不控制出现与消失。","roast":"从无到有选进入，送分送到嘴边了，这题还能错我就真没话说了。","n":74,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在PowerPoint 2010中，用于查看和管理幻灯片上各对象动画顺序与效果的任务窗格是____。","o":["审阅窗格","动画窗格","选择窗格","备注窗格"],"a":"B","ex":"动画窗格集中列出当前幻灯片的所有动画，可调整播放顺序、查看效果和修改开始方式；选择窗格只管理对象的选择与显示隐藏，与动画顺序无关。","n":75,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在PowerPoint 2010中，设置幻灯片之间换页时的切换效果应使用的选项卡是____。","o":["动画","设计","插入","切换"],"a":"D","ex":"切换效果集中在「切换」选项卡中设置；「动画」选项卡针对幻灯片内部对象的自定义动画，两者的作用对象不同。","n":76,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在「切换」选项卡中，调整切换效果播放速度快慢的设置项是____。","o":["声音","换片方式","持续时间","全部应用"],"a":"C","ex":"「持续时间」数值框控制切换效果播放的时间长短，数值越大播放越慢；「全部应用」是把当前效果复制到所有幻灯片，与速度无关。","n":77,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"要把当前设置的切换效果一次性应用到演示文稿的所有幻灯片上，应单击「切换」选项卡中的____按钮。","o":["全部应用","统一换片","批量放映","保存并放映"],"a":"A","ex":"「全部应用」把当前切换效果及其设置复制给整个演示文稿的每张幻灯片，不必逐张重复设置。","n":78,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"PowerPoint 2010中，自定义动画「开始」方式的默认设置是____。","o":["之后","单击时","之前","自动播放"],"a":"B","ex":"动画的开始方式有「单击时」「之前」「之后」三种，默认为「单击时」，即放映时单击鼠标才触发该动画。","n":79,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"让图片沿指定路线在幻灯片上移动的动画效果属于____类型。","o":["进入","退出","强调","动作路径"],"a":"D","ex":"动作路径使对象按绘制或预置的路线移动；进入控制出现、退出控制消失、强调只改变外观，都不产生沿路线移动的效果。","n":80,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"下列动画效果中，属于「强调」类型的是____。","o":["陀螺旋","飞入","消失","擦除"],"a":"A","ex":"陀螺旋、放大缩小、更改颜色等属于强调动画，用于突出已显示的对象；飞入、擦除是进入动画，消失是退出动画。","n":81,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"关于幻灯片切换效果与自定义动画，说法正确的是____。","o":["两者都是针对幻灯片内某个对象的动画","切换针对幻灯片整体换页，自定义动画针对幻灯片内的对象","两者完全相同，只是叫法不同","自定义动画只能用于文字对象"],"a":"B","ex":"切换效果作用于幻灯片整体，决定前后两张之间如何换页；自定义动画作用于幻灯片内的文字、图片等对象。自定义动画同样可以用于图片、图表等对象。","n":82,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在PowerPoint 2010中，为选中的文字或图片添加超链接，应使用的选项卡是____。","o":["开始","视图","插入","引用"],"a":"C","ex":"「超链接」按钮位于「插入」选项卡的「链接」组中，也可按快捷键Ctrl+K快速打开插入超链接对话框；PowerPoint 2010没有「引用」选项卡。","n":83,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在「插入超链接」对话框中，链接目标不能是____。","o":["现有文件或网页","本文档中的位置","电子邮件地址","幻灯片中的某个动画效果"],"a":"D","ex":"超链接可指向现有文件、网页、本演示文稿中的幻灯片或电子邮件地址；动画效果是放映时的动态表现过程，不能作为链接目标。","n":84,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"要在第1张幻灯片上设置超链接，单击后跳转到本演示文稿的第8张幻灯片，应在「插入超链接」对话框中选择____。","o":["本文档中的位置","现有文件或网页","新建文档","电子邮件地址"],"a":"A","ex":"跳转到同一演示文稿内的其他幻灯片应选「本文档中的位置」，再在列表中指定目标幻灯片；链接到别的文件或网页才用「现有文件或网页」。","roast":"链到自己文稿里的幻灯片当然选本文档中的位置，这题错了我真要急眼。","n":85,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"删除对象上已设置的超链接并保留对象本身，正确的操作是____。","o":["按Delete键删除该对象","右键单击该对象，选择「取消超链接」","在普通视图下双击该对象","切换到母版视图重新排版"],"a":"B","ex":"右键快捷菜单中的「取消超链接」只去掉链接、保留对象；按Delete键会把对象连同超链接一起删除。","n":86,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"PowerPoint 2010中的「动作按钮」位于____。","o":["「开始」选项卡的「段落」组","「幻灯片放映」选项卡的「排列」组","「插入」选项卡「形状」下拉列表的底部","「设计」选项卡的「背景」组"],"a":"C","ex":"在「插入」选项卡单击「形状」，下拉列表最底部一组就是动作按钮（如前进、后退、开始、结束等），插入后可设置单击时执行的跳转或打开程序等动作。","n":87,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"放映演示文稿时，使设置好的超链接跳转生效，应进行的操作是____。","o":["编辑状态下单击链接对象","放映时双击链接对象","保存文件后自动跳转","放映时单击链接对象"],"a":"D","ex":"超链接只在放映状态下单击（或按设置的鼠标移过方式）才触发跳转；编辑状态下单击只会选中对象。","n":88,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"放映演示文稿时，从第一张幻灯片开始放映的快捷键是____。","o":["F5","Shift+F5","F7","Ctrl+F5"],"a":"A","ex":"F5从第一张开始放映，Shift+F5从当前幻灯片开始放映，两个快捷键对比记忆最省事。","roast":"F5从头放映，白送的分，错这题等于把饭碗端起来又摔了。","n":89,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"正在编辑第5张幻灯片时，希望直接从这张幻灯片开始放映，应按____。","o":["F5","Shift+F5","Ctrl+F5","Alt+F5"],"a":"B","ex":"Shift+F5从当前选中的幻灯片开始放映；F5总是从第一张开始放映，两者正好相反。","n":90,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"放映过程中要中途结束放映，可直接按____键。","o":["Enter","空格","Esc","Tab"],"a":"C","ex":"Esc可立即结束放映返回编辑状态；Enter和空格在放映时的作用是前进到下一个动画或下一张幻灯片。","roast":"退出放映按Esc，这都不知道的话我真是白喂你小鱼干了。","n":91,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"使用「排练计时」完成全部幻灯片的排练后，系统会弹出对话框询问____。","o":["是否删除演示文稿","是否另存为新文件","是否重新排练","是否保留排练时间"],"a":"D","ex":"排练计时结束后弹出询问是否保留排练时间的对话框，选择保留后，以后放映时可按记录的时间自动换片。","n":92,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"要设置演示文稿在放映时不断循环播放，应在「幻灯片放映」选项卡的「设置放映方式」对话框中勾选____。","o":["演讲者放映（全屏幕）","使用硬件图形加速","放映时不加旁白","循环放映，按ESC键终止"],"a":"D","ex":"勾选「循环放映，按ESC键终止」后，放映到最后一张会自动回到第一张，直到按Esc才结束；演讲者放映只是常规的全屏幕放映方式。","n":93,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"「排练计时」按钮位于PowerPoint 2010的____选项卡中。","o":["开始","设计","幻灯片放映","视图"],"a":"C","ex":"排练计时在「幻灯片放映」选项卡的「设置」组中，用于预演放映并记录每张幻灯片停留的时间。","n":94,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"要使某张幻灯片在放映时不显示出来，应先选中该幻灯片，然后单击「幻灯片放映」选项卡中的____按钮。","o":["自定义幻灯片放映","排练计时","隐藏幻灯片","录制幻灯片演示"],"a":"C","ex":"单击「隐藏幻灯片」后，被隐藏的幻灯片在缩略图中编号会打上斜杠标记，正常放映时自动跳过它，但编辑时仍可查看。","n":95,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"关于「隐藏幻灯片」，下列说法正确的是____。","o":["隐藏后被彻底删除，无法恢复","隐藏后放映时跳过该幻灯片，编辑时仍能看到","隐藏后只能打印，不能放映","一张演示文稿只能隐藏最后一张"],"a":"B","ex":"隐藏只是放映时跳过，幻灯片仍保存在文件中，编辑视图可见，再次单击「隐藏幻灯片」即可取消隐藏；任何位置的幻灯片都可隐藏。","n":96,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"要让演示文稿在展台等无人值守场合自动循环放映，应在「设置放映方式」对话框中选择的放映类型是____。","o":["演讲者放映（全屏幕）","观众自行浏览（窗口）","在展台浏览（全屏幕）","启用演示者视图"],"a":"C","ex":"「在展台浏览」会自动按排练时间循环放映，不允许观众随意单击换片；演讲者放映由演讲者手动控制，观众自行浏览是在小窗口中放映。","roast":"展台浏览循环放，题目名字都写着展台了还选错，我请你吃鱼是为了让你长脑子的。","n":97,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"设置了排练计时后，希望放映时按记录的时间自动换片，应在「设置放映方式」对话框的换片方式中选择____。","o":["手动","如果存在排练时间，则使用它","单击鼠标换片","使用硬件图形加速"],"a":"B","ex":"换片方式有「手动」和「如果存在排练时间，则使用它」两项，选后者放映时才会按排练记录自动切换。","n":98,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在PowerPoint 2010中打印「讲义」时，每张纸最多可打印____张幻灯片。","o":["4","6","9","12"],"a":"C","ex":"讲义的每页幻灯片数可选1、2、3、4、6、9张，最多为9张/页；选项里没有12张这个档位。","n":99,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"打印时要同时输出幻灯片下方的演讲者备注文字，打印内容应选择____。","o":["幻灯片","讲义","备注页","大纲视图"],"a":"C","ex":"备注页每页打印一张幻灯片缩图及其下方备注文字；讲义只排幻灯片缩图不含备注，大纲视图打印的是文字大纲。","n":100,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"打印范围设置为「幻灯片」并输入 1,3,5-8，表示打印____。","o":["第1至8张连续打印","第1张和第3张以及第5张","第1、3、5、8张共4张","第1、3、5、6、7、8张"],"a":"D","ex":"逗号分隔表示并列的编号，连字符表示连续范围，所以5-8代表第5、6、7、8张，合计第1、3、5、6、7、8张。","n":101,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"打印对话框的「颜色/灰度」中选择「纯黑白」，打印效果是____。","o":["按彩色原样打印","打印速度减半","只打印文字，忽略图片","文字按黑色打印，背景以白色打印"],"a":"D","ex":"纯黑白打印时文字以黑色输出、隐藏背景填充（背景呈白色），不保留灰阶层次；灰度选项才会以灰阶层次保留背景效果。","n":102,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"把演示文稿输出为PDF文件，应使用「文件」菜单中的____命令。","o":["打印","保存并发送","信息","选项"],"a":"B","ex":"在「文件→保存并发送→创建PDF/XPS文档」中可把文稿输出为PDF；「打印」走打印机，「选项」用于设置软件参数。","roast":"另存成PDF走保存并发送，常考操作，这种题错了放学别走，我请你刷十道。","n":103,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"打开打印窗口（显示打印设置和预览）的快捷键是____。","o":["Ctrl+P","Ctrl+S","Ctrl+V","Ctrl+F"],"a":"A","ex":"Ctrl+P打开打印窗口；Ctrl+S保存文件，Ctrl+V粘贴，Ctrl+F是查找，与打印无关。","n":104,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"「打包成CD」功能的主要作用是____。","o":["把演示文稿刻录成音乐CD光盘","把演示文稿及链接文件、播放器等打包，便于在其他电脑上放映","压缩幻灯片中的图片以减小体积","把演示文稿转换成视频文件"],"a":"B","ex":"打包成CD会把文稿、链接的对象、嵌入字体和PowerPoint播放器收集到一起复制到文件夹或光盘，使没装PowerPoint的电脑也能放映；它与音乐CD和视频转换无关。","n":105,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"设置幻灯片方向为纵向（垂直），应使用的选项卡是____。","o":["开始","设计","切换","审阅"],"a":"B","ex":"「设计」选项卡「页面设置」组中的「幻灯片方向」下拉列表可选横向或纵向；也可通过页面设置对话框同时调整幻灯片和备注、讲义的方向。","n":106,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在「页面设置」对话框中不能完成的设置是____。","o":["幻灯片大小","幻灯片编号起始值","幻灯片的方向","设置切换声音"],"a":"D","ex":"页面设置负责幻灯片大小、方向、编号起始值等版面参数；切换声音属于切换效果设置，要在「切换」选项卡中设置。","n":107,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"要为每张幻灯片添加自动更新的页码，应使用「插入」选项卡「文本」组中的____命令。","o":["艺术字","文本框","幻灯片编号","对象"],"a":"C","ex":"「幻灯片编号」打开页眉和页脚对话框，勾选「幻灯片编号」后每张幻灯片都会显示自动变化的页码；艺术字和文本框是手工排版工具，不会自动更新。","n":108,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"关于幻灯片中的占位符，说法正确的是____。","o":["占位符是带虚线或阴影边框的框，用于放置标题、正文、图片等内容","占位符只能在母版中使用","占位符是保存演示文稿的位置","占位符只能放置图片"],"a":"A","ex":"占位符是版式中预先画好的容器，可放置标题、正文、图片、图表等对象，编辑时输入内容即可；它既出现在版式和母版中，也出现在普通视图的每张幻灯片上。","n":109,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"演示文稿与幻灯片的关系是____。","o":["一个演示文稿由一张或多张幻灯片组成","一张幻灯片由多个演示文稿组成","两者是同一个概念的不同说法","演示文稿就是幻灯片上的一个文本框"],"a":"A","ex":"演示文稿是扩展名为pptx的整个文件，幻灯片是文件中的每一页，相当于一本书与书里各页的关系。","roast":"文稿和幻灯片是书和页的关系，这题都错的话本鱼建议你先把这页翻回去重学。","n":110,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"在PowerPoint 2010中，新建一张幻灯片的快捷键是____。","o":["Ctrl+N","Ctrl+M","Ctrl+E","Ctrl+H"],"a":"B","ex":"Ctrl+M在当前演示文稿中插入一张新幻灯片；Ctrl+N是新建一个演示文稿文件，两者对象不同，最容易混。","n":111,"c":5,"status":"OK"},{"m":"X1","mn":"演示文稿","s":"要统一修改所有幻灯片的标题字体和背景样式，效率最高的方法是进入____进行修改。","o":["幻灯片母版视图","阅读视图","大纲视图","备注页视图"],"a":"A","ex":"在母版视图中修改样式会作用于所有使用该版式的幻灯片，一处改全局生效；阅读、大纲、备注页视图都只能编辑具体内容，做不到统一样式。","n":112,"c":5,"status":"OK"}],zh:[{"c":22,"n":1,"m":"zh","s":"下列词语字形书写和加点字注音完全正确的一组是","o":["隽永（juàn） 寒暄 沉缅 如火如荼（tú）","遒劲（qiú） 蓊郁 淬火 风驰电掣（zhì）","枢纽（shū） 诙谐 缜密 越俎代庖（páo）","夙愿（sù） 青徕 蒸馏 更胜一筹（chóu）"],"a":"C","ex":"2. A　　3. B"},{"c":22,"n":
