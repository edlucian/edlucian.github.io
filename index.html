2,"m":"zh","s":"下列句子中加点的成语使用恰当的一项是","o":["党和人民披荆斩棘、栉风沐雨，敢于啃硬骨头，如期打赢了脱贫攻坚战，全面建成了小康社会，实现了第一个百年奋斗目标。","从婉丽妩媚的昆曲到高亢嘹亮的唢呐，从炉火纯青的刺绣到璀璨艳丽的唐卡，多彩的文化遗产，见证着绵延不息的文明传承。","虎年正月初一，广汉三星堆展厅人头攒动，而墙面另一侧，文物修复工作者正熟视无睹、专心致志地修复着一件出土文物。","住建部准备为“奇怪建筑”设立判定准则，也就是说，“铜钱楼”之类有口皆碑的“奇葩建筑”以后很可能就不会获批建造了。"],"a":"A","ex":"2022年四川单招真题。"},{"c":22,"n":3,"m":"zh","s":"下列句子没有语病的一项是","o":["世界一流的设施、令人惊叹的技术，冬奥会上，中国有传统的一面，绽放文化的精彩；还有现代的一面，展示科技的魅力。","今年是“川剧振兴”20 周年，省川剧院将恢复《琵琶记》《柳荫记》等经典剧目，推出川剧《龙凤呈祥》，喜迎党的二十大。","经过不断总结完善防沙治沙方法，一片片沙漠变绿洲，八步沙林场管护区内林草植被覆盖率由不足 3%提高到近 70%以上。","不管我国经济运行面临的困难和挑战有多大，但是经济持续恢复发展的良好态势没有改变，长期向好的基本面没有改变。"],"a":"B","ex":"2022年四川单招真题。"},{"c":22,"n":4,"m":"zh","s":"对下列句子中加点词的解释，不正确的一项是","o":["申之以孝悌之义 悌：敬爱兄长。","颁白者不负戴于道路矣 颁：同“斑”。","涂有饿莩而不知发 发：发丧埋葬。","非我也，岁也 岁：年成。"],"a":"C","ex":"2022年四川单招真题。"},{"c":23,"n":1,"m":"zh","s":"下列词语字形书写和加点字注音完全正确的一组是","o":["菜圃（pǔ） 舐犊情深（tiǎn） 左顾右盼","青冢（zhǒng） 不盈不溢（yì） 按图索冀","蘸酱（zàn） 蓊蓊郁郁（wěng） 未雨绸缪","国粹（cuì） 空中楼阁（gé） 谈笑风生"],"a":"D","ex":"2.B　3.A　4.C"},{"c":23,"n":2,"m":"zh","s":"下列语段中加点的成语使用不恰当的一项是采桑湖，到了冬天依然芳草青青，欣欣向荣，有着无数螺蛳和鱼虾的湖洲浅滩和沼泽，正是遮天蔽日的候鸟们脍炙人口的露天餐厅。湖水像一面镜子，倒映着蓝天、白云。大堤下，一群山羊在得意地奔跑，一头见多识广的黄牛漫不经心地瞥了一眼我这个不速之客。一只白鹭歇在黄牛背上，发出悦耳的叫声。好一曲原生态的洞庭牧歌。","o":["欣欣向荣","脍炙人口","漫不经心","不速之客"],"a":"B","ex":"2023年四川单招真题。"},{"c":23,"n":3,"m":"zh","s":"下列句子没有语病的一项是","o":["在成都召开的第七届中国网络版权保护与发展大会上，专家们既讲述了中国版权保护的动人故事，也明确了中国网络版权发展需要解决的主要难题。","四川省将聚焦国家战略需求和本土优势产业，全面加强基础研究，实施省级重大科技创新专项，布局创新联合体，集中力量扭转一批“卡脖子”技术。","陈智林主演的川剧《草鞋县令》于2022年获得“文华大奖”，彰显了四川传统文化，这是时隔15年四川再次获得这一国家舞台艺术领域的政府最高奖。","川渝将联合促进铝产业链协同发展，计划共同培育了一批有全国影响力的龙头企业和专精特新企业，利用联合优势打造全国最强的高端铝材料制造基地。"],"a":"A","ex":"2023年四川单招真题。"},{"c":23,"n":4,"m":"zh","s":"对下列句子中加点词的解释，不正确的一项是","o":["夫夷以近 夷：平坦。","非常之观 非常：不平常。","后世之谬其传而莫能名者 谬：错误。","何可胜道也哉 胜：尽，完。"],"a":"C","ex":"2023年四川单招真题。"}],en:[{"c":16,"n":1,"m":"en","s":"Tony will be a teacher________ two years.","o":["on","at","in","by"],"a":"C","ex":"2016年四川单招真题。"},{"c":16,"n":2,"m":"en","s":"There's________ interesting on TV. Let's go out.","o":["anything","everything","something","nothing"],"a":"D","ex":"201 me":"电子表格（Excel）","weight":"10%","total":47,"topics":[{"id":"m6hs","name":"公式与函数","count":21,"status":"ok","sample":"4-11"},{"id":"m6sj","name":"数据处理","count":5,"status":"ok","sample":"4-21"},{"id":"m6tbc","name":"工作表与图表","count":39,"status":"ok","sample":"4-1"}]},{"id":"M7","name":"演示文稿（PPT）","weight":"2%","total":32,"topics":[{"id":"m7bb","name":"版式与母版","count":5,"status":"ok","sample":"5-2"},{"id":"m7dh","name":"动画与切换","count":8,"status":"ok","sample":"5-6"},{"id":"m7fy","name":"放映与交互","count":16,"status":"ok","sample":"5-1"}]}],"unmatched":{"M1":["1-1","1-11","1-12","1-13","1-14","1-15","1-16","1-18","1-19","1-20","1-21","1-34","1-35","1-37","1-39","1-40","1-41","1-42","1-43","1-45","1-46","1-47","1-48","1-49","1-50","1-69","1-119","1-120","1-127","8-1","8-7","8-16","8-21","8-24","8-27","8-28","8-43"],"M2":["10-10","10-12","10-14","10-24","10-54","10-55","10-66","10-72","10-73","10-77","10-78","10-91","10-109","10-116","10-119"],"M3":["2-1","2-15","2-20","2-32","2-42","2-45"],"M4":["6-2","6-6","6-16","6-17","6-46","6-54","7-13"],"M5":["3-7","3-11","3-20","3-21","3-25","3-33","3-37","3-42","3-44","3-46"],"M6":["4-10","4-31","4-32"],"M7":["5-8","5-9","5-10","5-11","5-12","5-13","5-15","5-17","5-23","5-24","5-25","5-27"]},"x2_offline":60};

var SUBJECT='computer';
var SUBJ_NAME={computer:'计算机',zh:'语文',en:'英语',math:'数学'};
function lsKey(){return 'dshdz_v3_'+SUBJECT;}
function load(){
  try{
    var raw=localStorage.getItem(lsKey());
    if(!raw&&SUBJECT==='computer')raw=localStorage.getItem('dshdz_v3');
    return raw?JSON.parse(raw):{done:{},wrong:{}};
  }catch(e){return{done:{},wrong:{}}}
}
function save(){localStorage.setItem(lsKey(),JSON.stringify(S));}
var S=load();

var filter='ALL',order=[],idx=0;

var MODS_COMP=[['ALL','全部'],['M1','基础'],['M2','数据库'],['M3','操作系统'],['M4','网络'],['M5','Word'],['M6','Excel'],['X1','PPT'],['X2','多媒体']];
function modsFor(){
  if(SUBJECT==='computer')return MODS_COMP;
  var ys=[];BANK.forEach(function(q){if(ys.indexOf(q.c)<0)ys.push(q.c);});ys.sort();
  var M=[['ALL','全部']];
  ys.forEach(function(c){M.push(['Y'+c,(2000+c)+'年卷']);});
  return M;
}

var KBD=['a','b','c','d'];



/* ---------- 统计：唯一数据源，三处展示全走这里 ---------- */

function matchQ(q,f){
  if(f==='ALL')return true;
  if(SUBJECT==='computer')return q.m===f;
  if(f.charAt(0)==='Y')return q.c===parseInt(f.slice(1),10);
  return false;
}
function stats(mod){
  var pool=mod&&mod!=='ALL'?BANK.filter(function(q){return matchQ(q,mod);}):BANK;

  var total=pool.length,done=0,right=0;

  for(var i=0;i<pool.length;i++){

    var q=pool[i],a=S.done[q.c+'-'+q.n];

    if(a){done++;if(a===q.a)right++;}

  }

  return{total:total,done:done,right:right,

    rate:done?Math.round(right/done*100):0,

    pct:total?Math.round(done/total*1000)/10:0};

}

function pctText(p){return (p%1===0?p:p.toFixed(1))+'%';}

function key(q){return q.c+'-'+q.n;}

function esc(s){return String(s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}



var ICONS={

  ok:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',

  bad:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',

  empty:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>'

};



function buildOrder(){order=BANK.map(function(q,i){return i;}).filter(function(i){return matchQ(BANK[i],filter);});idx=0;render();}



function chips(){

  var el=document.getElementById('chips');el.innerHTML='';

  modsFor().forEach(function(a){

    var k=a[0],label=a[1],st=stats(k);

    var b=document.createElement('button');

    b.className='tab'+(k===filter?' on':'');

    b.innerHTML=label+'<span class="n">'+st.done+'/'+st.total+'</span>';

    b.onclick=function(){filter=k;buildOrder();chips();render();};

    el.appendChild(b);

  });

}



var SUBJ_TITLE={computer:'计算机类 · 单招刷题',zh:'语文真题 · 单招刷题',en:'英语真题 · 单招刷题',math:'数学真题 · 单招刷题'};
function renderSubj(){
  var el=document.getElementById('subjbar');el.innerHTML='';
  Object.keys(BANKS).forEach(function(k){
    var b=document.createElement('button');
    b.className='sbtn'+(k===SUBJECT?' on':'');
    b.textContent=SUBJ_NAME[k];
    b.onclick=function(){if(k!==SUBJECT)setSubject(k);};
    el.appendChild(b);
  });
}
function setSubject(k){
  SUBJECT=k;S=load();filter='ALL';idx=0;BANK=BANKS[k];
  var h1=document.querySelector('.brand h1');
  if(h1)h1.innerHTML='<span class="mark">◢</span>'+SUBJ_TITLE[k];
  var bs=document.getElementById('btnsyl');
  if(bs)bs.style.display=(k==='computer')?'':'none';
  renderSubj();buildOrder();chips();render();
}
function renderSide(){

  var el=document.getElementById('side');

  var g=stats('ALL');

  var C=2*Math.PI*32;

  var h='<div class="panel"><p class="pt">学习进度</p>';

  h+='<div class="ring-row"><div class="ring">';

  h+='<svg viewBox="0 0 74 74"><circle class="track" cx="37" cy="37" r="32" fill="none" stroke-width="5"/><circle class="fill" cx="37" cy="37" r="32" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-g.pct/100)).toFixed(1)+'"/></svg>';

  h+='<div class="cv"><b>'+pctText(g.pct)+'</b><span>总进度</span></div></div>';

  h+='<div class="stat-rows">';

  h+='<div class="srow"><span class="k">已完成</span><span class="v">'+g.done+' <small>/ '+g.total+'</small></span></div>';

  h+='<div class="srow"><span class="k">答对</span><span class="v">'+g.right+'</span></div>';

  h+='<div class="srow"><span class="k">正确率</span><span class="v">'+(g.done?g.rate+'%':'—')+'</span></div>';

  h+='</div></div></div>';

  h+='<div class="panel"><p class="pt">分类进度</p>';

  modsFor().forEach(function(a){

    var k=a[0];if(k==='ALL')return;

    var st=stats(k);

    if(!st.total)return;

    h+='<div class="mrow"><span class="mn">'+a[1]+'</span><span class="mbar"><i style="width:'+st.pct+'%"></i></span><span class="mc">'+st.done+'/'+st.total+'</span></div>';

  });

  h+='</div>';

  el.innerHTML=h;

}



function render(){

  var app=document.getElementById('app');

  renderSide();

  if(!order.length){

    app.innerHTML='<div class="empty">'+ICONS.empty+'<p>这个模块没题</p></div>';update();return;

  }

  if(idx<0)idx=0;if(idx>=order.length)idx=order.length-1;

  var q=BANK[order[idx]],k=key(q);

  var answered=!!S.done[k],userSel=S.done[k]||null,userAns=S.wrong[k]||null;

  var h='<article class="qcard">';

  h+='<div class="qhead"><span class="qno">第 '+q.c+' 章 · 第 '+q.n+' 题</span><span class="qtag">'+esc(q.mn)+'</span></div>';

  h+='<h2 class="stem">'+esc(q.s)+'</h2><div class="opts">';

  ['A','B','C','D'].forEach(function(L,i){

    var cls='opt';

    if(answered){if(L===q.a)cls+=' ok';else if(L===userAns)cls+=' bad';else cls+=' dim';}

    h+='<button class="'+cls+'" data-k="'+L+'"><span class="k">'+L+'</span><span class="t">'+esc(q.o[i])+'</span></button>';

  });

  h+='</div>';

  if(answered){

    var ok=(userSel===q.a);

    var inner='<div class="feedwrap">';

    inner+='<div class="feed '+(ok?'ok':'bad')+'">'+(ok?ICONS.ok+'<span>答对了</span>':(ICONS.bad+'<span>正确答案 <span class="ans">'+q.a+'</span>'+'，你选了 '+(userSel||'—')+'</span>'))+'</div>';

    if(!ok&&q.roast){

      inner+='<div class="fb-panel"><div class="roast"><span class="rk">我点评</span><div class="rt">'+esc(q.roast)+'</div></div>';

      if(q.ex)inner+='<div class="explain"><div class="et">解析</div><div class="ex">'+esc(q.ex)+'</div></div>';

      inner+='</div>';

    }else if(q.ex){

      inner+='<div class="fb-panel"><div class="explain" style="border-top:none;padding-top:0"><div class="et">解析</div><div class="ex">'+esc(q.ex)+'</div></div></div>';

    }

    inner+='</div>';

    h+='<div class="after show">'+inner+'</div>';

  }else{

    h+='<div class="after"><div class="feedwrap"></div></div>';

  }

  h+='</article>';

  app.innerHTML=h;

  app.querySelectorAll('.opt').forEach(function(btn){

    btn.onclick=function(){

      if(S.done[k])return;

      var L=btn.dataset.k;

      S.done[k]=L;

      if(L!==q.a)S.wrong[k]=L;

      save();render();chips();

    };

  });

  update();

}



function update(){

  var g=stats(filter==='ALL'?'ALL':filter);

  var all=stats('ALL');

  document.getElementById('progbar').style.width=all.pct+'%';

  document.getElementById('sub').textContent='已完成 '+all.done+' / '+all.total+' 题 · 正确率 '+(all.done?all.rate+'%':'—');

  document.getElementById('pos').innerHTML='<b>'+(order.length?(idx+1):0)+'</b> / '+order.length;

  document.getElementById('btnprev').disabled=!order.length||idx<=0;

  document.getElementById('btnnext').disabled=!order.length||idx>=order.length-1;

}



function sheet(){

  var sh=document.getElementById('sheet'),list=document.getElementById('sheetlist');

  var wk=Object.keys(S.wrong);

  var all=stats('ALL');

  document.getElementById('sheettitle').textContent='错题本';

  document.getElementById('sheetstat').textContent=wk.length+' 道待重做 · 正确率 '+(all.done?all.rate+'%':'—');

  if(!wk.length){

    list.innerHTML='<div class="empty">'+ICONS.ok.replace('class="ic"','')+'<p>暂无错题，继续保持</p></div>';

  }else{

    list.innerHTML='';

    wk.forEach(function(k){

      var q=BANK.find(function(x){return key(x)===k;});if(!q)return;

      var row=document.createElement('div');row.className='wrow';

      row.innerHTML='<span class="wl"><b>第'+q.c+'章 · '+esc(q.mn)+'</b>　第'+q.n+'题</span><button class="redo" data-k="'+k+'">重做</button>';

      row.querySelector('button').onclick=function(){

        var bi=BANK.indexOf(q);

        var fi=order.indexOf(bi);

        if(fi>=0){idx=fi;}

        else{filter='ALL';buildOrder();idx=order.indexOf(bi);chips();}

        sh.classList.remove('show');render();

      };

      list.appendChild(row);

    });

  }

  sh.classList.add('show');

}



/* ---------- 考纲覆盖抽屉 ---------- */

var SMAP={M1:'M1',M2:'M2',M3:'M3',M4:'M4',M5:'M5',M6:'M6',M7:'X1'};

var SMETA={M1:'计算机基础',M2:'数据库基础',M3:'操作系统基础',M4:'计算机网络基础',M5:'图文编辑（Word）',M6:'电子表格（Excel）',M7:'演示文稿（PPT）'};

function renderSyl(){

  var el=document.getElementById('syllist');

  var h='<div class="synote">应知客观题（单选 51% · 多选 16% · 判断 33%）共 200 分，考点覆盖如下；另有<b>上机实操 150 分</b>（中英文录入 7% · 操作系统 20% · 网络 17% · Word 20% · Excel 23% · PPT 13%），需开真机单独练习。</div>';

  SYL.modules.forEach(function(m){

    h+='<div class="smod"><div class="smhead"><span class="smname">'+esc(m.name)+'</span><span class="smmeta">应知占比 '+m.weight+' · '+m.total+' 题</span></div>';

    m.topics.forEach(function(t){

      var dot=t.status==='ok'?'ok':(t.status==='thin'?'thin':'none');

      h+='<div class="strow" data-mid="'+m.id+'" data-s="'+(t.sample||'')+'">'

        +'<span class="sdot '+dot+'"></span><span class="sname">'+esc(t.name)+'</span>'

        +'<span class="scnt">'+t.count+' 题</span><span class="sgo">去刷 ›</span></div>';

    });

    h+='</div>';

  });

  h+='<div class="synote warn">⚠ 薄弱考点：新一代信息技术（4 题）、常用 CMD 命令（2 题）——官方考纲明确列出，建议补练。X2 多媒体 60 题为考纲外保底，时间紧可跳过。</div>';

  el.innerHTML=h;

  el.querySelectorAll('.strow').forEach(function(row){

    row.onclick=function(){

      sylJump(row.dataset.mid, row.dataset.s);

    };

  });

}

function sylJump(mid, sample){

  var f=SMAP[mid]||mid;

  filter=f;buildOrder();chips();

  if(sample){

    var p=sample.split('-');

    var bi=-1;

    for(var i=0;i<BANK.length;i++){if(BANK[i].c==p[0]&&BANK[i].n==p[1]){bi=i;break;}}

    var fi=order.indexOf(bi);

    if(fi>=0)idx=fi;else idx=0;

  }

  document.getElementById('sylsheet').classList.remove('show');

  render();

}

document.getElementById('btnsyl').onclick=function(){

  renderSyl();

  document.getElementById('sylsheet').classList.add('show');

};

document.getElementById('sylclose').onclick=function(){document.getElementById('sylsheet').classList.remove('show');};

document.getElementById('sylsheet').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});



document.getElementById('btnprev').onclick=function(){if(idx>0){idx--;render();}};

document.getElementById('btnnext').onclick=function(){if(idx<order.length-1){idx++;render();}};

document.getElementById('btnsheet').onclick=sheet;

document.getElementById('sheetclose').onclick=function(){document.getElementById('sheet').classList.remove('show');};

document.getElementById('sheet').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});

document.addEventListener('keydown',function(e){

  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;

  var i=KBD.indexOf(e.key.toLowerCase());

  if(i>=0){var btn=document.querySelector('.opt[data-k="'+e.key.toUpperCase()+'"]');if(btn)btn.click();}

  else if(e.key==='ArrowRight'){e.preventDefault();document.getElementById('btnnext').click();}

  else if(e.key==='ArrowLeft'){e.preventDefault();document.getElementById('btnprev').click();}

});

renderSubj();document.getElementById('btnsyl').style.display=(SUBJECT==='computer')?'':'none';
buildOrder();chips();
</script>
